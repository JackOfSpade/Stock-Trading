# Example dbt profile for the Stock-Trading project.
#
# Copy the relevant block into ~/.dbt/profiles.yml (do NOT commit a real profile with
# credentials). The profile name MUST be `stock_trading` to match dbt_project.yml.
#
# Project: stock-trading-498512   Location/multi-region: US
#
# The `dataset` set here is the DEFAULT dataset dbt would use. Because this project
# overrides generate_schema_name to emit BARE dataset names, models tagged with a
# per-folder `+schema:` (state / perf / analytics) land in THOSE datasets regardless
# of `dataset` below. `dataset` is still the landing spot for any model without an
# explicit +schema, and for dbt's own artifacts — set it to one you can write to.

stock_trading:
  target: dev
  outputs:

    # ---- DEV: OAuth (matches the owner's current interactive gcloud usage) -------
    dev:
      type: bigquery
      method: oauth            # uses your `gcloud auth application-default login` creds
      project: stock-trading-498512
      dataset: state           # default dataset; +schema configs route state/perf/analytics
      location: US
      threads: 4
      timeout_seconds: 300
      priority: interactive
      # Cost guardrail for ad-hoc runs against the live warehouse:
      maximum_bytes_billed: 1000000000   # 1 GB

    # ---- CI: service-account / Workload Identity Federation (gated on creds) ------
    # `dbt build` has NEVER been wired into automation (verified 2026-08-31, dbt#4: grepped ci.yml +
    # live-sql-parity.yml for `dbt build` -- zero hits; both only ever run `dbt parse`/`dbt compile`/
    # `dbt test`, none of which materialize anything). Requires BigQuery access; see README "CI".
    # Prefer keyless WIF in GitHub Actions over a long-lived JSON key.
    ci:
      type: bigquery
      # method: service-account
      # keyfile: /tmp/sa.json          # path written from a CI secret (avoid if WIF works)
      #
      # --- Workload Identity Federation alternative (keyless, recommended) ---------
      # method: oauth                   # with google-github-actions/auth providing ADC
      method: oauth
      project: stock-trading-498512
      # BUG FIX (2026-08-31 code-quality pass, dbt#4): `dataset: dbt_ci` here does NOT isolate a future
      # `dbt build --target ci` from the live datasets, despite what this line used to claim. This
      # project's macros/generate_schema_name.sql override uses a model's +schema AS-IS whenever one is
      # set (BARE, no dataset prefix) and dbt_project.yml gives EVERY model a folder-level +schema
      # (state/perf/analytics) -- confirmed no model lacks one. So under this exact profile, every model
      # would still compile to +schema's dataset (state/perf/analytics), i.e. the LIVE ones, regardless
      # of what `dataset` says here. `dbt build` must never be pointed at this (or the `dev`) target
      # without first overriding every model's +schema for that run (e.g. `--vars` plumbed through a
      # conditional +schema, or per-run --project-dir with a throwaway dbt_project.yml) -- `dataset:`
      # alone buys nothing. dbt/profiles.ci.yml (the file CI's dbt jobs actually copy in) sets
      # `dataset: state` for the same reason: it was never meant to provide isolation either, only a
      # default landing spot for dbt's own artifacts on the `dbt parse`/`compile`/`test`-only path that
      # never materializes a model.
      dataset: dbt_ci
      location: US
      threads: 4
      timeout_seconds: 300
      priority: interactive
      maximum_bytes_billed: 1000000000

# WIF note (no JSON key): in GitHub Actions use
#   - uses: google-github-actions/auth@v2
#     with:
#       workload_identity_provider: projects/<n>/locations/global/workloadIdentityPools/<pool>/providers/<provider>
#       service_account: dbt-ci@stock-trading-498512.iam.gserviceaccount.com
# which writes Application Default Credentials; dbt's method: oauth then picks them up.
