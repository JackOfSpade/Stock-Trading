# dbt package dependencies. Install with `dbt deps`.
# dbt_utils gives us the generic tests this layer leans on:
#   - unique_combination_of_columns  (composite keys: daily_marks_curated, etc.)
#   - expression_is_true             (invariants: no terminal status in open_queue, drawdown <= 0)
packages:
  - package: dbt-labs/dbt_utils
    version: [">=1.1.0", "<2.0.0"]
