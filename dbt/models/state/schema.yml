version: 2

# Tests for the state.* layer (B3: the load-bearing view invariants).
# Generic tests here; subtle invariants live as singular tests in tests/*.sql.

models:
  - name: current_positions
    description: Latest non-CLOSE position event per position_key.
    columns:
      - name: position_key
        description: Stable position identity; latest event wins.
        tests:
          - not_null
          # NOTE: NOT unique here intentionally — current_positions can carry >1 OPEN leg
          # per position_key only if the upstream emits multiple keys; the latest-wins QUALIFY
          # guarantees one row per position_key, but we assert uniqueness on the round-trip key
          # in analytics.position_lifecycle (position_key there is the canonical unique key).
      - name: status
        description: Latest status (OPEN guards downstream NAV / time-exits).

  - name: current_regime
    description: Latest regime reading per (scope, key).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [scope, key]
    columns:
      - name: scope
        tests: [not_null]
      - name: key
        tests: [not_null]

  - name: open_queue_detail
    description: Latest-wins queue projection (incl. payload/note), terminal statuses filtered out.
    tests:
      # No surviving row may carry a terminal status (case-normalized). If one does, a closed
      # item is stuck in the open queue — exactly the case-drift bug 01_schema.sql guards against.
      - dbt_utils.expression_is_true:
          expression: "UPPER(status) NOT IN ('COMPLETE','SUPERSEDED','DROPPED','FILLED','EXPIRED','ABANDONED')"
      # Latest-wins must leave exactly one row per (queue, item_key).
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [queue, item_key]
    columns:
      - name: item_key
        tests: [not_null]
      - name: status
        tests: [not_null]

  - name: open_queue
    description: Compact routing/identity columns over open_queue_detail (no payload/note).
    tests:
      - dbt_utils.expression_is_true:
          expression: "UPPER(status) NOT IN ('COMPLETE','SUPERSEDED','DROPPED','FILLED','EXPIRED','ABANDONED')"
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [queue, item_key]
    columns:
      - name: item_key
        tests: [not_null]

  - name: open_orders
    description: Durable staged-order registry (pending ORDER_STAGED rows). reserved_cash protects §13.
    columns:
      - name: item_key
        description: Stable per intended order; unique among pending rows.
        tests:
          - not_null
          - unique
      - name: side
        description: BUY / SELL (uppercased).
        tests:
          - not_null
          # NOTE: accepted_values' `NOT IN (...)` is NULL (not TRUE/FALSE) for a NULL
          # side under SQL three-valued logic, so it alone would silently pass a NULL
          # side through undetected — the paired `not_null` test above closes that gap
          # (2026-07-04 audit finding; see also tests/assert_open_orders_actionable.sql).
          - accepted_values:
              values: ['BUY', 'SELL']
      - name: qty
        description: Order quantity parsed from the staged payload. Required whenever
          side = BUY, since a missing/NULL value here silently collapses reserved_cash
          to NULL (and NULL rows are dropped, not counted as 0, by any SUM(reserved_cash)
          — 2026-07-04 audit finding; the 2026-06-08 MDT de-funding incident was this
          same failure class).
        tests:
          - not_null:
              config:
                where: "side = 'BUY'"
      - name: limit_price
        description: Limit price parsed from the staged payload. Required whenever
          side = BUY (all entry orders in this system are crafted LIMIT per
          Operating_Protocols.md; MARKET is only ever used for an assured SELL/exit
          flatten) — a missing/NULL value on a BUY row silently collapses reserved_cash
          to NULL the same way a missing qty does (2026-07-04 audit finding).
        tests:
          - not_null:
              config:
                where: "side = 'BUY'"
      - name: reserved_cash
        description: Cash a pending BUY reserves; resting SELL reserves 0. Must be >= 0 (see singular test).
      - name: guard_passed
        description: fn_order_guard/fn_order_guard_options result embedded in the staged payload (ITEM 15,
          2026-07-11) — NULL on a pre-ITEM-15 row is expected; a NULL on a row staged AFTER that rev is a
          detectable guard omission (bigquery/scheduled_queries/daily_staging_cap_check.sql flags it).
      - name: guard_reasons
        description: Human-readable guard check detail, embedded alongside guard_passed (ITEM 15).

  - name: trade_fills_curated
    description: Latest ingest per trade_id (the idempotency-by-trade_id guard).
    columns:
      - name: trade_id
        tests:
          - not_null
          - unique

  - name: daily_marks_curated
    description: Latest ingest per (ticker, mark_date) — the TWR double-count guard.
    tests:
      # THE dedup invariant that prevents the engine from double-counting a re-ingested day.
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [ticker, mark_date]
    columns:
      - name: ticker
        tests: [not_null]
      - name: mark_date
        tests: [not_null]

  - name: option_marks_curated
    description: Latest ingest per (occ_symbol, mark_date) — the option-mark double-count guard (mirror of daily_marks_curated; bigquery/40_options_marks.sql).
    tests:
      # THE dedup invariant that prevents the engine from double-counting a re-ingested option-mark day.
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [occ_symbol, mark_date]
    columns:
      - name: occ_symbol
        tests: [not_null]
      - name: mark_date
        tests: [not_null]

  - name: daily_briefing
    description: '"What needs attention today" union (queue due / kill flags / time exits).'
    columns:
      - name: category
        tests:
          - accepted_values:
              values: ['QUEUE_DUE', 'KILL_FLAG', 'TIME_EXIT']

  - name: market_calendar
    description: Computed trading-day calendar (weekday and not a full-close holiday).
    columns:
      - name: cal_date
        tests:
          - not_null
          - unique

  - name: trading_day_today
    description: Single-row "today"/last/next trading day in America/Denver.
    # Exactly one row — asserted by tests/assert_trading_day_today_single_row.sql.

  - name: freshness
    description: Dead-man's switch — marks/engine/D2 current vs last trading day.
    # Single row — asserted by tests/assert_freshness_single_row.sql.
    columns:
      - name: marks_fresh
        tests: [not_null]
      - name: engine_fresh
        tests: [not_null]

  - name: system_health
    description: One-row green/red rollup.
    # Exactly one row — asserted by tests/assert_system_health_single_row.sql.
    columns:
      - name: all_green
        description: Master health flag (marks+engine+embeddings fresh, 0 critical alerts).

  - name: gate_watch
    description: Conviction 30-closed-trade gate proximity (advisory).
    columns:
      - name: strategy
        tests: [not_null]
      - name: closed_to_gate
        description: Closed trades remaining to the 30-trade gate (>= 0).
        tests:
          - dbt_utils.accepted_range:
              min_value: 0

  - name: account_latest
    description: Latest account-level NAV/cash/TWR snapshot (from ops.account_snapshot). Retained for the dashboard and history — no longer read by the weekly self-email (2026-07 redesign).
    columns:
      - name: snapshot_date
        description: Operating day of the latest snapshot.
        tests: [not_null]

  - name: trading_control_latest
    description: Human/dashboard-facing latest row of ops.trading_control (halt-all control). Added
      2026-07-04 (audit finding, HIGH) — the trading-halt gate previously had zero dbt coverage.
    # Single row — asserted by tests/assert_trading_control_latest_single_row.sql.
    columns:
      - name: halt_all
        tests: [not_null]

  - name: book_drawdown_watch
    description: Book-level NAV drawdown breaker input (self-bootstrapping — always exactly one row).
      Added 2026-07-04 (audit finding, HIGH).
    # Single row — asserted by tests/assert_book_drawdown_watch_single_row.sql.
    columns:
      - name: n_snapshots
        tests: [not_null]
      - name: snapshot_stale
        description: TRUE when the latest ops.account_snapshot row is older than the current
          last_trading_day (ITEM 16, 2026-07-11) — folded into state.trading_enabled so a stalled
          D2a fails the drawdown breaker closed instead of silently trusting stale data.
      - name: breach_soft
        description: TRUE when flow-adjusted drawdown <= -15% (entries-only pause via
          state.entry_staging_allowed; NOT a gate term). Rebased 2026-07-17 (audit finding C1).
        tests: [not_null]
      - name: breach_hard
        description: TRUE when flow-adjusted drawdown <= -40% (the catastrophe full-halt gate term).
        tests: [not_null]
      - name: capital_base
        description: Cumulative net external flows (deposited capital) — the drawdown denominator.
      - name: drawdown_breach
        description: Backward-compat alias == breach_hard (pre-78 consumers). New code reads breach_hard.
        tests: [not_null]

  - name: trading_enabled
    description: The machine-readable trading-enable gate — sp_assert_trading_enabled reads this
      before every order-staging step. Added 2026-07-04 (audit finding, HIGH).
    # Single row — asserted by tests/assert_trading_enabled_single_row.sql.
    columns:
      - name: trading_enabled
        tests: [not_null]

  - name: trading_enabled_mechanical
    description: D2a-scoped trading-enable gate (deliberately excludes marks_fresh/engine_fresh —
      D2a's own same-run-circular term). ops.sp_assert_trading_enabled_mechanical reads this before
      D2a's mechanical sweep/persist-and-wait re-craft step. Added 2026-07-14 (audit finding, HIGH) —
      previously had ZERO dbt mirror despite its live sibling state.trading_enabled having full
      coverage since 2026-07-04.
    # Single row — asserted by tests/assert_trading_enabled_mechanical_single_row.sql.
    columns:
      - name: trading_enabled
        tests: [not_null]
