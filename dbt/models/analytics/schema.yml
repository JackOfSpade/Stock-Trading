version: 2

# Tests for the analytics.* layer.

models:
  - name: position_lifecycle
    description: One row per round-trip; position_key carries leg_seq so it is unique.
    columns:
      - name: position_key
        description: strategy:ticker:entry_date:leg_seq — unique per round-trip (LAG window partitions on it).
        tests:
          - not_null
          - unique
      - name: strategy
        description: Strategy code (NULL strategy rows are filtered before the TWR).

  - name: strategy_daily_returns
    description: Value-weighted daily deployed total returns per strategy (gross).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [as_of_date, strategy]
    columns:
      - name: as_of_date
        tests: [not_null]
      - name: strategy
        tests: [not_null]

  - name: sgov_daily_return
    description: SGOV actual total-return benchmark per day.
    columns:
      - name: as_of_date
        tests:
          - not_null
          - unique

  - name: thesis_outcomes
    description: Thesis-construction decisions joined to their round-trip outcome.
    columns:
      - name: entry_id
        description: One row per thesis entry_id (QUALIFY picks the nearest round-trip).
        tests:
          - not_null
          - unique
      - name: decision
        description: GO / NO-GO verdict.

  - name: conviction_features
    description: GO theses with conviction mapped to an ordinal (gated feature view).
    columns:
      - name: entry_id
        tests:
          - not_null
          - unique
      - name: decision
        description: Always 'GO' here (the WHERE filter).
        tests:
          - accepted_values:
              values: ['GO']
      - name: conviction_ordinal
        description: 1..6 for LOW..HIGHEST; NULL when conviction is unrecognized/missing.
        tests:
          - dbt_utils.accepted_range:
              min_value: 1
              max_value: 6
              # NULLs are allowed (unscored conviction); range test ignores NULLs.

  - name: calibration_summary
    description: Per-conviction-tier closed count / win-rate / avg realized P&L (cold-start safe).
    columns:
      - name: conviction
        tests:
          - not_null
          - unique

  - name: strategy_nav
    description: Per-strategy NAV / sizing base; one row per strategy A-E.
    columns:
      - name: strategy
        tests:
          - not_null
          - unique
          - accepted_values:
              values: ['A', 'B', 'C', 'D', 'E']

  - name: account_reconciliation
    description: Account-level §13 events-side expected totals (single row).
    # Single row — asserted by tests/assert_account_reconciliation_single_row.sql.

  - name: strategy_unit_value_7d_ago
    description: Nearest perf.strategy_daily row to "7 days ago" per strategy — feeds strategy_scorecard's Δ Wk column.
    columns:
      - name: strategy
        tests:
          - not_null
          - unique
          - accepted_values:
              values: ['A', 'B', 'C', 'D', 'E']

  - name: strategy_scorecard
    description: One row per strategy — activation + budget + deployed-TWR (weekly self-email + dashboard).
    columns:
      - name: strategy
        tests:
          - not_null
          - unique
          - accepted_values:
              values: ['A', 'B', 'C', 'D', 'E']
      - name: is_active
        description: TRUE when activation contains ACTIVATE and is not DO-NOT-ACTIVATE.
        tests: [not_null]
      - name: twr_7d
        description: Deployed-TWR change over the trailing 7 days (nullable — no strategy_daily row near that date yet).

  - name: weekly_activity
    description: Last-7-day activity counts for the weekly self-email (single row).
    columns:
      - name: fills_7d
        description: Curated fills in the last 7 days (America/Denver).
      - name: pending_orders
        description: Count of ORDER_STAGED pending registry rows.
