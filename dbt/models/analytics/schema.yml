version: 2

# Tests for the analytics.* layer.

models:
  - name: position_lifecycle
    description: >-
      FIFO lots. Tier-1 of the 2026-07-21 pyramid-aware accounting rebuild
      (bigquery/102_pyramid_aware_lifecycle.sql): one row per FIFO-matched (buy interval, sell
      interval) overlap, partitioned by (strategy,ticker) — supersedes the old ROW_NUMBER()
      leg_seq pairing, which left a pyramid add-leg perpetually-open. The audited is_dust flag is
      appended for TWR filtering; the lots themselves remain present for reconciliation.
    columns:
      - name: position_key
        description: strategy:ticker:buy_trade_id:sell_trade_id (or :OPEN for an unmatched tail) — unique per lot (LAG window partitions on it).
        tests:
          - not_null
          - unique
      - name: strategy
        description: Strategy code (NULL strategy rows are filtered before the TWR).
      - name: is_dust
        description: Fill-level audited dust classification carried onto the originating FIFO BUY lot; retained for reconciliation but excluded from deployed TWR.
        tests: [not_null]

  - name: position_campaigns
    description: >-
      Campaigns. Tier-2 of the 2026-07-21 pyramid-aware accounting rebuild, REBUILT 2026-07-30
      (bigquery/116_decision_record_analyzability.sql section (A), was bigquery/102): one row per
      (strategy,ticker) round-trip at the CAMPAIGN level — spans a position from the opening BUY
      through every add/partial-exit to the fill that returns it flat (or the latest fill if still
      open). This is "a trade" for closed_trades / gate_n (ops.sp_recompute_engine) and
      thesis_outcomes — a partial-exit pyramid counts as ONE closed trade, not one per FIFO lot.
    columns:
      - name: campaign_key
        description: strategy:ticker:campaign_seq — unique per campaign.
        tests:
          - not_null
          - unique
      - name: strategy
        description: Strategy code.
      - name: opening_thesis_ref
        description: >-
          NEW 2026-07-30 (bigquery/116 section (A)). The opening fill's source_thesis_ref —
          decision_log.entry_id, when the write path recorded it as a UUID (convention adopted
          ~2026-07-26; older campaigns carry free text like 'D2 2026-07-17 TSM D GO' and are left as
          is, no backfill). Lets thesis_outcomes pair a thesis to its campaign by durable FK instead
          of only nearest-entry_date proximity.
      - name: is_dust
        description: >-
          TRUE when the campaign contains a fill that D2a durably classified as post-close STK dust
          after inspecting authoritative connector state. The classification is keyed by source
          trade_id and therefore survives liquidation without inferring from mutable market value or
          ambiguous BUY notional. thesis_outcomes and closed-trade statistics exclude these campaigns.
        tests: [not_null]

  - name: dust_classified_fills
    description: Source BUY and exact liquidation SELL fill ids durably classified as post-close STK dust by D2a; legacy 2026-07-20 rows use two frozen, unique BUY-fill signatures.
    columns:
      - name: trade_id
        tests: [not_null, unique]
      - name: is_dust
        tests: [not_null]
      - name: dust_id
        description: Stable residual-generation identity shared by its source BUY fill(s) and liquidation SELL fill(s).
        tests: [not_null]
      - name: fill_role
        description: source-buy or liquidation-sell; Tier-1 FIFO matches only within the same dust identity/class.
        tests:
          - accepted_values:
              values: ['source-buy', 'liquidation-sell']

  - name: strategy_daily_returns
    description: Value-weighted daily deployed total returns per strategy (gross).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [as_of_date, strategy]
    columns:
      - name: as_of_date
        tests: [not_null]
      - name: strategy
        tests: [not_null]
      - name: deployed_capital
        description: Deployed dollars marked that day (Σ prev_mv) — feeds strategy_vs_park_daily.

  - name: strategy_vs_park_daily
    description: Per strategy-day, the weekly email's chart series — deployed-slice excess % (PRIMARY, from perf.strategy_daily) + cumulative $ edge vs the SGOV park (secondary). 2026-07 redesign.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [as_of_date, strategy]
    columns:
      - name: as_of_date
        tests: [not_null]
      - name: strategy
        tests: [not_null]
        description: Strategy code, restricted to ever-deployed strategies (A-E subset).
      - name: excess_vs_sgov
        description: Cumulative deployed-slice excess return vs SGOV for that day — from perf.strategy_daily; the email turns the latest value into an average vs-SGOV return per week/month/year over the strategy's deployed days.
      - name: deployed_unit_value
        description: The strategy's own chained cumulative total-return unit value for that day (the returns chart plots this − 1).

  - name: sgov_cumulative
    description: SGOV's own cumulative total return per deployed trading day (the returns chart's SGOV line + its own average return per week/month/year). 2026-07-03.
    columns:
      - name: as_of_date
        tests:
          - not_null
          - unique
      - name: sgov_cum_return
        description: SGOV's cumulative total return (close + dividends) since the first deployed date.

  - name: deployed_book_vs_sgov
    description: Single-row combined deployed-book excess % — the weekly email's hero headline (value-weighted across all deployed strategies, not a sum of per-strategy percentages). 2026-07-03.
    columns:
      - name: combined_excess_pct
        description: The aggregate deployed book's return vs SGOV over its deployed days.
      - name: first_deployed_date
        description: Earliest deployed day across all strategies.

  - name: strategy_vs_park
    description: Latest cumulative $ edge vs the SGOV park per ever-deployed strategy — the weekly email's per-strategy verdict row (2026-07 redesign).
    columns:
      - name: strategy
        tests:
          - not_null
          - unique
          - accepted_values:
              values: ['A', 'B', 'C', 'D', 'E']
      - name: edge_dollars_cum
        description: Cumulative $ edge vs the SGOV park since the strategy's first deployment.

  - name: park_baseline
    description: Single-row "what would parking everything have earned" scale anchor for the weekly email's hero tile (2026-07 redesign).
    columns:
      - name: first_deployed_date
        description: Earliest as_of_date across all strategies in strategy_vs_park_daily.
      - name: park_dollars_approx
        description: Approximate $ the current total sleeve NAV would have earned fully parked in SGOV over the same window.

  - name: sgov_daily_return
    description: SGOV actual total-return benchmark per day.
    columns:
      - name: as_of_date
        tests:
          - not_null
          - unique

  - name: voo_daily_return
    description: VOO (Vanguard S&P 500 ETF) actual total-return benchmark per day. 2026-07-13.
    columns:
      - name: as_of_date
        tests:
          - not_null
          - unique

  - name: voo_cumulative
    description: VOO's own cumulative total return per deployed trading day, aligned to the same axis as sgov_cumulative (the weekly email's VOO chart line + its own average return per month/year). NULL before VOO's first observed mark, and NULL on any interior/trailing day its mark is missing (an ingest gap → a break in the chart line, not a false flat carry). 2026-07-13; null-on-gap 2026-07-17.
    columns:
      - name: as_of_date
        tests:
          - not_null
          - unique
      - name: voo_cum_return
        description: VOO's cumulative total return (close + dividends) since the first deployed date; NULL until VOO's first mark AND on any day with no real VOO mark (ingest gap). The running level is still chained across gaps internally, so it resumes exactly on the next real mark.

  - name: deployed_book_vs_benchmarks
    description: Single-row combined deployed-book comparison vs SGOV AND VOO — the weekly email's headline block (percent + "same dollars, same days" dollar legs). 2026-07-13.
    columns:
      - name: first_deployed_date
        description: Earliest deployed day across all strategies.
      - name: n_deployed_days
        description: Count of deployed trading days in the window — the N used for both SGOV and VOO period-average denominators.
      - name: n_voo_mark_days
        description: Count of deployed days with an actual VOO mark. 0 means VOO-derived columns are NULL (backfill not yet applied) — gates the email's VOO rendering.
      - name: book_return
        description: The aggregate deployed book's cumulative return over its deployed days.
      - name: voo_return
        description: NULL when n_voo_mark_days = 0.

  - name: thesis_outcomes
    description: >-
      Thesis-construction decisions joined to their round-trip outcome. REBUILT 2026-07-30
      (bigquery/116_decision_record_analyzability.sql section (B), was bigquery/102): entry_type now
      tolerates the 'thesis' synonym (recovers the 2026-07-20..22 drift-incident rows); the campaign
      join is guarded to GO-family decisions only, so a NO-GO can never inherit a position outcome;
      pairing prefers the durable opening_thesis_ref FK over nearest-entry_date when available.
    columns:
      - name: entry_id
        description: One row per thesis entry_id (QUALIFY picks the FK match, else the nearest round-trip).
        tests:
          - not_null
          - unique
      - name: decision
        description: GO / GO (add tranche) / NO-GO verdict (raw free-text value; see is_go_family for the safe filter).
      - name: is_go_family
        description: >-
          NEW 2026-07-30. TRUE for any GO-family decision ('GO', 'GO (add tranche)', ...) via an
          anchored ^GO\b regex — never matches 'NO-GO' or its variants. Also guards the campaign join
          (a NO-GO thesis is never paired to a position) and is what conviction_features /
          thesis_outcome_summary now filter on instead of the exact string decision = 'GO'.
      - name: conviction_pct
        description: >-
          NEW 2026-07-30. Raw decision_log.conviction_pct as logged — mixed scale (most rows 0-100
          percent; 7 historical rows 0-1 fraction). Use conviction_pct_normalized instead for any
          comparison across rows.
      - name: conviction_pct_normalized
        description: >-
          NEW 2026-07-30. conviction_pct rescaled to 0-100: a value in (0, 1] is multiplied by 100
          (the 7 fraction-scale rows), everything else (incl. 0 and NULL) passes through unchanged.
          Substrate for analytics.conviction_pct_calibration. Never multiplied into sizing/EV math —
          conviction stays ordinal for sizing (AI_Trading_Foundation.md 2.13/2.26/3a.1); this is
          outcome-based measurement only.
      - name: campaign_key
        description: NEW 2026-07-30. FK to position_campaigns.campaign_key for this thesis's paired campaign, NULL for a NO-GO or an unpaired thesis.
      - name: paired_by_fk
        description: >-
          NEW 2026-07-30. TRUE when this thesis was paired to its campaign via
          position_campaigns.opening_thesis_ref (durable FK) rather than the nearest-entry_date
          heuristic — pairing-quality telemetry, not a filter.

  - name: conviction_features
    description: >-
      GO-family theses with conviction mapped to an ordinal (gated feature view). REBUILT 2026-07-30
      (bigquery/116_decision_record_analyzability.sql section (C), was bigquery/04): filters on
      is_go_family instead of the exact string decision = 'GO', so an add-tranche GO now counts as
      its own conviction observation (owner directive 2026-07-30).
    columns:
      - name: entry_id
        tests:
          - not_null
          - unique
      - name: decision
        description: >-
          'GO' or 'GO (add tranche)' — the WHERE is_go_family filter admits both (2026-07-30; was a
          tautological accepted_values(['GO']) test before the GO-family widening, since it only ever
          tested this view's own already-filtered output — dbt test never runs in CI, only dbt parse).
        tests:
          - accepted_values:
              values: ['GO', 'GO (add tranche)']
      - name: conviction_ordinal
        description: 1..6 for LOW..HIGHEST; NULL when conviction is unrecognized/missing.
        tests:
          - dbt_utils.accepted_range:
              min_value: 1
              max_value: 6
              # NULLs are allowed (unscored conviction); range test ignores NULLs.
      - name: conviction_pct_normalized
        description: >-
          NEW 2026-07-30. Passed through from thesis_outcomes — see that model's column doc.
          Substrate for analytics.conviction_pct_calibration.

  - name: calibration_summary
    description: Per-conviction-tier closed count / win-rate / avg realized P&L (cold-start safe).
    columns:
      - name: conviction
        tests:
          - not_null
          - unique

  - name: calibration_shrunk
    description: >-
      Beta-Binomial-shrunk per-conviction-tier win rate + Wilson 95% interval + the
      trustworthy_edge hard gate — supersedes reading calibration_summary.win_rate alone. Added
      2026-07-04 (audit finding): this model previously had zero test/doc coverage here, unlike every
      sibling analytics model, despite trustworthy_edge being documented as "the ONLY gate that may
      change behavior" off this view. See tests/assert_calibration_shrunk_wilson_bounds.sql for the
      Wilson-interval well-formedness invariant (also pins the 2026-07-04 SAFE_DIVIDE fix). REBUILT
      2026-07-30 (bigquery/116_decision_record_analyzability.sql section (D), was bigquery/25): now
      always enumerates all SEVEN canonical conviction tiers (FULL OUTER JOIN against the tier list)
      instead of only the tiers observed among closed GO-family theses — a tier with zero closed
      trades (e.g. HIGHEST) now renders an honest maximal-uncertainty [0,1] interval instead of being
      absent, which used to make find_precedents' LEFT JOIN return four NULLs for exactly the
      highest-conviction precedents its mandatory-interval guardrail exists to temper.
    columns:
      - name: conviction
        description: One of the 7 canonical tiers ('(unscored)', LOW..HIGHEST) — always present, even with closed=0.
        tests:
          - not_null
          - unique

  - name: strategy_nav
    description: Per-strategy NAV / sizing base; one row per strategy A-E.
    columns:
      - name: strategy
        tests:
          - not_null
          - unique
          - accepted_values:
              values: ['A', 'B', 'C', 'D', 'E']

  - name: account_reconciliation
    description: >-
      Account-level §13 events-side expected totals (single row). 2026-07-18 (PARK_ROUTER_DESIGN.md
      v2 §9, AI Park Allocator accounting): SUPERSEDES the bigquery/22-era definition — canonical
      source is now bigquery/93_park_accounting.sql. Adds park_unrealized / residual_after_park;
      every prior column preserved byte-identical.
    # Single row — asserted by tests/assert_account_reconciliation_single_row.sql.
    columns:
      - name: park_unrealized
        description: >-
          Current park market value (across every ever-held state.park_menu ticker) minus cost basis
          derived from events.parking_events' net cash. Instrument-only — unswept cash is never
          counted as park exposure.
      - name: residual_after_park
        description: >-
          The existing events-vs-live residual (undeployed_total − park MV − cash), with
          park_unrealized netted out. An ongoing drift signal (magnitude/trend over time), not
          expected to be exactly zero on any given day — see bigquery/93's DEVIATION #2 note.

  - name: park_nav_daily
    description: >-
      The AI Park Allocator's own daily-chained NAV/TWR, vehicle-generalized across the 12-ticker
      menu (PARK_ROUTER_DESIGN.md v2 §9; bigquery/93_park_accounting.sql). 2026-07-18.
    columns:
      - name: as_of_date
        tests:
          - not_null
          - unique
      - name: park_mv
        description: Park market value that day (instrument-only; unswept cash excluded by design).
      - name: twr_index
        description: Chained park TWR index (EXP(SUM(LN(1+r))) − 1), the AI's own book performance.

  - name: park_counterfactuals
    description: >-
      SGOV / VOO / v1-rule-shadow / AI, same date axis, four chained total-return indices —
      PARK_ROUTER_DESIGN.md v2 §9's three-way evaluation benchmark for the AI Park Allocator.
      2026-07-18 (bigquery/93_park_accounting.sql).
    columns:
      - name: as_of_date
        tests:
          - not_null
          - unique
      - name: sgov_index
        description: 100% SGOV counterfactual — never left the old world.
      - name: voo_index
        description: 100% VOO counterfactual — the prior static policy. NULL before VOO's first mark / on an ingest gap (voo_daily_return's own null-on-gap discipline).
      - name: rule_index
        description: The v1 deterministic rule table, running record-only (state.park_rule_shadow) — never trades.
      - name: ai_index
        description: park_nav_daily.twr_index joined by date — the AI's actual realized book performance.
      - name: ai_era_start_date
        description: >-
          bigquery/212. The last axis date STRICTLY BEFORE the AI Park Allocator's first BOUND
          park-allocation call (derived from state.decision_log_current; expected 2026-07-24, the
          close before the 2026-07-26 call). Constant across all rows — a property of the view,
          repeated so a single-row read is self-describing about its baseline. NULL if no BOUND
          call exists, in which case all four *_ai_era columns are NULL for every row.
      - name: sgov_index_ai_era
        description: sgov_index rebased to ai_era_start_date. NULL strictly before the anchor, 0 at it.
      - name: voo_index_ai_era
        description: >-
          voo_index rebased to ai_era_start_date. NULL strictly before the anchor, 0 at it; also
          inherits voo_index's own null-on-gap discipline.
      - name: rule_index_ai_era
        description: rule_index rebased to ai_era_start_date. NULL strictly before the anchor, 0 at it.
      - name: ai_index_ai_era
        description: >-
          ai_index rebased to ai_era_start_date — the allocator graded on ITS OWN decisions only.
          The inception-anchored ai_index spans the owner's manual 2026-07-15 VOO cutover, which
          went underwater immediately, so the published AI-vs-SGOV verdict was inherited rather
          than earned. Measured 2026-09-02: inception-anchored says AI −1.17pp vs SGOV; AI-era says
          AI +0.67pp vs SGOV. The sign flips. Not a whitewash — the same re-anchoring widens the
          AI's deficit against rule_index from −27bp to −179bp.

  - name: strategy_unit_value_7d_ago
    description: Nearest perf.strategy_daily row to "7 days ago" per strategy — feeds strategy_scorecard's Δ Wk column.
    columns:
      - name: strategy
        tests:
          - not_null
          - unique
          - accepted_values:
              values: ['A', 'B', 'C', 'D', 'E']

  - name: strategy_scorecard
    description: One row per strategy — activation + budget + deployed-TWR. Read by the weekly self-email only (not the dashboard, despite the name suggesting otherwise — ops/dashboard/generate_dashboard.py reads system_health/kill_flags/strategy_nav/gate_watch/alerts/run_log directly).
    columns:
      - name: strategy
        tests:
          - not_null
          - unique
          - accepted_values:
              values: ['A', 'B', 'C', 'D', 'E']
      - name: is_active
        description: TRUE when activation contains ACTIVATE and is not DO-NOT-ACTIVATE.
        tests: [not_null]
      - name: twr_7d
        description: Deployed-TWR change over the trailing 7 days (nullable — no strategy_daily row near that date yet).

  - name: weekly_activity
    description: Last-7-day activity counts. Retained for history — no longer read by the weekly self-email (2026-07 redesign). Single row.
    columns:
      - name: fills_7d
        description: Curated fills in the last 7 days (America/Denver).
      - name: pending_orders
        description: Count of ORDER_STAGED pending registry rows.
