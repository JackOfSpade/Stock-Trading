version: 2

# Tests for the analytics.* layer.

models:
  - name: position_lifecycle
    description: One row per round-trip; position_key carries leg_seq so it is unique.
    columns:
      - name: position_key
        description: strategy:ticker:entry_date:leg_seq — unique per round-trip (LAG window partitions on it).
        tests:
          - not_null
          - unique
      - name: strategy
        description: Strategy code (NULL strategy rows are filtered before the TWR).

  - name: strategy_daily_returns
    description: Value-weighted daily deployed total returns per strategy (gross).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [as_of_date, strategy]
    columns:
      - name: as_of_date
        tests: [not_null]
      - name: strategy
        tests: [not_null]
      - name: deployed_capital
        description: Deployed dollars marked that day (Σ prev_mv) — feeds strategy_vs_park_daily.

  - name: strategy_vs_park_daily
    description: Per strategy-day, the weekly email's chart series — deployed-slice excess % (PRIMARY, from perf.strategy_daily) + cumulative $ edge vs the SGOV park (secondary). 2026-07 redesign.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [as_of_date, strategy]
    columns:
      - name: as_of_date
        tests: [not_null]
      - name: strategy
        tests: [not_null]
        description: Strategy code, restricted to ever-deployed strategies (A-E subset).
      - name: excess_vs_sgov
        description: Cumulative deployed-slice excess return vs SGOV for that day — from perf.strategy_daily; the email turns the latest value into an average vs-SGOV return per week/month/year over the strategy's deployed days.
      - name: deployed_unit_value
        description: The strategy's own chained cumulative total-return unit value for that day (the returns chart plots this − 1).

  - name: sgov_cumulative
    description: SGOV's own cumulative total return per deployed trading day (the returns chart's SGOV line + its own average return per week/month/year). 2026-07-03.
    columns:
      - name: as_of_date
        tests:
          - not_null
          - unique
      - name: sgov_cum_return
        description: SGOV's cumulative total return (close + dividends) since the first deployed date.

  - name: deployed_book_vs_sgov
    description: Single-row combined deployed-book excess % — the weekly email's hero headline (value-weighted across all deployed strategies, not a sum of per-strategy percentages). 2026-07-03.
    columns:
      - name: combined_excess_pct
        description: The aggregate deployed book's return vs SGOV over its deployed days.
      - name: first_deployed_date
        description: Earliest deployed day across all strategies.

  - name: strategy_vs_park
    description: Latest cumulative $ edge vs the SGOV park per ever-deployed strategy — the weekly email's per-strategy verdict row (2026-07 redesign).
    columns:
      - name: strategy
        tests:
          - not_null
          - unique
          - accepted_values:
              values: ['A', 'B', 'C', 'D', 'E']
      - name: edge_dollars_cum
        description: Cumulative $ edge vs the SGOV park since the strategy's first deployment.

  - name: park_baseline
    description: Single-row "what would parking everything have earned" scale anchor for the weekly email's hero tile (2026-07 redesign).
    columns:
      - name: first_deployed_date
        description: Earliest as_of_date across all strategies in strategy_vs_park_daily.
      - name: park_dollars_approx
        description: Approximate $ the current total sleeve NAV would have earned fully parked in SGOV over the same window.

  - name: sgov_daily_return
    description: SGOV actual total-return benchmark per day.
    columns:
      - name: as_of_date
        tests:
          - not_null
          - unique

  - name: voo_daily_return
    description: VOO (Vanguard S&P 500 ETF) actual total-return benchmark per day. 2026-07-13.
    columns:
      - name: as_of_date
        tests:
          - not_null
          - unique

  - name: voo_cumulative
    description: VOO's own cumulative total return per deployed trading day, aligned to the same axis as sgov_cumulative (the weekly email's VOO chart line + its own average return per month/year). NULL before VOO's first observed mark, and NULL on any interior/trailing day its mark is missing (an ingest gap → a break in the chart line, not a false flat carry). 2026-07-13; null-on-gap 2026-07-17.
    columns:
      - name: as_of_date
        tests:
          - not_null
          - unique
      - name: voo_cum_return
        description: VOO's cumulative total return (close + dividends) since the first deployed date; NULL until VOO's first mark AND on any day with no real VOO mark (ingest gap). The running level is still chained across gaps internally, so it resumes exactly on the next real mark.

  - name: deployed_book_vs_benchmarks
    description: Single-row combined deployed-book comparison vs SGOV AND VOO — the weekly email's headline block (percent + "same dollars, same days" dollar legs). 2026-07-13.
    columns:
      - name: first_deployed_date
        description: Earliest deployed day across all strategies.
      - name: n_deployed_days
        description: Count of deployed trading days in the window — the N used for both SGOV and VOO period-average denominators.
      - name: n_voo_mark_days
        description: Count of deployed days with an actual VOO mark. 0 means VOO-derived columns are NULL (backfill not yet applied) — gates the email's VOO rendering.
      - name: book_return
        description: The aggregate deployed book's cumulative return over its deployed days.
      - name: voo_return
        description: NULL when n_voo_mark_days = 0.

  - name: thesis_outcomes
    description: Thesis-construction decisions joined to their round-trip outcome.
    columns:
      - name: entry_id
        description: One row per thesis entry_id (QUALIFY picks the nearest round-trip).
        tests:
          - not_null
          - unique
      - name: decision
        description: GO / NO-GO verdict.

  - name: conviction_features
    description: GO theses with conviction mapped to an ordinal (gated feature view).
    columns:
      - name: entry_id
        tests:
          - not_null
          - unique
      - name: decision
        description: Always 'GO' here (the WHERE filter).
        tests:
          - accepted_values:
              values: ['GO']
      - name: conviction_ordinal
        description: 1..6 for LOW..HIGHEST; NULL when conviction is unrecognized/missing.
        tests:
          - dbt_utils.accepted_range:
              min_value: 1
              max_value: 6
              # NULLs are allowed (unscored conviction); range test ignores NULLs.

  - name: calibration_summary
    description: Per-conviction-tier closed count / win-rate / avg realized P&L (cold-start safe).
    columns:
      - name: conviction
        tests:
          - not_null
          - unique

  - name: calibration_shrunk
    description: >-
      Beta-Binomial-shrunk per-conviction-tier win rate + Wilson 95% interval + the
      trustworthy_edge hard gate — supersedes reading calibration_summary.win_rate alone. Added
      2026-07-04 (audit finding): this model previously had zero test/doc coverage here, unlike every
      sibling analytics model, despite trustworthy_edge being documented as "the ONLY gate that may
      change behavior" off this view. See tests/assert_calibration_shrunk_wilson_bounds.sql for the
      Wilson-interval well-formedness invariant (also pins the 2026-07-04 SAFE_DIVIDE fix).
    columns:
      - name: conviction
        tests:
          - not_null
          - unique

  - name: strategy_nav
    description: Per-strategy NAV / sizing base; one row per strategy A-E.
    columns:
      - name: strategy
        tests:
          - not_null
          - unique
          - accepted_values:
              values: ['A', 'B', 'C', 'D', 'E']

  - name: account_reconciliation
    description: >-
      Account-level §13 events-side expected totals (single row). 2026-07-18 (PARK_ROUTER_DESIGN.md
      v2 §9, AI Park Allocator accounting): SUPERSEDES the bigquery/22-era definition — canonical
      source is now bigquery/93_park_accounting.sql. Adds park_unrealized / residual_after_park;
      every prior column preserved byte-identical.
    # Single row — asserted by tests/assert_account_reconciliation_single_row.sql.
    columns:
      - name: park_unrealized
        description: >-
          Current park market value (across every ever-held state.park_menu ticker) minus cost basis
          derived from events.parking_events' net cash. Instrument-only — unswept cash is never
          counted as park exposure.
      - name: residual_after_park
        description: >-
          The existing events-vs-live residual (undeployed_total − park MV − cash), with
          park_unrealized netted out. An ongoing drift signal (magnitude/trend over time), not
          expected to be exactly zero on any given day — see bigquery/93's DEVIATION #2 note.

  - name: park_nav_daily
    description: >-
      The AI Park Allocator's own daily-chained NAV/TWR, vehicle-generalized across the 12-ticker
      menu (PARK_ROUTER_DESIGN.md v2 §9; bigquery/93_park_accounting.sql). 2026-07-18.
    columns:
      - name: as_of_date
        tests:
          - not_null
          - unique
      - name: park_mv
        description: Park market value that day (instrument-only; unswept cash excluded by design).
      - name: twr_index
        description: Chained park TWR index (EXP(SUM(LN(1+r))) − 1), the AI's own book performance.

  - name: park_counterfactuals
    description: >-
      SGOV / VOO / v1-rule-shadow / AI, same date axis, four chained total-return indices —
      PARK_ROUTER_DESIGN.md v2 §9's three-way evaluation benchmark for the AI Park Allocator.
      2026-07-18 (bigquery/93_park_accounting.sql).
    columns:
      - name: as_of_date
        tests:
          - not_null
          - unique
      - name: sgov_index
        description: 100% SGOV counterfactual — never left the old world.
      - name: voo_index
        description: 100% VOO counterfactual — the prior static policy. NULL before VOO's first mark / on an ingest gap (voo_daily_return's own null-on-gap discipline).
      - name: rule_index
        description: The v1 deterministic rule table, running record-only (state.park_rule_shadow) — never trades.
      - name: ai_index
        description: park_nav_daily.twr_index joined by date — the AI's actual realized book performance.

  - name: strategy_unit_value_7d_ago
    description: Nearest perf.strategy_daily row to "7 days ago" per strategy — feeds strategy_scorecard's Δ Wk column.
    columns:
      - name: strategy
        tests:
          - not_null
          - unique
          - accepted_values:
              values: ['A', 'B', 'C', 'D', 'E']

  - name: strategy_scorecard
    description: One row per strategy — activation + budget + deployed-TWR. Read by the weekly self-email only (not the dashboard, despite the name suggesting otherwise — ops/dashboard/generate_dashboard.py reads system_health/kill_flags/strategy_nav/gate_watch/alerts/run_log directly).
    columns:
      - name: strategy
        tests:
          - not_null
          - unique
          - accepted_values:
              values: ['A', 'B', 'C', 'D', 'E']
      - name: is_active
        description: TRUE when activation contains ACTIVATE and is not DO-NOT-ACTIVATE.
        tests: [not_null]
      - name: twr_7d
        description: Deployed-TWR change over the trailing 7 days (nullable — no strategy_daily row near that date yet).

  - name: weekly_activity
    description: Last-7-day activity counts. Retained for history — no longer read by the weekly self-email (2026-07 redesign). Single row.
    columns:
      - name: fills_7d
        description: Curated fills in the last 7 days (America/Denver).
      - name: pending_orders
        description: Count of ORDER_STAGED pending registry rows.
