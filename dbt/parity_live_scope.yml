# dbt_parity LIVE-comparison scope — which ported models get a live BigQuery row comparison.
#
# WHY THIS FILE EXISTS (2026-09-01, dbt view-coverage burn-down completed).
# `scripts/check_dbt_view_coverage.py` reported 102 live state/analytics/perf views with neither a
# dbt model nor a declared source. 101 were pure SELECT; they are now ported (the 102nd,
# analytics.theater_independence, is ML.DISTANCE-backed and is declared in sources.yml instead).
# Coverage is 0 uncovered — but `scripts/dbt_parity.py` issues ONE LIVE BigQuery JOB PER MODEL, so
# comparing all 186 would roughly triple the warehouse-validation job. Measured 2026-09-01: 186
# models did not finish inside a 580 s local budget, against a 6m47s CI job at 85 models; the path
# gate fires that job on ~109 pushes/30d, so the naive version costs hundreds of billable
# minutes/month for no new information. CLAUDE.md's push-cost discipline forbids that.
#
# WHY DROPPING THE LIVE CHECK FOR THE REST IS SAFE — it is replaced by a STRONGER, cheaper gate, not
# by nothing. `scripts/verify_dbt_port.py --all --use-compiled` now runs in CI over EVERY model and
# proves each one TOKEN-IDENTICAL to its canonical bigquery/*.sql body. Its own docstring states the
# implication: "Token-equal here implies dbt_parity.py must also agree, because the two sides are the
# same SQL." And live-vs-canonical is independently proven for all 249 objects by
# `scripts/check_live_sql_parity.py`. Token-identical port + canonical==live ⇒ port==live. The live
# row comparison adds nothing for a token-identical model; it earns its cost only as a belt-and-braces
# check on the gate-critical set below.
#
# NOT a way to silence a failing model. Removing a model from this list does NOT reduce what is
# checked — verify_dbt_port still gates it on every push, and a DIFF there is a hard CI failure.
# This list only chooses where the EXPENSIVE redundant check also runs.
#
# THIS GATE IS WHY IT MATTERS: adding verify_dbt_port to CI immediately caught FOUR pre-existing
# ports that had silently gone stale against later bigquery/*.sql revisions — entry_staging_allowed
# (missed bigquery/205's message-stability rewrite), calibration_shrunk (dropped a
# COALESCE(conviction,'(unscored)')), position_lifecycle (lost an f. qualifier) and
# strategy_daily_returns (dropped the fn_is_occ_option_symbol option filter entirely). dbt_parity had
# passed all four for weeks because the differing branches are currently inert — no drawdown breach,
# no OCC option ever held. All four are regenerated and token-identical as of this commit.
#
# TO ADD A MODEL HERE: weigh it against the per-model live cost above. The default answer for a newly
# ported view is NO — verify_dbt_port already covers it.
