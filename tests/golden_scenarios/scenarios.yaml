    rationale: >
      Operating_Protocols.md §19's spec-floor rail: a pair may be routed as a Strategy E ENTRY CANDIDATE
      only if it ALSO meets E's frozen Entry criterion 3 (252-day corr >= 0.5 -- `strategy/07_strategy_e.md`,
