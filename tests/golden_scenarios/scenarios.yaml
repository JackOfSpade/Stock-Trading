  # ---- AI Park Allocator daily status-computation rule (PA-*) ----
  # Added 2026-07-18 (PARK_ROUTER_DESIGN.md v2 §10 Phase 0's golden-scenario fixture requirement --
  # "crisis call -> binds same day; low-conviction ambiguity -> KEEP; connectors-down -> HOLD; re-risk
  # without concurrence -> stays PENDING"). Every scenario below assumes loop `park_allocator`
  # (ops/autonomy_levels.yaml) has already been promoted to autonomy stage `active_auto` -- Claude_
  # Task_Plan.md's AUTONOMY-STAGE BRANCH is explicit that while the loop sits at its current build stage
  # `shadow`, EVERY call logs status='RECORD_ONLY' unconditionally and D2 converts nothing regardless of
  # vehicle/conviction, which would make all four scenarios collapse to the same trivial answer and
  # defeat the point of pinning the underlying conviction-gate / cadence-rail rule ahead of promotion
  # (exactly the ahead-of-rollout fixture role PARK_ROUTER_DESIGN.md's Phase 0 describes). Also assumes
  # `ops.park_control` is `enabled=TRUE` with no `forced_vehicle` pin and evidence is otherwise fresh
  # unless a scenario says otherwise. See this file's header VOCABULARY NOTE ON PA-* for why GO/NO-GO
  # (not a native park-status token) is the leading `expected_decision` vocabulary used here.

  - id: PA-01
    category: park_allocator
    situation: >
      The park's current vehicle is VOO (risk_tier 4). Today's PARK ALLOCATION CALL evidence:
      state.current_regime's FUNDAMENTAL_AXIS shock_overlay reads 'acute', live VIX closes at 34.5, and
      hy_oas has widened sharply intraday per today's own scanned developments. D1 judges HIGH conviction
      (conviction_pct 90) that the park should switch to SGOV (risk_tier 0) -- a de-risk. No
      forced_vehicle pin is set, the switch is exempt from the re-risk/lateral budget (it is a de-risk),
      and there is no active post-de-risk cooldown in effect. What status does today's call resolve to,
      and does it convert the park to SGOV this evening?
    governing_files: [Operating_Protocols.md, Claude_Task_Plan.md]
    expected_decision: "GO (status='BOUND' -- de-risk converts same day via D2, no concurrence required)"
    rationale: >
      Operating_Protocols.md §13.F conviction gates: "A de-risking call (to a lower risk_tier) binds at
      MEDIUM+ conviction" -- HIGH clears MEDIUM+. Cadence rail 1: "De-risk binds same day. A MEDIUM+
      conviction call to a lower risk_tier converts that evening (D2) -- flight to safety is never queued,
      never blocked by budget." Claude_Task_Plan.md D2's PARK ALLOCATION CONVERSION step 6: status='BOUND'
      and vehicle (SGOV) differs from state.park_policy_current.vehicle (VOO) -> D2 re-verifies the rails
      and, on a clean pass, INSERTs the events.park_policy_changes row today. GO.

  - id: PA-02
    category: park_allocator
    situation: >
      The park's current vehicle is VOO (risk_tier 4). Today's PARK ALLOCATION CALL evidence:
      shock_overlay reads 'contained' (neither 'none' nor 'acute'), live VIX closes at 19.8 with no
      band-crossing significance, hy_oas is flat month-over-month, and today's scanned developments
      contain nothing shock-relevant. D1's own assessment is LOW conviction for any switch away from VOO
      -- nothing clears the MEDIUM+ de-risk bar or the HIGH re-risk bar in either direction. D1 calls
      vehicle=VOO (KEEP), direction='keep'. What status does today's call resolve to, and does the park
      vehicle change?
    governing_files: [Operating_Protocols.md, Claude_Task_Plan.md]
    expected_decision: "NO-GO (KEEP -- status='BOUND' but vehicle is unchanged, so nothing executes)"
    rationale: >
      Operating_Protocols.md §13.F: "Default-KEEP on ambiguity -- the same high-bar, default-NO posture as
      D1's existing regime-router-review flag," logged every day including KEEP days. Claude_Task_Plan.md
      D2's PARK ALLOCATION CONVERSION step 6, second bullet: "If status='BOUND' and the call's vehicle
      already equals state.park_policy_current.vehicle (a bound KEEP) -- also do nothing; there is no
      switch to execute." A KEEP call has no risk_tier change to gate, so it resolves 'BOUND' trivially,
      but VOO stays VOO -- no capital-moving action occurs. NO-GO.

  - id: PA-03
    category: park_allocator
    situation: >
      The park's current vehicle is VOO. During today's PARK ALLOCATION CALL session, both the IBKR
      connector (get_price_snapshot, get_price_history) and the FMP connector (quote, chart) fail or time
      out for every pricing/quote call attempted, so no live ^VIX read and no fresh market evidence of any
      kind can be gathered for today's call. What status does today's call resolve to, and what happens to
      the park vehicle?
    governing_files: [Operating_Protocols.md, Claude_Task_Plan.md]
    expected_decision: "NO-GO (HOLD -- status='HOLD', a park_router warning alert is raised, VOO continues unchanged)"
    rationale: >
      Operating_Protocols.md §13.F cadence rail 6: "Connectors down / evidence ungatherable -> no call
      binds. HOLD + a warning alert (park_router category, auto-resolvable) -- the AI decides with
      evidence or not at all." Claude_Task_Plan.md's CONNECTORS-DOWN / EVIDENCE UNGATHERABLE clause: "no
      call binds -- log status='HOLD' and CALL ops.sp_raise_alert('warning','D1','park_router', 'evidence
      ungatherable -- park allocation HOLD', ...)." D2's PARK ALLOCATION CONVERSION step 6, first bullet:
      "If status != 'BOUND' (...'HOLD' on stale evidence / connectors-down) -- do nothing." VOO remains the
      park vehicle by default, not by an evidenced KEEP judgment. NO-GO.

  - id: PA-04
    category: park_allocator
    situation: >
      The park's current vehicle is GOVT (risk_tier 1) -- the last de-risk execution into GOVT completed
      20 trading days ago (outside the 5-trading-day post-de-risk cooldown), and state.park_switch_budget
      shows 0 of the 2-per-30-day re-risk/lateral budget used. Today's PARK ALLOCATION CALL evidence leads
      D1 to HIGH conviction (conviction_pct 88) that the park should move to VOO (risk_tier 4) -- a
      re-risk. No prior trading day's PARK ALLOCATION CALL proposed this same VOO switch, so there is no
      existing PENDING row to compare against -- this is the first session to propose it. What status does
      today's call resolve to, and does the park convert to VOO today?
    governing_files: [Operating_Protocols.md, Claude_Task_Plan.md]
    expected_decision: "NO-GO (PENDING -- recorded awaiting tomorrow's independently-derived concurrence, does not convert today)"
    rationale: >
      Operating_Protocols.md §13.F conviction gates: "A re-risking call (to a higher risk_tier) binds only
      at HIGH conviction, and even then only through the concurrence rail below." Cadence rail 2: "A
      HIGH-conviction call to a higher risk_tier is recorded PENDING; it binds only if the NEXT trading
      day's D1 -- instructed to derive its own call BEFORE reading the pending one -- independently lands
      on the same vehicle. Two fresh-context sessions must agree before the book re-risks." No such prior
      independently-matching session exists yet, so today's HIGH-conviction call cannot itself satisfy
      concurrence -- it is the FIRST of the two required reads. Claude_Task_Plan.md's status enumeration:
      "'PENDING' (a re-risk awaiting tomorrow's concurrence)." D2's PARK ALLOCATION CONVERSION step 6,
      first bullet: status != 'BOUND' -> do nothing. GOVT remains the park vehicle today. NO-GO.

  # ---- AI Research-Significance Screen scenarios (RS-*) ----
  # Added 2026-07-19 (Redesign C -- owner reversal of the same-day DEFER verdict; AI_DECISION_REDESIGN.md
  # §3). Every scenario below assumes the item has ALREADY cleared Layer 1's mechanical population rail
  # (Operating_Protocols.md §19) -- these fixtures pin only the Layer 2 AI significance judgment and the
  # spec-floor rail (both §19), not the population-rail arithmetic itself (that stays mechanical and
  # untested here by design). Also assumes loop `research_screener` (ops/autonomy_levels.yaml) sits at its
  # build ceiling `active_auto` from the first call -- unlike `park_allocator`'s shadow-first build, a
  # screen decision moves research attention, never capital, so there is no shadow-vs-live branch to pin
  # the way PA-* pins park_allocator's build-stage branch. See this file's header VOCABULARY NOTE ON RS-*
  # for why GO/NO-GO (not a native research-screener status token) is the leading `expected_decision`
  # vocabulary used here.

  - id: RS-01
    category: research_screener
    situation: >
      D1's single-name-move population rail (Operating_Protocols.md §19 Layer 1: mkt cap >= $2B, moved
      >= 2% close-to-close today) surfaces ticker JJK: a high-beta, unprofitable name (mkt cap $3.4B) that
      closed -6.8% today. The only same-day catalyst is a press release announcing the board "is exploring
      strategic alternatives" -- no process timeline, no advisor named, no financial specifics of any
      kind. JJK's realized volatility regime is already elevated (this magnitude of daily move is common
      for the name), and vague strategic-alternatives PRs of this kind have recurred for JJK without
      follow-through. The session's Layer 2 judgment concludes the move is NOT significant -- noise in an
      already-noisy name, not a real informational event. What is today's D1 single-name research-screen
      disposition on JJK?
    governing_files: [Operating_Protocols.md, Claude_Task_Plan.md]
    expected_decision: "NO-GO (rejected_notable -- legacy rule would have passed at >=5%; logged as a rule_only disagreement)"
    rationale: >
      Operating_Protocols.md §19 Layer 2: the session judges significance in the name's OWN volatility
      regime and event context, not off the raw move size -- "a 3% move in a low-vol mega-cap staple on a
      real event can outrank a 7% move in a high-beta name on noise." JJK's 6.8% move on a content-free
      strategic-alternatives PR, in a name where moves this size are routine, is judged not significant and
      REJECTED. Because 6.8% clears the legacy fixed bar (>=5%), §19's logging contract requires this item
      in `rejected_notable` with `legacy_rule_pass=true` -- the record-only legacy benchmark (the
      park_rule_shadow precedent) disagrees with the AI call, so it counts toward `agreement.rule_only`.
      NO-GO -- screened out.

  - id: RS-02
    category: research_screener
    situation: >
      D1's single-name-move population rail surfaces ticker PZQ: an ultra-low-volatility mega-cap consumer
      staple (mkt cap $190B) whose realized daily moves are rarely more than 1% in either direction. Today
      PZQ closed -3.4% after management cut full-year EPS guidance at a same-day investor conference -- a
      concrete, quantified, hard event (not rumor or vague language). The session's Layer 2 judgment
      concludes the move IS significant in PZQ's own volatility regime: 3.4% is several multiples of a
      typical daily move for this name, and the guidance cut is a real, quantifiable informational event.
      What is today's D1 single-name research-screen disposition on PZQ, and can it be routed as a Strategy
      B entry candidate?
    governing_files: [Operating_Protocols.md, Claude_Task_Plan.md]
    expected_decision: "GO (surfaced below_spec_floor=true -- context/SL1 evidence only; NOT routed as a B entry candidate: strategy/04 frozen Entry criterion 1 requires >=5%)"
    rationale: >
      Operating_Protocols.md §19 Layer 2 judges PZQ's 3.4% move significant given its ultra-low-vol regime
      and the hard guidance-cut catalyst -- it is written up. §19's spec-floor rail then applies: a name
      may be routed as a Strategy B ENTRY CANDIDATE only if it ALSO meets B's frozen Entry criterion 1
      (>=5% close-to-close on event day -- `strategy/04_strategy_b.md`, spec_hash-frozen). 3.4% is below
      that floor, so PZQ is recorded `below_spec_floor=true` -- context / SL1 ideation evidence only, per
      §19 -- and the write-up must not describe it as a tradeable candidate. GO -- screened in/surfaced,
      but not routed as a B candidate.

  - id: RS-03
    category: research_screener
    situation: >
      M2 PART 1's population rail (Operating_Protocols.md §19 Layer 1: same 6-digit GICS group, trailing
