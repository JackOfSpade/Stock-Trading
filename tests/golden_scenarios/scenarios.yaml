      block MXD's entry?
    governing_files: [Strategy.md]
    expected_decision: "GO"
    rationale: >
      Rev 35 (owner directive, Strategy.md line 7 changelog) removed Strategy D's "no more than 3
      positions may share any correlation bucket" count cap and its post-entry entry-blocking behavior --
      correlation-bucket membership (both at-entry and post-entry) is now monitored/informational only
      (Section 6), never entry-blocking, regardless of bucket size. MXD sharing a >0.6-correlation bucket
      with all 3 already-held positions is reported for Section 6 tracking but does not fail criterion 5.
      With an otherwise-clean thesis, no decisive adversarial flaw, and the 30%-of-NAV GICS-sector
