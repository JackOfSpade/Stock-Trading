      breadth narrows for a sixth consecutive session and the step ACCELERATES, which D1 judges a
      genuine deterioration. On every other axis nothing fires -- VIX closes 14.92, below both 15 and
      its own 20d; the index sits above its 50dma and near its trailing closing high; the 10Y is
      unchanged; hy_oas is a month-old monthly aggregate and untestable; shock_overlay has read 'acute'
