    rationale: >
      Claude_Task_Plan.md D1's DE-RISK EVIDENCE CARDINALITY rule (added 2026-09-03) and
      Operating_Protocols.md §13.F's de-risk-evidence-cardinality qualifier: a de-risk converts only
