version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Every github/codeql-action/* step in a workflow must run the SAME version, or CodeQL fails
    # ("Loaded a configuration file for version X, but running version Y"). Ungrouped, Dependabot
    # opened init and analyze as separate PRs (#68/#69, 2026-10-16): each was red alone, #68 landed
    # by fast-forward, and #69 then needed a merge commit touching a workflow file, which
    # auto-merge's GITHUB_TOKEN may not push (no `workflows` permission) -- stranded for good, with
    # main left on mismatched init/analyze. One grouped PR is consistent and fast-forwardable.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # dbt minor/major bumps cannot land as a lone Dependabot PR: dbt-core and dbt-bigquery must move
    # on the same minor AND dbt/dbt_project.yml's require-dbt-version must move with them, or
    # `dbt parse` refuses to run (#58 for 1.12.5, closed 2026-10-02; #71 for 1.12.6, red 2026-10-17).
    # Closing such a PR only skips that one release, so each new patch re-opens it and it strands.
    # Upgrade dbt as one deliberate change across all three; Dependabot still sends patch bumps.
    ignore:
      - dependency-name: "dbt-core"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "dbt-bigquery"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: terraform
    directory: /infra/terraform
    schedule:
      interval: weekly
