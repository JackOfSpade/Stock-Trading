name: Publish health dashboard

# Fix D1: the dashboard is generated by ops/dashboard/generate_dashboard.py but was gitignored and
# never served, so the operator's only window into the system was hand-run SQL. This builds it from
# BigQuery (keyless WIF) and publishes to GitHub Pages.
#
# DOUBLE-GATED + OFF BY DEFAULT — the page contains LIVE TRADING DATA (positions, NAV, alerts). It
# publishes ONLY when BOTH are set as repo variables:
#   * vars.GCP_WIF_PROVIDER + vars.GCP_WIF_SERVICE_ACCOUNT  (keyless GCP auth; ops/RUNBOOK.md §12/§16)
#   * vars.PUBLISH_DASHBOARD == 'true'                       (explicit opt-in)
# Only enable on a PRIVATE repo with access-controlled Pages (Settings → Pages → "Private"), or accept
# that a public repo would expose the data. Otherwise it skips cleanly (no artifact, no deploy).

on:
  schedule:
    - cron: '20 5 * * *'   # ~05:20 UTC — after the freshness (05:00) + cadence (05:15) checks
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # JOB-LEVEL GATE (2026-07-30 cost audit — replaces a step-level guard): PUBLISH_DASHBOARD is
    # confirmed UNSET (`gh variable list`), so all 40 sampled daily runs used to check out, hit a guard
    # step that set a `skip` output, skip every subsequent step via `if: steps.guard.outputs.skip ==
    # 'false'`, and STILL bill a full rounded minute for zero output — a job that starts always bills its
    # rounded minute even if every real step no-ops. A job-level `if:` makes GitHub Actions SKIP the job
    # entirely (0 billable minutes) instead of starting the runner just to no-op through it. Behavior when
    # PUBLISH_DASHBOARD=true + both WIF vars are set is unchanged — every step below still runs in order.
    #
    # Mirrors the removed guard step's condition exactly: PUBLISH_DASHBOARD must be the literal string
    # 'true' AND both WIF vars must be non-empty. An unset `vars.*` property evaluates to '' in GitHub
    # Actions expressions, so `!= ''` is the expression-syntax equivalent of the old step's `[ -n "..." ]`
    # bash test. `vars` (unlike `env`/`steps`) IS available in a job-level `if:` (GitHub Actions context
    # availability: jobs.<job_id>.if supports github, needs, vars, inputs — verified against current docs).
    if: vars.PUBLISH_DASHBOARD == 'true' && vars.GCP_WIF_PROVIDER != '' && vars.GCP_WIF_SERVICE_ACCOUNT != ''
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-ci.txt
      - name: GCP WIF auth + gcloud setup (provides the bq CLI)
        uses: ./.github/actions/gcp-wif-auth
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}
      - name: Generate dashboard
        run: python ops/dashboard/generate_dashboard.py
      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp ops/dashboard/index.html _site/index.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
