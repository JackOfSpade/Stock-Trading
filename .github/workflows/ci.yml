name: CI

# Guards the only executable code in the system. Strategy.md flags a bug in
# c_options_math.py as the experiment's highest-leverage failure mode ("converts
# the entire defined-risk premise into an undefined-risk position"). Before this
# workflow, the module's own self-test only ran if a human typed `python
# c_options_math.py`; nothing tested it on push. Now every change is checked.
#
# NOTE on merge-gating: auto-merge-claude.yml merges ANY branch -> main via a
# direct bot push (not a PR). It now triggers on this workflow's completion
# (workflow_run) and merges a branch ONLY if the CI run for that branch's exact
# tip commit concluded "success" — so a red build blocks the merge. The two ruff
# steps inside the `checks` job below are step-level continue-on-error (advisory),
# so they never affect that gate.
#
# `push:` has no `branches:` filter (was `['claude/**', main]`) — CI must run on
# every branch, not just claude/*, or the auto-merge CI-gate lookup finds no run
# for a non-claude branch's SHA and fails closed forever (skips it every drain).

# `pull_request:` REMOVED (2026-07-30 cost audit — verified before removing, not just asserted):
#   - 21 of a 27-run pull_request-triggered sample landed on a SHA that ALSO had a push-triggered run —
#     pure duplicate work, both running every job to the same conclusion. The other 6 were early-history
#     only (2026-07-07/08), none since.
#   - auto-merge-claude.yml's CI gate reads the MOST RECENT run's conclusion for a SHA regardless of
#     triggering event, so a push-triggered run alone already satisfies it.
#   - `gh api repos/:owner/:repo/branches/main/protection` returns HTTP 403 (no GitHub Pro / branch
#     protection on this repo) — auto-merge-claude.yml's own gate script is the ONLY merge gate; nothing
#     else consumes a pull_request-triggered run's status or check-run.
#   - `gh pr list --state all` shows every PR MERGED — consistent with the bot drain, not a human
#     clicking "Merge" off a PR's own Checks tab.
# ACCEPTED CONSEQUENCE: a PR's own "Checks" tab shows no ci.yml run of its own (it only ever duplicated
# the branch's push run); the branch's push-triggered run remains the real gate auto-merge reads.
on:
  push:
  workflow_dispatch:

# Cancel redundant in-flight runs on the same branch when a newer push arrives.
# Safe because auto-merge-claude.yml only reads the conclusion of the tip-SHA run;
# cancelling an earlier run on the same branch is correct-and-cheaper behavior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: tests + dbt parse + shell-lint + ruff (consolidated 2026-07-30)
    runs-on: ubuntu-latest
    # CONSOLIDATED (2026-07-30 GitHub Actions cost audit): these four non-credentialed jobs (formerly
    # separate `test`, `lint`, `shell-lint`, `dbt` jobs) measured ~105-136s of combined ACTUAL runtime
    # but billed 4-5 rounded minutes/run under GitHub's ceil(seconds/60)-per-JOB billing — each job pays
    # its own rounding overhead separately. Folded into one job — summed then rounded ONCE — for a
    # measured ~1.913 min/run saving (~687 min/month at ~13.1 runs/day). `dbt-parity` and `sql-validate`
    # below are UNTOUCHED by this change: they are credentialed (WIF) and gate-critical, out of scope.
    #
    # Those per-run minute figures describe the PRE-consolidation four-job layout and are history, not
    # the cost of a run today. CURRENT MEASURED BASELINE (2026-08-21, runs 32448847866 / 32437747452):
    # this workflow bills ~4 minutes per push across 2 jobs — this job ~148 s (3 billed min) plus
    # warehouse-validation ~26 s (1 billed min), under GitHub's ceil(seconds/60)-per-JOB billing.
    #
    # BLOCKING STATUS IS UNCHANGED PER STEP (only the container changed): every step below blocks the
    # run exactly as it did in its old standalone job, EXCEPT the two `ruff` steps at the end (formerly
    # the whole `lint` job, which was job-level `continue-on-error: true`) — those stay advisory via
    # their own step-level `continue-on-error: true` below, so folding an advisory check into an
    # otherwise-blocking job does not newly block landings on a lint nit.
    steps:
      - uses: actions/checkout@v7
        with:
          # full history so check_cadence_marker.py can resolve merge-base(HEAD, origin/main) and
          # read each cadence file's first line at the base revision. Under the default depth-1
          # checkout that base is unresolvable and the period half of the check silently degrades
          # to shape-only — the same fail-open shape the dbt-parity/sql-validate path gates were
          # fixed for on 2026-07-20 (CLAUDE.md), so it is set explicitly rather than left to default.
          # The change-scope step below shares that requirement (resolve_diff_base.sh needs
          # origin/main and the merge-base to be resolvable at all).
          fetch-depth: 0
      - name: Change scope (which optional step groups this push needs)
        id: scope
        # Path gate for the OPTIONAL step groups only. Everything that can regress from a change
        # ANYWHERE in the tree — the module self-test, pytest, every consistency checker, the bash
        # and node suites, and the workflow_run name-sync check — stays unconditional below; only
        # the three groups whose inputs are structurally confined to a path set are gated:
        #   dbt_needed  — dbt parse/coverage read bigquery/** + dbt/** (plus the pinned constraint file)
        #   lint_needed — actionlint/shellcheck read .github/**, *.sh, and the act config
        #   py_needed   — ruff reads *.py (plus its own config/constraint sources)
        # FAIL OPEN, matching the two warehouse-validation path gates: an unresolvable diff base
        # (new branch, force-push, unrelated histories) leaves all three 'true', so a push whose
        # scope cannot be determined runs everything rather than silently skipping a real check.
        env:
          EVENT_NAME: ${{ github.event_name }}
          # ci.yml has no pull_request trigger, so this is normally empty — the positional argument
          # is retained for the same reason the warehouse-validation guard steps retain it (the
          # helper is shared, and either side's trigger could be restored).
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          # shellcheck source=../../scripts/resolve_diff_base.sh
          source scripts/resolve_diff_base.sh
          dbt_needed=true
          lint_needed=true
          py_needed=true
          changed=""
          base="$(resolve_diff_base "$EVENT_NAME" "$PR_BASE" "$PUSH_BEFORE" "$HEAD_SHA" "$REF_NAME")"
          # A `git diff` that ERRORS must fail open too, so the scoping only happens when the diff
          # itself succeeded — an empty diff from a successful call legitimately means "nothing to do".
          # Herestrings, not pipes: `printf ... | grep -q` can report SIGPIPE under `pipefail` when
          # grep exits early on a match, which would invert the result of a matching pattern.
          if [ -n "$base" ] && changed="$(git diff --name-only "$base" "$HEAD_SHA")"; then
            grep -qE '^(bigquery/|dbt/|requirements-ci\.txt$)' <<<"$changed" || dbt_needed=false
            grep -qE '(^\.github/|\.sh$|^\.actrc$)' <<<"$changed" || lint_needed=false
            grep -qE '(\.py$|^pyproject\.toml$|^requirements-ci\.txt$)' <<<"$changed" || py_needed=false
          fi
          {
            echo "dbt_needed=$dbt_needed"
            echo "lint_needed=$lint_needed"
            echo "py_needed=$py_needed"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::CI change scope — dbt:$dbt_needed lint:$lint_needed ruff:$py_needed (diff base: ${base:-unresolved — all optional groups run})"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-ci.txt
      - name: Install test + dbt deps (pinned via constraints — RUNBOOK §25 C3)
        # pyyaml up front so the new parser tests can import check_cadence_consistency (which imports yaml)
        # during pytest, not only in the later cadence step. google-cloud-bigquery is NOT optional here and
        # must NOT be folded into the path-gated dbt install: tests/test_adversarial_review_storage.py
        # imports google.cloud.bigquery, so `pytest -q` needs it on EVERY push. It would otherwise arrive
        # only transitively via dbt-bigquery, which the sibling step below installs on SOME pushes —
        # requirements-ci.txt names it directly for exactly this reason, and so does this line. The dbt
        # half of this step's name is the path-gated sibling step directly below.
        run: pip install --quiet -c requirements-ci.txt pytest pyyaml google-cloud-bigquery
      - name: Install dbt for parse (pinned via constraints — RUNBOOK §25 C3)
        # Only the `dbt deps + parse` / `dbt view coverage` steps below consume these, and both are
        # gated on the same output — installing dbt on a docs- or code-only push buys nothing.
        if: steps.scope.outputs.dbt_needed == 'true'
        run: pip install --quiet -c requirements-ci.txt dbt-core dbt-bigquery
      - name: Module self-test (asserts, no deps)
        run: python c_options_math.py
      - name: pytest regression suite (options-math + drift-defense parsers — RUNBOOK §25 C2)
        run: python -m pytest -q
      - name: strategy/ slices in sync with Strategy.md
        run: python scripts/split_strategy.py --check
      - name: task_plan/ slices in sync with Claude_Task_Plan.md
        run: python scripts/split_task_plan.py --check
      - name: cadence single-source (cadence.yaml ⇄ 12/15/24 SQL ⇄ plan headings/inventory ⇄ 31/59 catchup lists)
        run: python scripts/check_cadence_consistency.py
      - name: prose invariants (routine-executed prose ⇄ ops/prose_invariants.yaml — no RETIRED instructions, H6)
        run: python scripts/check_prose_invariants.py
      - name: daily/weekly routine ownership (no duplicate weekly discovery, exits, or maintenance)
        run: python scripts/check_routine_scope.py
      - name: cadence-output first-line period markers (shape always; period for markers this push changed)
        run: python scripts/check_cadence_marker.py
      - name: cadence routine lists are generator-current (bigquery/12/15/24 ⇄ ops/cadence.yaml — ARCH-3 Item 30b)
        run: python scripts/gen_routine_lists.py --check
      - name: routine backup snapshot valid (routine_backup.json ⇄ cadence.yaml ⇄ triggers.json ⇄ trigger_ids.json)
        run: python scripts/routine_backup.py check
      - name: cron DST safety (every cron_utc holds its monitor_class contract in BOTH MST and MDT)
        run: python scripts/check_cron_dst_safety.py
      - name: roster single-source (roster.yaml ⇄ state seed ⇄ Strategy.md ⇄ slices ⇄ slice-map ⇄ derived SQL)
        run: python scripts/check_roster_consistency.py
      - name: autonomy-stage single-source (autonomy_levels.yaml ⇄ prose/SQL citations)
        run: python scripts/check_autonomy_consistency.py
      - name: handoff-contract completeness (queue drain-closes + required-column naming ⇄ ops/handoff_contracts.yaml)
        run: python scripts/check_handoff_contracts.py
      - name: script-version single-source (.gs SCRIPT_VERSION consts ⇄ bigquery/43 MERGE seed)
        run: python scripts/check_script_version_consistency.py
      - name: scheduled-query version single-source (bigquery/75+supersessions sp_beat_heartbeat literal ⇄ bigquery/63 registry MERGE)
        run: python scripts/check_sq_version_registry.py
      - name: superseded bigquery/*.sql definitions name the CURRENT canonical file (supersede-only discipline)
        # bigquery/*.sql is apply-in-order + supersede-only, enforced only by hand-written comments —
        # which rotted twice: 23's trading_enabled was re-applied live in isolation (re-latching the
        # trading gate for 3+ days), and 47 still claimed to be "the new single source of truth" long
        # after 78 superseded it, with 23/34 both pointing at the by-then-stale 47. Blocks NEW unmarked
        # or stale-pointer definitions; pre-existing ones are grandfathered in the script's BASELINE, a
        # burn-down list (19 at introduction 2026-07-18, down to 10 as of 2026-07-29 — see the script's
        # own docstring/BASELINE for the current count, not a number pinned here that would go stale
        # again the next time an entry is fixed).
        run: python scripts/check_superseded_markers.py
      - name: adversarial-review readers go through state.adversarial_reviews_current (superseded_by anti-join)
        # bigquery/143 gave events.adversarial_reviews an append-only correction path: the corrected row
        # is INSERTed carrying superseded_by = the OBSOLETE row's event_id, and the bad row stays in the
        # table for audit. A reader that goes to the base table therefore sees BOTH — silently, with no
        # error and no alert. The identical convention on events.decision_log has had NO machine check
        # since bigquery/122, and it already rotted: bigquery/116:571 still carries the INVERTED
        # `WHERE superseded_by IS NULL` form (which keeps the stale row and drops the correction),
        # undetected only because superseded_by is populated on 0 of 496 decision_log rows. This blocks
        # the same rot for adversarial_reviews. Checks CANONICAL definitions only — a raw read in a
        # superseded, never-re-applied file is DR history, not a finding.
        run: python scripts/check_superseded_by_discipline.py
      - name: alert-message stability (STRING_AGG feeding a sp_raise_alert_once message must be a TOTAL order)
        # ops.sp_raise_alert_once dedups on EXACT (category, message) string equality and NOTHING else,
        # so any message whose text can change while the CONDITION does not degenerates `_once` into a
        # plain sp_raise_alert: a new unresolved row, separately emailed, on every run. bigquery/205 swept
        # the "message embeds a moving VALUE" half of that class in 2026-08-31. This blocks the other half
        # — a STRING_AGG whose ORDER BY is NARROWER than the fields the message prints, or absent entirely,
        # so tied rows permute and the SAME set renders as a DIFFERENT string. Measured twice live before
        # bigquery/227 fixed it (2026-07-24/25 and 2026-07-31 05:00/05:16: identical open finding sets,
        # duplicate alert rows, duplicate emails). 205's sweep declared every other site "stable and left
        # alone" and missed all four that 227 fixes, which is precisely why this is now machine-checked
        # rather than hand-swept. Pure text parsing over the FINAL-EFFECTIVE definitions only (it imports
        # check_live_sql_parity's own parser, so superseded DR-rebuild copies are structurally excluded and
        # header prose quoting an offending snippet is unreachable) — no BigQuery, no network, no creds.
        # Its allowlist is anti-rot: an entry that stops tripping FAILS the build telling you to delete it.
        run: python scripts/check_alert_message_stability.py
      - name: roster-notice category lockstep (alert_relay.py ⇄ alert_emailer.gs ⇄ sp_auto_resolve_alerts Rule 5 ⇄ Claude_Task_Plan.md)
        # The six SISA roster-change notice categories are listed in FOUR places, each with a
        # different and individually silent failure mode if it drifts. alert_emailer.gs has warned
        # about this in a comment since 2026-08-04 ("A category in only one of the three places is
        # inert") with nothing enforcing it; 2026-09-07 added the fourth copy —
        # alert_relay.py's NO_PUSH_CATEGORIES, the ntfy suppression list — whose failure mode is the
        # worst of the four: a category listed there is SILENTLY never pushed to the phone. Exact-set
        # equality across all four, not subset: a subset rule would permit precisely that mistake.
        # Pure text parsing, no creds. A failed extraction is a FAILURE, never a vacuous pass.
        run: python scripts/check_roster_notice_lockstep.py
      - name: session-config tool coverage (Claude_Task_Plan.md/ops/triggers.json mcp__ refs ⇄ .claude/settings.json allowlist — completeness-critic N-1)
        # An unattended scheduled routine calling an mcp__ tool absent from .claude/settings.json's
        # permissions.allow gets an unanswerable permission prompt and silently stalls that step (no
        # dedicated alert class exists for a hung permission prompt). Went GREEN once the owner added
        # the missing entries (was KNOWN-RED at introduction; stale "KNOWN-RED" annotation corrected
        # 2026-07-29 — verified live: "SETTINGS TOOL COVERAGE: OK — 8 referenced mcp__ tool(s) all
        # present"). A future red run here is a REAL regression, not an expected/known state.
        # SCOPE NOTE (2026-08-08): this gate only ever sees full `mcp__Server__tool` tokens — a small
        # subset of the plan's tool references (the count drifts as prose changes; the script prints
        # it each run). Routine prose overwhelmingly writes bare backticked names instead
        # (`` `get_account_summary` ``), which this regex cannot see at all; that gap is covered by
        # scripts/check_connector_tools.py below. A green run here is NOT by itself proof of complete
        # tool coverage — see that script's module docstring.
        run: python scripts/check_settings_toolcov.py
      - name: connector tool manifest (ops/connector_tools.yaml ⇄ .claude/settings.json ⇄ routine text — new-tool drift gate)
        # A connector tool added by the VENDOR (not this repo) arrives in the claude.ai connectors UI
        # defaulted to "ask" / "needs approval" — not silently blocked, not silently allowed. An
        # unattended scheduled routine that happens to call that new tool mid-run hits an unanswerable
        # permission prompt and silently stalls: no error, no alert, just a missed_run the cadence watch
        # eventually raises hours later with no indication of WHY. This is the bare-name sibling of the
        # session-config tool coverage gate above (which only sees full mcp__Server__tool tokens); it
        # also catches routine text calling a tool the vendor has RETIRED (the live paper_search/
        # space_search bug class — see ops/connector_tools.yaml's header and this script's docstring).
        run: python scripts/check_connector_tools.py
      - name: OPS0 adopt-gate coverage (Claude_Task_Plan.md precondition 5 ⇄ this job's own blocking steps)
        # OPS0's STEP 4d ADOPT path merges a stranded branch onto main with no human in the loop,
        # gated on precondition 5 running this job's steps LOCALLY inside the routine container
        # (which cannot invoke the Actions runner). That step list is hand-copied prose, and it had
        # silently drifted six scripts behind this very job (ops0_adopt_gate_drift, verified
        # 2026-08-20) — OPS0 could have adopted a branch that broke any of the six after running a
        # gate strictly WEAKER than this job. Parses this job's own steps and fails if any blocking
        # one's script/test target is missing from precondition 5's paragraph — see the script's
        # docstring for exactly what counts as "blocking" and what is deliberately excluded.
        run: python scripts/check_adopt_gate_coverage.py
      - name: auto-merge decision logic (CI-gate + delete-safety fixtures — 2026-07-04 code-quality audit)
        run: bash tests/test_auto_merge_logic.sh
      - name: diff-base resolution (dbt-parity/sql-validate shared precedence chain — 2026-07-26 codebase audit)
        # scripts/resolve_diff_base.sh replaced the two path gates' verbatim-duplicated base-resolution
        # chain (see its header). Before the extraction this logic was only exercisable by pushing to CI;
        # this pins all four precedence branches plus the zero-SHA-on-ref-creation case (rev 2026-07-20)
        # against a scratch git repo, the same testing approach test_auto_merge_logic.sh already uses.
        run: bash tests/test_resolve_diff_base.sh
      - name: notify_webhook.sh curl-invocation tests (ntfy.sh / default-JSON branches, C19 code-review)
        run: bash tests/test_notify_webhook.sh
      - name: ci_finding.sh bq-invocation tests (ops.ci_findings VALUES-row writer — 2026-08-31 code-quality pass, shell-workflows#0)
        # scripts/ci_finding.sh replaced the VALUES-row half of the ops.ci_findings INSERT idiom that
        # was hand-copied across 17 of the 25 call sites in alert-relay.yml / auto-merge-claude.yml /
        # guard-config-audit.yml / keyless-sa-audit.yml / live-sql-parity.yml / offsite-backup.yml /
        # sql-dryrun-sweep.yml / stranded-branch-check.yml / wif-binding-audit.yml (see that script's
        # header for the 8 INSERT..SELECT / ARRAY-parameter sites deliberately left untouched). This
        # had ZERO functional coverage before the extraction — only YAML syntax validity via
        # actionlint — same gap class test_notify_webhook.sh above was created to close.
        run: bash tests/test_ci_finding.sh
      - name: bq_csv.sh helper tests (bq_csv_query / _headless / bq_list_events_tables — 2026-08-31 code-quality pass, shell-workflows#1)
        # WIRING FIX (2026-08-31, wave-2 follow-up to shell-workflows#1): the extraction itself
        # (scripts/bq_csv.sh, sourced by backup_events.sh/restore_drill.sh/state_snapshot.sh) and
        # this test suite landed in an earlier pass but were left OUT of the checks job on
        # purpose -- the extracting agent didn't own ci.yml/Claude_Task_Plan.md/
        # auto-merge-claude.yml and wiring a new blocking step touches all three (see
        # scripts/check_adopt_gate_coverage.py). Every sibling shell suite above (auto_merge_logic,
        # resolve_diff_base, notify_webhook) is already a blocking gate here; an unwired suite
        # would rot silently, so this closes that gap the same way.
        run: bash tests/test_bq_csv.sh
      - name: restore_drill.sh snapshot-DATE resolution tests (resolve_backup_date — 2026-09-02 code-quality pass)
        # Same WIRING discipline as the bq_csv.sh step above, and for the same reason: the fixing
        # agent owned scripts/restore_drill.sh but not ci.yml / Claude_Task_Plan.md /
        # auto-merge-claude.yml, and a blocking step has to be registered in all three (see
        # scripts/check_adopt_gate_coverage.py). An unwired suite rots silently.
        #
        # WHAT IT GUARDS: resolve_backup_date() used to walk the table list alphabetically and
        # `break` at the FIRST table with any dt= partition, anchoring the whole DR drill on that
        # table's own newest snapshot. bigquery's backup export isolates each table in its own
        # BEGIN/EXCEPTION block precisely so one table can fail without aborting the rest — so a
        # table whose export has been erroring for days, but which still has an old partition in
        # GCS, would silently pin the drill to a stale date while fresher snapshots sat unread.
        # The test sed-extracts the LIVE function out of scripts/restore_drill.sh rather than
        # mirroring it, so it cannot drift from what actually ships.
        run: bash tests/test_restore_drill.sh
      - name: session-start hook tests (shallow-clone deepen + reset safety — 2026-09-08 shallow_clone_git_attribution)
        # .claude/session-start.sh runs before the FIRST tool call of every remote routine session and
        # had zero functional coverage until now: it was only ever exercised by a live routine, which is
        # the one place a regression is both invisible and unfixable after the fact (the session that
        # would notice has already booted from the broken state).
        #
        # WHAT IT GUARDS: the hook's `git fetch --unshallow` — the MECHANICAL half of the fleet-wide
        # shallow-clone fix (prose half: Claude_Task_Plan.md §Execution environment, HISTORY-DEPTH
        # PRECHECK). The routine container clones SHALLOW, and on a shallow clone `git log -S/-L`,
        # `git blame`, `git log --since` and `git merge-base --is-ancestor` do not error — they resolve
        # every pre-boundary change onto the boundary commit and print a `--- /dev/null` header, which
        # is shaped exactly like a real authorship answer. That has already produced a false
        # `unlanded_completed_run` alert (OPS0 2026-08-03) and a false commit attribution
        # (SL2 2026-09-08). Three branches all matter and all fail silently in production: the deepen
        # must fire on a shallow clone, must NOT fire on a complete one (`git fetch --unshallow` on a
        # complete repository is a hard `fatal:`), and must WARN rather than pass quietly when it fails
        # — a silent failed deepen leaves every history command confidently wrong.
        run: bash tests/test_session_start_hook.sh
      - name: weekly_report.gs / alert_emailer.gs pure-helper tests (esc_/esc2_, periodAvg_, alertSubject_, ...)
        # No actions/setup-node step needed -- ubuntu-latest ships Node preinstalled and the script
        # only uses the built-in `assert` module (no package.json/npm install anywhere in the repo).
        # This suite previously had zero CI coverage (2026-07-14 audit finding) -- a regression in
        # either operator-facing email's pure logic passed every other CI gate silently.
        run: node ops/weekly_report/test_pure_helpers.js

      # The most CONSEQUENTIAL automation in the repo is the embedded bash that decides whether routine git
      # output reaches main (auto-merge-claude.yml) and whether a strand is detected (stranded-branch-check.yml)
      # — yet only the lower-stakes Python parsers had purpose-built tests. actionlint statically checks every
      # workflow (and runs shellcheck on each `run:` block); shellcheck covers every standalone .sh script
      # under scripts/, tests/, .claude/, and infra/terraform/ (globs — new scripts dropped into any of those
      # four directories are covered automatically, no list to maintain here). A subtle edit to the
      # branch-selection filter, the merge-base ancestry re-check, or the fail-closed default would
      # otherwise regress with no CI signal.
      #
      # BLOCKING GATE (promoted 2026-06-29 after a confirmed clean run on the runner — CI #102, all steps
      # green). NOT continue-on-error: a failure now fails the CI run and blocks auto-merge, the hard gate the
      # recommendation intended. Two stability guards so a *blocking* linter can't be wedged by tool drift:
      #   - actionlint is PINNED (script + binary at v1.7.12) — a future release adding a new check cannot
      #     suddenly red-light merges; bump the pin deliberately. The download SCRIPT itself is fetched
      #     by immutable commit SHA, not the `v1.7.12` tag (BUG FIX, 2026-08-31 code-quality pass,
      #     shell-workflows#2): a git tag is mutable — unlike a commit SHA, upstream could force-move
      #     `v1.7.12` to different content and this BLOCKING gate would fetch-and-execute whatever that
      #     tag now resolves to, with the job's own GITHUB_TOKEN in scope. `1.7.12` stays as the
      #     argument passed TO the script (it only selects which fixed-URL release tarball to download,
      #     `.../releases/download/v1.7.12/...` — not a ref the script itself is fetched from) and the
      #     cache key below, both unaffected by this. SHA resolved via
      #     `git ls-remote https://github.com/rhysd/actionlint refs/tags/v1.7.12` (a single, unpeeled
      #     result confirms v1.7.12 is a lightweight tag, so the returned object IS the commit) and
      #     verified byte-identical to the tag-addressed script at resolution time (sha256
      #     72fa3e45ac20f3c3a512d6747b4fcf719e21f890e8c43e78d48a41fdfb900c4e for both). Re-resolve and
      #     re-verify the same way before ever bumping this pin.
      #   - shellcheck (the runner's version, unpinned) is floored at `-S warning`, so only warnings/errors
      #     block; the scripts pass clean today, this just stops a future shellcheck release's new *style/info*
      #     nit from wedging the gate.
      #
      # PATH-GATED (`lint_needed`, see the change-scope step): actionlint reads .github/** only, and the
      # standalone shellcheck pass reads *.sh only, so a push touching neither cannot change either
      # verdict. Both remain BLOCKING whenever they run — an `if:` narrows WHEN a gate applies, it does
      # not downgrade it to advisory, and the scope step fails open. The `workflow_run` name-sync check
      # after them is deliberately NOT gated: it is sub-second and reads three workflow files plus the
      # merge-trigger array, so leaving it unconditional costs nothing and keeps the merge-gate coupling
      # checked on every single push.
      - name: Cache actionlint binary (pinned v1.7.12)
        id: cache-actionlint
        if: steps.scope.outputs.lint_needed == 'true'
        uses: actions/cache@v6
        with:
          path: actionlint
          key: actionlint-v1.7.12-${{ runner.os }}
      - name: Install actionlint (pinned v1.7.12)
        if: steps.scope.outputs.lint_needed == 'true' && steps.cache-actionlint.outputs.cache-hit != 'true'
        run: |
          # Commit SHA (not the `v1.7.12` tag) -- see the BLOCKING GATE comment block above this step.
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12
      # act-local-CI only. GitHub's ubuntu-latest ships shellcheck preinstalled, but act's
      # runner image (catthehacker/ubuntu:act-latest, selected by the operator's ~/.actrc)
      # does not — so both the actionlint step below (which shells out to shellcheck for its
      # embedded run-block linting) and the standalone shellcheck gate after it died with
      # exit 127 under the global `act push` pre-push hook. `env.ACT` is set ONLY by act and
      # is unset on GitHub-hosted runners, so this step is skipped there and CANNOT change
      # real CI — it exists purely so the local gate lints exactly what the hosted one does
      # rather than silently degrading to a weaker check.
      # `== 'true'`, not a bare truthiness test: GitHub expression truthiness
      # treats ANY non-empty string as true, so a future org/repo variable or
      # composite action exposing ACT="false" would make a bare `env.ACT` fire
      # this step on hosted CI. The in-script re-check is a second, independent
      # guard so that even a misfiring `if:` degrades to a no-op instead of
      # failing this BLOCKING GATE (auto-merge gates every branch on it) on a
      # transient apt error.
      - name: Install shellcheck (act-local CI only — GitHub's runner already has it)
        if: ${{ env.ACT == 'true' && steps.scope.outputs.lint_needed == 'true' }}
        run: |
          set -euo pipefail
          [ "${ACT:-}" = "true" ] || exit 0
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq shellcheck
          fi
          shellcheck --version
      - name: actionlint (workflow YAML + embedded run-block bash via shellcheck)
        if: steps.scope.outputs.lint_needed == 'true'
        run: ./actionlint -color
      - name: shellcheck standalone scripts (warning+ blocks)
        if: steps.scope.outputs.lint_needed == 'true'
        run: |
          set -euo pipefail
          # BUG FIX (2026-07-20 code-review, C23): nullglob so a non-matching pattern vanishes instead of
          # staying LITERAL (bash's default when nothing matches a glob) -- without it, an unmatched glob
          # string (.claude/*.sh and infra/terraform/*.sh each currently match exactly ONE file, so
          # deleting/renaming/moving either reproduces this immediately) is passed to shellcheck as a
          # literal, nonexistent path argument, which fails this BLOCKING GATE (not continue-on-error --
          # auto-merge-claude.yml gates every branch's merge on this exact CI run) with a spurious "no
          # such file" error instead of a real lint finding. Mirrors the identical idiom already used for
          # the SQL dry-run step's fail-open glob further down this file (rev 2026-07-20b, Finding 2).
          shopt -s nullglob
          files=(scripts/*.sh tests/*.sh .claude/*.sh infra/terraform/*.sh)
          shopt -u nullglob
          existing=()
          for f in "${files[@]}"; do [ -f "$f" ] && existing+=("$f"); done
          if [ "${#existing[@]}" -eq 0 ]; then
            echo "::error::shellcheck found zero .sh files across scripts/, tests/, .claude/, infra/terraform/ — broken checkout or repo layout, not nothing to check."
            exit 1
          fi
          shellcheck -S warning "${existing[@]}"
      - name: workflow_run trigger names stay in sync (auto-merge-claude.yml <-> ci.yml / golden-scenarios.yml name:)
        # actionlint does NOT catch this (verified): auto-merge-claude.yml's on.workflow_run.workflows
        # matches against a workflow's name: field, not its filename -- a rename to either name:
        # without updating this array silently and permanently stops that workflow's completions
        # from re-triggering auto-merge, with zero red CI signal (2026-07-14 audit finding).
        run: |
          set -euo pipefail
          ci_name="$(grep -m1 '^name:' .github/workflows/ci.yml | sed 's/^name:[[:space:]]*//')"
          gs_name="$(grep -m1 '^name:' .github/workflows/golden-scenarios.yml | sed 's/^name:[[:space:]]*//')"
          line="$(grep -m1 'workflows:' .github/workflows/auto-merge-claude.yml)"
          mapfile -t triggers < <(printf '%s' "$line" | grep -oP '(?<=\[)[^]]*(?=\])' | tr ',' '\n' | sed 's/^[[:space:]]*"//; s/"[[:space:]]*$//')
          missing=""
          for want in "$ci_name" "$gs_name"; do
            found=0
            for t in "${triggers[@]}"; do [ "$t" = "$want" ] && found=1 && break; done
            [ "$found" -eq 0 ] && missing="$missing [$want]"
          done
          if [ -n "$missing" ]; then
            echo "::error::auto-merge-claude.yml's on.workflow_run.workflows is missing:$missing (present as a ci.yml/golden-scenarios.yml name: but not in the trigger list) -- that workflow's completions will silently stop re-triggering auto-merge."
            exit 1
          fi
          echo "OK: workflow_run trigger names match ci.yml + golden-scenarios.yml name: fields."

      # Validates the dbt/ modeling layer's structure + that every ref()/source() and test resolves,
      # WITHOUT a warehouse (parse does not connect). The full `dbt build` against BigQuery is gated on
      # WIF creds — see ops/RUNBOOK.md §14. Offline; no secrets needed. PATH-GATED (`dbt_needed`, see the
      # change-scope step) on the same bigquery/** + dbt/** path set the warehouse-validation job's parity
      # guard uses, plus requirements-ci.txt (which pins the dbt versions parse itself runs under): what
      # `dbt parse` reads is confined to those paths, so a push touching none of them cannot change its
      # verdict. Still BLOCKING when it runs, and the scope step fails open. dbt-core/dbt-bigquery come
      # from the path-gated install step above, not from the always-run one.
      - name: Write a CI profile (no creds — parse does not connect)
        if: steps.scope.outputs.dbt_needed == 'true'
        # dbt/profiles.ci.yml is the single checked-in source for this profile (2026-07-04 code-quality
        # audit — this job and the dbt-parity equivalent step previously each wrote the same content via
        # an inline heredoc, byte-for-byte duplicated with no single source of truth).
        run: |
          mkdir -p ~/.dbt
          cp dbt/profiles.ci.yml ~/.dbt/profiles.yml
      - name: dbt deps + parse
        if: steps.scope.outputs.dbt_needed == 'true'
        working-directory: dbt
        run: |
          dbt deps
          dbt parse
      - name: dbt view coverage (ENFORCING as of 2026-09-01 — backlog is zero)
        if: steps.scope.outputs.dbt_needed == 'true'
        # scripts/dbt_parity.py only proves parity for views that already have a dbt model/source;
        # this asserts every live state/analytics/perf view HAS one, so drift in coverage itself
        # (not just row-level logic) fails the build.
        #
        # WAS `|| true`. It printed a backlog that grew from 70 uncovered (2026-07-14) to 102
        # (2026-09-01) and blocked nothing, so nobody read it — an advisory that is permanently red
        # is indistinguishable from one that is broken. The backlog is now ZERO: 101 of the 102 were
        # pure SELECT and are ported (generated by scripts/gen_dbt_port.py, each proved
        # token-identical to its canonical body by scripts/verify_dbt_port.py), and the 102nd,
        # analytics.theater_independence, is ML.DISTANCE-backed and is declared in
        # dbt/models/sources.yml as an object dbt reads but must never build.
        #
        # From here it earns its keep: a NEW live view with no dbt model and no source declaration
        # fails this step instead of joining a backlog nobody reads.
        run: python scripts/check_dbt_view_coverage.py
      # PATH-GATED (`py_needed`, see the change-scope step): ruff reads *.py plus its own pyproject.toml
      # configuration, so a push touching neither cannot change its output. These two steps were already
      # advisory; the gate only stops paying for a pip install and a lint pass that had nothing to say.
      - name: Install ruff (advisory — informational lint, never blocks; RUNBOOK §25 C3)
        if: steps.scope.outputs.py_needed == 'true'
        # continue-on-error: true added as belt-and-braces (2026-07-30 cost consolidation): this step used
        # to live in its own job-level `continue-on-error: true` JOB (`lint`), so nothing it did could ever
        # fail the CI run. Now that it is a step inside the otherwise-BLOCKING consolidated job, a
        # transient `pip install` failure here (network blip, package-index hiccup) would, without this,
        # newly fail the whole run and block auto-merge on something that used to be purely advisory.
        continue-on-error: true
        run: pip install --quiet -c requirements-ci.txt ruff
      - name: ruff check (informational)
        if: steps.scope.outputs.py_needed == 'true'
        # Same belt-and-braces reasoning as the install step above, PLUS the pre-existing `|| true` on the
        # ruff invocation itself — two independent reasons this step can never fail the job.
        continue-on-error: true
        run: ruff check c_options_math.py strategy_math/ tests/ scripts/ ops/ || true

  warehouse-validation:
    name: dbt↔live parity + BigQuery SQL syntax (keyless WIF)
    runs-on: ubuntu-latest
    # BLOCKING SQL SYNTAX GATE + ADVISORY DBT PARITY: no job-level continue-on-error. SQL guard/dry-run failures block unconditionally; dbt-only steps are advisory unless DBT_PARITY=block.
    # RUNS BY DEFAULT whenever the read-only WIF creds exist (changed 2026-06-22 — previously it was
    # opt-in via RUN_DBT_PARITY and so NEVER actually ran, leaving the two hand-kept copies of each view
    # (bigquery/*.sql + dbt/) without a drift guard). Proves each dbt model produces the SAME rows as its
    # live hand-SQL view (catches logic drift the always-on `dbt parse` can't). Read-only: it
    # `dbt compile`s (never `dbt build` — that would overwrite the live datasets, since
    # generate_schema_name pins models to bare dataset names) then runs compiled-vs-live EXCEPT
    # DISTINCT both ways via the bq CLI (scripts/dbt_parity.py).
    #
    # One var, `DBT_PARITY`, controls it (read-only SA: roles/bigquery.dataViewer + jobUser):
    #   unset / 'advisory' (default) : RUN when WIF present; a drift prints ::warning:: but does NOT
    #                                  block the merge (staged rollout — promote once a clean baseline is
    #                                  confirmed, so a latent drift can't wedge auto-merge).
    #   'block'                      : RUN and FAIL the build on drift (a hard merge gate).
    #   'off'                        : skip entirely (escape hatch if WIF misbehaves).
    # If the WIF vars are unset the job skips cleanly (green). See ops/RUNBOOK.md §6/§14.
    #
    # A SECOND var, `DBT_PARITY_CONCURRENCY`, tunes how fast (not whether) the check runs — the per-model
    # parity queries run through a small client-side thread pool, default 4, hard-capped at 16
    # (scripts/dbt_parity.py parity_concurrency()). Job COUNT is unchanged by it; only the instantaneous
    # BigQuery request rate. **Set it to 1 to restore fully serial behavior** — that is the no-code-change
    # rollback if the 2026-06-29 DTS consumer rate-quota (see the path-gate note below) is ever pressured
    # again. Owner-authorized 2026-07-30; concurrency 4 measured 43 models 230s -> see that function.
    permissions:
      contents: read
      id-token: write   # Workload Identity Federation (no downloadable key)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history so the path gate below can diff the pushed range
      - name: Path gate + WIF config + enablement
        id: dbt_guard
        continue-on-error: ${{ vars.DBT_PARITY != 'block' }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          # ci.yml no longer has a pull_request trigger, so this is normally empty. Keep the positional
          # argument: resolve_diff_base.sh is shared with golden-scenarios.yml, whose own pull_request
          # trigger was ALSO removed (2026-08-08, same cost-audit follow-up -- see that workflow's header
          # for the duplicate-run evidence). Dropping the argument here would silently break ci.yml
          # diff-base resolution if either workflow's pull_request trigger is ever restored.
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}   # push event's short branch name (e.g. "main"); rev 2026-07-20b
          WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          WIF_SA: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}
          DBT_PARITY: ${{ vars.DBT_PARITY }}
        run: |
          # PATH GATE (2026-06-29): parity only catches view-LOGIC drift, which is impossible without a
          # change under bigquery/** or dbt/**. This job dbt-compiles + runs 43 EXCEPT-DISTINCT parity
          # queries PER RUN (one per ported model — count corrected from "~30" 2026-07-30, measured; an
          # UNDERCOUNT matters here because this number is the basis of the quota reasoning below), on
          # EVERY push to EVERY branch (widened from claude/**+main once auto-merge covers all branches)
          # — the ~1k BigQuery jobs/day estimate below grows with total branch count. That volume already
          # tripped the project's BigQuery Data Transfer Service consumer rate-quota on 2026-06-29
          # (delayed the 05:00-06:00 scheduled window and FAILED the embed + integrity scheduled-query
          # runs). Skipping parity on docs-/code-only pushes removes that load with no loss of coverage.
          #
          # Per-run BigQuery job count is now 44, not 86: the 43 per-model INFORMATION_SCHEMA metadata
          # lookups were batched into ONE job (2026-07-30 Actions cost audit — 70.9s -> 1.5s, proven
          # 43/43 equivalent; see scripts/dbt_parity.py live_columns_all()). That HALVES this job's
          # contribution to the rate-quota risk described above. The 43 parity queries themselves must
          # stay one-per-model — batching them was measured and REJECTED (BigQuery "Resources exceeded"
          # all-in-one; SLOWER than per-model when chunked). See that function's notes before retrying.
          #
          # DIFF-BASE RESOLUTION moved to scripts/resolve_diff_base.sh (2026-07-26, codebase audit —
          # de-duplication): this guard and the SQL guard step below carried the IDENTICAL ~15-line
          # precedence chain verbatim, with nothing checking the two copies stayed in sync — see that
          # script's header for the full rev 2026-07-20 / 2026-07-20b history (the two correctness fixes
          # that had to be hand-applied twice in this file before the extraction). FAIL OPEN (run parity
          # rather than risk skipping a real check) is still this job's own policy for "nothing
          # resolvable" — the shared script only resolves the SHA, it does not decide what an empty
          # result means. Block-mode fail-closed (below) is unchanged.
          set -uo pipefail
          # shellcheck source=../../scripts/resolve_diff_base.sh
          source scripts/resolve_diff_base.sh
          relevant=true
          base="$(resolve_diff_base "$EVENT_NAME" "$PR_BASE" "$PUSH_BEFORE" "$HEAD_SHA" "$REF_NAME")"
          if [ -n "$base" ]; then
            # Herestring, NOT a pipe (quality pass 2026-08-22) — this is the same SIGPIPE-under-
            # pipefail hazard this file's own header warns about at the "Change scope" step, which
            # already captures-then-greps for exactly this reason; this second, independent copy of
            # the path gate ~300 lines later was never updated to match.
            #
            # `git diff --name-only ... | grep -qE ...` runs under `set -uo pipefail` above. grep -q
            # exits the instant it finds its first match, closing the read end of the pipe while
            # git may still be writing; on a diff larger than the ~64KB pipe buffer git then dies of
            # SIGPIPE with status 141, and pipefail makes 141 the status of the whole pipeline. The
            # `if` therefore takes the FALSE branch and sets relevant=false — silently SKIPPING the
            # dbt-parity check (even under DBT_PARITY=block) on a push that genuinely did touch
            # bigquery/** or dbt/**, which is the one thing this gate exists to catch. Reproduced:
            # a generator emitting a matching first line followed by 200k non-matching lines prints
            # "NOT MATCHED exit=141".
            changed="$(git diff --name-only "$base" "$HEAD_SHA")"
            if grep -qE '^(bigquery/|dbt/)' <<<"$changed"; then
              relevant=true
            else
              relevant=false
            fi
          fi
          if [ "$relevant" = "false" ]; then
            echo "::notice::dbt parity skipped — no bigquery/** or dbt/** changes in this push (path gate; ops/RUNBOOK.md §6/§12 D1). View-logic drift is impossible without an SQL/model change."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$WIF_PROVIDER" ] && [ -n "$WIF_SA" ] && [ "$DBT_PARITY" != "off" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif [ "$DBT_PARITY" = "block" ]; then
            # FAIL CLOSED (RUNBOOK §25 C1): block mode promises a HARD parity gate; on an SQL-changing
            # push a missing parity result is a failure, not a pass (matching the §5 auto-merge
            # "missing == not green" posture). The job is NOT continue-on-error when DBT_PARITY=block,
            # so this exit blocks the merge until it's fixed.
            echo "::error::DBT_PARITY=block but the WIF vars (GCP_WIF_PROVIDER / GCP_WIF_SERVICE_ACCOUNT) are unset — the hard parity gate has no parity result. Set the WIF vars, or change DBT_PARITY to advisory/off. (ops/RUNBOOK.md §25 C1 / §6.)"
            exit 1
          else
            echo "::notice::dbt parity skipped — set the WIF vars (read-only SA) to run it (it runs by default once they exist; set DBT_PARITY=off to suppress, =block to make drift a hard merge gate that fails closed). ops/RUNBOOK.md §6/§14/§25. dbt parse remains the always-on structural gate."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: WIF-present + not-disabled SQL guard
        id: sql_guard
        if: always()
        run: |
          # Optional repo variable: undefined is the intended enabled default; only "off" is the escape
          # hatch. guard-config-audit.yml watches for it; IDE context-access warnings are expected here.
          if [ "${{ vars.RUN_SQL_DRYRUN }}" != "off" ] \
             && [ -n "${{ vars.GCP_WIF_PROVIDER }}" ] \
             && [ -n "${{ vars.GCP_WIF_SERVICE_ACCOUNT }}" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::SQL syntax gate skipped — set the WIF vars (read-only SA) to enable it (runs by default once they exist; RUN_SQL_DRYRUN=off suppresses). dbt parse remains the always-on structural SQL gate."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      # Shared bootstrap blocks whenever sql_guard is active; when only dbt parity runs, it remains advisory unless DBT_PARITY=block.
      - uses: actions/setup-python@v7
        if: always() && (steps.dbt_guard.outputs.skip == 'false' || steps.sql_guard.outputs.skip == 'false')
        continue-on-error: ${{ steps.sql_guard.outputs.skip == 'true' && vars.DBT_PARITY != 'block' }}
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-ci.txt
      - name: GCP WIF auth + gcloud setup (provides the bq CLI)
        if: always() && (steps.dbt_guard.outputs.skip == 'false' || steps.sql_guard.outputs.skip == 'false')
        continue-on-error: ${{ steps.sql_guard.outputs.skip == 'true' && vars.DBT_PARITY != 'block' }}
        uses: ./.github/actions/gcp-wif-auth
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}
      - name: Install dbt (pinned via constraints — RUNBOOK §25 C3)
        if: steps.dbt_guard.outputs.skip == 'false'
        continue-on-error: ${{ vars.DBT_PARITY != 'block' }}
        run: pip install --quiet -c requirements-ci.txt dbt-core dbt-bigquery
      - name: dbt profile (ADC from WIF via oauth)
        if: steps.dbt_guard.outputs.skip == 'false'
        continue-on-error: ${{ vars.DBT_PARITY != 'block' }}
        # dbt/profiles.ci.yml is the single checked-in source for this profile (2026-07-04
        # code-quality audit — see the `dbt` job's equivalent step above).
        run: |
          mkdir -p ~/.dbt
          cp dbt/profiles.ci.yml ~/.dbt/profiles.yml
      - name: dbt deps + compile (no build — read-only)
        if: steps.dbt_guard.outputs.skip == 'false'
        continue-on-error: ${{ vars.DBT_PARITY != 'block' }}
        working-directory: dbt
        run: |
          dbt deps
          dbt compile
      - name: Port fidelity — every model token-identical to its canonical bigquery/*.sql (offline, no queries)
        if: steps.dbt_guard.outputs.skip == 'false'
        continue-on-error: ${{ vars.DBT_PARITY != 'block' }}
        # Reuses the `dbt compile` above (--use-compiled), so this costs no extra compile and issues
        # ZERO BigQuery jobs. It is what lets dbt/parity_live_scope.yml bound the EXPENSIVE live
        # comparison below to 85 of 186 models without losing coverage: a port proved token-identical
        # to its canonical body cannot disagree with live once check_live_sql_parity.py has proved
        # canonical == live (249 objects, 0 mismatched). See that file's header for the full argument.
        #
        # This gate did not exist before 2026-09-01, and on its first run it caught FOUR ports that
        # had silently gone stale against later bigquery/*.sql revisions — entry_staging_allowed,
        # calibration_shrunk, position_lifecycle and strategy_daily_returns. dbt_parity had passed
        # all four for weeks because each difference sits in a branch that is currently inert
        # (no drawdown breach; no OCC option ever held). Row-level parity cannot see a latent
        # divergence; token comparison can.
        run: python scripts/verify_dbt_port.py --all --use-compiled
      - name: Row-level parity (compiled vs live, EXCEPT both ways)
        if: steps.dbt_guard.outputs.skip == 'false'
        continue-on-error: ${{ vars.DBT_PARITY != 'block' }}
        # Drift fails this step; whether that BLOCKS the merge is the job-level continue-on-error above
        # (advisory by default; a hard gate only when repo var DBT_PARITY=block). ops/RUNBOOK.md §6/§12.
        run: python scripts/dbt_parity.py
      # `dbt test` (the B3 invariant suite vs LIVE data) USED TO RUN HERE and was MOVED OUT 2026-07-30 to
      # live-sql-parity.yml's daily job. It is not deleted — see that workflow's "B3 invariants vs live
      # data" step.
      #
      # WHY IT DOES NOT BELONG ON A PUSH TRIGGER: those tests assert properties of LIVE DATA (reserved_cash
      # formula, queue latest-wins, daily_marks no-double-count, one-row health views), and live data
      # changes on the calendar's schedule — marks land, trades fill, sweeps run — not on the schedule that
      # someone pushes code. A push trigger therefore got it wrong in BOTH directions: blind for days when
      # nobody pushed (exactly when the unattended routine fleet is doing all the work), and re-asserting
      # the same invariants against the same data several times on a busy day. This is the same
      # "a push-time trigger cannot answer a live-state question" reasoning already written out at the top
      # of live-sql-parity.yml for why THAT check is a daily cron rather than a dbt-parity-style push job.
      #
      # DELIVERY WAS THE OTHER HALF OF THE PROBLEM: this step was always advisory and only ever emitted a
      # `::warning::` annotation, which nothing routes anywhere — a violated live-data invariant was
      # effectively reported into a log nobody reads. Its new home records an ops.ci_findings row instead,
      # which state.ci_findings_open surfaces into cadence_check's `ci_finding` warning alert and thus the
      # monitored email channel. That path needed NO new IAM grant: gh-ci-runner@ already holds a
      # table-scoped bigquery.dataEditor binding on exactly ops.ci_findings (RUNBOOK §6). Writing
      # ops.alerts directly from CI would have needed a new owner-run grant and was NOT done.
      #
      # Removing this step is safe against every coupling point that exists: ci.yml's
      # "workflow_run trigger names stay in sync" step compares only workflow `name:` fields, and
      # auto-merge-claude.yml's post-merge coverage block mirrors only the credential-free `checks` job
      # (it deliberately excludes dbt-parity and sql-validate entirely), so neither reads this step.


      # SQL syntax validation remains an unconditional blocking gate.
      - name: Dry-run changed bigquery/*.sql — BLOCK on a syntax error
        if: always() && steps.sql_guard.outputs.skip == 'false'
        env:
          EVENT_NAME: ${{ github.event_name }}
          # Normally empty without ci.yml pull_request, but retain this positional shared-helper argument:
          # golden-scenarios.yml's own pull_request trigger was likewise removed (2026-08-08, same
          # cost-audit follow-up -- see that workflow's header), so a trigger restored on either side
          # still needs this argument unchanged.
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}   # push event's short branch name (e.g. "main"); rev 2026-07-20b
        run: |
          set -euo pipefail
          gcloud config set project stock-trading-498512 >/dev/null 2>&1 || true
          # DIFF-BASE RESOLUTION moved to scripts/resolve_diff_base.sh (2026-07-26, codebase audit —
          # de-duplication): this step used to carry its OWN verbatim copy of dbt-parity's ~15-line
          # precedence chain (this comment used to say so explicitly — "mirrors dbt-parity's guard step
          # above verbatim in structure") with nothing checking the two stayed in sync; see that script's
          # header for the full rev 2026-07-20 / 2026-07-20b history (the two correctness fixes that each
          # had to be hand-applied twice in this file before the extraction). FAIL OPEN (validate every
          # bigquery/*.sql file rather than risk skipping a real check) is still this job's own policy for
          # "nothing resolvable" — the shared script only resolves the SHA, it does not decide what an
          # empty result means.
          # shellcheck source=../../scripts/resolve_diff_base.sh
          source scripts/resolve_diff_base.sh
          base="$(resolve_diff_base "$EVENT_NAME" "$PR_BASE" "$PUSH_BEFORE" "$HEAD_SHA" "$REF_NAME")"
          # Scope to the pushed range to bound BigQuery dry-run job volume (dbt-parity §6 quota note).
          # FAIL OPEN: unknown/new-branch base (merge-base above also failed, e.g. missing origin/main or
          # unrelated histories) -> validate ALL bigquery/*.sql rather than skip a real check.
          fail_open=false
          if [ -n "$base" ]; then
            mapfile -t files < <(git diff --name-only "$base" "$HEAD_SHA" -- 'bigquery/*.sql' 'bigquery/scheduled_queries/*.sql')
          else
            fail_open=true
            # BUG FIX (rev 2026-07-20b, Finding 2): nullglob so a non-matching pattern vanishes instead of
            # staying LITERAL (bash's default when nothing matches a glob) — without it, an unmatched glob
            # string is filtered out by the `[ -f "$f" ]` check below and this fail-open branch (whose
            # entire purpose is "validate EVERYTHING because we couldn't scope the diff") could end up
            # validating zero files and still exit 0 below — a green, vacuous pass in the one branch that
            # most needs to actually check something. Restored immediately after so nothing later in this
            # step depends on non-default glob behavior.
            shopt -s nullglob
            mapfile -t files < <(printf '%s\n' bigquery/*.sql bigquery/scheduled_queries/*.sql)
            shopt -u nullglob
          fi
          existing=()
          for f in "${files[@]}"; do [ -f "$f" ] && existing+=("$f"); done
          if [ "${#existing[@]}" -eq 0 ]; then
            if [ "$fail_open" = "true" ]; then
