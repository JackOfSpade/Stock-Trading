name: CI

# Guards the only executable code in the system. Strategy.md flags a bug in
# c_options_math.py as the experiment's highest-leverage failure mode ("converts
# the entire defined-risk premise into an undefined-risk position"). Before this
# workflow, the module's own self-test only ran if a human typed `python
# c_options_math.py`; nothing tested it on push. Now every change is checked.
#
# NOTE on merge-gating: auto-merge-claude.yml merges claude/* -> main via a direct
# bot push (not a PR). It now triggers on this workflow's completion (workflow_run)
# and merges a branch ONLY if the CI run for that branch's exact tip commit
# concluded "success" — so a red build blocks the merge. The lint job below is
# continue-on-error (advisory), so it never affects that gate.

on:
  push:
    branches: ['claude/**', main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: options-math tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test deps (pinned via constraints — RUNBOOK §25 C3)
        # pyyaml up front so the new parser tests can import check_cadence_consistency (which imports yaml)
        # during pytest, not only in the later cadence step.
        run: pip install --quiet -c requirements-ci.txt pytest pyyaml
      - name: Module self-test (asserts, no deps)
        run: python c_options_math.py
      - name: pytest regression suite (options-math + drift-defense parsers — RUNBOOK §25 C2)
        run: python -m pytest -q
      - name: strategy/ slices in sync with Strategy.md
        run: python scripts/split_strategy.py --check
      - name: cadence single-source (cadence.yaml ⇄ 12/15 SQL ⇄ plan headings)
        run: python scripts/check_cadence_consistency.py
      - name: autonomy-stage single-source (autonomy_levels.yaml ⇄ prose/SQL citations)
        run: python scripts/check_autonomy_consistency.py
      - name: auto-merge decision logic (CI-gate + delete-safety fixtures — 2026-07-04 code-quality audit)
        run: bash tests/test_auto_merge_logic.sh

  lint:
    name: ruff (informational)
    runs-on: ubuntu-latest
    continue-on-error: true   # advisory; never blocks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet -c requirements-ci.txt ruff
      - run: ruff check c_options_math.py tests/ scripts/ ops/ || true

  shell-lint:
    name: actionlint + shellcheck (2026-06-28 #8)
    runs-on: ubuntu-latest
    # The most CONSEQUENTIAL automation in the repo is the embedded bash that decides whether routine git
    # output reaches main (auto-merge-claude.yml) and whether a strand is detected (stranded-branch-check.yml)
    # — yet only the lower-stakes Python parsers had purpose-built tests. actionlint statically checks every
    # workflow (and runs shellcheck on each `run:` block); shellcheck covers the standalone scripts/*.sh
    # (backup_events.sh, state_snapshot.sh, restore_drill.sh). A subtle edit to the origin/claude/ filter,
    # the merge-base ancestry re-check, or the fail-closed default would otherwise regress with no CI signal.
    #
    # BLOCKING GATE (promoted 2026-06-29 after a confirmed clean run on the runner — CI #102, all steps
    # green). NOT continue-on-error: a failure now fails the CI run and blocks auto-merge, the hard gate the
    # recommendation intended. Two stability guards so a *blocking* linter can't be wedged by tool drift:
    #   - actionlint is PINNED (script + binary at v1.7.12) — a future release adding a new check cannot
    #     suddenly red-light merges; bump the pin deliberately.
    #   - shellcheck (the runner's version, unpinned) is floored at `-S warning`, so only warnings/errors
    #     block; the scripts pass clean today, this just stops a future shellcheck release's new *style/info*
    #     nit from wedging the gate.
    steps:
      - uses: actions/checkout@v4
      - name: Install actionlint (pinned v1.7.12)
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
      - name: actionlint (workflow YAML + embedded run-block bash via shellcheck)
        run: ./actionlint -color
      - name: shellcheck standalone scripts (warning+ blocks)
        run: shellcheck -S warning scripts/*.sh

  dbt:
    name: dbt parse (offline model + test validation)
    runs-on: ubuntu-latest
    # Validates the dbt/ modeling layer's structure + that every ref()/source() and test resolves,
    # WITHOUT a warehouse (parse does not connect). The full `dbt build` against BigQuery is gated on
    # WIF creds — see ops/RUNBOOK.md §14. Always runs; offline; no secrets needed.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dbt (pinned via constraints — RUNBOOK §25 C3)
        run: pip install --quiet -c requirements-ci.txt dbt-core dbt-bigquery
      - name: Write a CI profile (no creds — parse does not connect)
        # dbt/profiles.ci.yml is the single checked-in source for this profile (2026-07-04 code-quality
        # audit — this job and dbt-parity's equivalent step previously each wrote the same content via
        # an inline heredoc, byte-for-byte duplicated with no single source of truth).
        run: |
          mkdir -p ~/.dbt
          cp dbt/profiles.ci.yml ~/.dbt/profiles.yml
      - name: dbt deps + parse
        working-directory: dbt
        run: |
          dbt deps
          dbt parse

  dbt-parity:
    name: dbt↔live row-level parity (keyless WIF)
    runs-on: ubuntu-latest
    # ADVISORY BY DEFAULT, HARD GATE ON DEMAND: this whole job is continue-on-error UNLESS DBT_PARITY=block,
    # so a drift (or a transient WIF/compile hiccup) reports without blocking auto-merge until the owner
    # promotes it to a gate. (The auto-merge gate keys off the CI run conclusion — a continue-on-error job
    # never fails the run; cf. the lint job. RUNBOOK §5/§12.)
    continue-on-error: ${{ vars.DBT_PARITY != 'block' }}
    # RUNS BY DEFAULT whenever the read-only WIF creds exist (changed 2026-06-22 — previously it was
    # opt-in via RUN_DBT_PARITY and so NEVER actually ran, leaving the two hand-kept copies of each view
    # (bigquery/*.sql + dbt/) without a drift guard). Proves each dbt model produces the SAME rows as its
    # live hand-SQL view (catches logic drift the always-on `dbt parse` can't). Read-only: it
    # `dbt compile`s (never `dbt build` — that would overwrite the live datasets, since
    # generate_schema_name pins models to bare dataset names) then runs compiled-vs-live EXCEPT
    # DISTINCT both ways via the bq CLI (scripts/dbt_parity.py).
    #
    # One var, `DBT_PARITY`, controls it (read-only SA: roles/bigquery.dataViewer + jobUser):
    #   unset / 'advisory' (default) : RUN when WIF present; a drift prints ::warning:: but does NOT
    #                                  block the merge (staged rollout — promote once a clean baseline is
    #                                  confirmed, so a latent drift can't wedge auto-merge).
    #   'block'                      : RUN and FAIL the build on drift (a hard merge gate).
    #   'off'                        : skip entirely (escape hatch if WIF misbehaves).
    # If the WIF vars are unset the job skips cleanly (green). See ops/RUNBOOK.md §6/§14.
    permissions:
      contents: read
      id-token: write   # Workload Identity Federation (no downloadable key)
    steps:
      - uses: actions/checkout@v4
      - name: Check WIF config + enablement
        id: guard
        run: |
          if [ -n "${{ vars.GCP_WIF_PROVIDER }}" ] \
             && [ -n "${{ vars.GCP_WIF_SERVICE_ACCOUNT }}" ] \
             && [ "${{ vars.DBT_PARITY }}" != "off" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ vars.DBT_PARITY }}" = "block" ]; then
            # FAIL CLOSED (RUNBOOK §25 C1): block mode promises a HARD parity gate, but the old guard
            # skipped GREEN whenever the WIF vars were absent — silently turning the only view-drift gate
            # into a no-op right after promotion. In block mode a missing parity result is a failure, not
            # a pass (matching the §5 auto-merge "missing == not green" posture). The job is NOT
            # continue-on-error when DBT_PARITY=block, so this exit blocks the merge until it's fixed.
            echo "::error::DBT_PARITY=block but the WIF vars (GCP_WIF_PROVIDER / GCP_WIF_SERVICE_ACCOUNT) are unset — the hard parity gate has no parity result. Set the WIF vars, or change DBT_PARITY to advisory/off. (ops/RUNBOOK.md §25 C1 / §6.)"
            exit 1
          else
            echo "::notice::dbt parity skipped — set the WIF vars (read-only SA) to run it (it runs by default once they exist; set DBT_PARITY=off to suppress, =block to make drift a hard merge gate that fails closed). ops/RUNBOOK.md §6/§14/§25. dbt parse remains the always-on structural gate."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip == 'false'
        with:
          python-version: '3.11'
      - name: GCP WIF auth + gcloud setup (provides the bq CLI)
        if: steps.guard.outputs.skip == 'false'
        uses: ./.github/actions/gcp-wif-auth
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}
      - name: Install dbt (pinned via constraints — RUNBOOK §25 C3)
        if: steps.guard.outputs.skip == 'false'
        run: pip install --quiet -c requirements-ci.txt dbt-core dbt-bigquery
      - name: dbt profile (ADC from WIF via oauth)
        if: steps.guard.outputs.skip == 'false'
        # dbt/profiles.ci.yml is the single checked-in source for this profile (2026-07-04
        # code-quality audit — see the `dbt` job's equivalent step above).
        run: |
          mkdir -p ~/.dbt
          cp dbt/profiles.ci.yml ~/.dbt/profiles.yml
      - name: dbt deps + compile (no build — read-only)
        if: steps.guard.outputs.skip == 'false'
        working-directory: dbt
        run: |
          dbt deps
          dbt compile
      - name: Row-level parity (compiled vs live, EXCEPT both ways)
        if: steps.guard.outputs.skip == 'false'
        # Drift fails this step; whether that BLOCKS the merge is the job-level continue-on-error above
        # (advisory by default; a hard gate only when repo var DBT_PARITY=block). ops/RUNBOOK.md §6/§12.
        run: python scripts/dbt_parity.py
      - name: dbt test — B3 invariants vs live data (ADVISORY — RUNBOOK §25 C2)
        if: steps.guard.outputs.skip == 'false'
        working-directory: dbt
        # Runs the B3 invariant suite (reserved_cash formula, queue latest-wins, daily_marks no-double-
        # count, one-row health views — the exact bugs that have already bitten this system) against the
        # LIVE views each push, instead of "on demand" only. Read-only: generate_schema_name pins refs to
        # the bare live datasets, so the tests SELECT against the existing live objects (no dbt build).
        # ALWAYS ADVISORY — a `::warning::` even in DBT_PARITY=block mode (block gates row-level DRIFT,
        # not a live-data invariant that may legitimately flex); the `if !` keeps the step green.
        run: |
          dbt deps >/dev/null 2>&1 || true
          if ! dbt test; then
            echo "::warning::dbt test reported failures (advisory) — a B3 invariant may be violated on live data; see log. ops/RUNBOOK.md §25 C2."
          fi

  sql-validate:
    name: BigQuery SQL dry-run (keyless WIF, opt-in)
    runs-on: ubuntu-latest
    # OPT-IN, default OFF. Dry-running the bigquery/*.sql DDL (CREATE TABLE/MODEL/VIEW) requires
    # CREATE/DDL permissions on the production datasets — even in --dry_run mode. Granting a
    # CI/PR-triggered identity write+DDL on events/ops/analytics/state (the append-only source of
    # truth among them) over-privileges it for marginal value, and a live dry-run does NOT catch the
    # runtime-only bugs we care about (e.g. the EXPORT DATA JSON-serialization error). So the CI
    # service account stays READ-ONLY and this job is DISABLED unless the owner explicitly opts in by
    # setting repo variable RUN_SQL_DRYRUN=true AND granting the SA the needed DDL perms + enabling
    # the Cloud Resource Manager API (see ops/RUNBOOK.md §6). The always-on SQL gate is the `dbt`
    # job's offline `dbt parse`; raw SQL is also dry-run via the BigQuery MCP during development.
    permissions:
      contents: read
      id-token: write   # required for Workload Identity Federation (no downloadable key)
    steps:
      - uses: actions/checkout@v4
      - name: Check opt-in + WIF config
        id: guard
        run: |
          if [ "${{ vars.RUN_SQL_DRYRUN }}" = "true" ] \
             && [ -n "${{ vars.GCP_WIF_PROVIDER }}" ] \
             && [ -n "${{ vars.GCP_WIF_SERVICE_ACCOUNT }}" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::SQL dry-run disabled (default). To enable: set vars.RUN_SQL_DRYRUN=true, set the WIF vars, grant the CI SA DDL perms, and enable cloudresourcemanager.googleapis.com — see ops/RUNBOOK.md §6. dbt parse remains the always-on SQL gate."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: GCP WIF auth + gcloud setup
        if: steps.guard.outputs.skip == 'false'
        uses: ./.github/actions/gcp-wif-auth
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}
      - name: Dry-run every bigquery/*.sql
        if: steps.guard.outputs.skip == 'false'
        run: |
          set -euo pipefail
          gcloud config set project stock-trading-498512
          rc=0
          for f in bigquery/*.sql bigquery/scheduled_queries/*.sql; do
            [ -f "$f" ] || continue
            echo "== dry-run $f =="
            bq query --use_legacy_sql=false --dry_run --quiet < "$f" || { echo "::error file=$f::dry-run failed"; rc=1; }
          done
          exit $rc
