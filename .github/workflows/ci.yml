name: CI

# Guards the only executable code in the system. Strategy.md flags a bug in
# c_options_math.py as the experiment's highest-leverage failure mode ("converts
# the entire defined-risk premise into an undefined-risk position"). Before this
# workflow, the module's own self-test only ran if a human typed `python
# c_options_math.py`; nothing tested it on push. Now every change is checked.
#
# NOTE on merge-gating: auto-merge-claude.yml merges claude/* -> main via a direct
# bot push (not a PR), so CI is not yet a *required* status check. To make a red
# build block the merge, see ops/RUNBOOK.md "Make CI gate merges". CI failures are
# still visible on the branch/PR today.

on:
  push:
    branches: ['claude/**', main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: options-math tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test deps
        run: pip install --quiet pytest
      - name: Module self-test (asserts, no deps)
        run: python c_options_math.py
      - name: pytest regression suite
        run: python -m pytest -q
      - name: strategy/ slices in sync with Strategy.md
        run: python scripts/split_strategy.py --check

  lint:
    name: ruff (informational)
    runs-on: ubuntu-latest
    continue-on-error: true   # advisory; never blocks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet ruff
      - run: ruff check c_options_math.py tests/ scripts/ ops/ || true

  dbt:
    name: dbt parse (offline model + test validation)
    runs-on: ubuntu-latest
    # Validates the dbt/ modeling layer's structure + that every ref()/source() and test resolves,
    # WITHOUT a warehouse (parse does not connect). The full `dbt build` against BigQuery is gated on
    # WIF creds — see ops/RUNBOOK.md §14. Always runs; offline; no secrets needed.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dbt
        run: pip install --quiet dbt-core dbt-bigquery
      - name: Write a CI profile (no creds — parse does not connect)
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<'YAML'
          stock_trading:
            target: ci
            outputs:
              ci:
                type: bigquery
                method: oauth
                project: stock-trading-498512
                dataset: state
                location: US
                threads: 4
          YAML
      - name: dbt deps + parse
        working-directory: dbt
        run: |
          dbt deps
          dbt parse

  sql-validate:
    name: BigQuery SQL dry-run (keyless WIF)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for Workload Identity Federation (no downloadable key)
    steps:
      - uses: actions/checkout@v4
      - name: Check for WIF config
        id: guard
        run: |
          if [ -n "${{ vars.GCP_WIF_PROVIDER }}" ] && [ -n "${{ vars.GCP_WIF_SERVICE_ACCOUNT }}" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::GCP_WIF_PROVIDER / GCP_WIF_SERVICE_ACCOUNT repo variables not set — skipping SQL dry-run. Keyless setup in ops/RUNBOOK.md §6/§12 (preferred over the deleted SA key)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Authenticate to GCP (keyless, WIF)
        if: steps.guard.outputs.skip == 'false'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}
      - name: Set up gcloud
        if: steps.guard.outputs.skip == 'false'
        uses: google-github-actions/setup-gcloud@v2
      - name: Dry-run every bigquery/*.sql
        if: steps.guard.outputs.skip == 'false'
        run: |
          set -euo pipefail
          gcloud config set project stock-trading-498512
          rc=0
          for f in bigquery/*.sql bigquery/scheduled_queries/*.sql; do
            [ -f "$f" ] || continue
            echo "== dry-run $f =="
            bq query --use_legacy_sql=false --dry_run --quiet < "$f" || { echo "::error file=$f::dry-run failed"; rc=1; }
          done
          exit $rc
