name: CI

# Guards the only executable code in the system. Strategy.md flags a bug in
# c_options_math.py as the experiment's highest-leverage failure mode ("converts
# the entire defined-risk premise into an undefined-risk position"). Before this
# workflow, the module's own self-test only ran if a human typed `python
# c_options_math.py`; nothing tested it on push. Now every change is checked.
#
# NOTE on merge-gating: auto-merge-claude.yml merges claude/* -> main via a direct
# bot push (not a PR). It now triggers on this workflow's completion (workflow_run)
# and merges a branch ONLY if the CI run for that branch's exact tip commit
# concluded "success" — so a red build blocks the merge. The lint job below is
# continue-on-error (advisory), so it never affects that gate.

on:
  push:
    branches: ['claude/**', main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: options-math tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test deps
        run: pip install --quiet pytest
      - name: Module self-test (asserts, no deps)
        run: python c_options_math.py
      - name: pytest regression suite
        run: python -m pytest -q
      - name: strategy/ slices in sync with Strategy.md
        run: python scripts/split_strategy.py --check

  lint:
    name: ruff (informational)
    runs-on: ubuntu-latest
    continue-on-error: true   # advisory; never blocks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet ruff
      - run: ruff check c_options_math.py tests/ scripts/ ops/ || true

  sql-validate:
    name: BigQuery SQL dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for GCP credentials
        id: guard
        run: |
          if [ -z "${{ secrets.GCP_SA_KEY }}" ]; then
            echo "::notice::GCP_SA_KEY secret not set — skipping live SQL dry-run. See ops/RUNBOOK.md to enable."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Auth + dry-run every bigquery/*.sql
        if: steps.guard.outputs.skip == 'false'
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          set -euo pipefail
          echo "$GCP_SA_KEY" > /tmp/sa.json
          gcloud auth activate-service-account --key-file=/tmp/sa.json
          gcloud config set project stock-trading-498512
          rc=0
          for f in bigquery/*.sql bigquery/scheduled_queries/*.sql; do
            [ -f "$f" ] || continue
            echo "== dry-run $f =="
            bq query --use_legacy_sql=false --dry_run --quiet < "$f" || { echo "::error file=$f::dry-run failed"; rc=1; }
          done
          exit $rc
