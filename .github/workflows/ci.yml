              # legitimately means "no SQL changed in this push" and stays a green no-op (below). An empty
              # list from the FAIL-OPEN branch means "we couldn't scope the diff AND found zero real SQL
              # files on disk" — that's a broken checkout or repo layout, not "nothing to check", so it
              # must not pass silently.
              echo "::error::SQL dry-run fail-open path found zero bigquery/*.sql / bigquery/scheduled_queries/*.sql files to validate — the diff base was unresolvable AND no real SQL files exist on disk, which means the checkout or repo layout is broken, not that there is nothing to check."
              exit 1
            fi
            echo "No bigquery/*.sql changed in this push — nothing to dry-run."
            exit 0
          fi
          python scripts/check_sql_dryrun.py "${existing[@]}"
