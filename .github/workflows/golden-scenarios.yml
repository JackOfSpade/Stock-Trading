name: Golden Scenarios (prose regression)

# ITEM 20 (2026-07-11) — golden-scenario prose regression harness.
#
# WHY: this system's real source code is prose (Strategy.md, Operating_Protocols.md,
# Claude_Task_Plan.md routine bodies) read fresh by an LLM every routine run. Every existing CI check
# in ci.yml is a STRUCTURAL fact scraper (cadence.yaml <-> SQL <-> plan headings, roster.yaml <-> seed
# <-> Strategy.md, etc.) — none of them evaluate what a routine would DECIDE when it reads the prose.
# Since the 2026-07-10 Strategy Arsenal (SISA) autonomy conversion, a prose edit reaches live
# decision-making behavior via auto-merge with zero behavioral test in between. This workflow adds one:
# tests/golden_scenarios/scenarios.yaml pins decision scenarios (31 as of 2026-07-30 — see that file's own
# header for the current count and per-category/per-governing-file breakdown) with an expected call
# (GO/NO-GO, CONTINUE/TERMINATE, ACTIVATE/DO-NOT-ACTIVATE) and the runner (run_golden.py) diffs a live
# model's read of CURRENT prose against those pins.
#
# PATH-GATED (only Strategy.md / Operating_Protocols.md / Claude_Task_Plan.md / the golden fixtures
# themselves) — mirrors ci.yml's dbt-parity path gate: a prose-regression check is meaningless without a
# prose change, and the live job below calls a live model per push (Gemini free tier by default, see
# below), so it should not run on every
# unrelated commit.
#
# ONE JOB since 2026-08-21 (owner-directed cost change; was two — see the history notes below):
#
#   schema-validate — HARD GATE, always runs when the path filter matches, NO network. Validates
#     tests/golden_scenarios/scenarios.yaml itself: every scenario has the required fields, ids are
#     unique, every governing_file exists, expected_decision uses a recognized vocabulary token. This can
#     never be allowed to silently rot, or the whole harness is decorative — see
#     tests/test_cadence_consistency.py for why the OTHER structural checks in this repo guard their own
#     parsers the same way (a check that vacuously passes on a broken fixture is worse than no check).
#
#   prose-regression RETIRED (2026-08-30, owner-directed — cost + measured zero precision). Full
#     history in three stages:
#     (1) ORIGINAL — ran HERE, in this file, a live Gemini decision-diff per triggering push.
#     (2) MOVED OUT to daily (2026-08-21, owner-directed — the 2026-08-21 usage-cost audit's largest
#         repo-side Actions finding): re-homed to run ONCE DAILY over the FULL scenario suite in
#         .github/workflows/golden-prose-daily.yml, because this workflow fired ~16x/day
#         (Claude_Task_Plan.md is in the paths list and most routine pushes touch it) at ~3.2 billable
#         job-min/run ≈ ~1,540 min/month, and the first few pushes of each day exhausted the two
#         QUALITY rungs of the Gemini free-tier ladder (20+20 RPD), so most of the day's advisory
#         verdicts were silently rendered by the weakest model.
#     (3) RETIRED outright (2026-08-30): golden-prose-daily.yml (~195 billable min/month) and its
#         companion gemini-key-health.yml liveness probe (whose only consumer was that job) were
#         DELETED, not re-homed again, once the daily job's own output showed it was buying zero signal
#         rather than just costing too much. It reported a decision flip on EVERY run (PA-02, RS-02,
#         KT-07 among them) while D3's own GOLDEN-SCENARIO PROSE-REGRESSION CHECK, re-evaluating the
#         SAME scenarios, logged ZERO flips (29 of 33 re-evaluated on both 2026-08-25 and 2026-08-26).
#         Decisive case: KT-07 flipped on 2026-08-28, but KT-07 is governed SOLELY by
#         Experiment_Parameters.md, which had ZERO commits in that window — prose that did not change
#         cannot have regressed, so the flip was judge noise, not signal. It had also degraded
#         mechanically: its final runs evaluated only 15 of 33 scenarios, the rest skipped on Gemini
#         free-tier "model ladder exhausted" (HTTP 503).
#     Defense posture across all three stages was always ADVISORY ONLY (continue-on-error, no BigQuery
#     write credentials, the daily job's own header said "nothing consumes this workflow's
#     conclusion") and NEVER a merge block, so retiring it changes nothing downstream of the merge
#     gate. This schema HARD GATE (below) is and was always the only thing auto-merge-claude.yml's
#     secondary gate reads off this workflow's conclusion (the prose job, in every stage above, was
#     continue-on-error) — gate semantics are unaffected. The REAL landing surface for a prose flip
#     remains, and is now the ONLY one: D3's GOLDEN-SCENARIO PROSE-REGRESSION CHECK + AR_orc's
#     `prose-regression` adjudication (see CLAUDE.md "Known non-issues") — it runs daily, needs no
#     Gemini key at all, and its measured false-positive rate on this same scenario set is zero. Do
#     not re-add a live per-push or per-day Gemini job here or elsewhere before re-reading CLAUDE.md's
#     golden-scenarios note and this history.
#
#   RECONCILED 2026-07-16 (completeness-critic finding N-5 — verified already resolved, no change made
#     here): that "mechanical follow-up by an autonomous routine" is Claude_Task_Plan.md D3's
#     GOLDEN-SCENARIO PROSE-REGRESSION CHECK step (files the real queue_events row) + AR_orc's
#     `prose-regression` adjudication (closes it with a decision_log verdict) — see CLAUDE.md's "Known
#     non-issues" for the full reconciliation. This workflow intentionally still has no BigQuery
#     credentials; do not add any before re-reading that note.
#
#   COST-SCOPED 2026-07-30 — HISTORY: applied to the prose-regression job while it lived in this file;
#   since the 2026-08-21 move its daily replacement runs the FULL suite (one run/day needs no diff
#   scoping), so the machinery below survives only as run_golden.py's --scenarios-for-changed flags,
#   which D3's own prose-regression step still uses. (cost audit — this workflow measured ~2,251 billable CI min/month, the single
#   largest line item in the repo's Actions bill: the push path filter below is FILE-level (any one of
#   Strategy.md / Operating_Protocols.md / Claude_Task_Plan.md / tests/golden_scenarios/**), but the
#   `prose-regression` job used to call --live with NO --scenario filter — i.e. it re-evaluated ALL 31
#   scenarios' live model calls on every triggering push even when only ONE governing file actually
#   changed. The `prose-regression` job now resolves the pushed diff's changed files (same
#   scripts/resolve_diff_base.sh merge-base-fallback pattern ci.yml's dbt-parity/sql-validate path gates
#   use — see that script's header for the zero-SHA-on-ref-creation trap it closes) and maps them to
#   scenario ids via run_golden.py's scenarios_for_changed_files() (governing_files intersection), then
#   passes only those ids as repeated --scenario args to --live. If that mapping selects ZERO scenarios,
#   the live step is skipped outright (a ::notice:: explains why) — that skip is the entire saving, since
#   the schema-validate job above is unaffected (still the always-on, un-scoped hard gate) and this only
#   ever narrows/skips the ADVISORY live job. CONSERVATIVE BY DESIGN: scenarios_for_changed_files() itself
#   fails OPEN to every scenario id (never a false-narrow subset) whenever it cannot cleanly resolve what
#   changed OR when the change is to the golden harness's own files (scenarios.yaml / run_golden.py) —
#   see that function's docstring. The job's overall run CONCLUSION is unaffected by any of this: a
#   skipped/narrowed live step cannot itself fail (still continue-on-error, and skipping a step is not a
#   step failure), so auto-merge-claude.yml's schema-validate secondary-gate check (below) still sees
#   exactly the same conclusion it always did.

#   PULL_REQUEST TRIGGER REMOVED (2026-08-08, cost audit follow-up — verified before removing, not just
#   asserted, same evidence standard ci.yml's own 2026-07-30 removal held itself to): `gh run list
#   --workflow=golden-scenarios.yml --limit 100` showed 14 pull_request-triggered runs, 11 of which
#   landed on a SHA that ALSO had a push-triggered run of this same workflow — pure duplicate work: the
#   schema-validate job's duplicate run is a free, offline re-parse, but the prose-regression job's
#   duplicate additionally re-spends a live Gemini free-tier API call for no new information (same
#   scenario, same prose, same expected answer). auto-merge-claude.yml's secondary gate
#   (scripts/auto_merge_decision.sh's
#   is_secondary_gate_satisfied, "Golden Scenarios schema-validate gate" below `git merge --ff-only`)
#   reads the golden-scenarios.yml run by `head_sha` alone, not by triggering event, so a push-triggered
#   run for a branch's own tip commit already satisfies it before any PR ever exists — the only PRs this
#   repo opens are auto-merge's own conflict-resolution PRs (`gh pr create --base main --head "$br"`),
#   whose head SHA by then already has the branch's push-triggered run. `gh api
#   repos/:owner/:repo/branches/main/protection` still returns HTTP 403 (no GitHub Pro / branch
#   protection, re-verified 2026-08-08) — auto-merge-claude.yml's gate script is the only merge gate;
#   nothing else consumes a pull_request-triggered run's status or check-run. ACCEPTED CONSEQUENCE (same
#   as ci.yml's): a conflict-PR's own "Checks" tab shows no golden-scenarios run of its own beyond the
#   branch's push run that already satisfied the gate.
on:
  push:
    paths:
      - 'Strategy.md'
      - 'Operating_Protocols.md'
      - 'Claude_Task_Plan.md'
      # ADDED 2026-07-30 (correctness gap, found during the Actions cost audit — NOT a cost change; it
      # slightly RAISES cost and is worth it): Experiment_Parameters.md governs 6 scenarios in
      # tests/golden_scenarios/scenarios.yaml (all six KT-* kill-trigger cases). Because it was absent
      # from these paths lists, an Experiment_Parameters.md-ONLY push triggered this workflow not at all
      # — so neither the live prose-regression check NOR the always-on offline schema-validate HARD GATE
      # ever ran for those 6 kill-trigger scenarios on such a change. Every other file a scenario can
      # declare in governing_files was already listed; this was the one omission.
      - 'Experiment_Parameters.md'
      - 'tests/golden_scenarios/**'
  workflow_dispatch:

# Cancel a superseded run on the same branch (path-gated, so if a second prose
# push arrives before the first run finishes, only the latest matters).
concurrency:
  group: golden-scenarios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  schema-validate:
    name: golden scenarios — offline schema gate (HARD GATE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-ci.txt
      - name: Install deps (pinned via constraints — RUNBOOK §25 C3)
        run: pip install --quiet -c requirements-ci.txt pyyaml
      - name: Validate scenarios.yaml schema + governing_files existence (no network)
        run: python tests/golden_scenarios/run_golden.py --offline

