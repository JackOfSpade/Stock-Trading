name: Golden Scenarios (prose regression)

# ITEM 20 (2026-07-11) — golden-scenario prose regression harness.
#
# WHY: this system's real source code is prose (Strategy.md, Operating_Protocols.md,
# Claude_Task_Plan.md routine bodies) read fresh by an LLM every routine run. Every existing CI check
# in ci.yml is a STRUCTURAL fact scraper (cadence.yaml <-> SQL <-> plan headings, roster.yaml <-> seed
# <-> Strategy.md, etc.) — none of them evaluate what a routine would DECIDE when it reads the prose.
# Since the 2026-07-10 Strategy Arsenal (SISA) autonomy conversion, a prose edit reaches live
# decision-making behavior via auto-merge with zero behavioral test in between. This workflow adds one:
# tests/golden_scenarios/scenarios.yaml pins decision scenarios (31 as of 2026-07-30 — see that file's own
# header for the current count and per-category/per-governing-file breakdown) with an expected call
# (GO/NO-GO, CONTINUE/TERMINATE, ACTIVATE/DO-NOT-ACTIVATE) and the runner (run_golden.py) diffs a live
# model's read of CURRENT prose against those pins.
#
# PATH-GATED (only Strategy.md / Operating_Protocols.md / Claude_Task_Plan.md / the golden fixtures
# themselves) — mirrors ci.yml's dbt-parity path gate: a prose-regression check is meaningless without a
# prose change, and the live job below calls a live model per push (Gemini free tier by default, see
# below), so it should not run on every
# unrelated commit.
#
# TWO JOBS, two different postures (mirrors ci.yml's advisory/hard-gate split, e.g. lint vs. shell-lint,
# dbt-parity's advisory-by-default vs. sql-validate's opt-in):
#
#   schema-validate — HARD GATE, always runs when the path filter matches, NO network. Validates
#     tests/golden_scenarios/scenarios.yaml itself: every scenario has the required fields, ids are
#     unique, every governing_file exists, expected_decision uses a recognized vocabulary token. This can
#     never be allowed to silently rot, or the whole harness is decorative — see
#     tests/test_cadence_consistency.py for why the OTHER structural checks in this repo guard their own
#     parsers the same way (a check that vacuously passes on a broken fixture is worse than no check).
#
#   prose-regression — ADVISORY ONLY, continue-on-error: true. NEVER hard-blocks a merge on a decision
#     flip — that would be a human review/approval/chat/PR gate on prose, which is explicitly forbidden
#     for this system's self-improvement surface (CLAUDE.md "Settled decisions" — the SISA autonomy
#     conversion; a prose-regression flip is not a strategy-add/delete decision, but the same
#     no-human-gate posture applies to any check that could otherwise be used to re-introduce one).
#     Requires the GEMINI_API_KEY secret (Gemini free tier, the sole provider); skips cleanly (green, with a ::notice::) if it is not
#     configured — opt-in, exactly like ci.yml's sql-validate / dbt-parity WIF-gated jobs. On a decision
#     flip, run_golden.py itself prints a `::warning::` annotation naming the scenario + the expected vs.
#     actual call, and echoes the exact (never-executed) events.queue_events INSERT a routine with write
#     access COULD run to file it as review_type='prose-regression' for later mechanical follow-up. This
#     workflow does not execute that INSERT — it has no BigQuery write credentials (same posture as every
#     other CI job here; the CI service account, where one is configured at all, stays read-only), and
#     the compensating control for a flip is mechanical follow-up by an autonomous routine, never a human
#     gate.
#
#   RECONCILED 2026-07-16 (completeness-critic finding N-5 — verified already resolved, no change made
#     here): that "mechanical follow-up by an autonomous routine" is Claude_Task_Plan.md D3's
#     GOLDEN-SCENARIO PROSE-REGRESSION CHECK step (files the real queue_events row) + AR_orc's
#     `prose-regression` adjudication (closes it with a decision_log verdict) — see CLAUDE.md's "Known
#     non-issues" for the full reconciliation. This workflow intentionally still has no BigQuery
#     credentials; do not add any before re-reading that note.
#
#   COST-SCOPED 2026-07-30 (cost audit — this workflow measured ~2,251 billable CI min/month, the single
#   largest line item in the repo's Actions bill: the push path filter below is FILE-level (any one of
#   Strategy.md / Operating_Protocols.md / Claude_Task_Plan.md / tests/golden_scenarios/**), but the
#   `prose-regression` job used to call --live with NO --scenario filter — i.e. it re-evaluated ALL 31
#   scenarios' live model calls on every triggering push even when only ONE governing file actually
#   changed. The `prose-regression` job now resolves the pushed diff's changed files (same
#   scripts/resolve_diff_base.sh merge-base-fallback pattern ci.yml's dbt-parity/sql-validate path gates
#   use — see that script's header for the zero-SHA-on-ref-creation trap it closes) and maps them to
#   scenario ids via run_golden.py's scenarios_for_changed_files() (governing_files intersection), then
#   passes only those ids as repeated --scenario args to --live. If that mapping selects ZERO scenarios,
#   the live step is skipped outright (a ::notice:: explains why) — that skip is the entire saving, since
#   the schema-validate job above is unaffected (still the always-on, un-scoped hard gate) and this only
#   ever narrows/skips the ADVISORY live job. CONSERVATIVE BY DESIGN: scenarios_for_changed_files() itself
#   fails OPEN to every scenario id (never a false-narrow subset) whenever it cannot cleanly resolve what
#   changed OR when the change is to the golden harness's own files (scenarios.yaml / run_golden.py) —
#   see that function's docstring. The job's overall run CONCLUSION is unaffected by any of this: a
#   skipped/narrowed live step cannot itself fail (still continue-on-error, and skipping a step is not a
#   step failure), so auto-merge-claude.yml's schema-validate secondary-gate check (below) still sees
#   exactly the same conclusion it always did.

#   PULL_REQUEST TRIGGER REMOVED (2026-08-08, cost audit follow-up — verified before removing, not just
#   asserted, same evidence standard ci.yml's own 2026-07-30 removal held itself to): `gh run list
#   --workflow=golden-scenarios.yml --limit 100` showed 14 pull_request-triggered runs, 11 of which
#   landed on a SHA that ALSO had a push-triggered run of this same workflow — pure duplicate work: the
#   schema-validate job's duplicate run is a free, offline re-parse, but the prose-regression job's
#   duplicate additionally re-spends a live Gemini free-tier API call for no new information (same
#   scenario, same prose, same expected answer). auto-merge-claude.yml's secondary gate
#   (scripts/auto_merge_decision.sh's
#   is_secondary_gate_satisfied, "Golden Scenarios schema-validate gate" below `git merge --ff-only`)
#   reads the golden-scenarios.yml run by `head_sha` alone, not by triggering event, so a push-triggered
#   run for a branch's own tip commit already satisfies it before any PR ever exists — the only PRs this
#   repo opens are auto-merge's own conflict-resolution PRs (`gh pr create --base main --head "$br"`),
#   whose head SHA by then already has the branch's push-triggered run. `gh api
#   repos/:owner/:repo/branches/main/protection` still returns HTTP 403 (no GitHub Pro / branch
#   protection, re-verified 2026-08-08) — auto-merge-claude.yml's gate script is the only merge gate;
#   nothing else consumes a pull_request-triggered run's status or check-run. ACCEPTED CONSEQUENCE (same
#   as ci.yml's): a conflict-PR's own "Checks" tab shows no golden-scenarios run of its own beyond the
#   branch's push run that already satisfied the gate.
on:
  push:
    paths:
      - 'Strategy.md'
      - 'Operating_Protocols.md'
      - 'Claude_Task_Plan.md'
      # ADDED 2026-07-30 (correctness gap, found during the Actions cost audit — NOT a cost change; it
      # slightly RAISES cost and is worth it): Experiment_Parameters.md governs 6 scenarios in
      # tests/golden_scenarios/scenarios.yaml (all six KT-* kill-trigger cases). Because it was absent
      # from these paths lists, an Experiment_Parameters.md-ONLY push triggered this workflow not at all
      # — so neither the live prose-regression check NOR the always-on offline schema-validate HARD GATE
      # ever ran for those 6 kill-trigger scenarios on such a change. Every other file a scenario can
      # declare in governing_files was already listed; this was the one omission.
      - 'Experiment_Parameters.md'
      - 'tests/golden_scenarios/**'
  workflow_dispatch:

# Cancel a superseded run on the same branch (path-gated, so if a second prose
# push arrives before the first run finishes, only the latest matters).
concurrency:
  group: golden-scenarios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  schema-validate:
    name: golden scenarios — offline schema gate (HARD GATE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-ci.txt
      - name: Install deps (pinned via constraints — RUNBOOK §25 C3)
        run: pip install --quiet -c requirements-ci.txt pyyaml
      - name: Validate scenarios.yaml schema + governing_files existence (no network)
        run: python tests/golden_scenarios/run_golden.py --offline

  prose-regression:
    name: golden scenarios — live decision diff (ADVISORY — never blocks)
    runs-on: ubuntu-latest
    needs: schema-validate
    continue-on-error: true   # advisory; a decision flip must never block a merge — see header above
    # HARD BACKSTOP (2026-08-17): this job sets no other timeout, so it inherited GitHub's 6-hour default
    # — a bug in run_golden.py's own retry/rewind/pacing loop (GEMINI_LADDER_REWINDS,
    # GEMINI_LADDER_REWIND_COOLDOWN_S, GEMINI_RUN_BUDGET_S) could in principle burn hours of billable CI,
    # which CLAUDE.md's cost-discipline note explicitly forbids. run_golden.py already self-limits via
    # GEMINI_RUN_BUDGET_S (default 3000s/50min, degrades gracefully — stops calling, reports partial
    # results); this is the belt-and-suspenders job-level cutoff for when the Python-level budget itself
    # somehow fails to fire. Comfortably above the 50-minute Python budget so the graceful path always
    # wins first in the normal case.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history so the cost-scoping diff below (scope step) can resolve the pushed range
      - name: Check GEMINI_API_KEY is present (opt-in)
        id: guard
        env:
          # Live eval uses Gemini's free tier exclusively (run_golden.py's stdlib Gemini path).
          HAVE_KEY: ${{ secrets.GEMINI_API_KEY != '' }}
        run: |
          if [ "$HAVE_KEY" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::golden-scenarios live run skipped — GEMINI_API_KEY secret not set (opt-in, default state). The offline schema gate in the other job still ran and is the hard gate. Set GEMINI_API_KEY (free tier) to enable live prose-regression diffing."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v7
        if: steps.guard.outputs.skip == 'false'
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-ci.txt
      - name: Install deps
        if: steps.guard.outputs.skip == 'false'
        # The Gemini provider uses only the Python stdlib (urllib) — no LLM SDK to install, just the
        # YAML parser (pinned via the shared ci.yml constraints file). Also what the scope step below
        # needs (run_golden.py --scenarios-for-changed also imports yaml).
        run: pip install --quiet -c requirements-ci.txt pyyaml
      - name: Cost-scope --live to the scenarios governed by this push's changed files (2026-07-30)
        id: scope
        if: steps.guard.outputs.skip == 'false'
        env:
          EVENT_NAME: ${{ github.event_name }}
          # This workflow no longer has a pull_request trigger (removed 2026-08-08, see header), so this
          # is now always empty. Kept anyway, same reasoning ci.yml's own PR_BASE retention already
          # documents: resolve_diff_base.sh's positional argument contract is shared between the two
          # workflows, and dropping it here would silently break resolution if a pull_request trigger is
          # ever restored on either side.
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}   # push event's short branch name (e.g. "main"); rev 2026-07-20b
        run: |
          # DIFF-BASE RESOLUTION reuses scripts/resolve_diff_base.sh — the same merge-base-fallback chain
          # ci.yml's dbt-parity/sql-validate path gates use, closing the same github.event.before ==
          # zero-SHA-on-ref-creation trap (see that script's header). FAIL OPEN when unresolvable: `files`
          # stays empty, no --changed-file args are passed below, and
          # scenarios_for_changed_files()/scenarios-for-changed treats "no changed files given" as "could
          # not determine what changed" -> selects EVERY scenario id, never zero.
          set -uo pipefail
          # shellcheck source=../../scripts/resolve_diff_base.sh
          source scripts/resolve_diff_base.sh
          base="$(resolve_diff_base "$EVENT_NAME" "$PR_BASE" "$PUSH_BEFORE" "$HEAD_SHA" "$REF_NAME")"
          files=()
          if [ -n "$base" ]; then
            mapfile -t files < <(git diff --name-only "$base" "$HEAD_SHA")
          fi
          changed_file_args=()
          for f in "${files[@]}"; do
            changed_file_args+=(--changed-file "$f")
          done
          mapfile -t scenario_ids < <(python tests/golden_scenarios/run_golden.py --scenarios-for-changed "${changed_file_args[@]}")
          if [ "${#scenario_ids[@]}" -eq 0 ]; then
            # The TRUE cost saving: the diff resolved cleanly (or intentionally saw zero changed files) AND
            # none of it is governed by any scenario. This can only make the live step's job CONCLUSION
            # "skipped", never "failure" — a skipped step cannot flip continue-on-error's success-despite-
            # failure semantics, so auto-merge-claude.yml's schema-validate secondary-gate check (which
            # reads this WORKFLOW RUN's overall conclusion, not this job's steps) is unaffected either way.
            echo "::notice::golden-scenarios live run SKIPPED — cost-scoping diffed ${#files[@]} changed file(s) in this push and none is in any scenario's governing_files (tests/golden_scenarios/run_golden.py scenarios_for_changed_files()). The offline schema-validate hard gate above already ran regardless. If this looks wrong (e.g. you expected a scenario to re-run), check whether the diff base was resolvable — an unresolvable base fails OPEN to running every scenario, never to this skip; see scripts/resolve_diff_base.sh."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::golden-scenarios live run scoped to ${#scenario_ids[@]} scenario(s) from ${#files[@]} changed file(s): ${scenario_ids[*]}"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            {
              echo "scenario_ids<<GOLDEN_SCENARIO_IDS_EOF"
              printf '%s\n' "${scenario_ids[@]}"
              echo "GOLDEN_SCENARIO_IDS_EOF"
            } >> "$GITHUB_OUTPUT"
          fi
      - name: Live decision diff vs. pinned expectations (advisory — never fails the build)
        if: steps.guard.outputs.skip == 'false' && steps.scope.outputs.skip == 'false'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SCENARIO_IDS: ${{ steps.scope.outputs.scenario_ids }}
        run: |
          set -uo pipefail
          scenario_args=()
          while IFS= read -r sid; do
            [ -n "$sid" ] && scenario_args+=(--scenario "$sid")
          done <<< "$SCENARIO_IDS"
          python tests/golden_scenarios/run_golden.py --live "${scenario_args[@]}"
