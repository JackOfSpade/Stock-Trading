name: Golden Scenarios

# Offline schema/governing-file validation only. Behavioral harness and math
# regressions also run in CI on Python 3.11/3.13. Semantic model adjudication
# belongs to the existing D3/AR_orc routine; this workflow makes no model calls
# and has no BigQuery credentials or writes.

on:
  push:
    paths:
      - 'Strategy.md'
      - 'Operating_Protocols.md'
      - 'Claude_Task_Plan.md'
      # ADDED 2026-07-30 (correctness gap, found during the Actions cost audit — NOT a cost change; it
      # slightly RAISES cost and is worth it): Experiment_Parameters.md governs 6 scenarios in
      # tests/golden_scenarios/scenarios.yaml (all six KT-* kill-trigger cases). Because it was absent
      # from these paths lists, an Experiment_Parameters.md-ONLY push triggered this workflow not at all
      # — so neither the live prose-regression check NOR the always-on offline schema-validate HARD GATE
      # ever ran for those 6 kill-trigger scenarios on such a change. Every other file a scenario can
      # declare in governing_files was already listed; this was the one omission.
      - 'Experiment_Parameters.md'
      - 'tests/golden_scenarios/**'
  workflow_dispatch:

# Cancel a superseded run on the same branch (path-gated, so if a second prose
# push arrives before the first run finishes, only the latest matters).
concurrency:
  group: golden-scenarios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  schema-validate:
    name: golden scenarios — offline schema gate (HARD GATE)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-ci.txt
      - name: Install deps (pinned via constraints — RUNBOOK §25 C3)
        run: pip install --quiet -c requirements-ci.txt pyyaml
      - name: Validate scenarios.yaml schema + governing_files existence (no network)
        run: python tests/golden_scenarios/run_golden.py --offline
