name: Live SQL parity (bigquery/*.sql vs deployed)

# 2026-07-15 self-improvement audit — CONFIRMED GAP check-live-sql-parity-unwired.
# scripts/check_live_sql_parity.py compares each BigQuery object's LIVE definition against the
# "final effective" apply-in-order definition across bigquery/*.sql, but nothing ever invoked it
# (its own docstring falsely claimed it was scheduled "per ops/RUNBOOK.md" — it was not referenced
# anywhere outside itself and its own test). It was purpose-built after the 2026-07-11 incident
# where a partial re-apply of bigquery/23_trading_control.sql silently reverted
# state.trading_enabled to a stale, self-latching formula for days with zero CI signal (fixed by
# bigquery/47_trading_enabled_resync.sql) — exactly the class of drift this job now catches.
#
# WHY A SEPARATE DAILY CRON, NOT A dbt-parity-style PUSH TRIGGER: dbt-parity compares freshly
# dbt-COMPILED models (built fresh every run from the current push) against live views — a
# meaningful "does this push's logic match live" question on every push. This script instead
# compares the repo's bigquery/*.sql DDL TEXT against whatever was last pasted into BigQuery via
# the MCP/console — an out-of-band, manual apply step that always lags the commit that adds/edits a
# bigquery/*.sql file (see bigquery/README.md's apply-in-order convention). Running this on every
# push to a branch that just edited bigquery/*.sql would report "drift" for the completely normal,
# expected case of "not live-applied yet" — structurally noisy, not a real signal. A daily,
# decoupled cadence instead asks "does main's current final-effective SQL match live", which is
# the actual question worth alerting on.
#
# RUNS BY DEFAULT once the read-only WIF vars exist (same baseline SA as dbt-parity: roles/
# bigquery.dataViewer + jobUser — no new IAM grant needed for the comparison itself). A real drift
# opens/refreshes a deduped GitHub issue (mirrors keyless-sa-audit.yml / wif-binding-audit.yml,
# RUNBOOK §43) so a finding has a durable record independent of the optional webhook relay.

on:
  schedule:
    - cron: '10 7 * * *'   # daily ~07:10 UTC — off-peak, after the 05:00-06:30 UTC scheduled-query
                            # block (RUNBOOK §1/§25) and the dashboard publish (05:20 UTC)
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: live-sql-parity
  cancel-in-progress: false

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Gate on WIF creds
        id: guard
        run: |
          if [ -n "${{ vars.GCP_WIF_PROVIDER }}" ] && [ -n "${{ vars.GCP_WIF_SERVICE_ACCOUNT }}" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Live SQL parity skipped — set vars.GCP_WIF_PROVIDER/GCP_WIF_SERVICE_ACCOUNT (the same read-only WIF SA dbt-parity already uses) to enable. ops/RUNBOOK.md §6/§14."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: GCP WIF auth + gcloud setup (provides the bq CLI)
        if: steps.guard.outputs.skip == 'false'
        uses: ./.github/actions/gcp-wif-auth
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}
      - name: Compare live BigQuery definitions vs bigquery/*.sql
        id: parity
        if: steps.guard.outputs.skip == 'false'
        run: |
          set -uo pipefail
          if python scripts/check_live_sql_parity.py --project stock-trading-498512 --json-out /tmp/findings.json 2>&1 | tee /tmp/parity_out.txt; then
            echo "result=ok" >> "$GITHUB_OUTPUT"
          else
            echo "result=drift" >> "$GITHUB_OUTPUT"
            echo "::error::Live SQL parity FAILED — see job output for the mismatched object(s)."
          fi
      # Live-vs-repo ROSTER parity (MON H4, 2026-07-17): scripts/check_roster_consistency.py proves the
      # roster is internally consistent across the REPO; nothing compared it against LIVE. This step diffs
      # live state.active_strategy_codes against strategy/roster.yaml's roster-active (probe/adopted) set
      # using the same read-only WIF SA + bq CLI this job already has. Runs independently of the SQL-parity
      # result (a roster drift is orthogonal to a DDL drift); exit 1 FAILS THE JOB on any divergence
      # (fail-closed — the script also exits 1 if it cannot read live, never OK on zero comparison).
      - name: Compare live roster vs strategy/roster.yaml
        if: steps.guard.outputs.skip == 'false'
        run: python scripts/check_live_roster_parity.py --project stock-trading-498512
      # DELIVERY PATH DECIDED (2026-07-17, OWNER_ACTIONS.md §I — option 3): findings reach the
      # self-heal consumer via the ops.ci_findings / state.ci_findings_open bridge
      # (bigquery/67_ci_findings_bridge.sql), which this run's INSERT step below already writes now that
      # gh-ci-runner@ holds bigquery.dataEditor on ops.ci_findings (grant applied 2026-07-17). The
      # earlier-considered alternative — committing a findings JSON file to main via an autonomous
      # CI->main `git push` — was REJECTED (it would arm a standing unattended push-to-main pathway for
      # no benefit the bridge does not already provide). The seeded placeholder
      # ops/monitoring/live_sql_parity_findings.json and the --json-out flag are therefore removed; the
      # single self-heal path is Claude_Task_Plan.md D3's unified CI-FINDINGS ADJUDICATION step.
      - name: Open/refresh finding issue (dedup)
        if: always() && steps.guard.outputs.skip == 'false' && steps.parity.outputs.result == 'drift'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          {
            echo "**DRIFT** — one or more live BigQuery object definitions no longer match the final-effective (last apply-in-order \`CREATE OR REPLACE\`) definition in \`bigquery/*.sql\`, or are missing live entirely. This is the exact drift class that silently reverted \`state.trading_enabled\` for days in the 2026-07-11 incident (see \`bigquery/47_trading_enabled_resync.sql\`). Re-apply the listed object(s)' current repo definition via the BigQuery MCP/console — or, for an object reported MISSING below (per-object detail starts \`MISSING: \`), CREATE it from the repo definition instead."
            echo
            cat /tmp/parity_out.txt
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > /tmp/body.md

          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --json number,title \
            --jq '[.[] | select(.title|startswith("⚠️ Live SQL parity:"))][0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file /tmp/body.md
            echo "Updated existing issue #$existing."
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "⚠️ Live SQL parity: needs attention" \
              --body-file /tmp/body.md
          fi

          # CI-findings bridge (2026-07-16, CC-1 / issue #10): mirror this finding into
          # ops.ci_findings so a BigQuery-side consumer (D3's adjudication step, cadence_check.sql's
          # ci_finding alert) sees it too, independent of anyone reading GitHub Issues.
          # FAIL-LOUD (MON H2, 2026-07-17): this step runs only when WIF is configured (the step `if`
          # gates on skip=='false') AND drift was detected. The gh-ci-runner@ dataEditor grant on
          # ops.ci_findings landed 2026-07-17, so this INSERT is expected to SUCCEED. Previously it was
          # swallowed with `|| echo ::warning::`, so a broken bridge (the DECLARED single delivery path
          # for live-sql-parity drift) stayed invisible inside a green run while ops.ci_findings received
          # ZERO rows ever. On a drift run, a failed INSERT now FAILS THE JOB — a dead bridge is exactly
          # as bad as the drift it is supposed to deliver, and must not be swallowed. (The ::warning::
          # fallback was only ever meaningful when WIF is absent, which is impossible in this step.)
          # PER-OBJECT rows (2026-07-18 audit): the previous single-row INSERT
          # (finding_key='live_sql_parity', detail=head -c 4000 of the whole run output) silently
          # truncated most drifted objects out of the DECLARED single delivery path on a high-drift
          # day — D3's adjudication step and ops.parity_selfheal_log (bigquery/69) both key on
          # individual objects and a per-object first_detected, which one aggregate blob can never
          # provide. Source of truth is the checker's own --json-out findings (dataset/name/
          # object_type/source_file — lookup-failure "skipped" entries are deliberately NOT
          # findings). One row per drifted object; keys that stop drifting are auto-resolved below;
          # state.ci_findings_open (bigquery/86) computes first_detected per key from the append-only
          # history.
          #
          # MISSING-OBJECT rows (2026-07-28, owner directive — autonomous CREATE authorized, see
          # scripts/check_live_sql_parity.py's module docstring + write_json_out() docstring for the
          # full rationale): the checker's --json-out also carries a `missing_objects` array — objects
          # the repo's final-effective bigquery/*.sql declares that do NOT exist live at all (the live
          # lookup SUCCEEDED and returned zero rows — positive evidence of absence, distinct from a
          # "skipped" lookup failure). These are now ALSO written one row per object, same
          # finding_key=<dataset>.<name> shape as a drift row, so state.ci_findings_open's dedup /
          # first_detected / auto-resolve machinery (bigquery/86) keeps working unchanged for both
          # classes without any schema change. The two classes are made UNAMBIGUOUSLY distinguishable
          # to the consumer (D3's CI-FINDINGS ADJUDICATION step, Claude_Task_Plan.md) by a marker at
          # the START of `detail`: a missing-object row's detail begins literally "MISSING: "; a drift
          # row's detail never starts with that string. D3 branches on this marker to pick CREATE
          # (new branch (d)) vs. re-apply (existing branches (a)/(b)/(c)) — the two self-heal actions
          # are not interchangeable and D3 must not have to re-derive which one applies.
          #
          # `missing_objects` entries are formatted STRINGS ("<dataset>.<name> (<source_file>): no
          # live object found -- ..."), unlike `findings`' structured dicts — write_json_out() in
          # scripts/check_live_sql_parity.py (2026-07-28 DROP-awareness fix) added `missing_objects`
          # as a NEW top-level payload key, fed by a new `missing_objects` parameter, but kept it as a
          # list of formatted strings rather than structured dicts like `findings`, so the
          # dataset.name key is pulled out here via a jq regex capture instead of a dedicated field.
          # That capture()/f-string coupling is pinned by tests/test_check_live_sql_parity.py's
          # test_missing_objects_key_extraction_matches_workflow_jq_pattern.
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          n=$(jq '.findings | length' /tmp/findings.json)
          m=$(jq '.missing_objects | length' /tmp/findings.json)
          if [ "$n" -eq 0 ] && [ "$m" -eq 0 ]; then
            # Drift exit with ZERO per-object findings AND ZERO missing objects = the checker's
            # fail-closed path (checked==0 systemic auth failure, or an internal error) — there is
            # nothing to key on either way, so keep the aggregate key for exactly this case: "parity
            # could not be verified" is itself the finding, and it must not auto-resolve the real
            # per-object rows below.
            #
            # THE SUBTLE BIT (2026-07-28): this guard must check BOTH counts, not just $n. A run with
            # zero mismatches but one or more missing_objects genuinely verified something real (the
            # objects it could compare are fine; the missing ones are a real, positively-evidenced
            # gap) — gating on $n alone would wrongly (a) write this "could not be verified" aggregate
            # row over a run that actually produced real per-object data, (b) never reach the `else`
            # branch below at all, so the real missing_objects rows would never get written, and (c)
            # never run the auto-resolve step either, so any object that WAS missing yesterday and
            # healed (or was created) today would incorrectly stay open forever. Three distinct wrongs
            # from one un-widened guard, not just one.
            detail=$(head -c 4000 /tmp/parity_out.txt)
            # shellcheck disable=SC2016 # single-quoted intentionally: the backtick-quoted BigQuery
            # identifier and @p_* named parameters must stay literal, not shell-expanded.
            if ! bq query --project_id=stock-trading-498512 --use_legacy_sql=false --parameter="p_detail:STRING:${detail}" --parameter="p_url:STRING:${run_url}" 'INSERT INTO `stock-trading-498512.ops.ci_findings` (workflow, finding_key, status, detail, run_url) VALUES ("live-sql-parity","live_sql_parity","open",@p_detail,@p_url)'; then
              echo "::error::ops.ci_findings open-row INSERT FAILED on a DRIFT run — the DECLARED single delivery path for live-sql-parity drift (bigquery/67) is broken (WIF is present; verify the gh-ci-runner@ dataEditor grant on ops.ci_findings). Failing the job so a dead bridge is visible, not swallowed."
              exit 1
            fi
          else
            if [ "$n" -gt 0 ]; then
              for i in $(seq 0 $((n - 1))); do
                key=$(jq -r ".findings[$i] | .dataset + \".\" + .name" /tmp/findings.json)
                src=$(jq -r ".findings[$i].source_file" /tmp/findings.json)
                typ=$(jq -r ".findings[$i].object_type" /tmp/findings.json)
                detail="live definition does NOT match the final-effective definition in ${src} (${typ})"
                # shellcheck disable=SC2016 # single-quoted intentionally: see above.
                if ! bq query --project_id=stock-trading-498512 --use_legacy_sql=false --parameter="p_key:STRING:${key}" --parameter="p_detail:STRING:${detail}" --parameter="p_url:STRING:${run_url}" 'INSERT INTO `stock-trading-498512.ops.ci_findings` (workflow, finding_key, status, detail, run_url) VALUES ("live-sql-parity",@p_key,"open",@p_detail,@p_url)'; then
                  echo "::error::ops.ci_findings open-row INSERT FAILED for ${key} on a DRIFT run — the DECLARED single delivery path for live-sql-parity drift (bigquery/67) is broken (WIF is present; verify the gh-ci-runner@ dataEditor grant on ops.ci_findings). Failing the job so a dead bridge is visible, not swallowed."
                  exit 1
                fi
              done
            fi
            if [ "$m" -gt 0 ]; then
              for i in $(seq 0 $((m - 1))); do
                # Pull "<dataset>.<name>" off the front of the checker's formatted string, e.g.
                # "state.gone (02_x.sql): no live object found -- ...". capture()'s named group keeps
                # this a single jq call (no separate sed pass) and matches how the union `keys` query
                # below extracts the same thing.
                key=$(jq --argjson i "$i" -r '.missing_objects[$i] | capture("^(?<key>\\S+) \\(") | .key' /tmp/findings.json)
                line=$(jq --argjson i "$i" -r '.missing_objects[$i]' /tmp/findings.json)
                detail="MISSING: ${line}"
                # shellcheck disable=SC2016 # single-quoted intentionally: see above.
                if ! bq query --project_id=stock-trading-498512 --use_legacy_sql=false --parameter="p_key:STRING:${key}" --parameter="p_detail:STRING:${detail}" --parameter="p_url:STRING:${run_url}" 'INSERT INTO `stock-trading-498512.ops.ci_findings` (workflow, finding_key, status, detail, run_url) VALUES ("live-sql-parity",@p_key,"open",@p_detail,@p_url)'; then
                  echo "::error::ops.ci_findings open-row INSERT FAILED for ${key} (missing object) on a DRIFT run — the DECLARED single delivery path for live-sql-parity findings (bigquery/67) is broken (WIF is present; verify the gh-ci-runner@ dataEditor grant on ops.ci_findings). Failing the job so a dead bridge is visible, not swallowed."
                  exit 1
                fi
              done
            fi
            # Auto-resolve any still-open live-sql-parity key that did NOT recur this run as EITHER a
            # drift finding OR a missing object (an object healed/created since yesterday, or the
            # legacy aggregate 'live_sql_parity' key) — otherwise a once-flagged object stays open
            # forever unless a FULLY clean run happens to come along. The exclusion set is the UNION
            # of both classes' keys (2026-07-28) — using only $n's findings keys here would wrongly
            # auto-resolve a still-missing object's open row the moment ANY drift finding also
            # existed this run (the missing object recurred too, just not as a "finding").
            keys=$(jq -c '([.findings[] | .dataset + "." + .name]) + ([.missing_objects[] | capture("^(?<key>\\S+) \\(") | .key])' /tmp/findings.json)
            # shellcheck disable=SC2016 # single-quoted intentionally: see above.
            if ! bq query --project_id=stock-trading-498512 --use_legacy_sql=false --parameter="p_keys:ARRAY<STRING>:${keys}" --parameter="p_url:STRING:${run_url}" 'INSERT INTO `stock-trading-498512.ops.ci_findings` (workflow, finding_key, status, detail, run_url) SELECT workflow, finding_key, "resolved", "no longer drifted/missing this run (per-object auto-resolve)", @p_url FROM `stock-trading-498512.state.ci_findings_open` WHERE workflow = "live-sql-parity" AND finding_key NOT IN UNNEST(@p_keys)'; then
              echo "::error::ops.ci_findings per-object auto-resolve INSERT FAILED — stale open findings cannot clear (WIF is present; verify the gh-ci-runner@ dataEditor grant on ops.ci_findings). Failing the job so a dead bridge is visible, not swallowed."
              exit 1
            fi
          fi

      - name: Close finding issue if resolved
        if: always() && steps.guard.outputs.skip == 'false' && steps.parity.outputs.result == 'ok'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --json number,title \
            --jq '[.[] | select(.title|startswith("⚠️ Live SQL parity:"))][0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Resolved — every checked object's live definition now matches its final-effective bigquery/*.sql source. Closing."
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY"
          fi

          # CI-findings bridge (2026-07-16, CC-1; PER-OBJECT since 2026-07-18): a clean run resolves
          # EVERY still-open live-sql-parity key — the per-object keys the drift path now writes AND
          # the legacy/zero-verification aggregate 'live_sql_parity' key — even when no GH issue was
          # open to close (a manually-closed issue must not strand an open ops.ci_findings row;
          # state.ci_findings_open / cadence_check.sql's ci_finding alert would otherwise never
          # auto-clear). INSERT..SELECT writes zero rows when nothing is open — harmless.
          # FAIL-LOUD (MON H2, 2026-07-17): same rationale as the open-row INSERT above. This step runs
          # only with WIF present (skip=='false') and on a CLEAN run; a failed resolved-row INSERT means
          # the bridge cannot auto-clear a stale open finding, so it now FAILS THE JOB rather than being
          # swallowed into a green run (the state where ops.ci_findings sat at ZERO rows undetected).
          # shellcheck disable=SC2016 # single-quoted intentionally: the backtick-quoted BigQuery
          # identifier and @p_url named parameter must stay literal, not shell-expanded.
          if ! bq query --project_id=stock-trading-498512 --use_legacy_sql=false --parameter="p_url:STRING:${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" 'INSERT INTO `stock-trading-498512.ops.ci_findings` (workflow, finding_key, status, detail, run_url) SELECT workflow, finding_key, "resolved", "parity clean this run", @p_url FROM `stock-trading-498512.state.ci_findings_open` WHERE workflow = "live-sql-parity"'; then
            echo "::error::ops.ci_findings resolved-row INSERT FAILED — the ci_findings bridge cannot auto-clear stale open findings (WIF is present; verify the gh-ci-runner@ dataEditor grant on ops.ci_findings). Failing the job so a dead bridge is visible, not swallowed."
            exit 1
          fi

      # ---------------------------------------------------------------------------------------------
      # PER-RUN LIVENESS MARKER (2026-07-30 — fixes alert a37e3185-d5d9-435c-b9d1-910a15ed419b,
      # category ci_findings_bridge_stale, which was raised as a CONFIRMED FALSE POSITIVE).
      #
      # THE BUG THIS CLOSES. cadence_check's `ci_findings_bridge_stale` predicate is
      # `MAX(finding_ts) WHERE workflow='live-sql-parity' < now - ~40h`, and it was the DECLARED single
      # detector for "the live-sql-parity delivery bridge is dead". But every pre-existing write above
      # is conditional on there being something to report: the drift-branch INSERTs need drift, and BOTH
      # auto-resolve steps are `INSERT..SELECT FROM state.ci_findings_open`, which writes ZERO ROWS once
      # nothing is open. So a perfectly healthy, drift-free system writes NOTHING for days, and the
      # predicate reads that healthy silence as a dead bridge — the exact confusion the alert claims to
      # resolve. VERIFIED live 2026-07-30: the last row was 2026-07-28 12:50 UTC (a drift-then-fix cycle),
      # three subsequent runs (07-28 13:09, 07-28 14:01, 07-29 09:47) all completed `success` and wrote
      # nothing, and ~40h later the alert duly fired. Worse, it has no health-based auto-resolve — only a
      # time-only 7-day age-out that re-raises within the same cadence_check run while the condition
      # holds — so on a permanently healthy system it is a self-sustaining permanent warning, i.e. exactly
      # the kind of noise that trains an operator to ignore the channel.
      #
      # THE FIX. Write ONE unconditional row per run so MAX(finding_ts) tracks BRIDGE LIVENESS rather
      # than DRIFT INCIDENCE. The predicate in bigquery/111 then needs NO change and finally means what
      # it says: no row in 40h == the workflow genuinely has not delivered in 40h.
      #
      # WHY THIS SHAPE, and why it needs NO new IAM grant (the alternative considered and rejected was a
      # beat into ops.heartbeat, which would have required a NEW owner-only table-scoped dataEditor grant
      # for gh-ci-runner@ — it holds one on EXACTLY ops.ci_findings, OWNER_ACTIONS.md item G, 2026-07-17):
      #   * status='resolved' + a RESERVED finding_key '__run_marker__' means this row can NEVER surface
      #     as an open finding: state.ci_findings_open (bigquery/86) filters `rn = 1 AND status = 'open'`,
      #     so D3's CI-FINDINGS ADJUDICATION and cadence_check's `ci_finding` alert are untouched.
      #   * The reserved key is per-run-distinct in `detail` only, never in finding_key, so the
      #     latest-wins dedup keeps exactly one live marker per workflow instead of unbounded keys.
      #   * ops.ci_findings' own table description has always sanctioned this ("Clean runs write
      #     unconditional resolved rows — harmless, the view takes the latest"); the implementation simply
      #     was not unconditional. bigquery/119 records the reserved key on the table description.
      # `if: always()` + skip=='false' so it beats on BOTH clean and drift runs — a drift run is still a
      # LIVE bridge, and gating on result would reintroduce a conditional write.
      # FAIL-LOUD, same rationale as the two INSERTs above: a marker that silently fails to write would
      # recreate the very blind spot this step exists to remove.
      # ---------------------------------------------------------------------------------------------
      - name: Record bridge liveness marker (unconditional)
        if: always() && steps.guard.outputs.skip == 'false'
        run: |
          set -uo pipefail
          # shellcheck disable=SC2016 # single-quoted intentionally: the backtick-quoted BigQuery
          # identifier and @p_* named parameters must stay literal, not shell-expanded.
          if ! bq query --project_id=stock-trading-498512 --use_legacy_sql=false \
            --parameter="p_detail:STRING:bridge alive; parity result=${{ steps.parity.outputs.result }}" \
            --parameter="p_url:STRING:${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            'INSERT INTO `stock-trading-498512.ops.ci_findings` (workflow, finding_key, status, detail, run_url) VALUES ("live-sql-parity","__run_marker__","resolved",@p_detail,@p_url)'; then
            echo "::error::ops.ci_findings liveness-marker INSERT FAILED — cadence_check's ci_findings_bridge_stale detector will read this bridge as DEAD (WIF is present; verify the gh-ci-runner@ dataEditor grant on ops.ci_findings). Failing the job so a dead bridge is visible, not swallowed."
            exit 1
          fi
