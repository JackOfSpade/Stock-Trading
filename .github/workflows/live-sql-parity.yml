name: Live SQL parity (bigquery/*.sql vs deployed)

# 2026-07-15 self-improvement audit — CONFIRMED GAP check-live-sql-parity-unwired.
# scripts/check_live_sql_parity.py compares each BigQuery object's LIVE definition against the
# "final effective" apply-in-order definition across bigquery/*.sql, but nothing ever invoked it
# (its own docstring falsely claimed it was scheduled "per ops/RUNBOOK.md" — it was not referenced
# anywhere outside itself and its own test). It was purpose-built after the 2026-07-11 incident
# where a partial re-apply of bigquery/23_trading_control.sql silently reverted
# state.trading_enabled to a stale, self-latching formula for days with zero CI signal (fixed by
# bigquery/47_trading_enabled_resync.sql) — exactly the class of drift this job now catches.
#
# WHY A SEPARATE DAILY CRON, NOT A dbt-parity-style PUSH TRIGGER: dbt-parity compares freshly
# dbt-COMPILED models (built fresh every run from the current push) against live views — a
# meaningful "does this push's logic match live" question on every push. This script instead
# compares the repo's bigquery/*.sql DDL TEXT against whatever was last pasted into BigQuery via
# the MCP/console — an out-of-band, manual apply step that always lags the commit that adds/edits a
# bigquery/*.sql file (see bigquery/README.md's apply-in-order convention). Running this on every
# push to a branch that just edited bigquery/*.sql would report "drift" for the completely normal,
# expected case of "not live-applied yet" — structurally noisy, not a real signal. A daily,
# decoupled cadence instead asks "does main's current final-effective SQL match live", which is
# the actual question worth alerting on.
#
# RUNS BY DEFAULT once the read-only WIF vars exist (same baseline SA as dbt-parity: roles/
# bigquery.dataViewer + jobUser — no new IAM grant needed for the comparison itself). A real drift
# opens/refreshes a deduped GitHub issue (mirrors keyless-sa-audit.yml / wif-binding-audit.yml,
# RUNBOOK §43) so a finding has a durable record independent of the optional webhook relay.

on:
  schedule:
    - cron: '10 7 * * *'   # daily ~07:10 UTC — off-peak, after the 05:00-06:30 UTC scheduled-query
                            # block (RUNBOOK §1/§25) and the dashboard publish (05:20 UTC)
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: live-sql-parity
  cancel-in-progress: false

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gate on WIF creds
        id: guard
        run: |
          if [ -n "${{ vars.GCP_WIF_PROVIDER }}" ] && [ -n "${{ vars.GCP_WIF_SERVICE_ACCOUNT }}" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Live SQL parity skipped — set vars.GCP_WIF_PROVIDER/GCP_WIF_SERVICE_ACCOUNT (the same read-only WIF SA dbt-parity already uses) to enable. ops/RUNBOOK.md §6/§14."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: GCP WIF auth + gcloud setup (provides the bq CLI)
        if: steps.guard.outputs.skip == 'false'
        uses: ./.github/actions/gcp-wif-auth
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}
      - name: Compare live BigQuery definitions vs bigquery/*.sql
        id: parity
        if: steps.guard.outputs.skip == 'false'
        run: |
          set -uo pipefail
          if python scripts/check_live_sql_parity.py --project stock-trading-498512 2>&1 | tee /tmp/parity_out.txt; then
            echo "result=ok" >> "$GITHUB_OUTPUT"
          else
            echo "result=drift" >> "$GITHUB_OUTPUT"
            echo "::error::Live SQL parity FAILED — see job output for the mismatched object(s)."
          fi
      # Live-vs-repo ROSTER parity (MON H4, 2026-07-17): scripts/check_roster_consistency.py proves the
      # roster is internally consistent across the REPO; nothing compared it against LIVE. This step diffs
      # live state.active_strategy_codes against strategy/roster.yaml's roster-active (probe/adopted) set
      # using the same read-only WIF SA + bq CLI this job already has. Runs independently of the SQL-parity
      # result (a roster drift is orthogonal to a DDL drift); exit 1 FAILS THE JOB on any divergence
      # (fail-closed — the script also exits 1 if it cannot read live, never OK on zero comparison).
      - name: Compare live roster vs strategy/roster.yaml
        if: steps.guard.outputs.skip == 'false'
        run: python scripts/check_live_roster_parity.py --project stock-trading-498512
      # DELIVERY PATH DECIDED (2026-07-17, OWNER_ACTIONS.md §I — option 3): findings reach the
      # self-heal consumer via the ops.ci_findings / state.ci_findings_open bridge
      # (bigquery/67_ci_findings_bridge.sql), which this run's INSERT step below already writes now that
      # gh-ci-runner@ holds bigquery.dataEditor on ops.ci_findings (grant applied 2026-07-17). The
      # earlier-considered alternative — committing a findings JSON file to main via an autonomous
      # CI->main `git push` — was REJECTED (it would arm a standing unattended push-to-main pathway for
      # no benefit the bridge does not already provide). The seeded placeholder
      # ops/monitoring/live_sql_parity_findings.json and the --json-out flag are therefore removed; the
      # single self-heal path is Claude_Task_Plan.md D3's unified CI-FINDINGS ADJUDICATION step.
      - name: Open/refresh finding issue (dedup)
        if: always() && steps.guard.outputs.skip == 'false' && steps.parity.outputs.result == 'drift'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          {
            echo "**DRIFT** — one or more live BigQuery object definitions no longer match the final-effective (last apply-in-order \`CREATE OR REPLACE\`) definition in \`bigquery/*.sql\`. This is the exact drift class that silently reverted \`state.trading_enabled\` for days in the 2026-07-11 incident (see \`bigquery/47_trading_enabled_resync.sql\`). Re-apply the listed object(s)' current repo definition via the BigQuery MCP/console."
            echo
            cat /tmp/parity_out.txt
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > /tmp/body.md

          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --json number,title \
            --jq '[.[] | select(.title|startswith("⚠️ Live SQL parity:"))][0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file /tmp/body.md
            echo "Updated existing issue #$existing."
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "⚠️ Live SQL parity: needs attention" \
              --body-file /tmp/body.md
          fi

          # CI-findings bridge (2026-07-16, CC-1 / issue #10): mirror this finding into
          # ops.ci_findings so a BigQuery-side consumer (D3's adjudication step, cadence_check.sql's
          # ci_finding alert) sees it too, independent of anyone reading GitHub Issues.
          # FAIL-LOUD (MON H2, 2026-07-17): this step runs only when WIF is configured (the step `if`
          # gates on skip=='false') AND drift was detected. The gh-ci-runner@ dataEditor grant on
          # ops.ci_findings landed 2026-07-17, so this INSERT is expected to SUCCEED. Previously it was
          # swallowed with `|| echo ::warning::`, so a broken bridge (the DECLARED single delivery path
          # for live-sql-parity drift) stayed invisible inside a green run while ops.ci_findings received
          # ZERO rows ever. On a drift run, a failed INSERT now FAILS THE JOB — a dead bridge is exactly
          # as bad as the drift it is supposed to deliver, and must not be swallowed. (The ::warning::
          # fallback was only ever meaningful when WIF is absent, which is impossible in this step.)
          detail=$(head -c 4000 /tmp/parity_out.txt)
          # shellcheck disable=SC2016 # single-quoted intentionally: the backtick-quoted BigQuery
          # identifier and @p_detail/@p_url named parameters must stay literal, not shell-expanded.
          if ! bq query --project_id=stock-trading-498512 --use_legacy_sql=false --parameter="p_detail:STRING:${detail}" --parameter="p_url:STRING:${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" 'INSERT INTO `stock-trading-498512.ops.ci_findings` (workflow, finding_key, status, detail, run_url) VALUES ("live-sql-parity","live_sql_parity","open",@p_detail,@p_url)'; then
            echo "::error::ops.ci_findings open-row INSERT FAILED on a DRIFT run — the DECLARED single delivery path for live-sql-parity drift (bigquery/67) is broken (WIF is present; verify the gh-ci-runner@ dataEditor grant on ops.ci_findings). Failing the job so a dead bridge is visible, not swallowed."
            exit 1
          fi

      - name: Close finding issue if resolved
        if: always() && steps.guard.outputs.skip == 'false' && steps.parity.outputs.result == 'ok'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --json number,title \
            --jq '[.[] | select(.title|startswith("⚠️ Live SQL parity:"))][0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Resolved — every checked object's live definition now matches its final-effective bigquery/*.sql source. Closing."
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY"
          fi

          # CI-findings bridge (2026-07-16, CC-1): unconditional resolved-row INSERT, even when no GH
          # issue was open to close — a manually-closed issue must not strand an open ops.ci_findings
          # row (state.ci_findings_open / cadence_check.sql's ci_finding alert would otherwise never
          # auto-clear).
          # FAIL-LOUD (MON H2, 2026-07-17): same rationale as the open-row INSERT above. This step runs
          # only with WIF present (skip=='false') and on a CLEAN run; a failed resolved-row INSERT means
          # the bridge cannot auto-clear a stale open finding, so it now FAILS THE JOB rather than being
          # swallowed into a green run (the state where ops.ci_findings sat at ZERO rows undetected).
          # shellcheck disable=SC2016 # single-quoted intentionally: the backtick-quoted BigQuery
          # identifier and @p_url named parameter must stay literal, not shell-expanded.
          if ! bq query --project_id=stock-trading-498512 --use_legacy_sql=false --parameter="p_url:STRING:${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" 'INSERT INTO `stock-trading-498512.ops.ci_findings` (workflow, finding_key, status, detail, run_url) VALUES ("live-sql-parity","live_sql_parity","resolved","parity clean this run",@p_url)'; then
            echo "::error::ops.ci_findings resolved-row INSERT FAILED — the ci_findings bridge cannot auto-clear stale open findings (WIF is present; verify the gh-ci-runner@ dataEditor grant on ops.ci_findings). Failing the job so a dead bridge is visible, not swallowed."
            exit 1
          fi
