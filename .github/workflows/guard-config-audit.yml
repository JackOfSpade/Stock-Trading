name: Guard config audit

# Self-improvement audit 2026-07-03 (B-4-obs follow-up). Five+ workflows in this repo are DOUBLE-GATED
# and default OFF — alert-relay, offsite-backup, keyless-sa-audit, wif-binding-audit, dashboard — plus
# two CI-time opt-ins in ci.yml (DBT_PARITY, RUN_SQL_DRYRUN). Each one's own `guard` step already prints
# a `::notice::` explaining how to enable it, but that notice only exists inside that ONE workflow's own
# run log — there is no single place that shows the aggregate picture, so a guard can sit dormant
# indefinitely simply because nobody thought to go check five separate Actions histories.
#
# This job does NOT treat "guard is off" as a failure — most of these are deliberately opt-in, and
# flagging an intentional, self-documented default-off state as a recurring problem would be exactly the
# kind of alert-fatigue/cry-wolf this project's monitoring elsewhere is built to avoid (see ops/RUNBOOK.md
# §19). Instead it distinguishes:
#   * LOAD-BEARING (alert-relay's ALERT_WEBHOOK_URL, offsite-backup's OFFSITE_BACKUP_GCS) — the two the
#     self-improvement audit specifically flagged as closing a real redundancy gap (alert-channel
#     diversity off the single Gmail inbox; backup off the single GCP project/billing account). These are
#     the only ones that open/keep-open a GitHub issue and fail the run, and ONLY once their sole
#     prerequisite (the WIF vars) is already live — before that, of course everything downstream is off
#     by cascade, which is the expected pre-bootstrap state, not a finding.
#   * OPTIONAL (keyless-sa-audit, wif-binding-audit, dashboard, DBT_PARITY=off, RUN_SQL_DRYRUN) — genuine
#     nice-to-haves the workflows' own headers already document as opt-in. Reported via `::notice::` only.
#
# Read-only: never touches BigQuery, IAM, or Pages. GH issue only (see stranded-branch-check.yml for the
# same read-only + issue-dedup pattern, and its comment on why CI can't write ops.alerts — RUNBOOK §6).

on:
  schedule:
    - cron: '0 7 1 * *'   # monthly, 1st @ 07:00 UTC (after keyless-sa-audit 06:30 + wif-binding-audit 06:45)
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  actions: read   # 2026-07-15 fix: workflow-STATE check below (disabled_manually) reads the Actions API
  id-token: write # 2026-07-16 fix (CC-1): CI-findings bridge WIF auth (ops.ci_findings write), optional

concurrency:
  group: guard-config-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7  # required for the local ./.github/actions/gcp-wif-auth composite action below
      - name: Gate on WIF (CI-findings bridge only — the audit itself below is unconditional)
        id: wifguard
        run: |
          if [ -n "${{ vars.GCP_WIF_PROVIDER }}" ] && [ -n "${{ vars.GCP_WIF_SERVICE_ACCOUNT }}" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CI-findings bridge (ops.ci_findings write) skipped — set vars.GCP_WIF_PROVIDER/GCP_WIF_SERVICE_ACCOUNT to enable. The guard-config audit itself still runs and still fails on a load-bearing finding regardless (auditing unset WIF vars is part of its purpose)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: GCP WIF auth + gcloud setup (provides the bq CLI, for the CI-findings bridge only)
        if: steps.wifguard.outputs.skip == 'false'
        uses: ./.github/actions/gcp-wif-auth
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}
      - name: Evaluate guard config
        id: eval
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          OFFSITE_BACKUP_GCS: ${{ secrets.OFFSITE_BACKUP_GCS }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          wif_live=false
          if [ -n "${{ vars.GCP_WIF_PROVIDER }}" ] && [ -n "${{ vars.GCP_WIF_SERVICE_ACCOUNT }}" ]; then
            wif_live=true
          fi

          if [ "$wif_live" = "false" ]; then
            echo "::notice::WIF vars (GCP_WIF_PROVIDER / GCP_WIF_SERVICE_ACCOUNT) are not set — every keyless guard (alert-relay, offsite-backup, keyless-sa-audit, wif-binding-audit, dashboard, dbt-parity, sql-validate, live-sql-parity) is dormant by cascade. Expected pre-bootstrap state, not itself a finding (ops/RUNBOOK.md §6/§25)."
            echo "problem=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          : > /tmp/loadbearing.txt

          # WORKFLOW-STATE CHECK (2026-07-15 self-improvement audit, completeness-critic finding):
          # every guard above checks CONFIG (secrets/vars) but none checked whether the workflow
          # itself is even enabled — confirmed live 2026-07-15 that alert-relay.yml had been manually
          # disabled at the GitHub platform level (`state: disabled_manually`, distinct from GitHub's
          # own 60-day-inactivity auto-disable and from a workflow's own internal secret/var guard,
          # both of which still leave the workflow "active" and run-and-skip-cleanly). A scheduled
          # workflow that is disabled_manually never runs at all — not even to report skip=true — so
          # every check above would stay silent forever about it. Any *scheduled* workflow found
          # disabled_manually is treated as load-bearing (same issue-opening path as the two secrets
          # above): a manual/accidental disable of standing automation is itself the finding.
          disabled_scheduled=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows" --paginate \
            --jq '.workflows[] | select(.state == "disabled_manually") | .path' 2>/tmp/wf_state_err || true)
          if [ -n "$disabled_scheduled" ]; then
            while IFS= read -r wf_path; do
              [ -n "$wf_path" ] || continue
              if grep -q '^\s*schedule:' "$wf_path" 2>/dev/null; then
                echo "- **$(basename "$wf_path")** (\`$wf_path\`): manually DISABLED at the GitHub Actions platform level (state=disabled_manually) — it has a \`schedule:\` trigger but will never fire, silently, until someone re-enables it (Settings → Actions, or \`gh api -X PUT repos/$GITHUB_REPOSITORY/actions/workflows/<id>/enable\`). This is distinct from being configured-off; the workflow's own guard/secret checks never even run." >> /tmp/loadbearing.txt
              fi
            done <<< "$disabled_scheduled"
          elif [ -s /tmp/wf_state_err ]; then
            echo "::notice::Workflow-state check could not read the Actions API (permissions or transient failure) — not itself a finding, but this run did not verify any workflow's enabled/disabled state. $(cat /tmp/wf_state_err)"
          fi

          if [ -z "${ALERT_WEBHOOK_URL:-}" ]; then
            echo "- **alert-relay** (\`.github/workflows/alert-relay.yml\`): WIF is live but secret \`ALERT_WEBHOOK_URL\` is unset — the fast, off-Gmail alert channel is still dormant. Single-inbox delivery risk persists (RUNBOOK §25 Theme A / B-4-obs)." >> /tmp/loadbearing.txt
          fi
          if [ -z "${OFFSITE_BACKUP_GCS:-}" ]; then
            echo "- **offsite-backup** (\`.github/workflows/offsite-backup.yml\`): WIF is live but secret \`OFFSITE_BACKUP_GCS\` is unset — the events/ops truth still has no out-of-project backup copy. Single-project blast-radius risk persists (RUNBOOK §27)." >> /tmp/loadbearing.txt
          fi

          # Optional guards — notice only, never a "problem". Plain `if` blocks throughout (not bare
          # `[ ... ] && echo`): GitHub Actions runs `bash -e` by default, and a one-liner whose `[ ]` test
          # is false would make the whole `&&` chain exit non-zero and abort the script under errexit.
          if [ "${{ vars.RUN_SA_KEY_AUDIT }}" != "true" ]; then
            echo "::notice::keyless-sa-audit disabled (opt-in). See its own guard step for the grant needed. RUNBOOK §25 E2."
          fi
          if [ "${{ vars.RUN_WIF_AUDIT }}" != "true" ]; then
            echo "::notice::wif-binding-audit disabled (opt-in). RUNBOOK §25 E1."
          fi
          if [ "${{ vars.PUBLISH_DASHBOARD }}" != "true" ]; then
            echo "::notice::dashboard publish disabled (opt-in). RUNBOOK §16."
          fi
          if [ "${{ vars.DBT_PARITY }}" = "off" ]; then
            echo "::notice::dbt-parity explicitly disabled (DBT_PARITY=off) — the dbt/BigQuery drift check is not running. RUNBOOK §14/§25 C1."
          fi
          if [ "${{ vars.RUN_SQL_DRYRUN }}" = "off" ]; then
            echo "::notice::sql-validate BigQuery SQL syntax gate explicitly disabled (RUN_SQL_DRYRUN=off) — a raw bigquery/*.sql parse error would not be caught before it reaches the live apply step. RUNBOOK §6."
          fi
          if [ "${{ vars.RUN_SQL_DRYRUN_SWEEP }}" = "off" ]; then
            echo "::notice::sql-dryrun-sweep (weekly full-tree syntax sweep) explicitly disabled (RUN_SQL_DRYRUN_SWEEP=off) — a parse error in an UNCHANGED bigquery/*.sql file (the gap that hid 3 real parse bugs in /34 and /63) would go undetected. Deliberately independent of RUN_SQL_DRYRUN; see sql-dryrun-sweep.yml."
          fi

          if [ -s /tmp/loadbearing.txt ]; then
            echo "problem=true" >> "$GITHUB_OUTPUT"
          else
            echo "problem=false" >> "$GITHUB_OUTPUT"
            echo "OK: all load-bearing guards (alert-relay, offsite-backup) are configured."
          fi

      - name: Open/refresh alert issue (dedup)
        if: steps.eval.outputs.problem == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # BUG FIX (2026-07-20 code-review, C24): same half-set-var fix as the sibling "Close stale
          # alert issue if resolved" step below — see its env-block comment for the full rationale.
          WIF_LIVE: ${{ steps.wifguard.outputs.skip == 'false' }}
        run: |
          set -uo pipefail
          {
            echo "The WIF bootstrap (\`vars.GCP_WIF_PROVIDER\` / \`vars.GCP_WIF_SERVICE_ACCOUNT\`) is live, but at least one **load-bearing** guard that depends only on it is still unconfigured:"
            echo
            cat /tmp/loadbearing.txt
            echo
            echo "These two are singled out (vs. the several genuinely-optional guards this same audit checks) because the self-improvement review specifically identified them as closing a real redundancy gap — not a nice-to-have. Set the missing secret(s) to resolve; this issue auto-closes on the next monthly run once configured."
          } > /tmp/body.md

          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --json number,title \
            --jq '[.[] | select(.title|startswith("⚠️ Guard config:"))][0].number // empty')
          if [ -n "$existing" ]; then
            echo "Alert issue #$existing already open; not duplicating."
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "⚠️ Guard config: load-bearing alert/backup channel still dormant" \
              --body-file /tmp/body.md
          fi

          # CI-findings bridge (2026-07-16, CC-1): non-fatal, and only attempted when the CI-findings
          # bridge WIF auth actually ran (vars unset -> no bq CLI credentials -> skip cleanly). Table-
          # scoped gh-ci-runner@ dataEditor grant on ops.ci_findings still needed for the write to land
          # (OWNER_ACTIONS.md); GH issue path above is unaffected either way.
          if [ "$WIF_LIVE" = "true" ]; then
            detail=$(head -c 4000 /tmp/loadbearing.txt)
            # shellcheck disable=SC2016 # single-quoted intentionally: the backtick-quoted BigQuery
            # identifiers and @p_detail/@p_url named parameters must stay literal, not shell-expanded.
            bq query --project_id=stock-trading-498512 --use_legacy_sql=false --parameter="p_detail:STRING:${detail}" --parameter="p_url:STRING:${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" 'INSERT INTO `stock-trading-498512.ops.ci_findings` (workflow, finding_key, status, detail, run_url) VALUES ("guard-config-audit","guard_config","open",@p_detail,@p_url)' || echo "::warning::ops.ci_findings insert failed — bridge inactive until the gh-ci-runner@ grant lands (OWNER_ACTIONS.md); GH issue path unaffected."
          fi
          exit 1   # surface red in the Actions tab too

      - name: Close stale alert issue if resolved
        if: steps.eval.outputs.problem == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          # BUG FIX (2026-07-20 code-review, C24): gate the bq-query block below on the SAME both-vars
          # condition that actually ran the auth step (steps.wifguard.outputs.skip), not a re-check of
          # GCP_WIF_PROVIDER alone. A half-set pair (PROVIDER set, SERVICE_ACCOUNT unset) makes wifguard
          # skip auth (no gcloud/bq credentials at all) while this inline check would still pass, so
          # `bq query` was failing on missing creds and the failure got swallowed and misattributed to
          # "bridge inactive until the grant lands" instead of the real half-set-var cause. Matches the
          # step-level `steps.guard.outputs.skip == 'false'` idiom every sibling workflow uses (keyless-
          # sa-audit, wif-binding-audit, offsite-backup, sql-dryrun-sweep, live-sql-parity), applied here
          # as an env var (mirroring auto-merge-claude.yml's WIF_CONFIGURED) since this step's own `if:`
          # is already spoken for by steps.eval.outputs.problem.
          WIF_LIVE: ${{ steps.wifguard.outputs.skip == 'false' }}
        run: |
          set -uo pipefail
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --json number,title \
            --jq '[.[] | select(.title|startswith("⚠️ Guard config:"))][0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Resolved — all load-bearing guards are now configured (or WIF was removed, resetting to the pre-bootstrap state). Closing."
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY"
          fi

          # CI-findings bridge (2026-07-16, CC-1): unconditional resolved-row INSERT (when the bridge's
          # own WIF auth ran) so a manually-closed GH issue never strands an open ops.ci_findings row.
          # Non-fatal until the grant lands; skipped cleanly (no bq CLI) when WIF vars are unset.
          if [ "$WIF_LIVE" = "true" ]; then
            # shellcheck disable=SC2016 # single-quoted intentionally: the backtick-quoted BigQuery
            # identifier and @p_url named parameter must stay literal, not shell-expanded.
            bq query --project_id=stock-trading-498512 --use_legacy_sql=false --parameter="p_url:STRING:${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" 'INSERT INTO `stock-trading-498512.ops.ci_findings` (workflow, finding_key, status, detail, run_url) VALUES ("guard-config-audit","guard_config","resolved","audit clean this run",@p_url)' || echo "::warning::ops.ci_findings resolved-row insert failed — bridge inactive until the gh-ci-runner@ grant lands; GH issue path unaffected."
          fi
