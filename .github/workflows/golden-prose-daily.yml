name: Golden prose regression (daily advisory)

# SPLIT OUT of golden-scenarios.yml on 2026-08-21 (owner-directed usage-cost change — see that file's
# header for the full history and the measured numbers). This is the LIVE half of the golden-scenario
# harness: run_golden.py --live asks the Gemini free tier to re-decide every pinned scenario against
# CURRENT prose and prints a ::warning:: on any decision flip. The offline schema HARD GATE stayed
# behind in golden-scenarios.yml, per push.
#
# WHY DAILY, WHY FULL-SUITE: per-push, this job fired ~16x/day and burned the free tier's two QUALITY
# rungs (gemini-3.5-flash 20 RPD + gemini-3-flash-preview 20 RPD) within the first few pushes, leaving
# most of each day's verdicts to the weakest ladder rung. One full 33-scenario run/day is a handful of
# batched calls (GOLDEN_BATCH groups by governing file) and fits entirely inside the top rungs, so
# every verdict comes from the best available judge — better signal AND ~93% fewer billable minutes.
# No diff scoping here: a daily run has no single push to scope to, and full-suite is the point.
#
# POSTURE (unchanged from the job's old home — the rules travel with it):
#   - ADVISORY ONLY. continue-on-error at the job level; nothing consumes this workflow's conclusion.
#     A decision flip must NEVER hard-block a merge — that would re-introduce a human-shaped gate on
#     the SISA self-improvement surface (CLAUDE.md "Settled decisions").
#   - NO BigQuery credentials, ever. On a flip, run_golden.py echoes the never-executed
#     events.queue_events INSERT for reference only; the REAL landing surface is D3's GOLDEN-SCENARIO
#     PROSE-REGRESSION CHECK + AR_orc adjudication (CLAUDE.md "Known non-issues"). Do not wire a write
#     path in here before re-reading that note.
#   - This workflow's name must NOT be added to auto-merge-claude.yml's on.workflow_run list: it gates
#     nothing, and a daily completion event would wake a pointless repo-wide drain.
#
# SCHEDULE: 10:35 UTC — clear of the 05:00-06:30 UTC scheduled-query window (RUNBOOK §6 quota note),
# after live-sql-parity (07:10) and gemini-key-health (08:40), and after the overnight routine fleet's
# prose pushes have drained, so the day's run sees the day's prose.
on:
  schedule:
    - cron: '35 10 * * *'
  workflow_dispatch:

concurrency:
  group: golden-prose-daily
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prose-regression-daily:
    name: golden scenarios — daily live decision diff (ADVISORY — never blocks)
    runs-on: ubuntu-latest
    continue-on-error: true   # advisory; nothing reads this conclusion — see header
    # Same belt-and-suspenders cutoff the job carried in golden-scenarios.yml (2026-08-17): run_golden.py
    # self-limits via GEMINI_RUN_BUDGET_S (default 3000s, degrades gracefully to partial results); this
    # job-level backstop covers the case where that Python-level budget itself fails to fire.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Check GEMINI_API_KEY is present (opt-in)
        id: guard
        env:
          # Live eval uses Gemini's free tier exclusively (run_golden.py's stdlib Gemini path).
          HAVE_KEY: ${{ secrets.GEMINI_API_KEY != '' }}
        run: |
          if [ "$HAVE_KEY" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::golden prose daily run skipped — GEMINI_API_KEY secret not set (opt-in, default state). The per-push offline schema gate in golden-scenarios.yml is unaffected. Set GEMINI_API_KEY (free tier) to enable live prose-regression diffing."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v7
        if: steps.guard.outputs.skip == 'false'
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-ci.txt
      - name: Install deps
        if: steps.guard.outputs.skip == 'false'
        # The Gemini provider uses only the Python stdlib (urllib) — no LLM SDK to install, just the
        # YAML parser (pinned via the shared ci.yml constraints file).
        run: pip install --quiet -c requirements-ci.txt pyyaml
      - name: Live decision diff vs. pinned expectations (full suite, advisory — never fails the build)
        if: steps.guard.outputs.skip == 'false'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # PYTHONUNBUFFERED so run_golden.py's per-attempt observability trail (added 2026-08-17 after
          # CI run 32043614925 evaluated 11/33 scenarios with no visibility into where the time went)
          # reaches the log even if the timeout-minutes backstop kills the job mid-run.
          PYTHONUNBUFFERED: "1"
        run: python tests/golden_scenarios/run_golden.py --live
