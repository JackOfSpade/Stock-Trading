name: Off-site backup mirror

# 2026-06-28 stack review #2 (#3, RUNBOOK §27). The irreplaceable append-only events.* truth AND its only
# durable backup (gs://stock-trading-backups) live in the SAME GCP project under ONE Google account —
# scripts/backup_events.sh's own header names "project loss" as a threat it should survive, yet the backup
# never leaves the project. A project deletion, billing closure, or single-account compromise destroys live
# data and backup together. This job mirrors the latest dt= snapshot to a store in a DIFFERENT trust domain
# (a separate billing-account project's bucket, or any gcloud-storage-addressable destination), closing that
# blast-radius. The complementary one-time owner controls (project deletion lien + Essential Contacts to a
# non-Google address) are in RUNBOOK §27 — they cannot live in CI.
#
# OPT-IN, default OFF + double-gated (like alert-relay.yml / keyless-sa-audit.yml). Reading the source
# bucket needs the WIF SA to hold roles/storage.objectViewer on gs://stock-trading-backups (a narrow grant
# beyond the read-only §6 set); writing the destination needs objectAdmin on the OFF-PROJECT bucket. Enable
# by adding those grants and setting secret OFFSITE_BACKUP_GCS (e.g. gs://other-project-stock-backups) +
# the WIF vars. Otherwise it skips cleanly (green). Keep the destination in a DIFFERENT billing account /
# project (or a non-GCP store reached via a small adapter) — same-project is not off-site.

on:
  schedule:
    - cron: '0 6 * * *'    # daily 06:00 UTC, after the in-project events backup (~05:30) + ops backup (~05:35)
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write
  issues: write   # 2026-07-18 audit — durable record of a failed mirror (a red daily run + best-effort
                  # webhook alone scroll off history; same treatment as keyless-sa-audit et al.)

concurrency:
  group: offsite-backup
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      SRC: gs://stock-trading-backups
      DEST: ${{ secrets.OFFSITE_BACKUP_GCS }}
    steps:
      - uses: actions/checkout@v7  # required for the local ./.github/actions/gcp-wif-auth composite action below
      - name: Gate on opt-in + WIF
        id: guard
        run: |
          if [ -n "${{ secrets.OFFSITE_BACKUP_GCS }}" ] \
             && [ -n "${{ vars.GCP_WIF_PROVIDER }}" ] \
             && [ -n "${{ vars.GCP_WIF_SERVICE_ACCOUNT }}" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Off-site backup disabled (default). To enable: set secret OFFSITE_BACKUP_GCS to an OFF-PROJECT gs:// bucket, grant the WIF SA storage.objectViewer on gs://stock-trading-backups + objectAdmin on the destination, and set the WIF vars. ops/RUNBOOK.md §27."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: GCP WIF auth + gcloud setup
        if: steps.guard.outputs.skip == 'false'
        uses: ./.github/actions/gcp-wif-auth
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}
      - name: Mirror the latest snapshot off-project
        id: mirror
        if: steps.guard.outputs.skip == 'false'
        env:
          WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          set -uo pipefail
          # rsync the whole backup tree (events/ + ops/) to the off-project destination. -d would delete
          # extras at the destination; we OMIT -d so the off-site copy retains history independent of the
          # source bucket's >400d lifecycle (a deliberate divergence — off-site is the deeper archive).
          # gcloud storage rsync parallelizes by default (unlike gsutil rsync, which needed a top-level -m).
          if gcloud storage rsync -r "$SRC" "$DEST"; then
            echo "off-site mirror OK: $SRC -> $DEST"
          else
            msg="🗄 Stock-Trading OFF-SITE backup mirror FAILED ($SRC -> $DEST). The off-project copy is stale — the events/ops truth has no out-of-trust-domain backup until this is fixed. See ops/RUNBOOK.md §27."
            echo "::error::$msg"
            scripts/notify_webhook.sh "$msg"
            printf '%s\n' "$msg" > /tmp/mirror_finding.txt
            exit 1
          fi

      # 2026-07-18 audit — durable failure record (same dedup'd-issue pattern as keyless-sa-audit /
      # wif-binding-audit): the webhook above is best-effort/optional and a red daily run scrolls off
      # history, yet a chronically-failing mirror means the irreplaceable events/ops truth has NO
      # out-of-trust-domain copy — precisely the silent-degradation class this repo's other guards
      # were already fixed for.
      - name: Open/refresh finding issue (dedup)
        if: always() && steps.guard.outputs.skip == 'false' && steps.mirror.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          {
            echo "**FINDING** — the off-site backup mirror FAILED. The off-project copy is stale; the events/ops truth currently has no out-of-trust-domain backup (RUNBOOK §27). This issue is the durable record, independent of whether \`ALERT_WEBHOOK_URL\` is configured."
            echo
            cat /tmp/mirror_finding.txt 2>/dev/null || true
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > /tmp/body.md
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --json number,title \
            --jq '[.[] | select(.title|startswith("⚠️ Off-site backup mirror:"))][0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file /tmp/body.md
            echo "Updated existing issue #$existing."
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "⚠️ Off-site backup mirror: needs attention" \
              --body-file /tmp/body.md
          fi
          # CI-findings bridge (same non-fatal pattern as the sibling guards). gcloud/bq are available
          # from the WIF auth step above (it must have succeeded for the mirror step to have run).
          # shellcheck disable=SC2016 # single-quoted intentionally: backtick identifier + @p_url stay literal.
          bq query --project_id=stock-trading-498512 --use_legacy_sql=false --parameter="p_url:STRING:${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" 'INSERT INTO `stock-trading-498512.ops.ci_findings` (workflow, finding_key, status, detail, run_url) VALUES ("offsite-backup","offsite_mirror","open","gcloud storage rsync to the off-project destination failed — off-site copy stale",@p_url)' || echo "::warning::ops.ci_findings insert failed — GH issue path unaffected."

      - name: Close finding issue if resolved
        if: always() && steps.guard.outputs.skip == 'false' && steps.mirror.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --json number,title \
            --jq '[.[] | select(.title|startswith("⚠️ Off-site backup mirror:"))][0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Resolved — the off-site mirror succeeded this run. Closing."
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY"
          fi

          # CI-findings bridge (2026-07-18 fix): unconditional, SELECT-based resolved-row INSERT —
          # same daily-cadence pattern as live-sql-parity.yml's clean path (bigquery/67 documents this
          # as the rule: "a clean run writes an unconditional resolved row even when no GH issue was
          # open to close ... it is what prevents a manually-closed GH issue from stranding an open
          # ops.ci_findings row / stuck cadence_check alert"). Previously this INSERT was nested inside
          # `if [ -n "$existing" ]`, so a manually-closed GH issue followed by continued healthy runs
          # left the "open" row (and its ci_finding alert) stuck forever. SELECT FROM
          # state.ci_findings_open writes zero rows on an already-clean day — no no-op-row cost, same
          # as the concern the old comment was (incompletely) guarding against.
          # shellcheck disable=SC2016 # single-quoted intentionally: backtick identifier + @p_url stay literal.
          bq query --project_id=stock-trading-498512 --use_legacy_sql=false --parameter="p_url:STRING:${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" 'INSERT INTO `stock-trading-498512.ops.ci_findings` (workflow, finding_key, status, detail, run_url) SELECT workflow, finding_key, "resolved", "mirror healthy this run", @p_url FROM `stock-trading-498512.state.ci_findings_open` WHERE workflow = "offsite-backup"' || echo "::warning::ops.ci_findings resolved-row insert failed — GH issue path unaffected."
