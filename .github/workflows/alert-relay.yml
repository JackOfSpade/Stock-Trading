name: Alert relay (webhook push)

# Stack review 2026-06-24 (RUNBOOK §25 A1/A2/A3). A version-controlled, scheduled relay that reads
# BigQuery via the EXISTING read-only WIF SA (gh-ci-runner@ — no new grant, §6) and POSTs to a
# vendor-neutral webhook (secrets.ALERT_WEBHOOK_URL — a Slack/Discord/ntfy/Pub/Sub-push endpoint).
# It diversifies alert DELIVERY off the single Google inbox every other path shares, and moves a poller
# OUT of un-versioned Apps Script into git. It COMPLEMENTS the reliable ~2h alert_emailer + the
# identity-independent DTS failure-email; this is the FAST, BEST-EFFORT channel (stateless time-window
# de-dup, so it stays read-only — see scripts/alert_relay.py).
#
# DOUBLE-GATED + OFF BY DEFAULT (it pushes live trading alerts): runs only when BOTH the WIF vars
# (vars.GCP_WIF_PROVIDER + vars.GCP_WIF_SERVICE_ACCOUNT) and the secret ALERT_WEBHOOK_URL are set.
# Otherwise it skips cleanly (no auth, no post). Do NOT retire the Apps Scripts until this is proven.
#
# Self-improvement audit 2026-07-03 (guard-config-audit companion): also runs a weekly `heartbeat` —
# alerts/orders are best-effort by design (a POST failure never fails the run, so it never adds noise
# on top of the reliable emailer), which means a permanently dead webhook would otherwise go unnoticed
# for months — it only has to fire when there happens to be something to relay. heartbeat POSTS a fixed
# canary line and, uniquely, FAILS THE RUN on a POST error, so channel diversity is actively verified,
# not just assumed from the secret being set. See scripts/alert_relay.py::relay_heartbeat.
#
# RETIRED 2026-07-18 (consolidation audit): the daily `catchup` mode (WO-8 part 1, 2026-07-03 — a
# "no rush, fire the trigger yourself" human notice over state.catchup_available). OPS0's autonomous
# catch-up auto-refire (bigquery/59_catchup_autofire.sql, 2026-07-15) reads the same signal and fires
# the trigger ITSELF in the same 04:30 UTC slot — a push asking a human to duplicate an autonomous
# action is alert-fatigue noise (RUNBOOK §19). The residual needs-a-human case (no live trigger id)
# alerts via bigquery/59's catchup_refire_no_trigger_id warning through the standard `alerts` mode.

on:
  # Cadence changed 2026-08-30 from `*/30` (every 30 min) to `0 */2 * * *` (every 2h). This relay is
  # the BACKUP/channel-diversity path — ntfy via GitHub Actions — for ops.alerts; the PRIMARY delivery
  # channel is ops/monitoring/alert_emailer.gs, which polls Gmail every POLL_HOURS=2. A backup channel
  # never needs to poll faster than the primary it backs up, so matching the emailer's 2h costs ZERO
  # effective alerting latency. Measured over Aug 11-26 2026 from the Actions jobs API, `*/30` was
  # running 18-41 times/day (~892 billable min/month, ~60% of the repo's entire scheduled-Actions
  # bill) for a channel whose primary is free and already 2h. Do NOT "restore" this to `*/30` as a
  # perceived regression — the slower cadence is the fix, not drift.
  schedule:
    - cron: '0 */2 * * *'    # alert relay — recent ops.alerts (best-effort backup channel).
                             # 2h, matching the PRIMARY channel it backs up (alert_emailer.gs,
                             # POLL_HOURS = 2). A backup never needs to poll faster than its
                             # primary. `*/30` was delivering ~30 runs/day = ~892 billable
                             # min/month, ~60% of this repo's entire scheduled-Actions bill.
                             # NOTE: hour-alignment here is NOT load-bearing. An earlier cut of
                             # this change used odd hours ('0 1-23/2 * * *') to dodge the
                             # anchor problem described on the window step below; a brute-force
                             # sweep over independent per-run scheduling delays showed odd and
                             # even hours BOTH still leaving an 80-min hole, so the alignment
                             # bought nothing and was reverted to this plainer form. The hole is
                             # closed by the window step's margin instead. Do not reintroduce an
                             # alignment trick here believing it fixes coverage — it does not.
    - cron: '5 13 * * *'     # daily staged-order reminder ~07:05 MT confirm window (A3)
    - cron: '15 13 * * 1'    # weekly (Monday) webhook liveness heartbeat
  workflow_dispatch:
    inputs:
      mode:
        description: 'alerts | orders | heartbeat'
        required: false
        default: 'alerts'
        type: choice
        options:
          - alerts
          - orders
          - heartbeat

permissions:
  contents: read
  actions: read   # read THIS workflow's own run history to size the alerts lookback window (see the
                  # "Size the alerts lookback window" step) — without it that API call 403s and the
                  # step falls back to its fixed window
  id-token: write   # Workload Identity Federation (no downloadable key)
  issues: write   # 2026-07-18 audit — durable record of a relay failure (esp. a dead-webhook heartbeat,
                  # which by definition cannot self-report through the channel that just failed)

concurrency:
  group: alert-relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Self-check — on.schedule crons stay in sync with the mode-dispatch step
        # The cron literals in `on.schedule` above are re-typed as string comparisons in the "Pick
        # mode from the trigger" step below — GitHub Actions `on:` triggers are static YAML (no
        # expressions allowed), so that duplication can't be removed outright. Nothing else kept the
        # two lists in sync, so a cron edited in one place and not the other could silently misroute a
        # run (e.g. reclassify the weekly heartbeat canary as best-effort "alerts" via the mode-dispatch
        # step's `else` branch). Runs on EVERY trigger, before the mode-pick step, unconditionally (not
        # gated behind the WIF/webhook guard) — it only reads this file, no secrets/creds needed — and
        # fails loud on drift instead of relying on someone to notice a wrong `::notice::` in a log.
        run: |
          set -euo pipefail
          FILE=".github/workflows/alert-relay.yml"

          # 1. Every cron literal actually declared in on.schedule (ground truth — what
          #    github.event.schedule is set to at runtime). Anchored on the YAML list-item form
          #    (optional indent, then "- cron: '...'") so this doesn't also match the grep pattern's
          #    OWN source text a few lines below (which contains the substring "cron: '" too).
          mapfile -t schedule_crons < <(grep -oP "^\s*-\s*cron:\s*'\K[^']+" "$FILE")
          echo "on.schedule crons: ${schedule_crons[*]}"
          # mapfile's OWN exit status is what `set -e` sees, never the process substitution's, so a
          # zero-line extraction (grep built without PCRE; a rewrite of the cron literals to
          # double-quoted YAML) is invisible here. Both arrays empty makes every check below pass
          # vacuously, which is worse than no check at all — fail loud instead (same rule as ci.yml's
          # zero-.sh-files guard and sql-dryrun-sweep.yml's zero-file guard).
          if [ "${#schedule_crons[@]}" -eq 0 ]; then
            echo "::error::cron self-check extracted ZERO on.schedule cron literals from $FILE — the extraction pattern no longer matches this file's YAML, so this guard verified nothing. Fix the pattern rather than letting it pass vacuously."
            exit 1
          fi

          # 2. Every cron literal the mode-dispatch step actually compares github.event.schedule
          #    against.
          mapfile -t dispatch_crons < <(grep -oP 'github\.event\.schedule \}\}"\s*=\s*"\K[^"]+' "$FILE")
          echo "mode-dispatch compared crons: ${dispatch_crons[*]}"
          # Same mapfile masking as above: a zero here is only caught indirectly (Check B would see
          # every scheduled cron as unhandled), so say what actually broke.
          if [ "${#dispatch_crons[@]}" -eq 0 ]; then
            echo "::error::cron self-check extracted ZERO mode-dispatch cron comparisons from $FILE — the extraction pattern no longer matches the mode-dispatch step. Fix the pattern rather than letting it report a drifted-looking result."
            exit 1
          fi

          # Check A: every compared cron must be a real on.schedule cron. An orphaned/stale comparison
          # means on.schedule changed (or a typo crept in) and the dispatch step's case wasn't updated
          # to match — that branch can now never fire.
          stale=""
          for c in "${dispatch_crons[@]}"; do
            found=0
            for s in "${schedule_crons[@]}"; do [ "$c" = "$s" ] && found=1 && break; done
            [ "$found" -eq 0 ] && stale="$stale [$c]"
          done

          # Check B: at most ONE on.schedule cron may lack an explicit comparison — that's the
          # documented implicit-default case (the fast `0 */2 * * *` alerts cron falls through to the
          # `else` branch). More than one uncompared cron means some OTHER schedule was added without a
          # matching mode branch, so it too would silently default to mode=alerts.
          unhandled=""
          unhandled_count=0
          for s in "${schedule_crons[@]}"; do
            found=0
            for c in "${dispatch_crons[@]}"; do [ "$c" = "$s" ] && found=1 && break; done
            if [ "$found" -eq 0 ]; then
              unhandled="$unhandled [$s]"
              unhandled_count=$((unhandled_count + 1))
            fi
          done

          if [ -n "$stale" ]; then
            echo "::error::mode-dispatch step compares github.event.schedule against cron(s) not present in on.schedule (stale/drifted):$stale — update the case in alert-relay.yml to match the current on.schedule crons."
            exit 1
          fi
          if [ "$unhandled_count" -gt 1 ]; then
            echo "::error::on.schedule has $unhandled_count cron(s) with no explicit mode-dispatch branch (only the single fast/alerts cron should be implicit):$unhandled — a drifted or newly-added cron would silently default to mode=alerts. Add an explicit branch in the mode-dispatch step."
            exit 1
          fi
          echo "OK: on.schedule <-> mode-dispatch crons are in sync (${#schedule_crons[@]} scheduled, ${#dispatch_crons[@]} explicit branch(es), $unhandled_count implicit default)."
      - name: Gate on WIF + webhook secret
        id: guard
        env:
          WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          if [ -n "${{ vars.GCP_WIF_PROVIDER }}" ] \
             && [ -n "${{ vars.GCP_WIF_SERVICE_ACCOUNT }}" ] \
             && [ -n "$WEBHOOK_URL" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Alert relay disabled — set the WIF vars (read-only SA, §6) + the ALERT_WEBHOOK_URL secret to enable (RUNBOOK §25). The alert_emailer Apps Script remains the reliable channel."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Pick mode from the trigger
        id: mode
        if: steps.guard.outputs.skip == 'false'
        env:
          # Passed through env, not spliced inline into the run: body, to avoid the GitHub Actions
          # script-injection anti-pattern of substituting an untyped workflow_dispatch string directly
          # into a shell command via ${{ }} — the same correct pattern the later `Relay` step already
          # uses for RELAY_MODE.
          MODE_INPUT: ${{ github.event.inputs.mode }}
        run: |
          # The daily 13:05 UTC schedule is the staged-order reminder; the weekly Monday 13:15 UTC
          # schedule is the webhook liveness heartbeat; everything else is alerts. (The former daily
          # 04:30 UTC catchup schedule was retired 2026-07-18 — see the header.)
          if [ "${{ github.event.schedule }}" = "5 13 * * *" ]; then
            echo "mode=orders" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "15 13 * * 1" ]; then
            echo "mode=heartbeat" >> "$GITHUB_OUTPUT"
          else
            echo "mode=${MODE_INPUT:-alerts}" >> "$GITHUB_OUTPUT"
          fi
      - name: Size the alerts lookback window from the last successful run
        id: window
        if: steps.guard.outputs.skip == 'false'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # GitHub scheduled delivery is best-effort and routinely runs late — never assume a cron
          # fires exactly on its nominal interval. Historical `*/30`-era measurement (2026-08-21, over
          # this workflow's run history before the 2026-08-30 move to `0 */2 * * *`): consecutive
          # deliveries a median 52.6 min and a max 89.5 min apart against a nominal 30-min interval.
          # A window fixed at the nominal cron interval therefore drops every alert raised more than
          # that interval before a late run — silently, because the relay is stateless and has no
          # cursor that could notice a skipped row. So size the window off the ACTUAL elapsed time
          # since the last successful run instead of off the nominal cron. The fallback/floor below
          # are sized off the current 2h nominal interval: 240 = one fully missed run (240 min = 2x
          # the 120-min interval) plus slack; 130 = the 120-min interval plus the same +10 margin the
          # normal (gap + 10) path below applies.
          # Best-effort BY CONSTRUCTION: no `set -e`, and continue-on-error, so an API/parse failure
          # degrades to a fixed generous window (> the measured max gap) rather than blocking
          # delivery; the Relay step below re-applies the same fallback if this step wrote no output.
          # Caveat this cannot see: the daily orders and weekly heartbeat runs count as successes
          # here although they relay no alerts, so for the alerts run following one of them the
          # computed window is a floor, not proof of gapless coverage.
          window=240
          last_ts="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/alert-relay.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].created_at // empty' 2>/dev/null || true)"
          last_epoch="$(date -u -d "$last_ts" +%s 2>/dev/null || true)"
          if [ -n "$last_ts" ] && [[ "$last_epoch" =~ ^[0-9]+$ ]]; then
            gap=$(( ( $(date -u +%s) - last_epoch ) / 60 ))
            if [ "$gap" -ge 0 ]; then
              # MARGIN = one full alerts interval + 10, NOT just 10 (2026-08-30). `gap` is measured
              # from the last SUCCESSFUL run of ANY MODE — and the daily orders run (13:05) and the
              # Monday heartbeat (13:15) relay NO alerts, yet still reset this anchor. When one of
              # them is the anchor, `gap` understates how far back coverage must reach by up to a
              # full alerts interval, silently dropping every alert raised in between (this relay is
              # stateless — a skipped row is never retried, so a hole is permanent). Brute-forced
              # over independent per-run delays: margin=10 leaves an 80-min hole; margin=130 leaves
              # ZERO. Cost is ~2.1x duplicate pushes instead of ~1.1x, which is the tradeoff this
              # module's docstring already declares: a duplicate ping is a nuisance, a silently
              # missed critical alert is a safety failure.
              window=$(( gap + 130 ))
              [ "$window" -lt 130 ] && window=130
              [ "$window" -gt 1440 ] && window=1440
            fi
          fi
          echo "last successful run: ${last_ts:-<none found>} — RELAY_WINDOW_MIN=$window"
          echo "window_min=$window" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v7
        if: steps.guard.outputs.skip == 'false'
        with:
          python-version: '3.11'
      - name: GCP WIF auth + gcloud setup (provides the bq CLI)
        if: steps.guard.outputs.skip == 'false'
        uses: ./.github/actions/gcp-wif-auth
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}
      - name: Relay
        id: relay
        if: steps.guard.outputs.skip == 'false'
        env:
          WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          RELAY_MODE: ${{ steps.mode.outputs.mode }}
          # Empty (window step errored before writing its output) falls back to the same generous
          # fixed window that step uses; an unset/empty value would make alert_relay.py's
          # int(RELAY_WINDOW_MIN) raise at import and take the whole relay down.
          RELAY_WINDOW_MIN: ${{ steps.window.outputs.window_min || '240' }}
        run: python scripts/alert_relay.py

      # 2026-07-18 audit — durable failure record (the exact treatment 5 sibling guards already got:
      # keyless-sa-audit / wif-binding-audit / live-sql-parity / guard-config-audit / sql-dryrun-sweep).
      # A red run here otherwise just scrolls off Actions history, and the heartbeat mode's failure is
      # BY DEFINITION un-self-reportable (the webhook that would carry the alert is the thing that
      # died). Issues are PER-MODE ("(heartbeat)", "(alerts)", ...) so a green fast-lane alerts run can
      # never close a dead-webhook heartbeat finding — only the next green heartbeat can.
      - name: Open/refresh finding issue (dedup, per-mode)
        if: always() && steps.guard.outputs.skip == 'false' && steps.relay.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -uo pipefail
          title="⚠️ Alert relay ($MODE): needs attention"
          {
            if [ "$MODE" = "heartbeat" ]; then
              echo "**FINDING** — the weekly webhook liveness heartbeat FAILED: the diversification alert channel is dead (revoked URL, decommissioned endpoint, or POST error). Until fixed, alert delivery has fallen back to the single Google-inbox path this channel exists to diversify away from. This issue is the durable record — the dead channel cannot self-report."
            else
              echo "**FINDING** — the alert relay run (mode: $MODE) FAILED. The reliable ~2h alert_emailer still covers delivery; investigate the run log."
            fi
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > /tmp/body.md
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --json number,title \
            --jq "[.[] | select(.title|startswith(\"$title\"))][0].number // empty")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file /tmp/body.md
            echo "Updated existing issue #$existing."
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file /tmp/body.md
          fi
          # CI-findings bridge (same non-fatal pattern as the sibling guards).
          # shellcheck disable=SC2016 # single-quoted intentionally: backtick identifier + @p_* params stay literal.
          bq query --project_id=stock-trading-498512 --use_legacy_sql=false --parameter="p_key:STRING:relay_${MODE}" --parameter="p_url:STRING:${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" 'INSERT INTO `stock-trading-498512.ops.ci_findings` (workflow, finding_key, status, detail, run_url) VALUES ("alert-relay",@p_key,"open","relay run failed — see issue/run",@p_url)' || echo "::warning::ops.ci_findings insert failed — GH issue path unaffected."

      - name: Close finding issue if resolved (same mode only)
        if: always() && steps.guard.outputs.skip == 'false' && steps.relay.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -uo pipefail
          title="⚠️ Alert relay ($MODE): needs attention"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --json number,title \
            --jq "[.[] | select(.title|startswith(\"$title\"))][0].number // empty")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Resolved — a $MODE relay run succeeded. Closing."
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY"
          fi
          # CI-findings bridge (2026-07-18 fix): unconditional, SELECT-based resolved-row INSERT for
          # ALL three modes — same daily/weekly-cadence pattern as live-sql-parity.yml's clean path
          # (bigquery/67 documents this as the rule: "a clean run writes an unconditional resolved row
          # even when no GH issue was open to close ... it is what prevents a manually-closed GH issue
          # from stranding an open ops.ci_findings row / stuck cadence_check alert"). Previously this
          # was gated on `[ -n "$existing" ] || [ "$MODE" = "heartbeat" ]`, so a manually-closed GH
          # issue for the alerts/orders modes followed by continued healthy runs left the "open" row
          # (and its ci_finding alert) stuck forever. SELECT FROM state.ci_findings_open, scoped to
          # this mode's finding_key, writes zero rows on an already-clean run — no no-op-row-volume
          # cost, same concern the old issue-conditional gating was (incompletely) guarding against.
          # shellcheck disable=SC2016 # single-quoted intentionally: backtick identifier + @p_* params stay literal.
          bq query --project_id=stock-trading-498512 --use_legacy_sql=false --parameter="p_key:STRING:relay_${MODE}" --parameter="p_url:STRING:${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" 'INSERT INTO `stock-trading-498512.ops.ci_findings` (workflow, finding_key, status, detail, run_url) SELECT workflow, finding_key, "resolved", "relay healthy this run", @p_url FROM `stock-trading-498512.state.ci_findings_open` WHERE workflow = "alert-relay" AND finding_key = @p_key' || echo "::warning::ops.ci_findings resolved-row insert failed — GH issue path unaffected."
