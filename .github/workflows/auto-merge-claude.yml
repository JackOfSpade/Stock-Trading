name: Auto-merge claude/* branches to main

on:
  push:
    # Only claude/* session branches are ever merged (see the drain loop below),
    # so only they trigger; other branches' pushes would run with write
    # permissions just to do nothing.
    branches:
      - 'claude/**'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-main
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge all pending claude/* branches into main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail

          # Drain EVERY un-merged claude/* branch, not just the one that triggered
          # this run. The concurrency group (auto-merge-main) keeps only ONE run
          # pending, so rapid pushes from several sessions can cancel a queued run
          # (GitHub keeps one pending per group). Processing all branches here means
          # whichever run does execute also picks up any stranded stragglers — a
          # dropped queued run can no longer lose a branch's work.
          if ! git fetch origin --prune; then
            echo "::warning::git fetch failed; the next push re-triggers and drains."
            exit 0
          fi

          git checkout -B main origin/main

          merged_branches=""
          for ref in $(git for-each-ref --format='%(refname:short)' refs/remotes/origin/ | grep '^origin/claude/' || true); do
            br="${ref#origin/}"

            # Already contained in main (e.g. a prior run merged it): just clean up.
            if git merge-base --is-ancestor "$ref" main; then
              merged_branches="$merged_branches $br"
              continue
            fi

            # Fast-forward if possible, else a merge commit. The .gitattributes
            # union driver auto-resolves append-only logs; anything else conflicts.
            if git merge --ff-only "$ref" || git merge --no-ff "$ref" -m "Auto-merge $br into main"; then
              merged_branches="$merged_branches $br"
            else
              git merge --abort || true
              echo "::warning::Unresolved conflict merging $br (likely an in-place state file)."
              gh pr create --base main --head "$br" \
                --title "Auto-merge conflict: $br" \
                --body "The auto-merge workflow hit a conflict the .gitattributes union driver could not resolve (likely an in-place state file). Resolve manually and merge, or close if superseded." \
                || echo "PR already exists or could not be created."
            fi
          done

          if [ -z "${merged_branches// }" ]; then
            echo "No branches to merge."
            exit 0
          fi

          if ! git push origin main; then
            echo "::warning::push to main failed; branches left intact for the next run."
            exit 0
          fi

          # Delete each merged branch ONLY after re-confirming its current remote
          # tip is fully contained in the new main, so a commit pushed during the
          # merge window is never deleted unmerged — it's left for the next run.
          for br in $merged_branches; do
            git fetch origin "$br" >/dev/null 2>&1 || continue
            if git merge-base --is-ancestor "origin/$br" main; then
              git push origin --delete "$br" || true
            else
              echo "::warning::$br advanced during the merge; not deleting (next run merges it)."
            fi
          done
