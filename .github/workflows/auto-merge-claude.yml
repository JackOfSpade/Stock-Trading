name: Auto-merge any branch to main

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-main
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge ${{ github.ref_name }} into main
        id: merge
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git fetch origin "$BRANCH"
          if git merge --ff-only "origin/$BRANCH"; then
            echo "Fast-forward merge succeeded."
            echo "merged=true" >> "$GITHUB_OUTPUT"
          elif git merge --no-ff "origin/$BRANCH" -m "Auto-merge $BRANCH into main"; then
            echo "Merge commit created (append-only conflicts auto-resolved via .gitattributes union)."
            echo "merged=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Unresolved conflict merging $BRANCH (likely an in-place state file)."
            git merge --abort
            echo "merged=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push main
        if: steps.merge.outputs.merged == 'true'
        run: git push origin main

      - name: Delete merged branch
        if: steps.merge.outputs.merged == 'true'
        env:
          BRANCH: ${{ github.ref_name }}
        run: git push origin --delete "$BRANCH"

      - name: Open PR on unresolved conflict
        if: steps.merge.outputs.merged == 'false'
        env:
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create --base main --head "$BRANCH" \
            --title "Auto-merge conflict: $BRANCH" \
            --body "The auto-merge workflow hit a conflict the .gitattributes union driver could not resolve (likely an in-place state file such as Portfolio_Ledger.md or Regime_State.md). Resolve manually and merge, or close if superseded." \
          || echo "PR already exists or could not be created."
