name: Auto-merge Claude branches to main

on:
  push:
    branches:
      - 'claude/**'

permissions:
  contents: write

concurrency:
  group: auto-merge-main
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge ${{ github.ref_name }} into main
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git fetch origin "$BRANCH"
          if git merge --ff-only "origin/$BRANCH"; then
            echo "Fast-forward merge succeeded."
          else
            echo "Branches diverged; creating merge commit."
            git merge --no-ff "origin/$BRANCH" -m "Auto-merge $BRANCH into main"
          fi
          git push origin main

      - name: Delete merged branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: git push origin --delete "$BRANCH"
