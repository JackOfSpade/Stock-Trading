name: Keyless-SA audit

# Stack review 2026-06-24 (RUNBOOK §25 E2). The whole CI/automation security model rests on
# gh-ci-runner@ and bq-scheduler@ having NO downloadable (USER_MANAGED) keys — the keyless-WIF posture
# (§6) and the deleted bq-loader@ key (§15). But nothing periodically asserts they STAY keyless: a single
# `gcloud iam service-accounts keys create` (by the owner, a future automation, or a compromised session)
# would silently reintroduce a long-lived exportable credential and undo the entire WIF investment, with
# no signal. This turns "keyless today" into "can't silently regain a key without an alarm" — the §17
# posture-hardening idea, but for the credential-KEY surface (no Org required, unlike §17's org policy).
#
# OPT-IN, default OFF + double-gated. Listing keys on the audited SAs needs the WIF SA to hold
# iam.serviceAccountKeys.list on each (e.g. roles/iam.serviceAccountKeyAdmin, or a custom role with only
# that permission) — a grant beyond the read-only §6 set, so this stays opt-in. Enable by granting that
# permission and setting vars.RUN_SA_KEY_AUDIT=true (+ the WIF vars). Otherwise it skips cleanly (green).
#
# The strictly-PREVENTIVE analog (org policy iam.disableServiceAccountKeyCreation) is deferred for the
# same no-Org reason as §17, so this DETECTION check is the actionable-today move.

on:
  schedule:
    - cron: '30 6 1 * *'   # monthly, 1st @ 06:30 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write
  issues: write   # 2026-07-15 fix — durable record of a finding independent of the optional webhook (RUNBOOK §43)

concurrency:
  group: keyless-sa-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      AUDITED_SAS: >-
        gh-ci-runner@stock-trading-498512.iam.gserviceaccount.com
        bq-scheduler@stock-trading-498512.iam.gserviceaccount.com
    steps:
      - uses: actions/checkout@v4  # required for the local ./.github/actions/gcp-wif-auth composite action below
      - name: Gate on opt-in + WIF
        id: guard
        run: |
          if [ "${{ vars.RUN_SA_KEY_AUDIT }}" = "true" ] \
             && [ -n "${{ vars.GCP_WIF_PROVIDER }}" ] \
             && [ -n "${{ vars.GCP_WIF_SERVICE_ACCOUNT }}" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Keyless-SA audit disabled (default). To enable: grant the WIF SA iam.serviceAccountKeys.list on gh-ci-runner@/bq-scheduler@ and set vars.RUN_SA_KEY_AUDIT=true (+ WIF vars). ops/RUNBOOK.md §25 E2."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: GCP WIF auth + gcloud setup
        if: steps.guard.outputs.skip == 'false'
        uses: ./.github/actions/gcp-wif-auth
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}
      - name: Assert zero USER_MANAGED keys
        id: audit
        if: steps.guard.outputs.skip == 'false'
        env:
          WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          set -uo pipefail
          offenders=""
          verify_error=""
          for sa in $AUDITED_SAS; do
            # --managed-by=user lists ONLY user-managed (downloadable) keys; GCP-managed signing keys are excluded.
            #
            # CRITICAL DISTINCTION (2026-07-09 fix, mirrors wif-binding-audit.yml's verify_error pattern):
            # a gcloud READ FAILURE (missing/not-yet-propagated iam.serviceAccountKeys.list grant, wrong
            # SA, transient API error) must NOT be reported as "zero keys". The prior version piped
            # straight into `grep -c . || true`, so a failed gcloud call produced empty stdout —
            # indistinguishable from a genuine zero-key result — and printed a false "OK: all audited SAs
            # are keyless" (the exact bug class wif-binding-audit.yml fixed 2026-06-29). Now a read failure
            # -> verify_error (exit 2, "could not verify"); only a SUCCESSFUL read counting a non-zero key
            # -> a real finding (exit 1).
            if out="$(gcloud iam service-accounts keys list --iam-account="$sa" \
                        --managed-by=user --project=stock-trading-498512 \
                        --format='value(name)' 2>err)"; then
              n=$(printf '%s' "$out" | grep -c . || true)
              echo "$sa: $n user-managed key(s)"
              if [ "$n" -ne 0 ]; then offenders="$offenders $sa($n)"; fi
            else
              verify_error="$verify_error [keys list failed for $sa: $(tr '\n' ' ' < err)]"
            fi
          done
          # A genuine finding on an SA that DID read successfully must never be masked by an unrelated read
          # failure on a DIFFERENT SA (2026-07-09 fix, code-review catch) — check offenders FIRST, always. A
          # loop over 2+ SAs can have one succeed-with-a-key and one fail-to-read at the same time; taking the
          # verify_error branch first would report "COULD NOT VERIFY (not a finding)" and skip the webhook
          # even though a real user-managed key was found on the other SA.
          if [ -n "$offenders" ]; then
            msg="🔑 Stock-Trading keyless-SA audit FAILED — user-managed key(s) found:$offenders. Expected ZERO (WIF/keyless posture, RUNBOOK §6/§15/§25). Delete the key(s) and investigate who created them."
            if [ -n "$verify_error" ]; then
              msg="$msg  (Also could not verify:$verify_error — re-run once resolved for a complete picture.)"
            fi
            echo "::error::$msg"
            scripts/notify_webhook.sh "$msg"
            # 2026-07-15 fix (RUNBOOK §43): the webhook above is best-effort/optional (silent no-op if
            # WEBHOOK_URL is unset) and a red Actions run alone scrolls off history — neither is a durable
            # record of a real finding on its own. Persist the message + mark this a FINDING so the
            # dedicated issue step below (which runs even though this step is about to fail/exit) can open
            # a durable GitHub issue regardless of webhook config.
            printf '%s\n' "$msg" > /tmp/audit_finding.txt
            echo "result=finding" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          # INCONCLUSIVE (read failure, no offenders found on the SAs that DID read) — NOT a security finding
          # on its own. Exit 2 with a distinct message so a perms/propagation issue can't masquerade as
          # "keyless". Re-run after grants propagate.
          if [ -n "$verify_error" ]; then
            msg="Keyless-SA audit COULD NOT VERIFY (this is NOT a keyless-posture finding):$verify_error  Likely the WIF SA lacks iam.serviceAccountKeys.list on the audited SA(s), or the grant has not propagated yet — wait a few minutes and re-run. RUNBOOK §25 E2."
            echo "::error::$msg"
            printf '%s\n' "$msg" > /tmp/audit_finding.txt
            echo "result=inconclusive" >> "$GITHUB_OUTPUT"
            exit 2
          fi
          echo "OK: all audited SAs are keyless (zero user-managed keys)."
          echo "result=ok" >> "$GITHUB_OUTPUT"

      - name: Open/refresh finding issue (dedup)
        # `always()` because the audit step above may have exit-1/exit-2'd (steps default to being
        # skipped after a prior failure) — this step must still run to durably record that failure.
        # Gated on skip=='false' too so a disabled/opt-out audit (no outputs set at all) never matches.
        if: always() && steps.guard.outputs.skip == 'false' && (steps.audit.outputs.result == 'finding' || steps.audit.outputs.result == 'inconclusive')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          {
            if [ "${{ steps.audit.outputs.result }}" = "finding" ]; then
              echo "**FINDING** — a user-managed key was found on an audited service account. Expected ZERO (WIF/keyless posture, RUNBOOK §6/§15/§25). This issue is the durable record of the finding, independent of whether \`ALERT_WEBHOOK_URL\` is configured (it may not be)."
            else
              echo "**INCONCLUSIVE** — the audit could not verify this run (a read failure, likely a missing or not-yet-propagated \`iam.serviceAccountKeys.list\` grant). This is NOT itself a keyless-posture finding, but posture was not confirmed this run — re-run once resolved."
            fi
            echo
            cat /tmp/audit_finding.txt 2>/dev/null || true
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > /tmp/body.md

          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --json number,title \
            --jq '[.[] | select(.title|startswith("⚠️ Keyless-SA audit:"))][0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file /tmp/body.md
            echo "Updated existing issue #$existing."
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "⚠️ Keyless-SA audit: needs attention" \
              --body-file /tmp/body.md
          fi

      - name: Close finding issue if resolved
        if: always() && steps.guard.outputs.skip == 'false' && steps.audit.outputs.result == 'ok'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --json number,title \
            --jq '[.[] | select(.title|startswith("⚠️ Keyless-SA audit:"))][0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Resolved — the audit is now clean (zero user-managed keys on all audited SAs, RUNBOOK §25 E2). Closing."
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY"
          fi
