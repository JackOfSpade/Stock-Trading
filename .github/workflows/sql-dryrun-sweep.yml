name: BigQuery SQL full dry-run sweep

# WHY THIS EXISTS (2026-07-18). ci.yml's SQL dry-run check (the `sql-validate` job until it was folded
# into the `warehouse-validation` job on 2026-07-30) is PATH-GATED: it dry-runs only the
# bigquery/*.sql files CHANGED in a push. That is the right default (it bounds BigQuery dry-run job
# volume — see dbt_parity.py's §6 quota note), but it means a file that never changes is never parsed.
#
# That gap was not theoretical. The gate landed 2026-07-17; on 2026-07-18 a comment-only edit to
# bigquery/34_alert_lifecycle.sql pulled it into the changed set for the FIRST time and it immediately
# failed with "concatenated string literals must be separated by whitespace or comments" — three
# pre-existing '' apostrophe mis-escapes (34 x2, 63 x1) that had been sitting unparsed. Each file aborts
# at its FIRST bad literal, so 34's ops.sp_auto_resolve_alerts and BOTH trading_enabled views, and 63's
# ALTER TABLE, would silently never have applied during a DR rebuild. Nothing would have caught them
# until someone happened to touch those files.
#
# The first full-repo sweep (82 files) found exactly one other "error", and it was a FALSE positive:
# bigquery/56_..._TEMPLATE.sql is unparseable by design (literal <TRANSFER_DATE> placeholders), now
# skipped by check_sql_dryrun.py's is_template().
#
# WHY A SWEEP IS STILL NEEDED once the baseline is clean: a clean file does not rot on its own, and any
# EDIT to it re-triggers the path-gated CI job — so in steady state the incremental gate is sufficient.
# This exists for the windows where that reasoning breaks: the gate skips silently when the WIF vars are
# absent or RUN_SQL_DRYRUN=off, a file can land during such a window, and a future BigQuery parser change
# can newly reject SQL that parsed before. Weekly, off-peak, it turns "we assume the unchanged files are
# fine" into "we re-confirm it every Sunday" — the same dead-man discipline the rest of ops/ uses.
#
# Read-only: `bq query --dry_run` never executes anything, and this uses the SAME read-only WIF SA as
# ci.yml's gate (dataViewer + jobUser). No DDL grant, no writes.
#
# RETUNED 2026-08-30: weekly -> monthly, for GitHub Actions cost — this workflow is ~8 billable
# min/run, so weekly was ~37 min/month. The back-catalogue parse-error latency for an UNCHANGED file
# (the gap this sweep exists to close, see above) widens from ~7 days to ~30 days as a result; that is
# acceptable because those files are not deployed between sweeps except during a DR rebuild, so a
# wider sweep interval does not widen any live-drift window, only the time-to-DETECT a latent parse
# bug in a file nobody is touching. The other regression path — a bug in the sweep's OWN checker
# logic — needs no cron at all and is NOT the reason this runs: `tests/test_check_sql_dryrun.py`
# (48 tests) already exercises that script inside ci.yml's `checks` job on every push, for free. A
# path-filtered `push:` trigger was drafted here to "offset" the wider cron gap and then removed once
# costed: it would have added ~10.7 min/month (~8 min/run x 4 push-days per 90 days = 32 min per 90
# days ≈ 10.7 min/month) to re-cover what those unit tests already cover — roughly a third of the
# ~29 min/month saving (37 → 8 min/month) the weekly→monthly move produces, not nearly all of it.
# See the note on `on:` below.
#
# ACCEPTED KNOWN GAP, recorded explicitly: there is NO liveness/dead-man monitor for this workflow —
# verified, `ci_findings_bridge_stale` (bigquery/111) is hardcoded to workflow='live-sql-parity' only,
# so a silently broken sweep (e.g. the guard step mis-skipping, or a `bq`/WIF outage that never
# surfaces) goes undetected indefinitely. Monthly widens a pre-existing gap rather than creating a new
# one. Building a BigQuery liveness beat for this workflow (mirroring live-sql-parity.yml's
# __run_marker__ pattern) was deliberately judged disproportionate here — it would mean new
# alert-category SQL on the trading-halt path for a backstop-to-a-backstop.

on:
  # NO push TRIGGER — DELIBERATE, and do not "helpfully" add one back (2026-08-30). A path-filtered
  # push trigger on `scripts/check_sql_dryrun.py` was drafted for this retune and then REMOVED once
  # measured: this workflow is a ~8-billable-minute full sweep, that file changed on 4 distinct days
  # in the last 90, so the trigger would have cost ~10.7 min/month (8 min/run x 4 push-days per 90
  # days = 32 min per 90 days) — roughly a third of the ~29 min/month saving the weekly->monthly
  # move produces, not nearly all of it. And it would have bought NOTHING, because the checker's own logic
  # is already covered by `tests/test_check_sql_dryrun.py` (48 tests), which runs inside ci.yml's
  # existing `checks` job on EVERY push at zero marginal cost (it is a step in a job that already
  # runs, so it adds no new billable job-minute). Unit tests guard the checker; this sweep guards the
  # CORPUS of unchanged bigquery/*.sql files, which is a different question and is time-based.
  schedule:
    - cron: '15 9 1 * *'   # monthly, 1st ~09:15 UTC — clear of the daily offsite-backup (06:00) /
                           # live-sql-parity (07:10) crons
  workflow_dispatch: {}    # manual sweep escape hatch

# MISSING-CONCURRENCY FIX (2026-07-26, codebase audit): this was the only one of the 13 workflows
# with no concurrency block. It has both schedule: and workflow_dispatch:, and its "Open/refresh
# finding issue (dedup)" / "Close finding issue if resolved" steps do a read-then-write dedup lookup
# (gh issue list -> comment/close/create) plus ops.ci_findings INSERTs that are NOT safe to run
# twice concurrently — a manual workflow_dispatch firing during the monthly 1st ~09:15 UTC scheduled
# run could race the dedup lookup and create a second, undeduped issue/row instead of updating the
# existing one. Matches live-sql-parity.yml / keyless-sa-audit.yml's group naming + cancel-in-
# progress: false (a sweep in progress must finish and report, not be silently cancelled mid-write).
concurrency:
  group: sql-dryrun-sweep
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write          # Workload Identity Federation (no downloadable key)
  issues: write            # durable finding record when the webhook is unconfigured

jobs:
  sweep:
    name: Dry-run every bigquery/*.sql (not just changed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: WIF-present + not-disabled guard
        id: guard
        # INDEPENDENT kill-switch (2026-07-18 audit): this sweep exists precisely for the windows
        # where the incremental gate is dark, so it must NOT share the incremental gate's
        # RUN_SQL_DRYRUN switch — turning the noisy per-push gate off would silently turn the
        # backstop off with it, and the header's "two independent failure modes" claim would be
        # false. Only RUN_SQL_DRYRUN_SWEEP=off suppresses the sweep. The WIF-vars dependency is
        # inherent (no credentials = no dry-run possible for either job) and stays.
        run: |
          if [ "${{ vars.RUN_SQL_DRYRUN_SWEEP }}" != "off" ] \
             && [ -n "${{ vars.GCP_WIF_PROVIDER }}" ] \
             && [ -n "${{ vars.GCP_WIF_SERVICE_ACCOUNT }}" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::SQL dry-run sweep skipped — set the WIF vars (read-only SA) to enable it (RUN_SQL_DRYRUN_SWEEP=off suppresses the sweep alone; the incremental gate's RUN_SQL_DRYRUN is deliberately NOT consulted here)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v7
        if: steps.guard.outputs.skip == 'false'
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install SQL checker dependencies
        if: steps.guard.outputs.skip == 'false'
        run: pip install --quiet -c requirements-ci.txt pyyaml

      - name: GCP WIF auth + gcloud setup (provides the bq CLI)
        if: steps.guard.outputs.skip == 'false'
        uses: ./.github/actions/gcp-wif-auth
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Dry-run ALL bigquery/*.sql — BLOCK on a syntax error
        id: sweep
        if: steps.guard.outputs.skip == 'false'
        env:
          # Without this the notify_webhook.sh call below is a guaranteed silent no-op (the script
          # exits 0 when WEBHOOK_URL is unset) — the 3 sibling workflows all pass it (2026-07-18).
          WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          set -uo pipefail
          gcloud config set project stock-trading-498512 >/dev/null 2>&1 || true
          # BUG FIX (2026-08-08, mirrors ci.yml's fail-open glob fix, rev 2026-07-20b Finding 2):
          # nullglob so a non-matching pattern vanishes instead of staying LITERAL (bash's default) —
          # without it, an unmatched glob string is filtered out by the `[ -f "$f" ]` check below and the
          # resulting empty `existing` array used to fall into a "nothing found -> warning + PASS" branch,
          # which also auto-closed any open finding issue. Unlike ci.yml's push-scoped dry-run gate (where
          # zero changed SQL files legitimately means nothing to check), THIS sweep exists to validate
          # EVERY bigquery/*.sql file every week — a zero-file result can only mean a broken checkout or
          # repo layout, never "clean", so it must fail loud instead of reporting a clean sweep.
          shopt -s nullglob
          mapfile -t files < <(printf '%s\n' bigquery/*.sql bigquery/scheduled_queries/*.sql)
          shopt -u nullglob
          existing=()
          for f in "${files[@]}"; do [ -f "$f" ] && existing+=("$f"); done
          if [ "${#existing[@]}" -eq 0 ]; then
            echo "::error::sql-dryrun-sweep found ZERO bigquery/*.sql / bigquery/scheduled_queries/*.sql files to check — broken checkout or repo layout change? This sweep has no legitimate zero-file case (it validates every SQL file every week, not a diff), so it must fail rather than report a clean pass."
            exit 1
          fi
          echo "Sweeping ${#existing[@]} file(s)…"
          # BUG FIX (2026-08-31 code-quality pass): add 2>&1 so a checker crash's traceback lands in
          # sweep.txt instead of vanishing to the job log alone -- without it, an uncaught exception in
          # check_sql_dryrun.py prints only to stderr, pipefail correctly fails this `if`, but
          # /tmp/sweep.txt is left 0 bytes, so the "Open/refresh finding issue" step's
          # `detail=$(head -c 4000 /tmp/sweep.txt)` below becomes "" -- which used to silently drop the
          # ops.ci_findings row (see scripts/ci_finding.sh's matching fix). Mirrors live-sql-parity.yml's
          # `check_live_sql_parity.py ... 2>&1 | tee /tmp/parity_out.txt`, which was never vulnerable to
          # this precisely because it already redirects stderr into the tee'd file.
          if python scripts/check_sql_dryrun.py "${existing[@]}" 2>&1 | tee /tmp/sweep.txt; then
            echo "result=ok" >> "$GITHUB_OUTPUT"
          else
            msg="🧩 Stock-Trading SQL sweep FAILED — a bigquery/*.sql file has a PARSE error and would abort on apply (DR rebuild / re-apply). This file did not change recently, so ci.yml's path-gated gate never saw it. $(grep -cE '✗ (SYNTAX ERROR|NO-FROM-WHERE) \(blocks merge\)' /tmp/sweep.txt || true) file(s) affected; see the run log."
            echo "::error::$msg"
            scripts/notify_webhook.sh "$msg" || true
            printf '%s\n\n' "$msg" > /tmp/finding.md
            cat /tmp/sweep.txt >> /tmp/finding.md
            echo "result=finding" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Open/refresh finding issue (dedup)
        # always(): the sweep step above exit-1s on a finding, which would otherwise skip this step —
        # but the durable record is the whole point when ALERT_WEBHOOK_URL is unset.
        if: always() && steps.guard.outputs.skip == 'false' && steps.sweep.outputs.result == 'finding'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          {
            echo "**FINDING** — a \`bigquery/*.sql\` file fails \`bq query --dry_run\` with a parse-class error."
            echo
            echo "It would abort at parse time on apply, so every statement AFTER the bad one in that file"
            echo "would silently never apply (a DR rebuild would come up quietly incomplete). Because the file"
            echo "has not changed recently, ci.yml's path-gated warehouse-validation SQL dry-run steps never dry-ran it."
            echo
            echo '```'
            cat /tmp/sweep.txt 2>/dev/null || true
            echo '```'
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > /tmp/body.md

          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --json number,title \
            --jq '[.[] | select(.title|startswith("⚠️ BigQuery SQL sweep:"))][0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file /tmp/body.md
            echo "Updated existing issue #$existing."
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "⚠️ BigQuery SQL sweep: parse error in an unchanged file" \
              --body-file /tmp/body.md
          fi

          # CI-findings bridge (2026-07-18): mirror each failing FILE into ops.ci_findings — one row
          # per file (finding_key=<path>, the per-object pattern live-sql-parity.yml uses), so the
          # BigQuery-side consumers (cadence_check's ci_finding warning alert -> monitored email; D3's
          # adjudication read of state.ci_findings_open) see a sweep finding even on a week nobody
          # reads GitHub Issues. Without this the sweep was the ONLY one of the 5 CI guards with zero
          # BigQuery-side landing surface. Same WIF auth + table-scoped gh-ci-runner@ dataEditor
          # grant this job already relies on; FAIL-LOUD on INSERT failure (a dead bridge must not
          # hide inside an already-red run as "just the sweep finding").
          # 2026-08-31 code-quality pass (shell-workflows#0): both VALUES-row inserts below now go
          # through scripts/ci_finding.sh, which builds its own run_url — the shell $run_url var
          # this step used to define is gone with them (nothing else in this step needed it).
          grep -E '✗ (SYNTAX ERROR|NO-FROM-WHERE) \(blocks merge\):' /tmp/sweep.txt | sed -E 's/.*\(blocks merge\): //' > /tmp/bad_files.txt || true
          if [ ! -s /tmp/bad_files.txt ]; then
            # Failure with ZERO per-file blocking findings = the checker's fail-closed canary path (the
            # environment could not prove it detects syntax errors) — no files to key on, so land ONE
            # aggregate not-verified row, same convention as live-sql-parity's zero-verification key.
            detail=$(head -c 4000 /tmp/sweep.txt)
            if ! scripts/ci_finding.sh "sql-dryrun-sweep" "sql_dryrun_sweep" "open" "$detail"; then
              echo "::error::ops.ci_findings not-verified INSERT FAILED (verify the gh-ci-runner@ dataEditor grant on ops.ci_findings)."
              exit 1
            fi
          fi
          while IFS= read -r line; do
            key="${line%% :: *}"
            # NO-FROM-WHERE lines carry `<path>:<lineno>`; strip the line number so finding_key stays a
            # bare file path — the per-object shape live-sql-parity's rows and D3's adjudication expect.
            # Safe because no bigquery/*.sql path contains a colon.
            key="${key%%:[0-9]*}"
            errdetail=$(printf '%s' "${line#* :: }" | head -c 900)
            if ! scripts/ci_finding.sh "sql-dryrun-sweep" "$key" "open" "parse error on dry-run: ${errdetail}"; then
              echo "::error::ops.ci_findings open-row INSERT FAILED for ${key} — the sweep's BigQuery-side landing surface is broken (verify the gh-ci-runner@ dataEditor grant on ops.ci_findings)."
              exit 1
            fi
          done < /tmp/bad_files.txt

      - name: Close finding issue if resolved
        if: always() && steps.guard.outputs.skip == 'false' && steps.sweep.outputs.result == 'ok'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --json number,title \
            --jq '[.[] | select(.title|startswith("⚠️ BigQuery SQL sweep:"))][0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
              --body "Resolved — the full sweep now parses every \`bigquery/*.sql\` cleanly. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY"
            echo "Closed issue #$existing."
          fi

          # CI-findings bridge (2026-07-18): a clean sweep resolves every still-open sweep key —
          # same per-object resolve-all pattern as live-sql-parity.yml's clean path. Writes zero
          # rows when nothing is open (harmless); FAIL-LOUD on INSERT failure so a dead bridge
          # cannot strand an open finding inside a green run.
          # shellcheck disable=SC2016 # single-quoted intentionally: the backtick-quoted BigQuery
          # identifier and @p_url named parameter must stay literal, not shell-expanded.
          if ! bq query --project_id=stock-trading-498512 --use_legacy_sql=false --parameter="p_url:STRING:${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" 'INSERT INTO `stock-trading-498512.ops.ci_findings` (workflow, finding_key, status, detail, run_url) SELECT workflow, finding_key, "resolved", "sweep clean this run", @p_url FROM `stock-trading-498512.state.ci_findings_open` WHERE workflow = "sql-dryrun-sweep"'; then
            echo "::error::ops.ci_findings resolved-row INSERT FAILED — stale sweep findings cannot auto-clear (verify the gh-ci-runner@ dataEditor grant on ops.ci_findings). Failing the job so a dead bridge is visible, not swallowed."
            exit 1
          fi
