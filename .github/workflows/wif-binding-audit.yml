name: WIF binding audit

# 2026-06-28 stack review #2 (#1, RUNBOOK §25 E1). The single highest-privilege least-privilege control on
# keyless CI is the WIF provider's attribute_condition + the gh-ci-runner@ workloadIdentityUser binding —
# they decide WHICH GitHub repo may impersonate the read-all-trading-data CI SA. infra/terraform/wif.tf
# DECLARES what that binding should be (assertion.repository == 'JackOfSpade/Stock-Trading' + a repo-scoped
# principalSet), but it is spec-only and the live binding was never verified+recorded (E1 still reads
# "Record the result here"). This job asserts the LIVE binding still matches the wif.tf-declared values and
# fails on divergence — turning a one-time manual check into a standing, reviewable guard. Read-only.
#
# OPT-IN, default OFF + double-gated (like keyless-sa-audit.yml). Describing the pool/provider + reading the
# SA IAM policy needs the WIF SA to hold roles/iam.workloadIdentityPoolViewer (project) AND
# iam.serviceAccounts.getIamPolicy on gh-ci-runner@ (e.g. roles/iam.serviceAccountViewer on that SA) —
# grants beyond the read-only §6 set, so this stays opt-in. Enable by adding those grants and setting
# vars.RUN_WIF_AUDIT=true (+ the WIF vars). Otherwise it skips cleanly (green).
#
# This does NOT change the binding (no terraform apply — §12). It only verifies + alarms.

on:
  schedule:
    - cron: '45 6 1 * *'   # monthly, 1st @ 06:45 UTC (after keyless-sa-audit at 06:30)
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write
  issues: write   # 2026-07-15 fix — durable record of a finding independent of the optional webhook (RUNBOOK §43)

concurrency:
  group: wif-binding-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      EXPECTED_REPO: JackOfSpade/Stock-Trading
      POOL_ID: github-pool
      PROVIDER_ID: github-provider
      CI_SA: gh-ci-runner@stock-trading-498512.iam.gserviceaccount.com
      PROJECT: stock-trading-498512
    steps:
      - uses: actions/checkout@v7  # required for the local ./.github/actions/gcp-wif-auth composite action below
      - name: Gate on opt-in + WIF
        id: guard
        run: |
          if [ "${{ vars.RUN_WIF_AUDIT }}" = "true" ] \
             && [ -n "${{ vars.GCP_WIF_PROVIDER }}" ] \
             && [ -n "${{ vars.GCP_WIF_SERVICE_ACCOUNT }}" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::WIF binding audit disabled (default). To enable: grant the WIF SA roles/iam.workloadIdentityPoolViewer + iam.serviceAccounts.getIamPolicy on gh-ci-runner@, and set vars.RUN_WIF_AUDIT=true (+ WIF vars). ops/RUNBOOK.md §25 E1."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: GCP WIF auth + gcloud setup
        if: steps.guard.outputs.skip == 'false'
        uses: ./.github/actions/gcp-wif-auth
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}
      - name: Assert the WIF binding is scoped to this repo
        id: audit
        if: steps.guard.outputs.skip == 'false'
        env:
          WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          set -uo pipefail
          problems=""
          verify_error=""

          # CRITICAL DISTINCTION (fixed 2026-06-29): a gcloud READ FAILURE (missing
          # iam.workloadIdentityPoolViewer / iam.serviceAccounts.getIamPolicy, or IAM-grant propagation
          # lag right after enabling this audit) must NOT be reported as a fork-permissive FINDING. The
          # prior version did `2>/dev/null || echo ''`, so a failed read became an empty string and tripped
          # the "no condition" branch — a FALSE POSITIVE (it fired on the very first run, seconds after the
          # grants, before they propagated). Now a read failure → verify_error (exit 2, "could not verify"),
          # and only a SUCCESSFUL read showing an empty/non-scoped binding → a real finding (exit 1).

          # 1. Provider attribute_condition must pin assertion.repository to THIS repo.
          if cond="$(gcloud iam workload-identity-pools providers describe "$PROVIDER_ID" \
                       --location=global --workload-identity-pool="$POOL_ID" --project="$PROJECT" \
                       --format='value(attributeCondition)' 2>cond_err)"; then
            echo "attributeCondition: ${cond:-<empty>}"
            # Accept EITHER the raw-claim form (assertion.repository) OR the mapped-attribute form
            # (attribute.repository) — they are equivalent here, since attribute_mapping sets
            # attribute.repository = assertion.repository (infra/terraform/wif.tf), so both pin the SAME
            # repo. Matching only one spelling false-failed runs #2-#4 (live used the mapped form) and would
            # otherwise pressure someone to mutate live IAM just to satisfy a string match. The trailing
            # non-word char after "repository" rejects the broader "repository_owner" (owner-level) form.
            if printf '%s' "$cond" | grep -Eq "(assertion|attribute)\.repository[^[:alnum:]_].*${EXPECTED_REPO}"; then
              : # scoped to this repo (either claim form) — OK
            else
              problems="$problems [attribute_condition does not pin (assertion|attribute).repository to $EXPECTED_REPO: '${cond:-<empty>}']"
            fi
          else
            verify_error="$verify_error [provider describe failed: $(tr '\n' ' ' < cond_err)]"
          fi

          # 2. The SA's workloadIdentityUser member must be a principalSet SCOPED TO THIS REPO
          #    (attribute.repository/<repo>), NOT a pool-wide member.
          if members="$(gcloud iam service-accounts get-iam-policy "$CI_SA" --project="$PROJECT" \
                          --flatten='bindings[].members' \
                          --filter='bindings.role=roles/iam.workloadIdentityUser' \
                          --format='value(bindings.members)' 2>mem_err)"; then
            echo "workloadIdentityUser members:"; printf '%s\n' "$members"
            if ! printf '%s' "$members" | grep -q "attribute.repository/$EXPECTED_REPO"; then
              problems="$problems [no repo-scoped principalSet member (attribute.repository/$EXPECTED_REPO) on workloadIdentityUser]"
            fi
            if printf '%s' "$members" | grep -Eq "workloadIdentityPools/$POOL_ID/\*"; then
              problems="$problems [POOL-WIDE workloadIdentityUser member present — any repo can impersonate $CI_SA]"
            fi
          else
            verify_error="$verify_error [get-iam-policy failed: $(tr '\n' ' ' < mem_err)]"
          fi

          # INCONCLUSIVE (read failure) — NOT a security finding. Exit 2 with a distinct message so a
          # perms/propagation issue can't masquerade as "fork-permissive". Re-run after grants propagate.
          if [ -n "$verify_error" ]; then
            msg="WIF binding audit COULD NOT VERIFY (this is NOT a fork-permissive finding):$verify_error  Likely the WIF SA lacks roles/iam.workloadIdentityPoolViewer + iam.serviceAccounts.getIamPolicy on $CI_SA, or the grant has not propagated yet — wait a few minutes and re-run. RUNBOOK §25 E1."
            echo "::error::$msg"
            printf '%s\n' "$msg" > /tmp/audit_finding.txt
            echo "result=inconclusive" >> "$GITHUB_OUTPUT"
            exit 2
          fi

          if [ -n "$problems" ]; then
            msg="🔐 Stock-Trading WIF binding audit FAILED:$problems. The keyless-CI trust boundary may be fork-permissive — see infra/terraform/wif.tf + RUNBOOK §25 E1. Tighten in the Console immediately."
            echo "::error::$msg"
            scripts/notify_webhook.sh "$msg"
            # 2026-07-15 fix (RUNBOOK §43): the webhook above is best-effort/optional (silent no-op if
            # WEBHOOK_URL is unset) and a red Actions run alone scrolls off history — neither is a durable
            # record of a real finding on its own. Persist the message + mark this a FINDING so the
            # dedicated issue step below (which runs even though this step is about to fail/exit) can open
            # a durable GitHub issue regardless of webhook config.
            printf '%s\n' "$msg" > /tmp/audit_finding.txt
            echo "result=finding" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "OK: WIF binding is scoped to $EXPECTED_REPO (provider condition + repo-scoped principalSet)."
          echo "result=ok" >> "$GITHUB_OUTPUT"

      - name: Open/refresh finding issue (dedup)
        # `always()` because the audit step above may have exit-1/exit-2'd (steps default to being
        # skipped after a prior failure) — this step must still run to durably record that failure.
        # Gated on skip=='false' too so a disabled/opt-out audit (no outputs set at all) never matches.
        if: always() && steps.guard.outputs.skip == 'false' && (steps.audit.outputs.result == 'finding' || steps.audit.outputs.result == 'inconclusive')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          {
            if [ "${{ steps.audit.outputs.result }}" = "finding" ]; then
              echo "**FINDING** — the live WIF binding no longer matches the \`infra/terraform/wif.tf\`-declared scope (attribute_condition and/or the \`workloadIdentityUser\` principalSet). The keyless-CI trust boundary may be fork-permissive. This issue is the durable record of the finding, independent of whether \`ALERT_WEBHOOK_URL\` is configured (it may not be)."
            else
              echo "**INCONCLUSIVE** — the audit could not verify this run (a read failure, likely missing or not-yet-propagated \`iam.workloadIdentityPoolViewer\`/\`iam.serviceAccounts.getIamPolicy\` grants). This is NOT itself a fork-permissive finding, but the binding was not confirmed this run — re-run once resolved."
            fi
            echo
            cat /tmp/audit_finding.txt 2>/dev/null || true
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > /tmp/body.md

          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --json number,title \
            --jq '[.[] | select(.title|startswith("⚠️ WIF binding audit:"))][0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file /tmp/body.md
            echo "Updated existing issue #$existing."
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "⚠️ WIF binding audit: needs attention" \
              --body-file /tmp/body.md
          fi

          # CI-findings bridge (2026-07-16, CC-1): inconclusive counts as open here, matching the
          # issue behavior above. Non-fatal until the table-scoped gh-ci-runner@ dataEditor grant on
          # ops.ci_findings lands (OWNER_ACTIONS.md).
          detail=$(printf '%s: ' "${{ steps.audit.outputs.result }}"; head -c 4000 /tmp/audit_finding.txt 2>/dev/null || echo "no detail file")
          # shellcheck disable=SC2016 # single-quoted intentionally: the backtick-quoted BigQuery
          # identifier and @p_detail/@p_url named parameters must stay literal, not shell-expanded.
          bq query --project_id=stock-trading-498512 --use_legacy_sql=false --parameter="p_detail:STRING:${detail}" --parameter="p_url:STRING:${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" 'INSERT INTO `stock-trading-498512.ops.ci_findings` (workflow, finding_key, status, detail, run_url) VALUES ("wif-binding-audit","wif_binding","open",@p_detail,@p_url)' || echo "::warning::ops.ci_findings insert failed — bridge inactive until the gh-ci-runner@ grant lands (OWNER_ACTIONS.md); GH issue path unaffected."

      - name: Close finding issue if resolved
        if: always() && steps.guard.outputs.skip == 'false' && steps.audit.outputs.result == 'ok'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --json number,title \
            --jq '[.[] | select(.title|startswith("⚠️ WIF binding audit:"))][0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Resolved — the live binding now matches the wif.tf-declared scope (RUNBOOK §25 E1). Closing."
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY"
          fi

          # CI-findings bridge (2026-07-16, CC-1): unconditional resolved-row INSERT so a
          # manually-closed GH issue never strands an open ops.ci_findings row. Non-fatal until the
          # grant lands.
          # shellcheck disable=SC2016 # single-quoted intentionally: the backtick-quoted BigQuery
          # identifier and @p_url named parameter must stay literal, not shell-expanded.
          bq query --project_id=stock-trading-498512 --use_legacy_sql=false --parameter="p_url:STRING:${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" 'INSERT INTO `stock-trading-498512.ops.ci_findings` (workflow, finding_key, status, detail, run_url) VALUES ("wif-binding-audit","wif_binding","resolved","audit clean this run",@p_url)' || echo "::warning::ops.ci_findings resolved-row insert failed — bridge inactive until the gh-ci-runner@ grant lands; GH issue path unaffected."
