name: Stranded-branch check

# Closes the monitoring gap behind the 2026-06-14 W5/W2 data loss (ops/RUNBOOK.md §20):
# a routine can log "completed" in ops.run_log (BigQuery) while its committed .md output
# NEVER reaches main — a branch whose CI stays red (auto-merge skips it) or an unresolved
# "Auto-merge conflict:" PR. Every existing monitor (freshness / cadence) watches BigQuery,
# so it is blind to this git↔BigQuery divergence. This sweep flags it within hours and opens
# a GitHub issue (which notifies the repo owner) instead of it sitting unnoticed for weeks.
#
# DELIVERY: BOTH a GitHub issue AND the ops.ci_findings bridge (bridge added 2026-08-09 -- this
# workflow was the LAST CI guard still issue-only). It writes workflow='stranded-branch-check',
# finding_key='stranded_branch', which state.ci_findings_open surfaces and cadence_check's
# `ci_finding` WARNING then delivers to the monitored alert-email channel. bigquery needs NO change:
# state.ci_findings_open (bigquery/86, superseding 67) partitions by (workflow, finding_key) with no
# workflow allowlist, so a new producer is picked up automatically.
#
# WHY THIS CHANGED (2026-08-09 incident). The issue-only delivery was a real, measured blind spot,
# not a theoretical one. On 2026-08-08/09 a single dbt-parity drift turned CI red on EVERY branch
# touching bigquery/**|dbt/** (auto-merge only drains green branches), so BOTH open branches stranded
# and main fell behind live. This workflow DETECTED it correctly and filed issue #36 -- but because
# it was the one guard not wired to the bridge, the ROOT CAUSE was visible only on a channel nobody
# was watching, while its DOWNSTREAM symptoms (10 live-sql-parity findings, postmerge_coverage) went
# out by email as usual. The operator triaged the symptoms; the cause sat for a day. Detection was
# never the gap -- delivery was.
#
# The original rationale (writing ops.alerts from CI would need the deliberately read-only CI
# identity to hold BigQuery write, RUNBOOK §6/§20) still stands and is NOT being reversed here: this
# does NOT write ops.alerts. It writes the table-scoped ops.ci_findings marker table via the
# gh-ci-runner@ dataEditor grant applied 2026-07-17 -- the same indirection live-sql-parity.yml /
# keyless-sa-audit.yml / wif-binding-audit.yml / guard-config-audit.yml already use, and the same
# reason the bridge exists at all (self-improvement audit 2026-07-16 CC-1). ops.alerts is still
# written only by BigQuery-side procedures, never by CI.
#
# Claude_Task_Plan.md's D3 CI-FINDINGS ADJUDICATION step classifies workflow='stranded-branch-check'
# as a NO-REPAIR class (like keyless_sa / wif_binding / guard_config / b3-invariants): the condition
# is git-side, the finding_key is not a <dataset>.<object>, and it must never reach the live-SQL
# self-heal branches. Adding a producer without adding that classification would leave D3 holding an
# unclassified row -- the two changes belong in the same commit.
#
# Also performs a bounded (max attempt 5, max 1 per Pacific day -- custom quotas reset midnight PT)
# rerun of quota-class red CI ("QueryUsagePerUserPerDay"/"Custom quota exceeded" in the failed-step
# logs), the one failure class where retry-after-daily-reset is the mechanically correct remediation
# (2026-07-16; second live occurrence of the dbt-parity quota strand -- run 29469270140). Non-quota
# failures keep the detection-only issue path unchanged.
#
# 2026-07-19 hardening: the rerun step's guards were all bare `|| continue` (the exact bug class
# fixed above on 2026-07-09), so a transient `gh` failure was indistinguishable from "nothing to
# do" -- runs 29680174657 and 29689890540 both silently no-op'd against an eligible quota-stranded
# branch (claude/fervent-franklin-kzblrt). Every skip path now emits a ::warning::/::notice:: naming
# the branch and reason, and the failed-step log fetch is a distinct, explicitly-checked step. The
# dedup issue step also now refreshes an already-open issue's body on every firing instead of only
# creating it once (issue #11's body sat stale, naming a since-deleted branch, for 3 days).

on:
  schedule:
    # RETUNED 2026-08-30: 4x/day -> 3x/day, for GitHub Actions cost — each run is a single ~35s job
    # billed at the 1-minute floor, so this drops ~120 -> ~90 min/month.
    #
    # UNIFORM 8h spacing was chosen deliberately OVER simply deleting one of the four `*/6` slots:
    # dropping a single slot (e.g. just the 18:23 UTC one) would have left a non-uniform 12h gap
    # (12:23 -> 00:23 UTC) and doubled worst-case detection latency for a strand that lands right
    # after the last surviving sweep before that gap, whereas even 8h spacing keeps every gap equal.
    #
    # 8h still comfortably exceeds the detect step's own MAX_AGE_HOURS='6' staleness threshold below:
    # a branch stranded right after a sweep is still >6h unmerged by the next one, so it is flagged on
    # the very next run either way. Worst-case detection moves from ~6h to ~8h (plus GitHub's measured
    # 30-100 min scheduling delay for scheduled workflows).
    - cron: '23 0,8,16 * * *'   # every 8h (UTC) — 3 sweeps/day
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read
  issues: write
  actions: write   # rerun quota-class red CI, bounded — see 'Bounded next-Pacific-day rerun' step
  id-token: write  # keyless WIF for the ops.ci_findings bridge write (2026-08-09); no static key

concurrency:
  group: stranded-branch-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      # WIF is OPTIONAL here, unlike in live-sql-parity.yml where it gates the whole check. This
      # workflow's detection is pure git/gh and needs no GCP credential at all; WIF is only for the
      # ops.ci_findings bridge write below. So an unset var DEGRADES delivery to issue-only (the
      # pre-2026-08-09 behaviour) rather than skipping the sweep — never trade detection for delivery.
      - name: Gate on WIF creds (ops.ci_findings bridge only)
        id: guard
        run: |
          if [ -n "${{ vars.GCP_WIF_PROVIDER }}" ] && [ -n "${{ vars.GCP_WIF_SERVICE_ACCOUNT }}" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ops.ci_findings bridge skipped — vars.GCP_WIF_PROVIDER/GCP_WIF_SERVICE_ACCOUNT unset. Detection still runs and still opens a GitHub issue, but a stranded branch will NOT reach the alert-email channel. ops/RUNBOOK.md §6/§20."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: GCP WIF auth + gcloud setup (provides the bq CLI)
        if: steps.guard.outputs.skip == 'false'
        uses: ./.github/actions/gcp-wif-auth
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Detect stranded branches + open conflict PRs
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_AGE_HOURS: '6'   # a healthy branch auto-merges within minutes of green CI; >6h unmerged = stuck
        run: |
          set -uo pipefail
          # Fetch ALL remote branches (checkout only brought main).
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune --quiet
          now=$(date -u +%s)

          : > /tmp/stranded.txt
          for ref in $(git for-each-ref --format='%(refname)' refs/remotes/origin/ \
                        | grep -v -E '^refs/remotes/origin/(main|HEAD)$' || true); do
            br=${ref#refs/remotes/}
            # Skip anything already contained in main.
            if git merge-base --is-ancestor "$ref" origin/main; then continue; fi
            ct=$(git log -1 --format='%ct' "$ref")
            age=$(( (now - ct) / 3600 ))
            if [ "$age" -ge "$MAX_AGE_HOURS" ]; then
              echo "- \`$br\` — unmerged, ${age}h old (tip $(git rev-parse --short "$ref"))" >> /tmp/stranded.txt
            fi
          done

          # READ FAILURE (API rate limit, token/permission hiccup, transient GH outage) is NOT the same as
          # "zero open conflict PRs" — the prior version's `|| true` made a failed `gh pr list` call
          # indistinguishable from a clean empty result, so the check never having run could silently
          # report "OK: no ... open conflict PRs" (2026-07-09 fix, same bug class as keyless-sa-audit.yml).
          # (No separate pre-truncation of /tmp/conflicts.txt needed here — the `>` redirect below already
          # truncates it before `gh` runs, on both the success and failure path; the `then`-branch
          # re-truncation is what actually guards against partial output surviving a failed read, since
          # that runs AFTER gh may have already written partial stdout through the redirect.)
          if ! gh pr list --repo "$GITHUB_REPOSITORY" --state open --json number,title,url \
                --jq '.[] | select(.title|startswith("Auto-merge conflict:")) | "- #\(.number) \(.title) (\(.url))"' \
                > /tmp/conflicts.txt 2>/tmp/gh_pr_list_error.txt; then
            : > /tmp/conflicts.txt   # a failed read must not carry over partial/stale output
          else
            : > /tmp/gh_pr_list_error.txt   # successful read — no error to report
          fi

          if [ -s /tmp/gh_pr_list_error.txt ]; then
            echo "problem=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Could not check for open 'Auto-merge conflict:' PRs ($(tr '\n' ' ' < /tmp/gh_pr_list_error.txt)) — treating as a problem so a gh/API failure surfaces instead of silently reporting OK."
          elif [ -s /tmp/stranded.txt ] || [ -s /tmp/conflicts.txt ]; then
            echo "problem=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Stranded routine output detected — see the Alert step / opened issue."
          else
            echo "problem=false" >> "$GITHUB_OUTPUT"
            echo "OK: no stranded branches (> ${MAX_AGE_HOURS}h), no open conflict PRs."
          fi

      - name: Bounded next-Pacific-day rerun for per-day-quota CI failures
        if: steps.detect.outputs.problem == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # BigQuery custom quotas (QueryUsagePerUserPerDay) reset at midnight PACIFIC, not UTC —
          # gate the once-per-day rerun on the Pacific calendar day so the retry fires in the first
          # sweep AFTER the quota actually reset (the 08:23Z sweep = 01:23 PDT / 00:23 PST, fresh
          # quota — under PST the margin over the 08:00Z reset is only 23 minutes) instead of the
          # 00:23Z sweep (= 17:23 PDT / 16:23 PST of the PREVIOUS Pacific day, the tail of the SAME
          # still-exhausted Pacific day — which would deterministically re-fail and burn the attempt
          # budget).
          # TIMES CORRECTED 2026-09-04 (comment-only; the mechanism was and is right): this paragraph
          # used to cite an "11:23Z"/"05:23Z" sweep pair that matches NO cron this workflow has ever
          # had — they were the PT renderings of the pre-2026-08-30 `23 */6` schedule's 18:23Z/12:23Z
          # slots, mislabelled "Z", and were already wrong when the step landed. Read the times off
          # `on.schedule` above (`23 0,8,16`) if this is ever re-checked.
          today_pt=$(TZ=America/Los_Angeles date +%F)
          while IFS= read -r line; do
            # shellcheck disable=SC2016 # single-quoted intentionally: the backtick-quoted markdown
            # branch-name pattern must stay literal, not shell-expanded.
            br=$(echo "$line" | sed -nE 's/^- `([^`]+)` .*/\1/p')
            [ -n "$br" ] || { echo "::warning::rerun-check: could not parse a branch name from stranded.txt line: $line"; continue; }
            # Every guard below speaks on skip (2026-07-19): a transient `gh`/API failure must not
            # be indistinguishable from "nothing to do" — the exact bug class the detect step above
            # fixed on 2026-07-09. Two sweeps (runs 29680174657/29689890540) silently no-op'd against
            # an eligible quota-stranded branch before this was hardened.
            sha=$(git rev-parse "refs/remotes/$br" 2>/dev/null) || { echo "::warning::rerun-check: could not resolve $br to a sha"; continue; }
            run_json=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI --commit "$sha" --limit 1 --json databaseId,conclusion,updatedAt,attempt --jq '.[0] // empty' 2>/dev/null) || { echo "::warning::rerun-check: gh run list failed for $br — cannot evaluate quota-retry (transient API failure?)"; continue; }
            [ -n "$run_json" ] || { echo "::notice::rerun-check: $br has no CI run for tip sha — nothing to rerun"; continue; }
            conclusion=$(echo "$run_json" | jq -r .conclusion)
            [ "$conclusion" = "failure" ] || { echo "::notice::rerun-check: $br CI conclusion is '$conclusion', not failure — skip"; continue; }
            attempt=$(echo "$run_json" | jq -r .attempt)
            [ "$attempt" -lt 5 ] || { echo "::warning::$br — quota-retry budget exhausted (attempt $attempt); owner attention needed (existing stranded-branch issue stands)."; continue; }
            run_day_pt=$(TZ=America/Los_Angeles date -d "$(echo "$run_json" | jq -r .updatedAt)" +%F 2>/dev/null) || { echo "::warning::rerun-check: could not parse updatedAt for $br — cannot evaluate the once-per-Pacific-day gate"; continue; }
            if [ "$run_day_pt" = "$today_pt" ]; then
              echo "::notice::rerun-check: $br already retried this Pacific day (run day $run_day_pt) — skip"
              continue
            fi
            run_id=$(echo "$run_json" | jq -r .databaseId)
            if ! gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log-failed > /tmp/rerun_log.txt 2>/tmp/rerun_log_err.txt; then
              echo "::warning::rerun-check: could not fetch failed-step logs for run $run_id — cannot classify failure; leaving for the stranded-branch issue ($(tr '\n' ' ' < /tmp/rerun_log_err.txt))"
              continue
            fi
            if grep -qE 'QueryUsagePerUserPerDay|Custom quota exceeded' /tmp/rerun_log.txt; then
              echo "::notice::$br — CI run $run_id failed on a per-day BigQuery quota; requesting bounded next-Pacific-day rerun (attempt $attempt)."
              gh run rerun "$run_id" --failed --repo "$GITHUB_REPOSITORY" || echo "::warning::rerun request failed for $br (run $run_id); falls through to the stranded-branch issue."
            else
              echo "::notice::rerun-check: run $run_id failure is not quota-class — no rerun (detection-only path stands)"
            fi
          done < /tmp/stranded.txt

      # MUST run BEFORE the issue step below, which ends in `exit 1` — a later step would never run
      # on the very path that matters. Single step with an internal branch (the live-sql-parity.yml
      # "Record B3 finding" precedent) so the open and resolved writes cannot drift apart.
      - name: Record stranded-branch finding (ops.ci_findings bridge)
        if: steps.guard.outputs.skip == 'false'
        run: |
          set -uo pipefail
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ "${{ steps.detect.outputs.problem }}" = "true" ]; then
            # detail is SHORT and IDENTITY-BEARING: it lands in a JSON payload and an operator email.
            # Name the branches/PRs, not the full markdown issue body. Note the alert MESSAGE only ever
            # says "stranded-branch-check/stranded_branch" — a single stable finding_key, so
            # sp_raise_alert_once dedups to ONE open row while the condition persists, exactly the
            # "identity in the message, detail in the payload" convention the cadence_check blocks use.
            # A per-branch finding_key would instead leave a permanently-open row for every branch name
            # that ever stranded, since branch names are ephemeral and nothing would resolve the old key.
            # shellcheck disable=SC2016 # single-quoted intentionally: the backtick-quoted markdown
            # branch-name pattern must stay literal, not shell-expanded (same as the rerun step above).
            branches=$(sed -nE 's/^- `([^`]+)`.*/\1/p' /tmp/stranded.txt 2>/dev/null | paste -sd',' - || true)
            prs=$(sed -nE 's/^- (#[0-9]+).*/\1/p' /tmp/conflicts.txt 2>/dev/null | paste -sd',' - || true)
            detail=""
            [ -n "$branches" ] && detail="unmerged branch(es): ${branches}"
            [ -n "$prs" ] && detail="${detail:+${detail}; }open auto-merge conflict PR(s): ${prs}"
            if [ -s /tmp/gh_pr_list_error.txt ]; then
              detail="${detail:+${detail}; }could not read conflict PRs (monitoring gap, not necessarily a strand): $(tr '\n' ' ' < /tmp/gh_pr_list_error.txt)"
            fi
            [ -n "$detail" ] || detail="stranded-branch check reported a problem but produced no detail lines — see the run log"
            detail="Routine output may be stranded off main (RUNBOOK §20). ${detail}"
            detail=$(printf '%s' "$detail" | cut -c1-900)

            # 2026-08-31 code-quality pass (shell-workflows#0): VALUES-row insert extracted to
            # scripts/ci_finding.sh (it builds its own run_url; the shell $run_url var above is
            # still needed by the auto-resolve INSERT..SELECT in the else branch below).
            if ! scripts/ci_finding.sh "stranded-branch-check" "stranded_branch" "open" "$detail"; then
              # DELIBERATELY does NOT exit here, unlike live-sql-parity.yml's B3 open-row write. The
              # GitHub-issue step below is the pre-existing delivery path and still works; exiting now
              # would suppress it and make a bridge outage strictly worse than no bridge at all. The job
              # still goes red — that step ends in `exit 1` on this same branch.
              echo "::error::Could not record the stranded-branch finding to ops.ci_findings — it will reach the GitHub issue but NOT the alert-email channel. Check gh-ci-runner@'s table-scoped dataEditor grant on ops.ci_findings (RUNBOOK §6)."
            fi
          else
            # Auto-resolve, scoped to THIS producer only. Writes zero rows when nothing is open, so a
            # healthy sweep costs one no-op query and appends nothing.
            # shellcheck disable=SC2016 # single-quoted intentionally: see above.
            if ! bq query --project_id=stock-trading-498512 --use_legacy_sql=false \
                 --parameter="p_url:STRING:${run_url}" \
                 'INSERT INTO `stock-trading-498512.ops.ci_findings` (workflow, finding_key, status, detail, run_url) SELECT workflow, finding_key, "resolved", "no stranded branches or conflict PRs this sweep", @p_url FROM `stock-trading-498512.state.ci_findings_open` WHERE workflow = "stranded-branch-check"'; then
              echo "::warning::Could not auto-resolve the stranded-branch finding in ops.ci_findings; a stale open row may linger until the next clean sweep."
            fi
          fi

      # THE ISSUE HALF OF DELIVERY MUST CLOSE ITSELF TOO (added 2026-08-19). This workflow delivers
      # BOTH ways -- ops.ci_findings AND a GitHub issue -- but until now only the ci_findings half
      # auto-resolved (the step above). The issue was opened on a problem and then never closed by
      # anything, so it outlived the condition indefinitely: issue #41 (opened 2026-08-19T13:17Z for
      # claude/sl3-2026-08-18) was still open after that branch merged as e039dd1 and
      # `git branch -r --no-merged origin/main` had gone empty.
      #
      # WHY THAT IS A DELIVERY DEFECT, not just untidiness: the open step below dedups by title
      # prefix and, when it finds an existing open issue, calls `gh issue edit` instead of
      # `gh issue create`. An edit does not notify the way a new issue does. So the FIRST stranded
      # branch opens a loud issue, and every subsequent incident silently amends that same stale
      # issue -- the channel degrades to quiet after one use, and the quieter it gets the longer a
      # genuine strand sits unseen. Closing on a clean sweep restores the create-path (and its
      # notification) for the next real incident.
      #
      # Mutually exclusive with the open step below (problem == 'false' vs 'true'), so ordering
      # against its `exit 1` does not matter. Fail-soft throughout: a transient gh failure must never
      # turn a HEALTHY sweep red, which would itself become a false stranded-branch signal.
      #
      # NOT gated on steps.guard (the WIF-credentials gate) ON PURPOSE — that guard is scoped to the
      # ops.ci_findings bridge, as its own name says. Closing an issue needs only GH_TOKEN, which is
      # always present, so coupling the two would mean a WIF outage silently left the issue open
      # forever even though closing it was perfectly possible. The `detect` step always runs, and if
      # it were ever skipped its output is empty and this condition is simply false.
      - name: Close the stranded-branch issue on a clean sweep
        if: steps.detect.outputs.problem == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Same title-prefix selector the open step dedups on, so the two can never disagree about
          # which issue represents this condition.
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --json number,title \
            --jq '[.[] | select(.title|startswith("⚠️ Stranded routine branch"))][0].number // empty' \
            2>/dev/null || echo "")

          if [ -z "$existing" ]; then
            echo "No open stranded-branch issue to close — nothing to do."
          else
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY" \
              --comment "Closed automatically: this sweep found no stranded branches and no open auto-merge conflict PRs, so the condition this issue reports is no longer true. Sweep run: ${run_url}. The matching ops.ci_findings row was resolved by the same sweep. A future strand opens a NEW issue (this workflow dedups on open issues only), so closing here is what keeps that notification loud." \
              && echo "Closed stale stranded-branch issue #$existing." \
              || echo "::warning::Could not close stranded-branch issue #$existing (transient gh failure?) — it stays open and the NEXT incident will edit it rather than opening a fresh, notifying issue. Close it by hand if this repeats."
          fi

      - name: Open alert issue (dedup) and fail the run
        if: steps.detect.outputs.problem == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          {
            echo "A routine may have **completed** (logged to \`ops.run_log\`) while its committed \`.md\` output never reached \`main\`. Every BigQuery monitor (freshness / cadence) is blind to this git↔BigQuery divergence — see \`ops/RUNBOOK.md\` §20."
            echo
            if [ -s /tmp/stranded.txt ]; then
              echo "**Stranded branches (unmerged > 6h):**"; echo; cat /tmp/stranded.txt; echo
            fi
            if [ -s /tmp/conflicts.txt ]; then
              echo "**Open auto-merge conflict PRs:**"; echo; cat /tmp/conflicts.txt; echo
            fi
            if [ -s /tmp/gh_pr_list_error.txt ]; then
              echo "**Could not check for open 'Auto-merge conflict:' PRs** (\`gh pr list\` failed — this is a monitoring gap, not necessarily a stranded branch): $(cat /tmp/gh_pr_list_error.txt)"; echo
            fi
            echo "**Resolve:** get the branch's CI green (the auto-merge then drains it), or merge/close the conflict PR. If the branch is obsolete, confirm its outputs are superseded (or back-fill cumulative files like \`B_Sub_Pattern_Taxonomy.md\`) before deleting."
          } > /tmp/body.md

          # Dedup by title prefix (avoids a new issue every sweep while one incident is open — the
          # cadence was every 6h until the 2026-08-30 retune to `23 0,8,16`, i.e. every 8h; MAX_AGE_HOURS
          # a few steps up is a DIFFERENT 6, the staleness threshold, and is unaffected).
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --json number,title \
            --jq '[.[] | select(.title|startswith("⚠️ Stranded routine branch"))][0].number // empty')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" --body-file /tmp/body.md \
              && echo "Alert issue #$existing already open; body refreshed with the current stranded list." \
              || echo "::warning::could not refresh issue #$existing body (transient gh failure?) — issue remains open with a stale body."
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "⚠️ Stranded routine branch / unmerged output detected" \
              --body-file /tmp/body.md
          fi
          exit 1   # surface red in the Actions tab too
