      - date: 2026-07-26
        note: "spec_hash recomputed (codebase audit 2026-07-26 — 2 bug fixes + 1 self-test hardening in c_options_math.py; strategy/05_strategy_c.md is byte-unchanged, and none of these change Strategy C's entry/exit rules or thresholds): (1) implied_vol() no longer fabricates an IV where none is identifiable. It was a bare Newton-Raphson loop accepting `abs(price - target_price) < tolerance` as convergence — but that test is ALSO satisfied wherever the pricing function is numerically flat in sigma, and there the returned value is just whatever the caller passed as `initial_guess`. Two measured classes: deep-OTM/$0.00-quoted legs (routine on the short and protective legs of the iron condors and wide credit spreads this module builds), where price underflows to 0.0 across the practical vol range so iteration 0 'converged' immediately — implied_vol(0.0, 100, 150, 5, 0.045, 'call') returned 0.30 for guess 0.30, 0.05 for 0.05, 0.80->0.7011, an answer tracking the solver knob instead of the input; and deep-ITM legs, whose price sits within tolerance of the discounted-intrinsic floor across a wide sigma band. A 20k randomized-quote sweep found 2278 fabricated IVs. Thresholding vega does NOT fix this: an intermediate attempt moving a `vega_per_unit < 1e-6` guard ahead of the accept-check was measured to still fabricate 410 IVs while NEWLY rejecting 760 solvable quotes. The fix decides identifiability from the TARGET PRICE, which is well-posed because BSM price is strictly increasing in sigma: bracket the solvable range as (price(0.001), price(5.0)) and return None for any target at or outside it, then solve inside the proven bracket with Newton SAFEGUARDED by bisection (any step leaving the bracket, or a vega too small to divide by, bisects instead). Measured net on the same sweep: 2278 fabrications eliminated, 3294 quotes bare Newton could not solve now solve correctly, no true regressions. The module's contract — non-convergence returns None so the caller DEFERS rather than trading on a fabricated IV — is now actually honored. (2) probability_weighted_payoff() no longer draws the simulation's volatility from structure.legs[0] — an arbitrary artifact of each builder's leg-construction order (for iron_condor, always the long-put WING). Unlike risk_free_rate/dividend_yield, which Structure.__post_init__ DOES enforce uniform across legs, volatility is deliberately per-leg because real chains are skewed — so the one field most likely to differ was the one taken by index. With wings 0.60 / body 0.40 the reported prob_max_loss swung 0.2398 vs 0.0806 (~2.4x) purely on leg order. Now uses the volatility of the leg whose strike is nearest the underlying (the standard ATM-IV proxy). The similar legs[0] read in max_loss_monte_carlo() is left alone — its own comment justifies it. (3) The __main__ self-test's Tests 9/13/14 printed without asserting while the block still ended 'ALL SELF-TESTS PASSED'; Test 9 (cascade_max_loss, a load-bearing safety bound) now carries the golden-value assert from tests/test_options_math.py, and 13/14 assert real invariants. Verified by scripts/check_roster_consistency.py R-F and the full tests/test_options_math.py suite."
