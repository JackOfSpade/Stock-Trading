#   candidate|qualifying|authoring|under_review|shadow|paper|probe|adopted|
#   retirement_proposed|terminated|post_mortem|rejected.
# Derived flags: is_active = roster_state IN (probe, adopted); is_incubating = IN (shadow, paper).
# Version numbers (edges 1.x / disadvantages 2.x) are QUOTED so YAML keeps "1.10" distinct from "1.1".
