t implied-move sourcing rule and a skip-not-block fallback. NO threshold, entry/exit rule, indicator, router rule, kill criterion, sizing rule or order-guard behaviour changed. Verified by scripts/check_roster_consistency.py R-F, scripts/split_strategy.py --check, scripts/split_task_plan.py --check and the full pytest suite."
