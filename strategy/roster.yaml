as gone to zero (or been delisted) is the SHORT SELLER'S BEST possible outcome, not a stop event, and `0.0 >= short_entry_price * 1.25` correctly returns False for any positive short_entry_price. That was exactly the regression class this pass's own governing promise ('behavior on every valid input is byte-identical; only previously-invalid inputs now raise') rules out - 0.0 was always valid input, never invalid input this pass was entitled to newly reject. CORRECTED before landing: current_price now passes allow_zero=True, so only negative/NaN/inf current_price raise; short_entry_price correctly KEEPS allow_zero=False (a zero short-entry price is genuinely invalid - there is no such thing as shorting at a $0 entry). HARD SEMANTIC RULE HONORED (as corrected): behavior on every already-valid input to all three guards, INCLUDING current_price == 0.0, is byte-identical to before, and the SHORT_STOP_LOSS_PCT=0.25 trigger level itself is untouched. No entry/exit rule, threshold, indicator, router rule, sizing rule, or the short stop's 25% level is altered - only invalid-input handling changed, from a silent wrong answer to a clear, named ValueError, and current_price == 0.0 is explicitly PRESERVED as a valid, non-triggering input, not newly rejected. Regression tests at tests/test_strategy_math.py::test_b_event_reaction_rejects_nonfinite_base, test_b_short_stop_loss_rejects_nonfinite_or_negative_current_price (renamed from ...or_nonpositive_current_price; 0.0 removed from its reject list since 0.0 is valid, not invalid), test_b_short_stop_loss_current_price_zero_is_valid_not_triggered (NEW: pins `short_stop_loss_triggered(100.0, 0.0) is False`), test_b_short_stop_loss_rejects_nonfinite_entry. NOT a restart: is_restart_of and spec_locked_since deliberately untouched. Verified by scripts/check_roster_consistency.py R-F, ruff check, and the full pytest suite."
