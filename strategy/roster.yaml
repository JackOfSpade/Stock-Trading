        note: "spec_hash recomputed — Rev 43 (owner directive 2026-07-28): the fixed 2%-of-strategy-portfolio position size is RETIRED and replaced by THESIS-SCALED RISK BUDGETING. The AI now sets each thesis's Capital-at-Risk budget (justified against the seven-factor list in Experiment_Parameters.md rev 18 \u00a7Position size, recorded in the decision-log entry, and adversarially attacked on size as well as direction), bounded by hard envelopes: per-name aggregate CaR <= 10% of strategy portfolio across all tranches, per-strategy deployed CaR <= 75%. This IS a machinery change and is FUNDAMENTAL (it alters position-sizing methodology, one of the five material-structural-difference dimensions), applied through the unbounded owner-directive channel \u2014 explicitly NOT an AI_Trading_Foundation.md \u00a75.6a non-fundamental in-life edit. Rationale: (1) Rev 40's unbounded add-tranches had already destroyed the 2% rule's status as a per-name risk cap, leaving it asserting streak math the mechanism no longer delivered; (2) the experiment uses no price-based stop-losses, so the size decision IS the risk decision and a blanket number cannot express the differing risk of a tightly-falsifiable catalyst versus a diffuse multi-year thesis. The per-name envelope is what finally bounds Rev 40's adds \u2014 tranche COUNT stays uncapped, total RISK does not. strategy_math/common.py position_size_dollars and c_options_math.py size_position now REQUIRE an explicit budget (the 0.02 default was removed so a forgetful caller fails loudly instead of silently reinstating 2%) and both reject a budget above the 10% envelope. Verified by scripts/check_roster_consistency.py R-F and the full test suite."
