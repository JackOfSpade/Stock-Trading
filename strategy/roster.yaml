                                     #   entries can turn on single-day developments -> D1 + W3.
                                     #   long_horizon = multi-year thesis, entries do NOT turn on
                                     #   single-day developments (D's own documented rationale) -> Q2 +
                                     #   M3 instead, never D1/W3. New strategies default to `reactive`
                                     #   unless SL2 explicitly declares `long_horizon` in the draft (the
