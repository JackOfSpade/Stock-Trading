ames exactly which index and value is bad. AMENDED same day (adversarial review of this pass's OWN diff, before it landed): the guard as first written validated the entire `daily_close_prices` argument BEFORE the `[-31:]` slice, so a bad value strictly OUTSIDE the trailing 31-close window - previously discarded harmlessly, exactly as this function's own docstring documents (\"uses the most recent 31 closes\") - newly raised instead. That was exactly the regression class this pass's own governing promise ('behavior on every valid input is byte-identical; only previously-invalid inputs now raise') rules out: a value outside the window is never actually consumed by the computation, so it was never a genuinely invalid INPUT to what the function does. CORRECTED before landing: the guard now runs AFTER the slice, over `window` only, so an out-of-window bad value is explicitly PRESERVED as ignored, exactly as before this pass (reviewer-verified: `[0.0]*5 + [-10.0]*4 + [100.0+i for i in range(31)]` returns 0.01070060710530742 both pre-diff and post-fix). The error message still names the index into the ORIGINAL `daily_close_prices` list (via an offset), not a window-local index, so it stays unambiguous and directly usable against the caller's own list. HARD SEMANTIC RULE HONORED (as corrected): behavior on every already-valid (finite, in-range, non-empty) input to all four sites, INCLUDING a bad close strictly outside the trailing window, is byte-identical to before - no formula, threshold, constant, or default is touched, and the module's own self-test (`python c_options_math.py`, 16 checks) still passes unchanged. No entry criterion, exit rule, threshold, indicator, router rule, options order-guard, hedge-ratio rule, or kill criterion is altered - only invalid-input handling changed, from a silent wrong answer or unattributed downstream crash to a clear, named ValueError at the point of entry, and an out-of-window bad value is explicitly PRESERVED as ignored, not newly rejected. Regression tests at tests/test_options_math.py (test_optioninputs_rejects_nonfinite_underlying_price_strike_days, test_structure_rejects_empty_legs, test_size_position_rejects_nonfinite_or_nonpositive_max_loss, test_realized_vol_rejects_nonfinite_or_nonpositive_price (now documented as covering only the in-window case, since its list is too short to reach outside the window), and NEW test_realized_vol_ignores_bad_price_strictly_outside_trailing_31_window pinning the out-of-window-ignored behavior against both the exact reviewer-verified value and an equivalent unprefixed call). NOT a restart: is_restart_of and spec_locked_since deliberately untouched. Verified by scripts/check_roster_consistency.py R-F, ruff check, python c_options_math.py's self-test, and the full pytest suite."
