      + shadow + paper + probe + 30-trade graduation pipeline, exactly like D2a's autonomous cutover (§36),
      NOT a PR-gated change to a production trading CONSTANT. The compensating control replacing human PR
      review is that graduation pipeline plus the anti-churn/anti-runaway rails (concurrent-incubation cap
      k_incubate=2, one adoption per rolling quarter, roster floor N>=2 / ceiling N_max=8, cooldowns,
      default-REJECT adoption / default-KEEP retirement / default-HOLD out-of-table) and the
      ops.arsenal_control owner kill switch. CI consistency gate: scripts/check_roster_consistency.py.
    added: "2026-07-10"

