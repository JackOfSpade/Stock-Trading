# Autonomy-level register (2026-07-03, self-improvement audit — cross-cutting guard shared by all
# Phase-4/5 self-improvement loops per the adversarial-critique sequencing in the audit report).
#
# WHY THIS EXISTS: several loops proposed by the audit (the run_log process-reliability loop, the
# append-only strategy playbook, execution-quality rule tuning, the single-parameter calibration
# carve-out) each independently said "record-only first, then promote" — but a scattered, per-loop
# promotion decision is invisible drift. This file is the ONE checked-in register of every such loop's
# current stage, so "who turned this on and on what evidence" is a first-class, reviewable fact instead
# of a decision buried in a commit message or a routine's memory.
#
# STAGES (strictly increasing; a loop may only be promoted by editing this file in a commit whose
# message cites the evidence — e.g. "N clean weeks observed, see decision_log entry <id>"):
#   dormant        — scaffolding exists (tables/views/spec sections) but NOTHING reads or writes
#                    through it as part of normal routine operation. Safe to build ahead of activation.
#   shadow         — a routine computes what the loop WOULD do, logs it, but the result never changes
#                    live behavior (a "what if" burn-in).
#   record_only    — the loop's measurement view is read and reported (e.g. in a weekly digest) but no
#                    routine acts on it.
#   active_pr_gated — the loop's LLM-authored change flows through a GitHub PR requiring human review
#                    (never auto-merge-claude) before it affects behavior. This is the ceiling for any
#                    loop that touches strategy/process constants per the audit's own "no autonomy-
#                    increasing loop turns on until its compensating control is live and drilled"
#                    sequencing.
#                    SUPERSEDED AS A CEILING (rev 2026-07-10 — round-2 self-improvement autonomy conversion,
#                    owner directive + explicit confirmation): active_pr_gated is NO LONGER the terminal
#                    ceiling of any loop. It remains a describable pass-through STAGE (a loop may still be
#                    observed here transiently), but every loop's ceiling is now active_auto (see that stage's
#                    definition below and each loop's gate_to_next_stage). No self-improvement change requires
#                    a human-merged PR anymore; the compensating control is the loop's own data-sufficiency
#                    gate + audit trail, not human review.
#   active_auto    — the loop's change reaches live behavior WITHOUT a human PR review, gated instead
#                    by an in-band compensating control drilled to be at least as strong. AUTHORIZED for
#                    exactly one loop today — `strategy_arsenal` (autonomous strategy roster add/delete),
#                    by the owner's 2026-07-10 directive (rev 2026-07-10 — Strategy Arsenal autonomy
#                    conversion, owner directive; see ops/RUNBOOK.md §39). Its compensating control is NOT
#                    human PR review but the multi-scrutiny GRADUATION pipeline — a two-routine adversarial
#                    pre-mortem (AR_att/AR_orc) + a zero-capital SHADOW signals phase + a simulated-fill
#                    PAPER forward-test vs SGOV + the live $2,000 PROBE + the existing 30-trade gate —
#                    bounded by caps / rate-limits / default-no / default-KEEP / N-floor and the
#                    ops.arsenal_control owner kill switch, exactly the "compensating control is live and
#                    drilled" bar this register's own sequencing demands (the D2a auto-cutover precedent,
#                    RUNBOOK §36). GENERALIZED TO EVERY LOOP (rev 2026-07-10 — round-2 self-improvement
#                    autonomy conversion, owner directive + explicit confirmation): the owner's 2026-07-10
#                    directive — "there should be no more 'give results and wait for human review'; all
#                    remote routines should have a pathway to take action autonomously by AI without human
#                    intervention (except final order execution)" — together with the owner's explicit
#                    confirmation, when asked directly, that this INCLUDES removing the
#                    no_auto_merge_self_improvement guard for ALL self-improvement loops
#                    (calibration_parameter_carveout included), AUTHORIZE active_auto as the ceiling for
#                    EVERY loop in this register, not just strategy_arsenal. The prior RESERVED /
#                    "fail-SAFE-direction-only" restriction and the calibration_parameter_carveout
#                    active_pr_gated carve-out are SUPERSEDED by this rev. The compensating control that
#                    replaces human PR review is, for each loop, its OWN objective data-sufficiency readiness
#                    view (UNCHANGED — the evidence gate is preserved verbatim) + a durable idempotency
#                    marker + a self-executed commit/push (or live write) + an events.decision_log entry + an
#                    info-severity ops.alerts audit row + the meta_monitoring_heartbeat dead-man's switch —
#                    the D2a / strategy_arsenal skeleton (bigquery/37_self_improvement_autonomy.sql). A loop
#                    still may NOT self-apply until ITS OWN data gate clears; autonomy removes the human
#                    step, never the evidence bar. What is NOT relaxed: the mechanical kill triggers, the
#                    $2,000 probe-stake floor, the per-thesis risk-budget discipline (its hard envelopes
#                    RETIRED by owner directive 2026-08-05 - sizing is now numerically unconstrained;
#                    the DISCIPLINE, i.e. the seven-factor justification + adversarial size attack, remains)
#                    (Rev 43/EP rev 18, 2026-07-28 — the flat 2% figure is retired), and the IBKR
#                    order-confirm execution tap — all stand.
#
# PROMOTION RULE: no routine may treat a loop as being at a stage higher than what this file declares.
# If a routine's instructions (Claude_Task_Plan.md / Operating_Protocols.md) describe a behavior that
# would require a HIGHER stage than declared here, THIS FILE is wrong or stale — fix it before acting.

