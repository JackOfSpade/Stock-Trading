# Autonomy-level register (2026-07-03, self-improvement audit — cross-cutting guard shared by all
# Phase-4/5 self-improvement loops per the adversarial-critique sequencing in the audit report).
#
# WHY THIS EXISTS: several loops proposed by the audit (the run_log process-reliability loop, the
# append-only strategy playbook, execution-quality rule tuning, the single-parameter calibration
# carve-out) each independently said "record-only first, then promote" — but a scattered, per-loop
# promotion decision is invisible drift. This file is the ONE checked-in register of every such loop's
# current stage, so "who turned this on and on what evidence" is a first-class, reviewable fact instead
# of a decision buried in a commit message or a routine's memory.
#
# STAGES (strictly increasing; a loop may only be promoted by editing this file in a commit whose
# message cites the evidence — e.g. "N clean weeks observed, see decision_log entry <id>"):
#   dormant        — scaffolding exists (tables/views/spec sections) but NOTHING reads or writes
#                    through it as part of normal routine operation. Safe to build ahead of activation.
#   shadow         — a routine computes what the loop WOULD do, logs it, but the result never changes
#                    live behavior (a "what if" burn-in).
#   record_only    — the loop's measurement view is read and reported (e.g. in a weekly digest) but no
#                    routine acts on it.
#   active_pr_gated — the loop's LLM-authored change flows through a GitHub PR requiring human review
#                    (never auto-merge-claude) before it affects behavior. This is the ceiling for any
#                    loop that touches strategy/process constants per the audit's own "no autonomy-
#                    increasing loop turns on until its compensating control is live and drilled"
#                    sequencing.
#                    SUPERSEDED AS A CEILING (rev 2026-07-10 — round-2 self-improvement autonomy conversion,
#                    owner directive + explicit confirmation): active_pr_gated is NO LONGER the terminal
#                    ceiling of any loop. It remains a describable pass-through STAGE (a loop may still be
#                    observed here transiently), but every loop's ceiling is now active_auto (see that stage's
#                    definition below and each loop's gate_to_next_stage). No self-improvement change requires
#                    a human-merged PR anymore; the compensating control is the loop's own data-sufficiency
#                    gate + audit trail, not human review.
#   active_auto    — the loop's change reaches live behavior WITHOUT a human PR review, gated instead
#                    by an in-band compensating control drilled to be at least as strong. AUTHORIZED for
#                    exactly one loop today — `strategy_arsenal` (autonomous strategy roster add/delete),
#                    by the owner's 2026-07-10 directive (rev 2026-07-10 — Strategy Arsenal autonomy
#                    conversion, owner directive; see ops/RUNBOOK.md §39). Its compensating control is NOT
#                    human PR review but the multi-scrutiny GRADUATION pipeline — a two-routine adversarial
#                    pre-mortem (AR_att/AR_orc) + a zero-capital SHADOW signals phase + a simulated-fill
#                    PAPER forward-test vs SGOV + the live $2,000 PROBE + the existing 30-trade gate —
#                    bounded by caps / rate-limits / default-no / default-KEEP / N-floor and the
#                    ops.arsenal_control owner kill switch, exactly the "compensating control is live and
#                    drilled" bar this register's own sequencing demands (the D2a auto-cutover precedent,
#                    RUNBOOK §36). GENERALIZED TO EVERY LOOP (rev 2026-07-10 — round-2 self-improvement
#                    autonomy conversion, owner directive + explicit confirmation): the owner's 2026-07-10
#                    directive — "there should be no more 'give results and wait for human review'; all
#                    remote routines should have a pathway to take action autonomously by AI without human
#                    intervention (except final order execution)" — together with the owner's explicit
#                    confirmation, when asked directly, that this INCLUDES removing the
#                    no_auto_merge_self_improvement guard for ALL self-improvement loops
#                    (calibration_parameter_carveout included), AUTHORIZE active_auto as the ceiling for
#                    EVERY loop in this register, not just strategy_arsenal. The prior RESERVED /
#                    "fail-SAFE-direction-only" restriction and the calibration_parameter_carveout
#                    active_pr_gated carve-out are SUPERSEDED by this rev. The compensating control that
#                    replaces human PR review is, for each loop, its OWN objective data-sufficiency readiness
#                    view (UNCHANGED — the evidence gate is preserved verbatim) + a durable idempotency
#                    marker + a self-executed commit/push (or live write) + an events.decision_log entry + an
#                    info-severity ops.alerts audit row + the meta_monitoring_heartbeat dead-man's switch —
#                    the D2a / strategy_arsenal skeleton (bigquery/37_self_improvement_autonomy.sql). A loop
#                    still may NOT self-apply until ITS OWN data gate clears; autonomy removes the human
#                    step, never the evidence bar. What is NOT relaxed: the mechanical kill triggers, the
#                    $2,000 probe-stake floor, 2% sizing, and the IBKR order-confirm execution tap — all stand.
#
# PROMOTION RULE: no routine may treat a loop as being at a stage higher than what this file declares.
# If a routine's instructions (Claude_Task_Plan.md / Operating_Protocols.md) describe a behavior that
# would require a HIGHER stage than declared here, THIS FILE is wrong or stale — fix it before acting.

loops:
  - id: process_reliability          # WO-6: ops.run_log metrics -> W5 self-applied process-constant change
    stage: active_auto           # rev 2026-07-10b, code-review finding #7, owner-confirmed: was `dormant`
                                  # while ceiling was already `active_auto` — self-contradictory (this
                                  # file's own header defines dormant as "NOTHING reads or writes through
                                  # it", and its PROMOTION RULE forbids a routine acting above its declared
                                  # stage; the round-2 routine text DOES actively read/write + self-apply).
                                  # stage now matches ceiling, same as strategy_arsenal — the loop's OWN
                                  # readiness view (not a separate stage field) is what actually gates
                                  # whether it does anything on a given firing.
    ceiling: active_auto
    artifact: analytics.routine_health_scorecard (bigquery/27_process_reliability.sql) +
      state.process_reliability_readiness / ops.process_reliability_observations /
      ops.process_constant_change_log (bigquery/37_self_improvement_autonomy.sql)
    gate_to_next_stage: >
      DATA-SUFFICIENCY GATE (UNCHANGED, preserved): analytics.routine_health_scorecard must have >=3
      consecutive weeks of data for at least one routine (the loop's own natural N>=20 / 3-week floor, per
      its spec in Claude_Task_Plan.md W5), AND that routine's deadline-threat pattern (min_n_met=TRUE AND
      p90_completion_minute_of_day within ~90 min of a version-controlled deadline) must persist for 3+
      consecutive W5 cycles. AUTONOMOUS SELF-APPLY (rev 2026-07-10 — round-2 conversion, owner directive +
      explicit confirmation): once state.process_reliability_readiness.ready_for_change = TRUE, W5
      SELF-APPLIES the bounded process-constant change (edit the version-controlled deadline/threshold +
      check_cadence_consistency.py + commit + push, auto-merge on green CI), writes an
      ops.process_constant_change_log idempotency row, logs an events.decision_log entry, and raises an
      info-severity ops.alerts audit row — NO human-merged PR. The does-not-fire-on-noise check a human used
      to perform is now the objective 3-consecutive-cycle persistence assertion baked into the readiness
      view. Automated noise-check replaces human eyeballing; the evidence bar is unchanged.
    added: "2026-07-03"

  - id: strategy_playbook             # B-4-data: append-only self-authored playbook deltas
    stage: active_auto           # rev 2026-07-10b, code-review finding #7, owner-confirmed: was `dormant`
                                  # while ceiling was already `active_auto` — self-contradictory (this
                                  # file's own header defines dormant as "NOTHING reads or writes through
                                  # it", and its PROMOTION RULE forbids a routine acting above its declared
                                  # stage; the round-2 routine text DOES actively read/write + self-apply).
                                  # stage now matches ceiling, same as strategy_arsenal — the loop's OWN
                                  # readiness view (not a separate stage field) is what actually gates
                                  # whether it does anything on a given firing.
    ceiling: active_auto
    artifact: events.playbook_updates / state.active_playbook / state.strategy_playbook_readiness
      (bigquery/37_self_improvement_autonomy.sql; consumes analytics.calibration_shrunk +
      analytics.process_scorecard)
    gate_to_next_stage: >
      DATA-SUFFICIENCY GATE (UNCHANGED, preserved): do NOT write a playbook delta until (a)
      analytics.calibration_shrunk shows trustworthy_edge=TRUE for at least one conviction tier (currently
      FALSE for all tiers) AND (b) analytics.process_scorecard has min_n_met=TRUE on at least 2 of its 3
      metrics (state.strategy_playbook_readiness encodes both). SEPARATION-OF-DUTIES CONTROL (UNCHANGED,
      in-band, NOT human review): the delta's evidence-generating session and delta-writing session must be
      independent, OR the delta must pass the S-5 theater-judge review (bigquery/11_theater_judge.sql,
      judge_independent=TRUE) — an automated adversarial check recorded on the events.playbook_updates row,
      not a human sign-off. AUTONOMOUS SELF-APPLY (rev 2026-07-10 — round-2 conversion, owner directive +
      explicit confirmation): once state.strategy_playbook_readiness.ready_for_change = TRUE, the loop
      APPENDS the delta to events.playbook_updates (append-only = its own idempotency substrate), refreshes
      state.active_playbook, logs events.decision_log, and raises an info ops.alerts row — NO human-merged
      PR. Still explicitly the LAST loop to activate (its data gate is the strictest and is currently unmet);
      its ceiling is active_auto, not active_pr_gated.
    added: "2026-07-03"

  - id: execution_quality_tuning      # B-3/B-8-exec: slippage + fill-vs-expire rule tuning
    stage: active_auto           # rev 2026-07-10b, code-review finding #7, owner-confirmed: was `dormant`
                                  # while ceiling was already `active_auto` — self-contradictory (this
                                  # file's own header defines dormant as "NOTHING reads or writes through
                                  # it", and its PROMOTION RULE forbids a routine acting above its declared
                                  # stage; the round-2 routine text DOES actively read/write + self-apply).
                                  # stage now matches ceiling, same as strategy_arsenal — the loop's OWN
                                  # readiness view (not a separate stage field) is what actually gates
                                  # whether it does anything on a given firing.
    ceiling: active_auto
    artifact: analytics.execution_quality / state.execution_quality_readiness /
      ops.exec_rule_change_log (bigquery/37_self_improvement_autonomy.sql)
    gate_to_next_stage: >
      DATA-SUFFICIENCY GATE (UNCHANGED, preserved): not actionable at today's fill volume (~23 fills, mostly
      SGOV). Requires >=8 single-name (non-SGOV) fills with a consistent-sign slippage signal before any
      rule-tuning change (state.execution_quality_readiness enforces both the >=8-non-SGOV-fill floor and the
      sign-consistency test). Build order preserved: analytics.execution_quality (the measurement view)
      exists first; the tuning step only fires once the volume gate is met. AUTONOMOUS SELF-APPLY (rev
      2026-07-10 — round-2 conversion, owner directive + explicit confirmation): once
      state.execution_quality_readiness.ready_for_change = TRUE, the loop SELF-APPLIES the bounded
      execution-rule change (edit the version-controlled slippage / fill-vs-expire constant + commit + push,
      auto-merge on green CI), writes an ops.exec_rule_change_log idempotency row, logs events.decision_log,
      and raises an info ops.alerts row — NO human-merged PR.
    added: "2026-07-03"

  - id: calibration_parameter_carveout  # unified S-8 + B-8-obs: the ONE whitelisted self-updating parameter
    stage: active_auto           # rev 2026-07-10b, code-review finding #7, owner-confirmed: was `dormant`
                                  # while ceiling was already `active_auto` — self-contradictory (this
                                  # file's own header defines dormant as "NOTHING reads or writes through
                                  # it", and its PROMOTION RULE forbids a routine acting above its declared
                                  # stage; the round-2 routine text DOES actively read/write + self-apply).
                                  # stage now matches ceiling, same as strategy_arsenal — the loop's OWN
                                  # readiness view (not a separate stage field) is what actually gates
                                  # whether it does anything on a given firing.
    ceiling: active_auto
    artifact: state.calibration_param_registry / state.param_change_provenance /
      state.param_oos_degradation / state.calibration_param_readiness
      (bigquery/37_self_improvement_autonomy.sql)
    gate_to_next_stage: >
      DATA-SUFFICIENCY GATE (UNCHANGED, preserved): ship the provenance + OOS-degradation MONITOR views
      first and prove them on a shadow (paper) change before any real parameter write. The act-trigger is
      "the calibration_shrunk credible interval EXCLUDES the current ladder anchor's implied rate" — NOT a
      periodic re-match to the posterior (which would ratchet on noise while the interval is this wide);
      state.calibration_param_readiness encodes exactly this exclusion test plus the shadow-proven
      precondition. AUTONOMOUS SELF-APPLY (rev 2026-07-10 — round-2 conversion, owner directive + EXPLICIT
      confirmation that this loop is INCLUDED and that the no_auto_merge_self_improvement guard is removed
      for it): the prior "auto-CHANGE requires a human-merged PR, always" and "must be pre-mortem-reviewed
      by the owner before any table is even created" gates are REMOVED. Auto-REVERT stays autonomous
      (fail-safe direction, always allowed). Auto-CHANGE is now ALSO autonomous once
