      ops.process_constant_change_log (bigquery/37_self_improvement_autonomy.sql) +
      state.process_constant_oos_watch (bigquery/72_constant_tuning_oos_watch.sql — post-change OOS watch + auto-revert fail-safe, 2026-07-16)
