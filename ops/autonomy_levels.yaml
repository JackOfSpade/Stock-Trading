                                          # documented_not_enforced for the four constant-tuning loops;
                                          # that was already stale the moment those four were bumped to
                                          # stage:active_auto in this same file's rev 2026-07-10b —
                                          # active_auto loops with no heartbeat and no evaluating routine
                                          # at all is a worse gap than "no heartbeat yet")
    note: >
      Every loop above dormant should write an "evaluated this cycle" heartbeat (or an explicit
      decision_log "no change" entry) on every firing, with a scheduled-query dead-man's-switch
      alerting if the expected evaluation is missing — the same pattern ops.heartbeat already uses
      for the Apps Scripts (bigquery/16_automation_health.sql). LIVE for the strategy_arsenal loop (rev
      2026-07-10 — Strategy Arsenal autonomy conversion): SL1 (quarterly), SL4 (monthly), and SL3 (daily)
      each write a decision_log 'evaluated, no change' heartbeat every firing, and a scheduled-query
      dead-man's switch alerts if the expected quarterly / monthly / daily arsenal evaluation is missing.
      SL1/SL3/SL4 also register in the cadence dead-man views (bigquery/12 + 24) and the stalled-run guard
      (bigquery/18); the queue_driven SL2/SL5 register in bigquery/18 stalled_runs only (NOT 12/24, per the
      queue_driven rule). LIVE for the four constant-tuning loops as of rev 2026-07-11 (ITEM 11): before
      this rev they had NEITHER a heartbeat NOR any routine that ever evaluated their readiness views at
      all — declared active_auto with zero operational wiring, a real gap this rev closes, not merely a
      missing heartbeat. Claude_Task_Plan.md's W5 section now reads each of the four loops'
      state.*_readiness view every weekly cycle (self-applying the bounded change when ready, logging
      "not ready" otherwise) and writes `ops.heartbeat(source='loop:<id>')` unconditionally either way;
      `bigquery/scheduled_queries/cadence_check.sql` alarms (WARNING, self-bootstrapping — never fires
      before a loop's first-ever heartbeat) if a loop that has previously reported goes >10 days quiet.
