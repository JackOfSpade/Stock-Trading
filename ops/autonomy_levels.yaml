cross_cutting_guards:
  - id: no_auto_merge_self_improvement
    status: superseded_2026-07-10   # was documented_not_enforced; retired as a blocking guard (see note)
    note: >
      SUPERSEDED / RETIRED (rev 2026-07-10 — round-2 self-improvement autonomy conversion, owner directive +
      EXPLICIT confirmation). This guard NO LONGER requires human-merged-PR review for ANY self-improvement
      loop. The owner's 2026-07-10 directive ("there should be no more 'give results and wait for human
      review'; all remote routines should have a pathway to take action autonomously by AI without human
      intervention except final order execution") and the owner's explicit confirmation, when asked directly,
      that this INCLUDES removing THIS guard for ALL loops (calibration_parameter_carveout included) mean
      self-improvement commits are now auto-merge-eligible via .github/workflows/auto-merge-claude.yml on
      green CI, EXACTLY like Claude's routine commits. The sole compensating control is now each loop's own
      objective data-sufficiency readiness view (bigquery/37_self_improvement_autonomy.sql) + a durable
      idempotency marker + the audit trail (events.decision_log entry + info-severity ops.alerts row) + the
      meta_monitoring_heartbeat dead-man's switch — the D2a / strategy_arsenal precedent. There is no per-loop
      human-review label to enforce and nothing to exclude from auto-merge; the guard is RETIRED, not merely
      unenforced. What is NOT relaxed: the mechanical kill triggers, the $2,000 probe-stake floor, 2% sizing,
      and the IBKR order-confirm execution tap all remain fully in force (they are execution/capital gates,
      not review gates).
      --- HISTORICAL RATIONALE (2026-07-03 .. 2026-07-10, preserved per the Experiment_Parameters.md
      prior-revision convention; NO LONGER IN FORCE) ---
      Originally (documented_not_enforced): any GitHub PR authored by a self-improvement loop
      (process_reliability, strategy_playbook, etc.) must carry an explicit human-review requirement and must
      NOT be eligible for auto-merge-claude.yml — designed for Claude's own ROUTINE commits, not for a loop
      proposing a change to production trading constants; not yet enforced in CI; to be implemented before the
      first loop opened its first real PR. The 2026-07-10 Strategy Arsenal carve-out then exempted
      strategy_arsenal's SL1-SL5 routine commits (eligible for auto-merge on green CI incl.
      scripts/check_roster_consistency.py) while holding the four constant-tuning loops subject to the guard.
      Round-2 (this rev) extends that exemption to ALL loops, retiring the guard entirely.
  - id: meta_monitoring_heartbeat
    status: documented_not_enforced
    note: >
      Every loop above dormant should write an "evaluated this cycle" heartbeat (or an explicit
      decision_log "no change" entry) on every firing, with a scheduled-query dead-man's-switch
      alerting if the expected evaluation is missing — the same pattern ops.heartbeat already uses
      for the Apps Scripts (bigquery/16_automation_health.sql). LIVE for the strategy_arsenal loop (rev
      2026-07-10 — Strategy Arsenal autonomy conversion): SL1 (quarterly), SL4 (monthly), and SL3 (daily)
      each write a decision_log 'evaluated, no change' heartbeat every firing, and a scheduled-query
      dead-man's switch alerts if the expected quarterly / monthly / daily arsenal evaluation is missing.
      SL1/SL3/SL4 also register in the cadence dead-man views (bigquery/12 + 24) and the stalled-run guard
      (bigquery/18); the queue_driven SL2/SL5 register in bigquery/18 stalled_runs only (NOT 12/24, per the
      queue_driven rule). The four constant-tuning loops above remain dormant, so no heartbeat is expected
      from them yet.
