      compensating control replacing the owner pre-mortem / human-merged PR is the OOS-degradation kill
      (state.param_oos_degradation) — an automatic auto-REVERT if the changed parameter degrades
      out-of-sample (the fail-safe direction already blessed autonomous) — plus the shadow-prove
      precondition and the credible-interval-exclusion trigger. Still the highest-scrutiny loop with the
      narrowest data gate; its ceiling is active_auto.
    added: "2026-07-03"
  - id: strategy_arsenal              # SISA: autonomous strategy roster add/delete (ops/RUNBOOK.md §39)
