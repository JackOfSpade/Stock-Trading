      with a referee_concurs AND-condition, not yet applied)
    gate_to_next_stage: >
      DORMANT -> SHADOW: a routine (candidate: W5, mirroring its existing S-5 adversarial-independence-audit
      bullet) starts calling ops.sp_score_cross_model_referee() on a schedule and reporting referee-vs-
      orchestrator concurrence via an analytics.theater_check_calibration-style view — record-only, no
      readiness view yet reads referee_verdict, so live SISA decisions are unaffected during this stage.
      SHADOW -> ACTIVE_AUTO: burn in ONE FULL QUARTERLY CYCLE of observed concurrence (per
      ops/spikes/cross-model-adversarial-independence-2026Q3.md §6) before folding referee_concurs into
      state.strategy_adoption_readiness / state.strategy_retirement_readiness / state.
      foundation_change_termination_readiness as a fail-closed AND-condition (default 'MISSING' != the
      required verdict, so a not-yet-refereed review reads not-ready). NO human PR/chat gate at any stage —
      the compensating control for each promotion is the observed concurrence-rate evidence itself, logged
      to events.decision_log, exactly the same "record-then-promote-by-editing-this-register" discipline
      every other loop in this file follows. Promotion is a version-controlled edit to THIS file's `stage`
