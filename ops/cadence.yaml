# ---- WEB-UI TRIGGER AUDIT — 2026-07-10, RE-SPACED 2026-07-12 (Claude-in-Chrome + RemoteTrigger API,
# cross-checked against ops.run_log) ----
# ops/trigger_ids.json (added 2026-07-12) maps routine id -> live RemoteTrigger id (trig_...), so a
# session can call RemoteTrigger get/update/run directly instead of re-discovering IDs via
# Claude-in-Chrome each time. See that file's _meta for provenance/staleness caveats.
#
# 2026-07-16: Q4 step E now audits + self-corrects via RemoteTrigger get/update over
# ops/trigger_ids.json (each routine's structured `expected_trigger`, below, is the enforced
# source of truth); Chrome is fallback only. Schedule corrections are snapshot+partial-update+
# verify+rollback guarded (never a from-scratch schedule body), and are applied ONLY to the
# custom_cron cohort — a daily/weekly schedule drift is diff-only + an emailed warning, never a
# RemoteTrigger update. OPS0's STEP 3 runs the identical sweep weekly (Sundays only).
#
# CORRECTED 2026-08-01: that carve-out used to exclude 17 routines, on the reasoning that
# `RemoteTrigger get` renders a native Daily/Weekly picker as a fixed UTC cron while the live
# trigger is really DST-aware, so a raw-cron write would demote it. The premise was FALSE — the
# live API says every trigger is `created_via: "http_api"` with no timezone field anywhere in the
# schema, i.e. nothing in this fleet was ever DST-aware. Those 17 are now declared
# `recurrence: custom_cron` with their true `cron_utc`, so the sweep compares them verbatim and
# self-corrects them like any other. The daily/weekly branch is retained as a fail-safe in case a
# GUI-created trigger ever appears, not because one does today.
#
# Exact clock times below ARE enforced as of 2026-08-01: `cron_utc` is the source of truth and
# scripts/check_cron_dst_safety.py fails CI if a cron violates its monitor_class contract in either
# DST season, or if `time_local` disagrees with the cron's MDT rendering. `time_local` is therefore
# derived documentation — change `cron_utc`, and let the checker tell you what `time_local` must be.
# Values were read from each live trigger and, where history existed, cross-checked against real
# ops.run_log execution timestamps.
#
# 2026-07-12 INCIDENT: W2 and W4 (the two :30-minute-offset weekly triggers) silently no-showed
# 2026-07-12 — zero ops.run_log rows, no self-heal marker, "next run" jumped straight to the
# following Sunday — while W1/W3/W5 (the :00-minute triggers) fired normally within the same hour.
# 13 prior weeks (2026-04-19..2026-07-05) had zero gaps for any of W1-W5, so this wasn't a chronic
# flake. Root cause is opaque (Anthropic cloud trigger infra, no log access from this repo) but the
# same audit also found the weekly block was NOT the only collision risk: quarterly Q1/Q2/Q3
# exactly coincided with daily AR_orc/SL2/SL3 (6/7/8 PM MT) on every quarter-start date, and SL4 sat
# only 5 min after M5. Re-spaced the whole non-daily schedule below to remove every exact collision
# and land routines that share a possible calendar day on the same day at least 30 min apart
# (financial/trading risk was zero throughout — state.system_health stayed green; only the weekly
# research/analytics chain stalled, recovered via manual `RemoteTrigger run` on W2 then W4).
# Watch-trigger: if a `:00`-minute-offset routine ALSO silently no-shows on a future date, that's
# the signal this is a genuine platform bug worth filing with Anthropic, not schedule tuning.
#
# 2026-08-01 RUNTIME-BASED RE-SPACING (D2a, AR_att, AR_orc, D3, SL2, SL5, OPS1, A1, A2, A3).
# Measured every
# routine's real duration from ops.run_log (started -> next terminal row, per routine, MDT season)
# and removed every slot where a predecessor's p90/max finish ran past the next routine's start:
#   * D2a 4:20 -> 4:40 PM. D1 p90 27 min / max 31 min from a 4:00 PM start finishes 4:31, so the old
#     4:20 slot started D2a while D1 was still running on ~1 day in 4.
#   * AR_att 5:30 -> 6:00 PM, AR_orc 6:00 -> 6:20 PM, D3 6:30 -> 6:45 PM, SL2 7:00 -> 7:05 PM,
#     SL5 7:15 -> 7:25 PM. D2 p90 21 min / max 38 min from 5:15 PM finishes 5:36-5:53; the old 5:30
#     AR_att overlapped it routinely -- 2026-07-30 is on the record with D2 completing 17:38:15 and
#     AR_att starting 17:38:14, a 1-second miss. The rest of the evening chain then shifts to stay
#     clear at OBSERVED-MAX, not just p90: AR_orc depends_on [AR_att], and AR_att's max is 16 min
#     (vs 1 min p90), so a 15-min gap could have hard-stopped AR_orc on its own dependency gate.
#     Gaps now cover every routine's worst recorded run: AR_att 20m, AR_orc 25m, D3 20m, SL2 20m.
#   * OPS1 7:00 -> 6:30 AM. OPS1 is daily and M2 is monthly-on-the-1st, and BOTH sat on 13:00 UTC --
#     an exact same-minute collision every 1st of the month. OPS1 is the flexible one (a 2-min
#     read-only probe), so it moved rather than breaking the monthly cohort's hourly ladder.
#     6:30 AM MDT / 5:30 AM MST is still pre-market and still ~9.5h ahead of the daily cadence.
#   * A1/A2/A3 -- see the annual block below.
# Everything else measured clean and was deliberately left alone (D1, D2, SL3, OPS2, OPS0, W5,
# M1a-M5, SL4, Q1-Q4, SL1). Do NOT "restore" the old times without re-measuring: the gaps are
# runtime-derived, not aesthetic.
#
# W1-W4 RETIMED 2026-08-01 (DST day-boundary defect, NOT a runtime measurement):
#   W1 `0 6`->`30 7`, W2 `0 7`->`0 8`, W3 `0 8`->`0 9`, W4 `0 9`->`30 9`. W1's old cron was
#   Sunday 00:00 MDT but SATURDAY 23:00 MST, and bigquery/114 buckets monitor_class weekly_sun by
#   the Sunday of the run week -- so from 2026-11-08 W1's run_date would have sat outside its own
#   period window every week, hard-blocking W4 (depends_on [W1,W2,W3]) and tripping period_watch.
#   W2-W4 moved only to keep the chain ordered behind W1 with gaps >= each predecessor's OBSERVED
#   MAX (W1 15m, W2 29m, W3 9m, W4 13m over 180d). W5 already landed Sunday in both seasons and
#   did not move. New MST renderings are 00:30/01:00/02:00/02:30/03:00 -- >= 30 min clear of the
#   Saturday boundary, which matters because observed trigger jitter runs several minutes LATE.
#
# THE WHOLE FLEET IS FIXED-UTC, and always was. Verified 2026-08-01 against the live API: every
# trigger reports `created_via: "http_api"` and the trigger schema carries NO timezone field at all.
# Earlier revisions of this file described a DST-aware "native Daily/Weekly picker" cohort; that
# cohort does not exist. Consequences, all deliberate: schedules are version-controlled and
# API-manageable, ops/routine_backup.json restores them losslessly, DST transitions can never skip
# or double-fire a run (a UTC instant is unambiguous), and Q4 step E / OPS0 STEP 3 -- which only
# self-correct `recurrence: custom_cron` -- now reach every routine instead of the 15 they used to.
# The price is that a fixed-UTC cron slides 1h EARLIER in local terms under MST, so any constraint
# expressed in LOCAL time can hold in summer and break in winter. That has bitten twice (OPS2 vs the
# 21:00 MT deadline, 2026-07-27; W1 vs the Sunday boundary, above), so it is now mechanical:
# scripts/check_cron_dst_safety.py renders every cron in both seasons and fails CI on a violation.
# It also enforces that `time_local` is the MDT rendering for EVERY routine -- the old OPS2
# split-convention trap (its time_local was the MST reading) is fixed, not just documented.
#
# DAILY (the platform's native Daily/Weekdays picker IS genuinely DST-aware — shows "MDT"/"MST") —
# UNCHANGED 2026-07-12: no exact collisions found here, and gaps are deliberately telemetry-tuned
# (see D2/D2a note below), so widening to 1hr would only push SL3 into the new W1 Sunday slot:
#   D1 4:00 PM MT · D2a 4:40 PM MT · D2 5:15 PM MT (widened from 4:30 PM 2026-07-10 — D2a's real
#     completion time varies 6-17+ min in ops.run_log; the old 10-min gap was too thin) · D3 6:45 PM MT ·
#     SL3 8:00 PM MT · AR_att 6:00 PM MT · AR_orc 6:20 PM MT · SL2 7:05 PM MT · SL5 7:25 PM MT ·
#     OPS0 10:30 PM MDT / 9:30 PM MST (04:30 UTC FIXED cron, not the native DST-aware picker — resilience
#     audit 2026-07-16, RES-1/OAE-1 merge; deliberately inside the 21:00-24:00 Denver daily-miss
#     visibility window year-round, bigquery/48_cadence_monitor_unbounded.sql:52-59, and clear of the
#     05:15 UTC cadence_check scheduled-query snapshot) — pending owner creation, see OWNER_ACTIONS.md §A
#
# WEEKLY (native Weekly picker, DST-aware) — RE-SPACED 2026-07-12, now a full 1hr apart (was 30 min;
# see incident note above). W1 unchanged, W2-W5 moved:
#   W1 12:00 AM MT Sun · W2 1:00 AM MT Sun (was 12:30 AM) · W3 2:00 AM MT Sun (was 1:00 AM) ·
#   W4 3:00 AM MT Sun (was 1:30 AM) · W5 4:00 AM MT Sun (was 2:00 AM)
#   D1/D2a/D2/SL3 intentionally still fire on weekends/holidays (recurrence type "Daily", not
#   "Weekdays") — confirmed via real weekend runs (2026-06-20/21, 2026-07-04/05) that they self-detect
#   the non-trading day and complete cheap, safe, idempotent work (D1 catches weekend geopolitical
#   news relevant to Monday's open; D2/D2a run harmless broker/cash reconciliation). Do NOT switch
#   these to "Weekdays" — that would remove working, valuable behavior, not fix a bug.
#
# MONTHLY/QUARTERLY/ANNUAL (forced onto raw "Custom" cron — confirmed 2026-07-10 the platform's
# recurrence-type options are ONLY Once/Hourly/Daily/Weekdays/Weekly/Custom, no month-of-year option
# exists — so these have NO timezone concept, just a fixed UTC hour. PERMANENT PLATFORM LIMITATION,
# not a bug to keep re-investigating; revisit only if the platform ever adds a DST-aware monthly type):
#   M1a 5:00 AM MT · M1b 6:00 AM MT · M2 7:00 AM MT · M3 8:00 AM MT · M4 9:00 AM MT · M5 10:00 AM MT ·
