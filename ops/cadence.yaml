# Watch-trigger: if a `:00`-minute-offset routine ALSO silently no-shows on a future date, that's
# the signal this is a genuine platform bug worth filing with Anthropic, not schedule tuning.
#
# 2026-08-01 RUNTIME-BASED RE-SPACING (D2a, AR_att, AR_orc, D3, SL2, SL5, OPS1, A1, A2, A3).
# Measured every
# routine's real duration from ops.run_log (started -> next terminal row, per routine, MDT season)
# and removed every slot where a predecessor's p90/max finish ran past the next routine's start:
#   * D2a 4:20 -> 4:40 PM. D1 p90 27 min / max 31 min from a 4:00 PM start finishes 4:31, so the old
