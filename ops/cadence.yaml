# Cadence manifest — the version-controlled source of truth for WHAT runs WHEN.
#
# WHY THIS EXISTS: each routine is a Claude-Code-on-Web session whose trigger/schedule
# lives only in the web UI — unversioned, invisible, un-reviewable, a single point of
# failure. This file makes the cadence reviewable and gives the freshness monitor
# (state.freshness / ops.run_log) something to check missed runs against.
#
# It does NOT execute anything by itself. Keep it in sync with the web-trigger config
# and with Claude_Task_Plan.md. Times are America/Denver (the experiment's operating tz);
# "trading_day" means gate on state.trading_day_today.is_trading_day.
#
# Every routine should, at start/end, CALL ops.sp_routine_start / ops.sp_routine_end (one-call
# wrappers over ops.sp_log_run, plus a dependency gate) so ops.run_log records the run and
# state.cadence_watch can flag a missed one (P1-1 / A3 / C1). Data currency is also proven
# independently by state.freshness.marks_fresh/engine_fresh (data tables, not run_log). See ops/RUNBOOK.md §7/§13 +
# bigquery/12_cadence_monitor.sql. This manifest's `depends_on` (below) is the source for each
# routine's <deps> argument to sp_routine_start.

timezone: America/Denver

# MODEL OF RECORD for the remote-routine fleet (owner directive 2026-07-28).
#
# THE OWNER PICKS THE MODEL; ROUTINES DO NOT INFER IT. Every remote routine runs on the SAME model —
# that is a standing invariant, not a per-routine setting — and this key is the version-controlled
# record of which one. It is set from the web-UI RemoteTrigger configuration the owner actually chose,
# NOT from whatever model happens to be newest.
#
# WHY THIS EXISTS: `AI_Trading_Foundation.md`'s in-use-Claude-version field drives the Part 4
# version-change protocol (which Tier 2 magnitudes flip to version-pending, and which model's
# capability research is even relevant). Before 2026-07-28 the only in-repo trace of the configured
# model was a prose comment in OWNER_ACTIONS.md and an aside in the OPS2 slice, so A1/Q3 had no
# authoritative field to read and risked anchoring the foundation to the current FRONTIER model
# instead of the DEPLOYED one. Those are routinely different: as of 2026-07-28 Anthropic's most
# capable widely-released model was `claude-fable-5` (model-id-exempt — illustrative, not a fleet
# assertion), while the configured fleet model was the one below — anchoring to the frontier would
# have made the entire foundation document describe a model this experiment does not run.
#
# KEEP IN SYNC: when the owner changes the model on the triggers, update this key in the same pass.
# A1/Q3 read it as the in-use model of record; if it ever disagrees with the live trigger config,
# the live trigger config wins and this key is the thing that is stale.
routine_model: claude-opus-5

# Cadence-watch deadline guard (added 2026-06-25, RUNBOOK §1 step 3). state.cadence_watch.needs_attention
# only alarms a missed DAILY routine (D1/D2/D3) AFTER this America/Denver wall-clock time — past the
# routines' real after-close completion (D2 ~17:47, D3 ~18:36) yet before the 05:15 UTC / 23:15 MT
# scheduled cadence_check — so an off-schedule/manual run BEFORE the routines run can't false-fire a
# missed_run CRITICAL, while a GENUINE miss still fires at the scheduled run. MUST equal the TIME literal
# in bigquery/12_cadence_monitor.sql (state.cadence_watch); CI enforces it via
# scripts/check_cadence_consistency.py. QUOTE it — an unquoted 21:00 is parsed by YAML as base-60 (=1260).
cadence_watch_deadline_local: "21:45"

# Period-miss grace windows (added 2026-07-03, self-improvement audit WO-1/B-6-obs). Declares WHEN a
# weekly/monthly/quarterly/annual routine counts as "missed for the current period" in
# state.cadence_period_watch (bigquery/24_cadence_period_watch.sql) — a grace deadline placed strictly
# AFTER the documented tolerance so a routine that ran on its normal day never false-alarms. Value is
# the Nth TRADING DAY of the period by which the routine must have completed (weekly_sun is calendar
# days from that week's Sunday, since weeklies tolerate "Sunday OR Monday", not a trading-day count).
# MUST match the OFFSET/day-count literals in bigquery/24_cadence_period_watch.sql; CI enforces it via
# scripts/check_cadence_consistency.py (check E).
period_grace_days:
  weekly_sun: 1      # Monday (1 calendar day after the period's Sunday)
  monthly_ftd: 3     # 3rd trading day of the month
  quarterly_ftd: 3   # 3rd trading day of the quarter
  annual_ftd: 5      # 5th trading day of the year

defaults:
  log_run: true            # BEST-EFFORT, wrapped so it can never abort the routine: CALL ops.sp_routine_start(<id>,<run_date>,<session>,<branch>,<verbatim trigger instruction>) at start; ops.sp_routine_end(...,'completed'|'failed'|'halted',...) at end (templates in Claude_Task_Plan.md "Observability"). instruction -> ops.run_log.instruction -> state.routine_last_instruction (verify live triggers by query; diff vs scripts/print_routines.py).
  dep_gate: true           # SEPARATE + FATAL (not wrapped): action routines CALL ops.sp_assert_deps(<id>,<depends_on below>,<run_date>) BEFORE the start-log; aborts on a missing monitored upstream (self-bootstrapping)
  on_hard_stop: raise_alert # CALL ops.sp_raise_alert -- delivered via alert_emailer.gs's email poll of ops.alerts. No calendar event for an ordinary hard stop since the 2026-07-09 calendar-scope narrowing (Operating_Protocols.md); the sole surviving calendar exception is a BigQuery-unreachable RE-AUTH pre-flight, since sp_raise_alert itself can't run when BigQuery is down.

# SINGLE-SOURCE THE CADENCE (added 2026-06-22). Each routine carries an explicit `monitor_class`
# — the canonical cadence bucket that state.cadence_expected_today (bigquery/12_cadence_monitor.sql)
# encodes in SQL. This file is the SOURCE OF TRUTH for that mapping; the SQL must agree with it, and
# scripts/check_cadence_consistency.py (CI) FAILS the build if it drifts — so the hand-kept SQL list,
# the ops.routine_catalog seed, and this manifest can no longer silently diverge (the recurring
# RUNBOOK §22-class problem). Allowed monitor_class values:
#   daily_trading  : every trading day               (alarmed in state.cadence_watch)
#   daily_all      : every calendar day              (alarmed)
#   weekly_sun     : Sundays                          (visible, not alarmed — inferred run-day)
#   monthly_ftd    : first trading day of the month   (visible, not alarmed)
#   quarterly_ftd  : first trading day of the quarter (visible, not alarmed)
#   annual_ftd     : first trading day of the year    (visible, not alarmed)
#   queue_driven   : fires only when a queue entry is due — NOT calendar-predictable, so deliberately
#                    EXCLUDED from state.cadence_expected_today (the adversarial AR routines).
#
# SINGLE-SOURCE catchup_safe (added 2026-07-16, ARCH-3 Item 30b). Each routine also carries an explicit
# `catchup_safe: true|false` boolean — a DECLARED capital-adjacency judgment (never derived from
# monitor_class, which classifies by schedule SHAPE only), reproducing bigquery/31_catchup_notify.sql
# and bigquery/59_catchup_autofire.sql's hand-maintained catchup-safe UNNEST lists byte-for-byte in set
# terms: `true` means a late/catch-up run of this routine reproduces exactly what a same-day run would
# have produced (no live-order-crafting / intraday-price dependency) — D1/D3/SL3 (daily tier) and
# W1/W2/W3/W5, M1a/M1b/M2/M3/M5, Q1/Q2/Q3/SL1, A1/A2 (period tier). `false` means the routine crafts
# orders off live intraday quotes or is otherwise capital-adjacent — D2/D2a, W4/M4/Q4/A3/SL4 (the
# action-conversion + discretionary-retirement routines), SL2/SL5 (queue-driven SISA authoring/roster
# routines — never calendar-predictable so never catchup-eligible either way), AR_att/AR_orc
# (queue-driven adversarial reviews), and OPS0 (the auto-refire dispatcher itself — re-firing the
# watchdog that re-fires others is out of scope). scripts/check_cadence_consistency.py (CI) — check K —
# requires every routine to declare this key AND requires bigquery/31 and 59's UNNEST lists to equal
# the corresponding {catchup_safe AND monitor_class in <tier>} subset of this manifest, so a routine
# added here without an explicit catchup_safe (or added to 31/59 without a matching declaration here)
# fails the build instead of drifting silently. scripts/gen_routine_lists.py does NOT generate 31/59's
# lists (they stay hand-kept per-file, CHECKED not GENERATED — see bigquery/31 and 59's headers) since
# the capital-adjacency judgment is a human declaration, not a mechanical derivation from monitor_class.

routines:
  # ---- DAILY (every trading day, after the close) ----
  #
  # THE MARKET CLOSE IS 14:00 MT, YEAR-ROUND. Stated explicitly because it has been misread:
  # the close is 16:00 America/New_York (bigquery/03_twr_engine.sql:64, "09:30-16:00 ET"), and
  # Mountain is ALWAYS Eastern minus two hours -- both zones switch DST on the same dates, so the
  # offset never varies. There is no "16:00 MT close". A fixed-UTC daily that renders 15:00 MST in
  # winter therefore runs an HOUR AFTER the close, not before it: D1's 32 observed starts over the
  # last 120 days run 16:04-17:14 MT, roughly two hours past close. scripts/check_cron_dst_safety.py
  # enforces the real window (after 14:00 MT, before the 21:00 MT cadence_watch deadline) for every
  # monitor_class: daily_trading routine in BOTH seasons, so this no longer rests on reading a comment.
  - id: D1
    name: Market Development Scan
    schedule: "after_close trading_day"   # ~16:10 MT
    monitor_class: daily_trading
    catchup_safe: true
    depends_on: []
    writes: [Daily.md, events.decision_log, events.regime_events, ops.heartbeat, state.strategy_candidates]
    expected_trigger:
      recurrence: custom_cron
      cron_utc: "0 22 * * *"
      time_local: "16:00"
      enabled: true
  - id: D2a
    name: Broker Reconcile & Snapshot
    schedule: "after_close trading_day, before D2"
    monitor_class: daily_trading
    catchup_safe: false
    depends_on: []   # deliberately independent of D1 -- the book must reconcile even if D1 failed
    writes: [events.trade_fills, events.position_events, events.daily_marks, perf.strategy_daily,
             ops.account_snapshot, events.signal_marks]
    expected_trigger:
      recurrence: custom_cron
      cron_utc: "40 22 * * *"
      time_local: "16:40"
      enabled: true
    notes: >
      CUT OVER 2026-07-09 (autonomous, performed by D2a itself after 3 distinct trading-day completed runs
      with no prior cutover logged; ops.d2a_cutover_log + an INFO-severity ops.alerts 'auto_cutover' row are
      the record -- no chat question was raised). D2a owns the mechanical broker-reconcile /
      cash-tripwire / park-sweep / TWR-engine-maintenance (Step 0/0b/PER-STRATEGY PERFORMANCE MAINTENANCE),
      split out of D2's analysis-heavy action-conversion so a D2 halt can never also stall fills
      reconciliation, cash safety, or the engine. D2 now depends_on [D1, D2a] (flipped by that cutover).
      Runs every trading day, before D2, independent of D1. PARK-SWEEP AMENDED 2026-07-26 (owner
      directive): D2 now crafts BOTH legs of a park switch in its own session, sizing the BUY off the
      expected proceeds of the paired in-flight SELL (Operating_Protocols.md 13.E PAIRED-ROTATION
      EXCEPTION), so D2a's park-sweep is the BACKSTOP for both legs -- re-craft either leg whose DAY
      order expired unfilled, deploy the slippage-haircut residual -- and is no longer the owner of the
      BUY side. Its cover test now reads bridge_adjusted_settled_cash, never raw settled_cash.
  - id: D2
    name: Daily Action Conversion
    schedule: "after D1 trading_day"
    monitor_class: daily_trading
    catchup_safe: false
    depends_on: [D1, D2a]
    # Watchlist.md added 2026-07-29 (OPS0 STEP 4f): D2 has written it in 20/37 of its commits
    # (5/5 in the trailing week) since 2026-05-09 while declaring no repo path at all, which made
    # OPS0's unlanded-completed-run detector skip the fleet's highest-frequency routine entirely.
    # STEP 4f consumes the repo-file entries of this list as its git-evidence surface -- keep it real.
    writes: [events.decision_log, events.queue_events, events.position_events, calendar:confirm_order,
             events.park_policy_changes, Watchlist.md]
    expected_trigger:
      recurrence: custom_cron
      cron_utc: "15 23 * * *"
      time_local: "17:15"
      enabled: true
    notes: "CUT OVER 2026-07-09 (autonomous, by D2a; ops.d2a_cutover_log). D2 no longer runs Step 0/0b/TWR-maintenance -- those (broker reconcile + cash tripwire + park sweep, ops.account_snapshot, CALL ops.sp_daily_refresh()) now run in D2a, on which D2 now depends. D2 keeps its own freshness-inclusive trading-enable gate (safe now that D2a made marks/engine fresh), but as of 2026-07-27 it READS state.trading_enabled non-fatally at that point and enforces the verdict at each individual order-craft point, instead of calling ops.sp_assert_trading_enabled('D2') and aborting the whole routine on FALSE. The PENDING_ANALYSIS drain and the non-staging conversion work now run regardless; only order crafting and ORDER_STAGED writes are blocked while the gate is FALSE."
  - id: D3
    name: Calendar & Queue Hygiene
    schedule: "after D2 daily"             # runs daily incl. non-trading days for queue/calendar upkeep
    monitor_class: daily_all
    catchup_safe: true
    depends_on: [D2]
    writes: [calendar:confirm_order, events.queue_events, AI_Trading_Foundation.md]
    expected_trigger:
      recurrence: custom_cron
      cron_utc: "45 0 * * *"
      time_local: "18:45"
      enabled: true
  - id: OPS0
    name: Cadence Watchdog
    schedule: "after D3 daily"             # runs daily incl. non-trading days; deliberately after D3
                                            # so a same-evening D3 catch-up-eligible miss (if any) is
                                            # already reflected before OPS0 sweeps
    monitor_class: daily_all
    catchup_safe: false
    depends_on: []          # DELIBERATELY independent -- this routine's job is to unblock others; a
                             # dependency on anything would recreate the exact failure class it exists
                             # to fix (self-improvement audit 2026-07-15, CONFIRMED GAP
                             # catchup-notify-no-auto-refire; Architect recommendation #1)
    writes: [ops.catchup_refire_log, events.decision_log, ops.alerts, ops/cadence.yaml, ops/trigger_ids.json]
                             # ops.alerts also carries STEP 4's stranded_branch / stranded_branch_adopted /
                             # unlanded_completed_run categories, and events.decision_log the
                             # stranded-branch-adoption + unlanded-completed-run entry_types
                             # (landing-hardening 2026-07-29). STEP 4d adoption additionally writes
                             # ops.routine_commit_markers and may merge arbitrary NON-excluded repo files
                             # from an adopted branch onto OPS0's own branch (bigquery/*.sql, dbt/** and
                             # the spec-locked strategy surfaces are hard-excluded -- see STEP 4d).
    expected_trigger:
      recurrence: custom_cron
      cron_utc: "30 4 * * *"
      time_local: "22:30"          # fixed 04:30 UTC cron (trig_018zZNYXYmgkqbmcfzss1YjU, created
                                    # 2026-07-17, recreated 2026-08-01) -- NOT the DST-aware native picker, so this is
                                    # 10:30 PM MDT / 9:30 PM MST depending on season, deliberately
                                    # after D3's ~18:36 MT completion (see RUNBOOK cadence note)
      enabled: true
    notes: >
      Meta-repair / cadence-dispatcher routine (added 2026-07-15). Reads
      state.catchup_refire_readiness (bigquery/59_catchup_autofire.sql) and calls
      RemoteTrigger run(<trigger_id>) for every catchup-safe daily/period miss not yet auto-attempted
      today -- the daily D1/D3/SL3 tier plus the period-tier research/consolidation routines
      (W1/W2/W3/W5, M1a/M1b/M2/M3/M5, Q1/Q2/Q3/SL1, A1/A2). NEVER re-fires D2/D2a/W4/M4/Q4/A3/SL4 (the
      order-crafting / capital-adjacent routines) -- those keep their existing human-visible
      missed_run/period_missed alert only. Idempotent via ops.catchup_refire_log (one attempt per
      miss_key, ever). No chat question, ever. STEP 4 (landing-hardening 2026-07-29) adds a daily GIT
      LANDING SWEEP: detects claude/* branches stranded >6h unmerged into origin/main (CI-red or
      merge-conflict) and raises a deduped 'warning'/stranded_branch alert. Where all six STEP 4d
      preconditions hold (clean worktree; no hard-excluded path; unambiguous merge; no conflict
      residue; the local credential-free CI subset passing on the RESOLUTION; immediate push) it also
      ADOPTS the stranded branch onto OPS0's own branch so the work reaches main with no human --
      otherwise it aborts cleanly and leaves the branch for the human PR path. STEP 4f separately
      checks, on git evidence (not commit markers), for runs that logged 'completed' but whose repo
      output never reached main, raising 'warning'/unlanded_completed_run. Never 'critical': neither
      category is in bigquery/107's blocking-criticals exclusion list, so a critical would gate
      state.trading_enabled.
  - id: OPS1
    name: Morning Connector Liveness Probe
    schedule: "pre-market, ~9.5h before the 16:10-17:15 MT daily cadence"
    monitor_class: daily_all
    catchup_safe: true      # a late probe still helps; a missed one is covered next morning
    depends_on: []           # DELIBERATELY independent, same rationale as OPS0 -- a probe that exists
                              # to catch an auth failure early must never itself be blocked by one
    writes: [ops.alerts]
    expected_trigger:
      recurrence: custom_cron
      cron_utc: "30 12 * * *"
      time_local: "06:30"          # fixed 12:30 UTC cron (trig_012jxpUDFsrTR5FnSRmnxej4, recreated
                                    # 2026-08-01) -- NOT the DST-aware native picker, so this drifts to
                                    # 05:30 MST in winter, which is fine -- still hours ahead of the
                                    # 16:10-17:15 MT daily cadence either way
      enabled: true
    notes: >
      Pre-market connector-auth early warning (owner-approved 2026-07-19, after an IBKR OAuth expiry
      was discovered only at D2a's 16:20 MT pre-flight and cascaded into a halted evening -- see
      ops/RUNBOOK.md §15b). Probes IBKR/Calendar/FMP/Gmail read-only and raises
      connector_reauth_needed on an auth-class failure, hours before the daily cadence needs any of
      them live. Detection-only -- never refires, stages, or writes repo files.
  - id: OPS2
    name: Catch-up Executor
    schedule: "after the daily chain, before OPS0's 22:30 sweep"   # runs daily incl. non-trading days
    monitor_class: daily_all
    catchup_safe: false      # a catch-up executor must never itself be auto-caught-up (same as OPS0)
    # ops.run_log CANNOT PROVE THIS TRIGGER FIRED (learned the hard way 2026-07-28). OPS2's SAME-DAY
    # DOUBLE-RUN GUARD (task_plan/OPS2.md, the generalized guard bullet) runs FIRST, BEFORE run-logging,
    # and on finding OPS2 already completed today it ends immediately and deliberately writes NO
    # started/completed row. So a scheduled fire that lands on a day OPS2 already ran (e.g. after a manual
    # smoke test) leaves ZERO trace in ops.run_log. On 2026-07-28 an interactive session read that absence
    # as "the trigger has never fired", raised a trigger_never_fired alert, and began building a
    # run_log-derived "trigger never fired on schedule" detector -- all wrong: Claude-in-Chrome confirmed
    # in claude.ai/code/routines that the trigger is ACTIVE, on the correct cron, and had COMPLETED its
    # 2026-07-27 22:15 scheduled fire. The alert was retracted and the detector abandoned, because no
    # check inferring trigger health from ops.run_log alone can distinguish "never fired" from "fired and
    # was correctly guard-suppressed". VERIFY A TRIGGER IN THE ROUTINES CONSOLE, NOT THE DATABASE.
    depends_on: []           # DELIBERATELY independent, same rationale as OPS0 -- a routine that exists to
                             # recover others must never be blocked by a missing dependency
    writes: [ops.run_log, ops.catchup_refire_log, events.decision_log, ops.alerts]
    expected_trigger:
      recurrence: custom_cron
      cron_utc: "15 4 * * *"
      time_local: "22:15"          # AFTER the 21:00 MT needs_attention deadline (bigquery/48:56) and
                                    # BEFORE OPS0's 04:30 UTC, in BOTH seasons (22:15 MDT / 21:15 MST)
                                    # -- DST-robust, retimed by owner 2026-07-27 (was `0 3 * * *`, which
                                    # fell to 20:00 MST in winter, before the deadline).
                                    # NOTE 2026-08-01: this field read "21:15" (the MST rendering) while
                                    # every other routine's time_local is the MDT rendering. That split
                                    # convention was the documented trap for anything deriving a UTC cron
                                    # from time_local. Normalized to MDT and now ENFORCED for every
                                    # routine by scripts/check_cron_dst_safety.py, so the trap is retired
                                    # rather than merely described.
      enabled: true                # LIVE 2026-07-27: owner created OPS2 (recreated 2026-08-01 after
                                    # an accidental deletion; live id trig_01YSwsMubckdarNX9Z8yb4eX)
                                    # (cron 15 4 * * * = ~21:15 MT, retimed 2026-07-27 for DST-robustness;
                                    # model claude-opus-5); trig_id recorded in ops/trigger_ids.json.
                                    #
                                    # STANDING ADDENDUM DELIBERATELY OMITTED (owner-confirmed 2026-07-28).
                                    # Every OTHER routine's live trigger carries the operator's standing
                                    # second paragraph ("Spawn Sonnet 5 model sub-agents to do the grunt
                                    # work. Save your processing (Opus 5) for design/analysis/orchestration
                                    # work only."). OPS2's does NOT, on purpose: OPS2 HOSTS other routines
                                    # inline at full fidelity, and its own slice's hosting requirement (a)
                                    # NO MODEL DOWNGRADE ("execute X's judgment-heavy steps at that
                                    # fidelity, NOT on a weaker sub-agent model ... never to downgrade the
                                    # model") is in direct tension with a blanket instruction to push grunt
                                    # work onto Sonnet sub-agents. Do NOT "fix" this by adding the addendum
                                    # to OPS2 -- a hand comparison against OPS0 will keep surfacing it as a
                                    # difference, and it is the intended one.
                                    # NOTE state.instruction_drift cannot see this either way: it compares
                                    # the FIRST LINE ONLY (REGEXP_EXTRACT(instruction, r'^[^\n]*'), by
                                    # design, so the addendum's wording never trips drift), so the addendum
                                    # is unmonitored for EVERY routine -- this comment is the only record.
    notes: >
      Catch-up EXECUTOR (added 2026-07-27, owner directive -- the headless-RemoteTrigger workaround,
      ops/RUNBOOK.md §15b). Reads state.catchup_refire_readiness + the non-trading-day D1/SL3 set and, for
      each catchup_safe miss (D1/SL3/OPS1 daily plus W1/W2/W3/W5, M1a/M1b/M2/M3/M5, Q1/Q2/Q3/SL1, A1/A2
      period), EXECUTES that routine's slice INLINE in its own session (idempotency + 3h in-flight guards),
      logging as that routine so cadence clears the miss -- so the operator no longer manually re-runs it.
      NEVER executes D2/D2a/W4/M4/Q4/A3/SL4 (order-crafting/capital-adjacent, statically excluded) or D3
      (catchup_safe yet order-crafting -- caught by the runtime ORDER-CRAFT SLICE-SCAN over D3's OWN slice
      section, deferred to OPS0's email like the static exclusions). Carries FULL connector access
      including IBKR (per-connector read-only scoping isn't offered by the claude.ai GUI, owner-accepted
      2026-07-27) -- the guardrails above, not tool restriction, are what keep it from ever placing an
      order. Anything it cannot run (missing connector, execution error, over-bound) it leaves in
      readiness with no log row, so OPS0's 22:30 residual-email fallback still catches it. Idempotent via
      ops.catchup_refire_log. No chat question, ever.
  - id: SL3
    name: Incubation Monitor & Graduation
    schedule: "after D2a trading_day"     # SISA arsenal loop; needs D2a's fresh marks
    monitor_class: daily_trading
    catchup_safe: true
    depends_on: [D2a]
    writes: [analytics.strategy_incubation_perf, events.strategy_lifecycle, state.arsenal_regime_coverage,
             events.queue_events, events.decision_log, ops.alerts, events.shadow_positions]
    expected_trigger:
      recurrence: custom_cron
      cron_utc: "0 2 * * *"
      time_local: "20:00"
      enabled: true
    notes: >
      SISA strategy-arsenal lifecycle (ops/RUNBOOK.md §39; ops/autonomy_levels.yaml loop strategy_arsenal).
      Daily forward-test monitor for SHADOW/PAPER strategies: updates analytics.strategy_incubation_perf,
      SELF-EXECUTES the light SHADOW->PAPER transition (the D2a self-execute pattern), and on PAPER->PROBE
      readiness ENQUEUES SL5 (the roster-mutation registrar) -- SL3 never edits the repo/roster or touches
      capital itself. Gated by ops.sp_assert_arsenal_enabled('SL3'); FATAL sp_assert_deps(['D2a']). Writes a
      decision_log 'evaluated, no change' meta-heartbeat every firing.

  # ---- ADVERSARIAL REVIEWS (daily, queue-driven; fire only if an entry is due) ----
  - id: AR_att   # ASCII id standardized 2026-07-01 (RUNBOOK §28); legacy middle-dot ops.run_log rows fold in via instruction_drift's separator-normalized join
    name: Adversarial Review — Attacker
    schedule: "daily; if events.queue_events PENDING_REVIEW attacker_due<=today"
    monitor_class: queue_driven           # NOT calendar-predictable -> excluded from cadence_expected_today
    catchup_safe: false
    depends_on: []
    writes: [events.adversarial_reviews, Adversarial_Review_*_attacker.md]
    expected_trigger:
      recurrence: custom_cron
      cron_utc: "0 0 * * *"
      time_local: "18:00"
      enabled: true
  - id: AR_orc
