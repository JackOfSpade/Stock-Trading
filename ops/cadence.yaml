# THE WHOLE FLEET IS FIXED-UTC, and always was. Verified 2026-08-01 against the live API: every
# trigger reports `created_via: "http_api"` and the trigger schema carries NO timezone field at all.
# Earlier revisions of this file described a DST-aware "native Daily/Weekly picker" cohort; that
# cohort does not exist. Consequences, all deliberate: schedules are version-controlled and
# API-manageable, ops/routine_backup.json restores them losslessly, DST transitions can never skip
# or double-fire a run (a UTC instant is unambiguous), and Q4 step E / OPS0 STEP 3 -- which only
# self-correct `recurrence: custom_cron` -- now reach every routine instead of the 15 they used to.
# The price is that a fixed-UTC cron slides 1h EARLIER in local terms under MST, so any constraint
# expressed in LOCAL time can hold in summer and break in winter. That has bitten twice (OPS2 vs the
# 21:00 MT deadline, 2026-07-27; W1 vs the Sunday boundary, above), so it is now mechanical:
# scripts/check_cron_dst_safety.py renders every cron in both seasons and fails CI on a violation.
# It also enforces that `time_local` is the MDT rendering for EVERY routine -- the old OPS2
# split-convention trap (its time_local was the MST reading) is fixed, not just documented.
