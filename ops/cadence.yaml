# Cadence manifest — the version-controlled source of truth for WHAT runs WHEN.
#
# WHY THIS EXISTS: each routine is a Claude-Code-on-Web session whose trigger/schedule
# lives only in the web UI — unversioned, invisible, un-reviewable, a single point of
# failure. This file makes the cadence reviewable and gives the freshness monitor
# (state.freshness / ops.run_log) something to check missed runs against.
#
# It does NOT execute anything by itself. Keep it in sync with the web-trigger config
# and with Claude_Task_Plan.md. Times are America/Denver (the experiment's operating tz);
# "trading_day" means gate on state.trading_day_today.is_trading_day.
#
# Every routine should, at start/end, CALL ops.sp_routine_start / ops.sp_routine_end (one-call
# wrappers over ops.sp_log_run, plus a dependency gate) so ops.run_log records the run and
# state.cadence_watch can flag a missed one (P1-1 / A3 / C1). Data currency is also proven
# independently by state.freshness.marks_fresh/engine_fresh (data tables, not run_log). See ops/RUNBOOK.md §7/§13 +
# bigquery/12_cadence_monitor.sql. This manifest's `depends_on` (below) is the source for each
# routine's <deps> argument to sp_routine_start.

timezone: America/Denver

# Cadence-watch deadline guard (added 2026-06-25, RUNBOOK §1 step 3). state.cadence_watch.needs_attention
# only alarms a missed DAILY routine (D1/D2/D3) AFTER this America/Denver wall-clock time — past the
# routines' real after-close completion (D2 ~17:47, D3 ~18:36) yet before the 05:15 UTC / 23:15 MT
# scheduled cadence_check — so an off-schedule/manual run BEFORE the routines run can't false-fire a
# missed_run CRITICAL, while a GENUINE miss still fires at the scheduled run. MUST equal the TIME literal
# in bigquery/12_cadence_monitor.sql (state.cadence_watch); CI enforces it via
# scripts/check_cadence_consistency.py. QUOTE it — an unquoted 21:00 is parsed by YAML as base-60 (=1260).
cadence_watch_deadline_local: "21:00"

# Period-miss grace windows (added 2026-07-03, self-improvement audit WO-1/B-6-obs). Declares WHEN a
# weekly/monthly/quarterly/annual routine counts as "missed for the current period" in
# state.cadence_period_watch (bigquery/24_cadence_period_watch.sql) — a grace deadline placed strictly
# AFTER the documented tolerance so a routine that ran on its normal day never false-alarms. Value is
# the Nth TRADING DAY of the period by which the routine must have completed (weekly_sun is calendar
# days from that week's Sunday, since weeklies tolerate "Sunday OR Monday", not a trading-day count).
# MUST match the OFFSET/day-count literals in bigquery/24_cadence_period_watch.sql; CI enforces it via
# scripts/check_cadence_consistency.py (check E).
period_grace_days:
  weekly_sun: 1      # Monday (1 calendar day after the period's Sunday)
  monthly_ftd: 3     # 3rd trading day of the month
  quarterly_ftd: 3   # 3rd trading day of the quarter
  annual_ftd: 5      # 5th trading day of the year

defaults:
  log_run: true            # BEST-EFFORT, wrapped so it can never abort the routine: CALL ops.sp_routine_start(<id>,<run_date>,<session>,<branch>,<verbatim trigger instruction>) at start; ops.sp_routine_end(...,'completed'|'failed'|'halted',...) at end (templates in Claude_Task_Plan.md "Observability"). instruction -> ops.run_log.instruction -> state.routine_last_instruction (verify live triggers by query; diff vs scripts/print_routines.py).
  dep_gate: true           # SEPARATE + FATAL (not wrapped): action routines CALL ops.sp_assert_deps(<id>,<depends_on below>,<run_date>) BEFORE the start-log; aborts on a missing monitored upstream (self-bootstrapping)
  on_hard_stop: raise_alert # CALL ops.sp_raise_alert -- delivered via alert_emailer.gs's email poll of ops.alerts. No calendar event for an ordinary hard stop since the 2026-07-09 calendar-scope narrowing (Operating_Protocols.md); the sole surviving calendar exception is a BigQuery-unreachable RE-AUTH pre-flight, since sp_raise_alert itself can't run when BigQuery is down.

# SINGLE-SOURCE THE CADENCE (added 2026-06-22). Each routine carries an explicit `monitor_class`
# — the canonical cadence bucket that state.cadence_expected_today (bigquery/12_cadence_monitor.sql)
# encodes in SQL. This file is the SOURCE OF TRUTH for that mapping; the SQL must agree with it, and
# scripts/check_cadence_consistency.py (CI) FAILS the build if it drifts — so the hand-kept SQL list,
# the ops.routine_catalog seed, and this manifest can no longer silently diverge (the recurring
# RUNBOOK §22-class problem). Allowed monitor_class values:
#   daily_trading  : every trading day               (alarmed in state.cadence_watch)
#   daily_all      : every calendar day              (alarmed)
#   weekly_sun     : Sundays                          (visible, not alarmed — inferred run-day)
#   monthly_ftd    : first trading day of the month   (visible, not alarmed)
#   quarterly_ftd  : first trading day of the quarter (visible, not alarmed)
#   annual_ftd     : first trading day of the year    (visible, not alarmed)
#   queue_driven   : fires only when a queue entry is due — NOT calendar-predictable, so deliberately
#                    EXCLUDED from state.cadence_expected_today (the adversarial AR routines).

routines:
  # ---- DAILY (every trading day, after the close) ----
  - id: D1
    name: Market Development Scan
    schedule: "after_close trading_day"   # ~16:10 MT
    monitor_class: daily_trading
    depends_on: []
    writes: [Daily.md, events.decision_log, events.regime_events]
  - id: D2a
    name: Broker Reconcile & Snapshot
    schedule: "after_close trading_day, before D2"
    monitor_class: daily_trading
    depends_on: []   # deliberately independent of D1 -- the book must reconcile even if D1 failed
    writes: [events.trade_fills, events.position_events, events.daily_marks, perf.strategy_daily,
             ops.account_snapshot]
    notes: >
      CUT OVER 2026-07-09 (autonomous, performed by D2a itself after 3 distinct trading-day completed runs
      with no prior cutover logged; ops.d2a_cutover_log + an INFO-severity ops.alerts 'auto_cutover' row are
      the record -- no chat question was raised). D2a now solely owns the mechanical broker-reconcile /
      cash-tripwire / park-sweep / TWR-engine-maintenance (Step 0/0b/PER-STRATEGY PERFORMANCE MAINTENANCE),
      split out of D2's analysis-heavy action-conversion so a D2 halt can never also stall fills
      reconciliation, cash safety, or the engine. D2 now depends_on [D1, D2a] (flipped by that cutover).
      Runs every trading day, before D2, independent of D1.
  - id: D2
    name: Daily Action Conversion
    schedule: "after D1 trading_day"
    monitor_class: daily_trading
    depends_on: [D1, D2a]
    writes: [events.decision_log, events.queue_events, events.position_events, calendar:confirm_order]
    notes: "CUT OVER 2026-07-09 (autonomous, by D2a; ops.d2a_cutover_log). D2 no longer runs Step 0/0b/TWR-maintenance -- those (broker reconcile + cash tripwire + park sweep, ops.account_snapshot, CALL ops.sp_daily_refresh()) now run in D2a, on which D2 now depends. D2 keeps its own ops.sp_assert_trading_enabled('D2') gate (freshness-inclusive; safe now that D2a made marks/engine fresh) before it drains the queue and converts Daily.md's RECOMMENDED ACTIONS into orders."
  - id: D3
    name: Calendar & Queue Hygiene
    schedule: "after D2 daily"             # runs daily incl. non-trading days for queue/calendar upkeep
    monitor_class: daily_all
    depends_on: [D2]
    writes: [calendar:confirm_order, events.queue_events]
  - id: SL3
    name: Incubation Monitor & Graduation
    schedule: "after D2a trading_day"     # SISA arsenal loop; needs D2a's fresh marks
    monitor_class: daily_trading
    depends_on: [D2a]
    writes: [analytics.strategy_incubation_perf, events.strategy_lifecycle, state.arsenal_regime_coverage,
             events.queue_events, events.decision_log, ops.alerts]
    notes: >
      SISA strategy-arsenal lifecycle (ops/RUNBOOK.md §39; ops/autonomy_levels.yaml loop strategy_arsenal).
      Daily forward-test monitor for SHADOW/PAPER strategies: updates analytics.strategy_incubation_perf,
      SELF-EXECUTES the light SHADOW->PAPER transition (the D2a self-execute pattern), and on PAPER->PROBE
      readiness ENQUEUES SL5 (the roster-mutation registrar) -- SL3 never edits the repo/roster or touches
      capital itself. Gated by ops.sp_assert_arsenal_enabled('SL3'); FATAL sp_assert_deps(['D2a']). Writes a
      decision_log 'evaluated, no change' meta-heartbeat every firing.

  # ---- ADVERSARIAL REVIEWS (daily, queue-driven; fire only if an entry is due) ----
  - id: AR_att   # ASCII id standardized 2026-07-01 (RUNBOOK §28); legacy middle-dot ops.run_log rows fold in via instruction_drift's separator-normalized join
    name: Adversarial Review — Attacker
    schedule: "daily; if events.queue_events PENDING_REVIEW attacker_due<=today"
    monitor_class: queue_driven           # NOT calendar-predictable -> excluded from cadence_expected_today
    depends_on: []
    writes: [events.adversarial_reviews]
  - id: AR_orc
    name: Adversarial Review — Orchestrator
    schedule: "daily; if a review is attacker-complete and orchestrator_due<=today"
    monitor_class: queue_driven
    depends_on: [AR_att]
    writes: [events.adversarial_reviews, events.regime_events, events.decision_log, calendar:confirm_order]
  # ---- STRATEGY ARSENAL — QUEUE-DRIVEN (SISA lifecycle, added 2026-07-10; fire only if a queue entry is due) ----
  - id: SL2
    name: Strategy Draft, Revise & Post-mortem
    schedule: "daily; if events.queue_events PENDING_DRAFT (strategy-draft/strategy-revise/post-mortem) due<=today"
    monitor_class: queue_driven           # NOT calendar-predictable -> excluded from cadence_expected_today (like AR)
    depends_on: []
    writes: [Strategy.md, strategy/slices, events.queue_events, events.strategy_postmortems,
             events.strategy_lifecycle, events.decision_log, ops.alerts]
    notes: >
      SISA arsenal loop (ops/RUNBOOK.md §39). Autonomous EDITORIAL routine that overturns the
      'revision reserved to the participant' gate: drafts the '## Strategy <code> [CANDIDATE]' section +
      a self-contained 7-section pre-mortem (all parameters derived FRESH + a derivation-provenance record),
      redrafts ONLY the flagged Tier-1 defects on an AR_orc REVISION REQUIRED verdict (cycle_number++,
      cycle-5 soft cap), and authors events.strategy_postmortems on a TERMINATED transition. INDEPENDENT
      context from SL1 and the AR reviewers. Gated by ops.sp_assert_arsenal_enabled('SL2'). NEVER stages
      orders, NEVER touches capital, NEVER edits the live roster (SL5 does that). queue_driven: registers in
      bigquery/15 + ops/triggers.json + bigquery/18 stalled_runs only (NOT 12/24).
  - id: SL5
    name: Strategy Register & Roster Sync
    schedule: "daily; if a SUFFICIENT strategy-adoption verdict, an SL3 PAPER->PROBE enqueue, or a TERMINATED transition is due"
    monitor_class: queue_driven
    depends_on: [AR_orc]
    writes: [strategy/roster.yaml, Strategy.md, strategy/slices, Claude_Task_Plan.md, ops.roster_change_log,
             events.strategy_lifecycle, events.decision_log, ops.alerts]
    notes: >
      SISA arsenal loop (ops/RUNBOOK.md §39). The D2a self-executing transition + fanout engine and the ONLY
      writer of roster MEMBERSHIP: SHADOW register (roster.yaml entry + lifecycle row, spec-locks the
      strategy), PROBE register (finalize Strategy.md candidate->roster-active, scripts/split_strategy.py,
      roster fanout, run scripts/check_roster_consistency.py + check_cadence_consistency.py + split_strategy
      --check locally, commit+push on auto-merge, re-apply the roster-derived views live via the BigQuery MCP,
      register into the existing probe-stake funding queue), TERMINATED deregister (the reverse). Idempotent
      via ops.roster_change_log (the ops.d2a_cutover_log analog, keyed by change_key). Gated by
      ops.sp_assert_arsenal_enabled('SL5'); FATAL sp_assert_deps(['AR_orc']). Never a chat question, ever.
      queue_driven: registers in bigquery/15 + ops/triggers.json + bigquery/18 stalled_runs only (NOT 12/24).

  # ---- WEEKLY (Sunday) ----
  - id: W1
    name: Catalyst Calendar (A, C)
    schedule: "weekly Sun"
    monitor_class: weekly_sun
    writes: [Weekly_Catalyst_Calendar.md]
  - id: W2
    name: Post-Event Screen (B)
    schedule: "weekly Sun"
    monitor_class: weekly_sun
    writes: [Weekly_Post_Event_Screen.md]
  - id: W3
    name: Open-Position Deep-Dive (A,B,C,E)
    schedule: "weekly Sun"
    monitor_class: weekly_sun
    writes: [Weekly_Position_Deep_Dive.md]
  - id: W4
    name: Weekly Action Conversion
    schedule: "weekly Sun after W1,W2,W3"
    monitor_class: weekly_sun
    depends_on: [W1, W2, W3]
    writes: [events.queue_events, events.decision_log, calendar:confirm_order]
  - id: W5
    name: Factbase & Analytics Consolidation
    schedule: "weekly Sun after W4"
    monitor_class: weekly_sun
    depends_on: [W4]
    writes: [B_Sub_Pattern_Taxonomy.md, analytics.decision_embeddings, events.decision_log]
    notes: "Good home for CALL ops.sp_score_theater() (P3-2 independence judge) + embedding health check."

  # ---- MONTHLY (1st trading day) ----
  - id: M1a
    name: Strategy-Blind Regime Scoring
    schedule: "monthly first_trading_day"
    monitor_class: monthly_ftd
    writes: [events.regime_events, events.macro_series, events.macro_fred]
  - id: M1b
    name: Strategy Mapping & Activation Calls
    schedule: "monthly after M1a"
    monitor_class: monthly_ftd
    depends_on: [M1a]
    writes: [Monthly_Fundamental.md]
  - id: M2
    name: E Pair Divergence Screen
    schedule: "monthly first_trading_day"
    monitor_class: monthly_ftd
    writes: [Monthly_E_Pairs.md]
  - id: M3
    name: D Position Deep-Dive
    schedule: "monthly first_trading_day"
    monitor_class: monthly_ftd
    writes: [Monthly_D_Position_Deep_Dive.md]
  - id: M4
    name: Monthly Action Conversion
    schedule: "monthly after M1b,M2,M3"
    monitor_class: monthly_ftd
    depends_on: [M1b, M2, M3]
    writes: [events.regime_events, events.queue_events, events.decision_log, calendar:confirm_order]
  - id: M5
    name: Deployed-TWR & Macro Forecast (advisory)
    schedule: "monthly after M4"
    monitor_class: monthly_ftd
    depends_on: [M4]
    writes: [analytics.deployed_twr_forecast, events.decision_log]
  - id: SL4
    name: Discretionary Retirement Proposer
    schedule: "monthly after M4"
    monitor_class: monthly_ftd
    depends_on: [M4]
    writes: [events.queue_events, events.strategy_lifecycle, events.decision_log, ops.alerts]
    notes: >
      SISA arsenal loop (ops/RUNBOOK.md §39). Monthly REMOVE-ONLY discretionary-retirement scanner,
      default-KEEP: reads the objective state.strategy_retirement_candidacy signal (edge-decay / redundancy /
      dominated-by-newcomer), enqueues review_type='strategy-retirement' (conservative_default=KEEP) + writes
      RETIREMENT_PROPOSED; only an affirmative AR RETIRE verdict routes to the existing D2 step-5 termination
      handler. Enforces the N>=2 floor (never proposes below it) + a per-strategy post-KEEP re-proposal
      cooldown. Adds NO new autonomy to the mechanical kill path (drawdown/30-trade/m2m stay immediate) and
      can never spare a strategy a mechanical trigger flagged. Gated by ops.sp_assert_arsenal_enabled('SL4');
      FATAL sp_assert_deps(['M4']). decision_log 'evaluated, no change' meta-heartbeat every firing.

  # ---- QUARTERLY (1st trading day of quarter) ----
  - id: Q1
    name: Regime Retrospective
    schedule: "quarterly first_trading_day"
    monitor_class: quarterly_ftd
    writes: [Quarterly_Regime.md]
  - id: Q2
    name: D Long-Horizon Candidates
    schedule: "quarterly first_trading_day"
    monitor_class: quarterly_ftd
    writes: [Quarterly_D_Candidates.md]
  - id: Q3
    name: AI Foundation Quarterly Delta
    schedule: "quarterly first_trading_day"
    monitor_class: quarterly_ftd
    writes: [Quarterly_AI_Foundation_Delta.md]
  - id: Q4
    name: Quarterly Action Conversion
    schedule: "quarterly after Q2,Q3"
    monitor_class: quarterly_ftd
    depends_on: [Q2, Q3]
    writes: [Watchlist.md, events.queue_events, events.decision_log]
  - id: SL1
    name: Strategy Candidate Synthesis & Qualification
    schedule: "quarterly after Q1,Q3"
    monitor_class: quarterly_ftd
    depends_on: [Q1, Q3]
    writes: [state.strategy_candidates, events.strategy_lifecycle, events.queue_events,
             events.decision_log, ops.alerts]
    notes: >
      SISA arsenal loop (ops/RUNBOOK.md §39; ops/autonomy_levels.yaml loop strategy_arsenal). Quarterly
      deep-research candidate synthesis + mechanical qualifier (DEFAULT-REJECT on ambiguity): reads the
      candidate feed (events.strategy_candidates from D1/Q1/Q3/A1) + the regime/foundation factbase +
      state.arsenal_regime_coverage + terminated-strategy post-mortems, synthesizes 0-2 candidates biased
      toward zero/under-covered regime cells, and promotes to QUALIFYING->AUTHORING only when the
      concurrent-incubation cap + adoption-rate window are open (else waits FIFO). A roster at the N>=2 floor
      force-generates candidates + raises an INFO 'roster_below_floor' alert. Gated by
      ops.sp_assert_arsenal_enabled('SL1'); FATAL sp_assert_deps(['Q1','Q3']). decision_log 'evaluated, no
      change' meta-heartbeat every firing.

  # ---- ANNUAL (1st trading day of year / experiment anniversary) ----
  - id: A1
    name: AI Foundation Annual Re-Derivation
    schedule: "annual first_trading_day"
    monitor_class: annual_ftd
    writes: [Annual_AI_Foundation_Sweep.md]
  - id: A2
    name: Per-Strategy Constraint Audit
    schedule: "annual first_trading_day"
    monitor_class: annual_ftd
    writes: [Annual_Constraint_Audit.md]
  - id: A3
    name: Annual Action Conversion
    schedule: "annual after A1,A2"
    monitor_class: annual_ftd
    depends_on: [A1, A2]
    writes: [AI_Trading_Foundation.md, Strategy.md, events.queue_events, events.decision_log]

# ---- WEB-UI TRIGGER AUDIT — 2026-07-10, RE-SPACED 2026-07-12 (Claude-in-Chrome + RemoteTrigger API,
# cross-checked against ops.run_log) ----
# ops/trigger_ids.json (added 2026-07-12) maps routine id -> live RemoteTrigger id (trig_...), so a
# session can call RemoteTrigger get/update/run directly instead of re-discovering IDs via
# Claude-in-Chrome each time. See that file's _meta for provenance/staleness caveats.
#
# Exact clock times below are NOT enforced anywhere (per the file header, exact times live only in
# the web UI) — recorded purely as the human-readable reference scripts/print_routines.py invites
# ("Record exact times in cadence.yaml if you want them printed"). Read directly from each trigger's
# editor and, where history existed, cross-checked against real ops.run_log execution timestamps.
#
# 2026-07-12 INCIDENT: W2 and W4 (the two :30-minute-offset weekly triggers) silently no-showed
# 2026-07-12 — zero ops.run_log rows, no self-heal marker, "next run" jumped straight to the
# following Sunday — while W1/W3/W5 (the :00-minute triggers) fired normally within the same hour.
# 13 prior weeks (2026-04-19..2026-07-05) had zero gaps for any of W1-W5, so this wasn't a chronic
# flake. Root cause is opaque (Anthropic cloud trigger infra, no log access from this repo) but the
# same audit also found the weekly block was NOT the only collision risk: quarterly Q1/Q2/Q3
# exactly coincided with daily AR_orc/SL2/SL3 (6/7/8 PM MT) on every quarter-start date, and SL4 sat
# only 5 min after M5. Re-spaced the whole non-daily schedule below to remove every exact collision
# and land routines that share a possible calendar day on the same day at least 30 min apart
# (financial/trading risk was zero throughout — state.system_health stayed green; only the weekly
# research/analytics chain stalled, recovered via manual `RemoteTrigger run` on W2 then W4).
# Watch-trigger: if a `:00`-minute-offset routine ALSO silently no-shows on a future date, that's
# the signal this is a genuine platform bug worth filing with Anthropic, not schedule tuning.
#
# DAILY (the platform's native Daily/Weekdays picker IS genuinely DST-aware — shows "MDT"/"MST") —
# UNCHANGED 2026-07-12: no exact collisions found here, and gaps are deliberately telemetry-tuned
# (see D2/D2a note below), so widening to 1hr would only push SL3 into the new W1 Sunday slot:
#   D1 4:00 PM MT · D2a 4:20 PM MT · D2 5:15 PM MT (widened from 4:30 PM 2026-07-10 — D2a's real
#     completion time varies 6-17+ min in ops.run_log; the old 10-min gap was too thin) · D3 6:30 PM MT ·
#     SL3 8:00 PM MT · AR_att 5:30 PM MT · AR_orc 6:00 PM MT · SL2 7:00 PM MT · SL5 7:15 PM MT
#
# WEEKLY (native Weekly picker, DST-aware) — RE-SPACED 2026-07-12, now a full 1hr apart (was 30 min;
# see incident note above). W1 unchanged, W2-W5 moved:
#   W1 12:00 AM MT Sun · W2 1:00 AM MT Sun (was 12:30 AM) · W3 2:00 AM MT Sun (was 1:00 AM) ·
#   W4 3:00 AM MT Sun (was 1:30 AM) · W5 4:00 AM MT Sun (was 2:00 AM)
#   D1/D2a/D2/SL3 intentionally still fire on weekends/holidays (recurrence type "Daily", not
#   "Weekdays") — confirmed via real weekend runs (2026-06-20/21, 2026-07-04/05) that they self-detect
#   the non-trading day and complete cheap, safe, idempotent work (D1 catches weekend geopolitical
#   news relevant to Monday's open; D2/D2a run harmless broker/cash reconciliation). Do NOT switch
#   these to "Weekdays" — that would remove working, valuable behavior, not fix a bug.
#
# MONTHLY/QUARTERLY/ANNUAL (forced onto raw "Custom" cron — confirmed 2026-07-10 the platform's
# recurrence-type options are ONLY Once/Hourly/Daily/Weekdays/Weekly/Custom, no month-of-year option
# exists — so these have NO timezone concept, just a fixed UTC hour. PERMANENT PLATFORM LIMITATION,
# not a bug to keep re-investigating; revisit only if the platform ever adds a DST-aware monthly type):
#   M1a 5:00 AM MT · M1b 6:00 AM MT · M2 7:00 AM MT · M3 8:00 AM MT · M4 9:00 AM MT · M5 10:00 AM MT ·
#     SL4 10:30 AM MT (was 10:05 AM — widened 2026-07-12 from a 5-min gap after M5 to 30 min) — all
#     tuned for MDT (UTC-6); fire ~1hr EARLY every MST month (~Nov-Mar). Accepted; no fix available.
#   RELOCATED 2026-07-12 off the daily-collision zone (was 6-10 PM MT, exactly overlapping
#   AR_orc/SL2/SL3 on quarter-start dates) into the free midday window, still MDT-tuned/UTC-6:
#   Q1 11:00 AM MT (was 6:00 PM, collided with AR_orc) · Q2 12:00 PM MT (was 7:00 PM, collided with
#     SL2) · Q3 1:00 PM MT (was 8:00 PM, collided with SL3) · Q4 2:00 PM MT (was 9:00 PM) ·
#     SL1 3:00 PM MT (was 10:00 PM) — all fixed 2026-07-10 for the UTC-evaluation bug, then
#     relocated 2026-07-12 for the daily-block collision. Same MDT-only caveat as the monthly
#     cohort above (fires ~1hr early every January).
#   A1 9:00 PM MT · A2 10:00 PM MT · A3 11:00 PM MT — FIXED 2026-07-10 (UTC-evaluation bug), moved
#     2026-07-12 from 7:30/8:30/9:30 PM (which sat inside the daily block) to right after SL3 (8 PM)
#     with a full 1hr buffer on both sides; no seasonal caveat, these only ever fire in January (MST)
#     so the MST-calibrated cron is exact year-round.
#
# Also confirmed correct and left untouched: M4's instruction text (a prior audit pass misread it as
# missing its "Read Claude_Task_Plan.md. Perform " prefix; ops.run_log's actual last-received
# instruction is fully canonical). W5's Instructions field was already correct; only its Name/title
# field was missing the " — regular routine" suffix (fixed 2026-07-10). A2's Instructions had a
# trailing newline (stripped 2026-07-10).
#
# 2026-07-13/14 INCIDENT (RUNBOOK §41): cron times below are NOT what drifted this time (RemoteTrigger
# get confirmed every evening-block trigger still matches this file exactly) — the evening block (D2
# onward) simply ran 5-7h LATE (opaque cloud trigger infra, same class as the 2026-07-12 W2/W4 no-show
# above). Because AR_orc/D3/SL5/SL3's MT evening slots are cron-encoded on/after UTC midnight, the delay
# pushed their actual execution past LOCAL midnight MT too — so each one's dependency check evaluated
# against the wrong (new, not-yet-started) calendar day instead of the day it actually served, even
# though that day's upstream had genuinely completed, just also late. Fixed same-day, mechanically,
# inside ops.sp_assert_deps (bigquery/12_cadence_monitor.sql) — a dependency completed for
# yesterday now also satisfies the gate while Denver wall-clock is before noon. No cadence/cron change
