#     (vs 1 min p90), so a 15-min gap could have hard-stopped AR_orc on its own dependency gate.
#     Gaps now cover every routine's worst recorded run: AR_att 20m, AR_orc 25m, D3 20m, SL2 20m.
#   * OPS1 7:00 -> 6:30 AM. OPS1 is daily and M2 is monthly-on-the-1st, and BOTH sat on 13:00 UTC --
