  - name: Google-Cloud-BigQuery
    connector_uuid: 64f9594a-0ed8-4081-883c-df850f1c8fcd
    settings_prefix: mcp__Google_Cloud_BigQuery__
    tools:
      - name: cancel_job
        use: unused
        note: >-
          Auto-added by OPS1 2026-09-13. Vendor-added tool, first observed in the live connector's tool
          inventory. `use: unused` is the conservative default — nothing in this fleet calls it (mirrors
          the IBKR `whats_new` precedent, July 2026). Promoting it to required/optional and adding
          routine prose that calls it is a separate, deliberate feature-adoption decision this step
          never makes on its own.
          DELIBERATELY NOT PROMOTED alongside its sibling `get_query_results` (2026-09-13) — do NOT
          promote it "for symmetry". The two are not symmetric: `get_query_results` RECOVERS the result
          of a query that outran the synchronous window, whereas `cancel_job` only ABORTS one, discarding
          work BigQuery is already being billed for. No routine has a reason to abandon a query it
          deliberately issued, and on a DML/DDL statement a cancel would leave the write in an
          indeterminate state the fleet has no reconciliation path for — strictly worse than waiting.
          See RUNBOOK §52.
      - name: execute_sql
        use: required
        note: >-
          all routine DML/DDL (RUNBOOK §15a canonical matrix). KNOWN DEFECT (RUNBOOK §51): drops the
          `query` argument on ~14% of calls, returning `Required parameter is missing: query` with no
          BigQuery job created. One immediate verbatim re-issue clears it; never shorten the payload.
      - name: execute_sql_readonly
        use: required
        note: >-
          every routine's pre-flight liveness read (RUNBOOK §15a canonical matrix). Same ~14% `query`
          arg-drop defect as execute_sql (RUNBOOK §51) — measured 28/204 on 2026-09-11 while
          list_table_ids/list_dataset_ids were 0/80 in the same windows.
      - name: get_dataset_info
        use: required
        note: diagnostics/schema inspection (RUNBOOK §15a canonical matrix)
      - name: get_query_results
        use: required
        note: >-
          Auto-added by OPS1 2026-09-13 as `use: unused`; PROMOTED TO `required` the same day by the
          deliberate, hand-authored path this file's EDIT DISCIPLINE header reserves for actually wiring
          a capability into a routine (manifest `use:` + the routine prose that calls it, changed
          together). It is the ONLY way to retrieve the result of a query that exceeds the MCP's
          synchronous window: `execute_sql` / `execute_sql_readonly` then return
          `{"jobComplete": false, "jobId": ...}` — NOT an error, NO rows — and the result is
          unreachable without polling this tool with that `jobId`. Measured 2026-09-13: 867 of 54,522
          MCP-labelled jobs (1.6%) exceeded 20s over the trailing 180d, on EVERY operating day, p99
          26.3s, max 195.7s — so this is a live path, not a theoretical one. Called from
          Claude_Task_Plan.md's TRANSIENT-FAILURE WAIT-AND-RETRY ladder
          (SYNCHRONOUS-TIMEOUT HANDOFF bullet); full record in RUNBOOK §52.
      - name: get_table_info
        use: required
        note: diagnostics/schema inspection (RUNBOOK §15a canonical matrix)
      - name: list_dataset_ids
        use: optional
        note: "RUNBOOK §15a: OPTIONAL — zero operational dependency, repo-wide verified 2026-07-19"
      - name: list_table_ids
        use: optional
        note: "RUNBOOK §15a: OPTIONAL — zero operational dependency, repo-wide verified 2026-07-19"
    absent: []

