        use: unused
        prose_ambiguous: true
      - name: calendar
        use: required
        prose_ambiguous: true
        note: >-
          W2 SHARED POPULATION PULL (Claude_Task_Plan.md §W2) — the orchestrator's single
          pre-fan-out `earnings-calendar` pull that the discovery sub-agents consume instead
          of each querying FMP themselves (added 2026-08-17 after the W2 2026-W34 free-tier
          exhaustion; see the shared "One shared pull, not N independent ones" rule). Flipped
          unused→required in that commit: it is now a named call site, so it must be allowlisted
          or an unattended W2 stalls on a permission prompt at the top of the run.
          STANDING CONSTRAINT (MEASURED 2026-08-23, direct probes against this FMP tier —
          record it here so W1 stops rediscovering it and raising a fresh alert every weekly
          cycle). `earnings-calendar` is a FORWARD-ONLY ROLLING WINDOW: a
          2026-11-20..2026-12-05 probe returned exactly ONE row (BABA, 2026-11-24) and a
          2027-01-15..2027-02-15 probe returned ZERO rows, so the horizon ends around
          2026-11-24 — roughly 13 weeks out. The BACKWARD end is not merely empty but
          explicitly REFUSED: a 2026-01-26..2026-01-30 (historical) probe returned "ACCESS
          DENIED ... requires a higher plan" — which means the "derive next year's earnings
          dates from last year's actuals" fallback is NOT available on this tier either. The
          per-symbol forms are also denied: `calendar/earnings-company` returns ACCESS DENIED
          (confirmed on MSCI), and `calendar/dividends-company` returns ACCESS DENIED too. The
          one usable dividend surface is the DATE-RANGE form: `calendar/dividends-calendar`
          WORKS on this tier — a 2026-08-10..2026-08-18 probe returned 7 rows with ex-date,
          record date, payment date, declaration date and amount — and is the fallback for
          `state.price_level_criterion_drift` (bigquery/197) when `events.daily_marks` does
          not cover a criterion's reference date. On statements, `statements/income-statement`
          with `period=quarter` returns ACCESS DENIED, and `statements/financial-reports-dates`
          WORKS but returns only `fiscalYear`+`period` with NO dates, so it cannot supply
          report dates.
      - name: chart
        use: required
        prose_ambiguous: true
        note: >-
          OPS1 liveness probe (FMP-PRIMARY ^VIX historical-price-eod-light) + D1/D2a. Chosen as the
          probe target precisely because `^VIX` is on free's allow-list, so a failure here means an
          AUTH problem rather than the tier gate. SYMBOL-ALLOW-LIST GATED for equities, deterministically
          per symbol and NOT quota-shaped: on 2026-08-26 `historical-price-eod-light` returned a clean
          five-bar series for AAPL and returned "ACCESS DENIED: A parameter you passed to this tool
          (\"chart\") requires a higher plan" for ANF in the same session. Also plan-gated for INDEX
          symbols other than the allow-listed ones (D1 EQUITY-BREADTH OBSERVATION records this).
      - name: commitmentOfTraders
        use: unused
      - name: commodity
        use: required
        prose_ambiguous: true
        note: >-
          D2a STEP 1d BRENT LIMB (Claude_Task_Plan.md D2a step 1d) — `commodities-historical-price-eod-light`
          with symbol `BZUSD` is the ONLY source for Brent crude, which is the PRICE limb of the park v4
          SHOCK axis (`state.park_axis_daily`, bigquery/216; seeded by bigquery/217). Brent is not an
          IBKR menu instrument, so there is no IBKR primary and no fallback: if this endpoint denies,
          ingest nothing and let the axis freeze semantics carry the last measured level.
          PROMOTED unused -> required 2026-09-04 together with the D2a prose that calls it; the two must
          move in one commit (this file's EDIT DISCIPLINE header).
          MEASURED WORKING on the current plan tier 2026-09-04, and it cross-validates against a record
          written independently of it (BZUSD prints 94.65 on 2026-09-01, the figure D1's own 09-01
          de-risk record cites). Do NOT raise `fmp_quote_plan_gated` for this; it is a STANDING tier
          constraint.
          CORRECTED 2026-09-13 — this note previously read "Contrast `economics`, measured DENIED on the
          same tier the same day — which is why the park v4 RATES axis is UNTESTABLE". THAT WAS FALSE and
          it contradicted this same file's own `economics` entry (`use: required`, "D1/D2a
          TECHNICAL_SIGNAL ingest (treasury-rates for SUSTAINED_INVERSION)") two screens below. FMP
          `economics`/`treasury-rates` is NOT plan-gated: re-probed live 2026-09-13 for the exact cited
          date, it returned a full payload (`year10` 4.78, `year2` 4.37 on 2026-09-04), and D2a's own
          `events.regime_events` SUSTAINED_INVERSION row for 2026-09-04 records that same successful
          call with those same two figures. The RATES axis is stood down for an unrelated and much
          smaller reason — the 10Y those calls return is captured only as free text inside
          `events.regime_events.rationale`, never in a numeric column `state.park_axis_daily` can join
          against. See bigquery/216's header and PARK_ALLOCATOR_V4_DESIGN.md §"Phase-1 data decision".
      - name: company
        use: required
        prose_ambiguous: true
        note: >-
          D1 SINGLE-NAME-MOVE MARKET-CAP RAIL (Claude_Task_Plan.md D1 item 3, "Large single-name moves")
          — `profile-symbol` is the market-cap source of record for a symbol FMP's free-tier allow-list
          denies. PROMOTED unused -> required 2026-08-30 together with the D1 prose that calls it; the
          two must move in one commit (this file's EDIT DISCIPLINE header).
          SYMBOL-ALLOW-LIST GATED, NOT QUOTA-SHAPED — the distinction a 2026-08-26 D1 alert got backwards,
          and it changes the remedy (pacing/retry cannot help; a different symbol or a different source
          can). `market-cap` returned AAPL cleanly on 2026-08-26 (marketCap 4,603,751,738,200) and
          returned "ACCESS DENIED: A parameter you passed to this tool (\"company\") requires a higher
          plan" for ANF in the same session — deterministic and reproducible, not intermittent. That
          parameter-level string always means THE SYMBOL is outside free's ~87-name allow-list, never
          that the tool is down. `batch-market-cap` additionally DROPS denied symbols at HTTP 200 with no
          marker, so a batch response can look complete and be short.
          THE GATE IS PER-ENDPOINT, NOT PER-TOOL (measured 2026-08-30 across the 12 symbols
          `batch-market-cap` silently dropped from a 20-symbol call: MARA, SOLS, SMR, IREN, ESTC, GAP,
          IONQ, PLUG, NU, PCG, MRVL, MSTR). `batch-market-cap`, `market-cap` and `shares-float` returned
          ACCESS DENIED for ALL 12; `profile-symbol` returned a `marketCap` for ALL 12, each carrying a
          `price` matching that symbol's independently IBKR-measured 2026-08-28 close exactly. So a
          denial on one `company` endpoint says nothing about its siblings — go to `profile-symbol`
          FIRST for a cap on a denied symbol.
          CORRECTION, same measurement: this entry previously routed that case to
          Operating_Protocols.md §11 MARKET CAP BASIS on the grounds that "`secFilings` is NOT
          allow-list-gated (verified 2026-08-26: `sec-company-full-profile` returned for ANF, a symbol
          this tool denies)". The premise stands and is NOT retracted — but the inference built on it
          was wrong: `sec-company-full-profile` returned for all 12 and carries NO `marketCap` and NO
          share-count field (registrant/SIC/CIK metadata only), so it cannot satisfy the market-cap
          rail at all. CAVEAT on `profile-symbol`: FMP's implied share count can lag a recent issuance
          — it put SMR at $2.77B against ~$3.81–3.99B from two independent sources, a ~30% gap. No
          binary >=$2B call among the 12 changed, but second-source any name within ~30% of the rail.
      - name: crypto
        use: unused
        prose_ambiguous: true
      - name: directory
        use: unused
        prose_ambiguous: true
        note: >
