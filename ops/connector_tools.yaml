# Connector tool-inventory manifest — the version-controlled EXPECTED MCP tool inventory,
# per connector, for every claude.ai connector this fleet uses.
#
# WHY THIS EXISTS. OPS1 (ops/cadence.yaml) probes exactly ONE tool per connector every
# pre-market morning to prove that connector is authenticated (IBKR/Calendar/FMP/Gmail
# read-only liveness). That proves the connector session is live and says NOTHING about
# the other ~99 tools each connector exposes. When a connector VENDOR ships a brand-new
# tool, it arrives in the claude.ai connectors UI defaulted to "ask" / "needs approval" —
# not silently blocked, not silently allowed. An unattended scheduled routine that happens
# to call that new tool mid-run then hits a permission prompt with nobody there to answer
# it, and the routine silently stalls: no error, no alert, just a session that never
# completes and a missed_run the cadence watch eventually raises hours later with no
# indication of WHY. See scripts/check_settings_toolcov.py's header for the sibling
# problem this solves on the OTHER axis (a tool a routine calls that was never allowlisted
# at all) and ops/RUNBOOK.md §15a (the per-tool allow/ask/block matrix and its "a label
# flip is not proof anyone changed a needed permission" warning). This file is the
# EXPECTED inventory as of the last time a human reconciled it against the live connector.
# OPS1 diffs the live session's actually-available tool list against this file every
# morning and raises `connector_tool_added` / `connector_tool_removed` on any diff — the
# `whats_new` row below (IBKR, added by the vendor July 2026) is the first observed live
# instance of exactly the drift class this file exists to catch.
#
# SINGLE-SOURCE RULE. This file is the BASELINE, not a live mirror. OPS1's per-run
# observations land append-only in `ops.connector_tool_inventory` (one row per {run_date,
# connector, tool} observed); drift between the latest observation and this file's
# declared inventory surfaces on `state.connector_tool_drift`. Critically, the claude.ai
# connectors UI is the ONLY place the allow/ask/block state can actually be changed — this
# file RECORDS what should be allowed, it cannot GRANT anything itself. Editing this file
# never flips a tool's live permission; it only changes what OPS1 expects to see.
#
# CI GATE. `scripts/check_connector_tools.py` fails the build if: (a) a tool declared
# `use: required` here is missing from `.claude/settings.json`'s `permissions.allow`
# array; (b) routine text (Claude_Task_Plan.md / ops/triggers.json) calls a tool not
# declared `use: required` here; or (c) routine text calls a tool listed under this
# file's `absent:` block. This is the sibling gate to
# scripts/check_settings_toolcov.py's one-direction "every referenced tool must be
# allowlisted" check — this file additionally pins WHICH tools are allowed to be
# referenced at all, and records the ones known to be gone.
#
# EDIT DISCIPLINE. This file is ROUTINE-MAINTAINED, NOT GENERATED. Revised 2026-08-12 (owner
# directive: the operator grants every new connector tool "Always allow" regardless of
# relevance and will not manually edit this file, so a routine does the ADD side of the
# reconciliation instead of waiting on a human who will never act). When OPS1 raises
# `connector_tool_added`, OPS1 ITSELF appends the row here, alphabetically among its
# siblings, with `use: unused` and an auto-add note (Claude_Task_Plan.md's OPS1 section,
# TOOL-INVENTORY DRIFT CHECK) — that is what clears the alert, mechanically, on OPS1's next
# run once the merged edit is visible to a fresh observation. `use: unused` is inert: it
# grants no routine any new capability (CHECK 3/4 in scripts/check_connector_tools.py still
# block any routine text from calling a non-`required` tool), so auto-adding it does not
# depend on knowing whether the operator actually flipped the tool in the claude.ai
# connectors UI — see the NAMESPACE NOTE below on why that flip is unobservable from this
# side anyway. Promoting a tool from `unused` to `required`/`optional` — i.e. actually wiring
# a new capability into a routine — stays a deliberate, hand-authored change: edit this file's
# `use:` value AND the routine prose that will call it together, subject to the same CI gate.
# `connector_tool_removed` is NOT auto-reconciled: a vanished tool can break routine text that
# depends on it, which needs a human decision (restore it, or fix the routine + this file
# together), not a rubber stamp — OPS1 only ever alerts on that category, never edits for it.
#
# A tool that reappears out of a connector's `absent:` block: if the matching entry is
# `verified: unconfirmed`, OPS1 deletes it as part of the same auto-add edit (a name may never
# sit in both `tools:` and `absent:` for one connector — CHECK1 hard-fails on that). If the entry
# is instead a DATED/confirmed retirement (e.g. Hugging-Face's `paper_search`), OPS1 does NOT
# auto-delete it or auto-add that one tool — it leaves the alert open for a human instead, since
# discarding a confirmed-retirement record permanently disables CHECK4's protection against that
# tool's name being called again. Full procedure: Claude_Task_Plan.md's OPS1 AUTO-ADD paragraph.
#
# NAMESPACE NOTE (important — read before trusting a green CI gate as proof anything can
# actually be called). `.claude/settings.json`'s `permissions.allow` array uses the form
# `mcp__<Server>__<tool>` (e.g. `mcp__Google_Calendar__list_calendars`), matching the
# `settings_prefix` field below. An INTERACTIVE CLI session's own runtime tool names carry
# an extra `claude_ai_` infix instead (`mcp__claude_ai_Google_Calendar__list_calendars`) —
# the two namespaces are NOT the same string. Empirically, the repo allowlist is NOT the
# binding control for the CLOUD ROUTINE fleet: Gmail has had ZERO entries in
# `.claude/settings.json`'s allow array the entire time, yet OPS1's `list_labels` liveness
# probe has succeeded on every run from 2026-07-20 through 2026-08-07 — a routine session
# is evidently gated by the claude.ai connector's own per-tool allow/ask/block policy, not
# by this repo's JSON file. Keep `.claude/settings.json` correct anyway (it IS the binding
# control for INTERACTIVE sessions, and is defence in depth even where it is not binding),
# but do not read a green `check_connector_tools.py` / `check_settings_toolcov.py` run as
# proof that a cloud routine can actually call a given tool — only the claude.ai connector
# UI's per-tool matrix is that proof (RUNBOOK §15a).

connectors:
  - name: FMP                       # display name used in alerts and run_log notes
    connector_uuid: f4bd1992-c70e-4b23-b617-271b19976e92
    settings_prefix: mcp__FMP__     # the .claude/settings.json namespace for this connector
    tools:
