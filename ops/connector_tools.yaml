        use: required
        note: OPS1-adjacent / D1 pre-flight liveness surface
      - name: marketPerformance
        use: required
        prose_ambiguous: true
        note: >-
          OPEN ON THE FREE TIER — one of the few FMP surfaces that is (re-verified live 2026-08-26).
          `biggest-gainers`, `biggest-losers` and `most-active` all returned full 50-row payloads with
          symbol/price/change/changesPercentage/exchange while `quote/batch-quote`, `news` and `search`
          were denied in the same session. TWO DIFFERENT SHAPES, and the difference matters:
          `biggest-gainers`/`biggest-losers` are ranked BY PERCENT MOVE and bottom out around +11.5% /
          -12.0% (measured 2026-08-26; +16.80% / -13.81% on 2026-08-19) — a tail-risk radar dominated by
          micro-caps, SPAC rights and leveraged ETFs. `most-active` is ranked BY VOLUME, so it carries
          ordinary large-cap moves the percent-ranked lists never reach: on 2026-08-26 it held
          SNAP -8.53%, IREN -6.23%, SMR -5.40%, MARA -5.16%, PLUG -4.41%, BSX -3.39%, SMCI -2.78%,
          NKE -2.25%. STILL NOT AN ENUMERATION ROUTE — that finding stands (see the D2a EQUITY_BREADTH
          bullet cited above): 50 rows, no `limit`/paging, no market-cap field, and a COHR-class name can
          still be missed. It is a cheap PARTIAL discovery net for D1's single-name-move screen when the
          per-symbol endpoints are symbol-gated, nothing more. FLIPPED unused->required 2026-08-26: D1's
          single-name-move screen now names the token at its DISCOVERY leg, so it is a real call site and
          must stay allowlisted (`mcp__FMP__marketPerformance` added to `.claude/settings.json` in the
          same change) or an unattended D1 stalls on a permission prompt. `required` here means "must be
          allowlisted", NOT "load-bearing" — the screen degrades to a stated coverage gap without it. Filters are ACCEPTED AND IGNORED
          here — `biggest-losers` with `exchange='NYSE'` returned NASDAQ and AMEX rows (2026-08-19) — so
          reconcile every response against what you asked for.
      - name: news
        use: required
        prose_ambiguous: true
        note: >-
          D1 Market Development Scan + external-content extraction discipline (Claude_Task_Plan.md).
          TOOL-LEVEL ACCESS DENIED ON THIS TIER — and unlike `quote`, this one is a genuine WHOLE-TOOL
          gate with no working corner: `general-news` returned "ACCESS DENIED: This tool (\"news\")
          requires the Starter, Premium, Ultimate, or Enterprise plan" (measured 2026-08-24,
          re-measured 2026-08-26). Stays `use: required` because routine text names the token and CHECK2
          must keep it allowlisted — an unattended run that hits an un-allowlisted token stalls on a
          permission prompt, which is worse than a clean ACCESS DENIED. Route every news-shaped need to
          WebSearch/Tavily; do not write routine text that depends on this returning data, and do not
          re-alert its absence — it is a standing vendor limit, not a regression.
      - name: quote
        use: required
        prose_ambiguous: true
        note: >
          `required` per this manifest's semantics — named by full token in routine text
          (5 sites: D2a `^VIX`/`daily_marks`, W5 shadow marks), so it MUST stay allowlisted
          or an unattended run stalls on a permission prompt. That is NOT a claim it is
          load-bearing: every one of those sites has IBKR as PRIMARY with this tool as a
          best-effort FALLBACK (rewired 2026-07-19, OWNER_ACTIONS.md item W, when the owner
          declined the tier purchase).
          PARTIAL AVAILABILITY, not blanket denial (note corrected 2026-08-17 — this entry
          previously read "currently ACCESS DENIED", which overstated it and contradicted
          Claude_Task_Plan.md's own W5 text). Since FMP's 2026-07-19 free-tier re-scoping
          this tool RESOLVES for FMP's free-list symbols (~87 big-caps + 9 indexes) and is
          symbol-blocked for everything else; the deeper history/ETF endpoints remain
          plan-gated at Premium+. The `daily_marks` ETF-mark fallback that ran through here
          stays DEAD — an accepted loss, since it only mattered when IBKR itself was down on
          a marking day and a missed mark self-heals on the next healthy run.
          OPS1 deliberately does NOT probe this tool for liveness (it would false-fire on the
          tier/symbol gate rather than on an auth failure) — `chart` is the probe target.
          THE BATCH ENDPOINTS DENY WITH TOOL-LEVEL WORDING — the trap that cost D1 a screen on
          2026-08-26. `quote/batch-quote` returns "ACCESS DENIED: This tool (\"quote\") requires the
          Premium, Ultimate, or Enterprise plan" — the whole-tool string — while single-symbol
