          previousClose 309.90 and marketCap). That error also instructs "Do not retry this tool or
          attempt sibling tools that require the same plan in this session" — scoped to the ENDPOINT
          and its same-tier siblings, NOT a licence to stand the tool down for the run. A batch denial
          NEVER establishes a tool-wide outage: re-test the canary (`quote` on AAPL) before recording
          one. See Claude_Task_Plan.md's shared FMP TIER MATRIX rule, "FOURTH MECHANISM".
      - name: search
        use: unused
        prose_ambiguous: true
        note: >-
          TOOL-LEVEL ACCESS DENIED ON THIS TIER (measured 2026-08-26): `search-company-screener` with
