# Prose invariants — the version-controlled source of truth for "protocol prose must not re-instruct
# RETIRED behavior in the sections agents execute" (finding H6, whole-system deep audit 2026-07-17).
#
# WHY THIS EXISTS. The routine-executed prose files (Claude_Task_Plan.md, Operating_Protocols.md,
# Watchlist.md, README.md, AI_Trading_Foundation.md) are read and ACTED ON by the scheduled Claude
# routines. When a mechanism is retired (the 2026-06-06 `.md`->BigQuery cutover; the 2026-07-09
# calendar-scope narrowing; the D2/D2a Step-0 cutover; the SGOV->VOO park cutover) the CHANGELOG and
# the §15 redirect map get updated, but stray IMPERATIVE instructions elsewhere in the same files can
# keep telling a routine to do the retired thing — write to Portfolio_Ledger.md, hand-carry a router
# state from Regime_State.md, drop an order-confirmation into a calendar event, apply a pinned SQL
# range. Those went undetected because nothing cross-checked the prose. scripts/check_prose_invariants.py
# (CI, BLOCKING) turns each such retired-instruction class into a machine-checked invariant: a future
# revision that re-introduces the retired phrasing (silent non-propagation) fails the build with a
# precise file:line diff instead of silently mis-instructing a live routine. The same discipline as
# scripts/check_cadence_consistency.py / check_roster_consistency.py, applied to prose.
#
# HOW A RULE WORKS (see scripts/check_prose_invariants.py for the exact semantics):
#   - `files`         : the file(s) the rule scans (repo-relative).
#   - `forbid_regex`  : FAIL if any non-exempt line matches it (a retired instruction re-appeared).
#   - `require_regex` : FAIL if NO line in the file matches it (a load-bearing correct phrasing vanished).
#   - `ignorecase`    : optional; case-insensitive match.
#   - `exempt_line_regex` : optional; a line matching this is SKIPPED for `forbid_regex` (the sanctioned
#                       passages — the §15 retirement map, dated changelog lines, and explicit
#                       "retired"/"there is no <file>" notes legitimately NAME the retired file).
#   - `exempt_sections`: optional; markdown-heading substrings — a match under a heading containing one
#                       of these is skipped.
#   - `ignore_strikethrough`: optional; strips only `~~old prose~~` before `forbid_regex` matching, so
#                       an active instruction on the same line remains visible to the guard.
#   - `reason` / `source_of_truth` : printed on failure so the fix is self-evident.
#
# The `forbid_regex`es are deliberately tight to the retired IMPERATIVE phrasing (e.g. "in
# Portfolio_Ledger.md alongside", "per Regime_State.md"), NOT the bare filename — so the many
# legitimate references (the redirect map, "Portfolio_Ledger.md retired, §15", "there is no
# Portfolio_Ledger.md to update") do not trip it and this file needs almost no exemptions.

invariants:
  # ---- Experiment Parameters rev 19 retired BOTH hard CaR envelopes (2026-08-05). The most
  # dangerous recurrence is operative authoring/execution prose that silently reinstates the old
  # 10%-per-name / 75%-deployed gates.  Historical descriptions are permitted ONLY when they
  # explicitly say that the old rule is retired/superseded (or display it as struck-through
  # text); a bare historical quote can otherwise be read as an operative instruction. ----
  - id: retired_car_envelopes_not_operational
    # This is deliberately a semantic family rather than an inventory of the last incident's
    # sentences: CaR + old number + its relevant scope + binding vocabulary, in either order.
    # It catches normal rephrasings such as "must not exceed 10%" and "deployed CaR capped at
    # 75 percent" while leaving unrelated percentages alone.
    files: [Experiment_Parameters.md, AI_Trading_Foundation.md, AI_DECISION_REDESIGN.md, Operating_Protocols.md, Strategy.md, Claude_Task_Plan.md, task_plan/D2.md, task_plan/SL2.md]
    forbid_regex: '(?:(?=.*\b(?:CaR|Capital at Risk)\b)(?=.*\b(?:10\s*%|10\s+percent\b))(?=.*\b(?:per[- ](?:name|thesis|position)|single[- ]name|same[- ]name|aggregate)\b)(?=.*\b(?:hard\s*(?:CaR\s*)?envelope|cap(?:ped)?|bound(?:ed)?|ceiling|(?:must|may|shall)\s+(?:remain|be|stay|not\s+exceed)|no\s+more\s+than|at\s+most|maximum\s+(?:allowed|CaR|Capital at Risk|per[- ](?:name|thesis|position)|single[- ]name))\b).*|(?=.*\b(?:CaR|Capital at Risk)\b)(?=.*\b(?:75\s*%|75\s+percent\b))(?=.*\b(?:deployed|per[- ]strategy|total\s+(?:deployed\s+)?strategy)\b)(?=.*\b(?:hard\s*(?:CaR\s*)?envelope|cap(?:ped)?|bound(?:ed)?|ceiling|(?:must|may|shall)\s+(?:remain|be|stay|not\s+exceed)|no\s+more\s+than|at\s+most|maximum\s+(?:allowed|CaR|Capital at Risk|per[- ]strategy|deployed))\b).*|\b(?:bounded by (?:the )?current hard envelopes|(?:its|the) current hard envelopes|thesis-scaled CaR budgeting\s*/\s*hard-envelope control|risk envelopes may be re-valued but never removed|per-thesis short CaR is bounded by|C.s size is now an AI-chosen Capital-at-Risk budget under the|first\s+\d+\s+earnings/PDUFA structures are sized at (?:a )?(?:fixed )?\d+\s*% per structure|full-cap activation)\b)'
    ignorecase: true
    ignore_strikethrough: true
    exempt_line_regex: '\b(?:retired|superseded|historical)\b'
    reason: >
      Experiment_Parameters.md rev 19 retired the per-name 10% and per-strategy-deployed 75% CaR
      envelopes. New strategies, adds, and pre-mortem revisions must use the no-ceiling risk-budget
      discipline: seven-factor recorded justification plus mandatory adversarial attack on size.
    source_of_truth: Experiment_Parameters.md rev 19 §Position size (2026-08-05 owner directive)

  # Narrative retirement markers above are legitimate, but they must never conceal a new live cap
  # later on the same physical line.  This narrower present-tense rule deliberately has NO narrative
  # exemption; only struck-through text is removed before it runs.
  - id: active_numeric_car_caps_not_operational
    files: [Experiment_Parameters.md, AI_Trading_Foundation.md, AI_DECISION_REDESIGN.md, Operating_Protocols.md, Strategy.md, Claude_Task_Plan.md, task_plan/D2.md, task_plan/SL2.md]
    forbid_regex: '(?:\b(?:per[- ](?:name|thesis|position)|single[- ]name|same[- ]name|aggregate)\b[^\n]{0,160}\b(?:CaR|Capital at Risk)\b[^\n]{0,160}\b(?:(?:is|are|must|shall)\s+(?:capped|bounded)|(?:must|shall|may)\s+not\s+exceed|cannot\s+exceed|no\s+more\s+than|at\s+most)\b[^\n]{0,160}\b(?:10\s*%|10\s+percent\b)|\b(?:CaR|Capital at Risk)\b[^\n]{0,160}\b(?:(?:is|are|must|shall)\s+(?:capped|bounded)|(?:must|shall|may)\s+not\s+exceed|cannot\s+exceed|no\s+more\s+than|at\s+most)\b[^\n]{0,160}\b(?:10\s*%|10\s+percent\b)[^\n]{0,160}\b(?:per[- ](?:name|thesis|position)|single[- ]name|same[- ]name|aggregate)\b|\b(?:deployed|per[- ]strategy|total\s+(?:deployed\s+)?strategy)\b[^\n]{0,160}\b(?:CaR|Capital at Risk)\b[^\n]{0,160}\b(?:(?:is|are|must|shall)\s+(?:capped|bounded)|(?:must|shall|may)\s+not\s+exceed|cannot\s+exceed|no\s+more\s+than|at\s+most)\b[^\n]{0,160}\b(?:75\s*%|75\s+percent\b)|\b(?:CaR|Capital at Risk)\b[^\n]{0,160}\b(?:(?:is|are|must|shall)\s+(?:capped|bounded)|(?:must|shall|may)\s+not\s+exceed|cannot\s+exceed|no\s+more\s+than|at\s+most)\b[^\n]{0,160}\b(?:75\s*%|75\s+percent\b)[^\n]{0,160}\b(?:deployed|per[- ]strategy|total\s+(?:deployed\s+)?strategy)\b|\bbounded by (?:the )?hard envelopes\b|\benvelope-based magnitude-only mitigation applies\b|\bsiz(?:e|ing) toward[^\n]{0,120}\b10\s*%[^\n]{0,120}\bper[- ]name envelope\b|\bworst-case[^\n]{0,240}\b10\s*%[^\n]{0,240}\b5x increase\b)'
    ignorecase: true
    ignore_strikethrough: true
    reason: >
      An explicitly retired historical sentence must not shield a present-tense instruction that
      reinstates the 10%-per-name or 75%-deployed CaR cap on the same line.
    source_of_truth: Experiment_Parameters.md rev 19 §Position size (2026-08-05 owner directive)

  - id: no_ceiling_sizing_doctrine_present
    files: [Experiment_Parameters.md, AI_Trading_Foundation.md, AI_DECISION_REDESIGN.md, Operating_Protocols.md, Strategy.md, Claude_Task_Plan.md, task_plan/D2.md, task_plan/SL2.md]
    require_regex: 'no numeric ceiling'
    ignorecase: true
    reason: >
      Each canonical sizing/operating document must retain an explicit statement that rev 19 has no
      numeric sizing ceiling; otherwise a future partial propagation can make the retired envelopes
      appear current again while CI stays green.
    source_of_truth: Experiment_Parameters.md rev 19 §Position size (2026-08-05 owner directive)

  # ---- Portfolio_Ledger.md is RETIRED (2026-06-06 cutover, §15). No routine writes/caches/edits it;
  # positions/perf/NAV live in state.current_positions / perf.* / analytics.* / state.open_orders. ----
  - id: portfolio_ledger_not_a_write_target
    files: [Operating_Protocols.md, Claude_Task_Plan.md]
    forbid_regex: '(?:\b(?:records?|cache|write|writing|append|logs?)\b[^.\n]{0,70}\bin Portfolio_Ledger\.md\b|\brecorded in Portfolio_Ledger\.md\b|Portfolio_Ledger\.md.{0,3}(?:remains authoritative|mirrors it)|edited in place\)[^.\n]*Portfolio_Ledger\.md)'
    ignorecase: true
    reason: >
      Portfolio_Ledger.md was RETIRED in the 2026-06-06 cutover (Operating_Protocols.md §15). A routine
      must NOT be instructed to record/cache/write to it or told it "remains authoritative" — the live
      state is state.current_positions / perf.strategy_daily / analytics.strategy_nav /
      analytics.account_reconciliation, and staged orders live in state.open_orders (events.queue_events).
    source_of_truth: Operating_Protocols.md §11/§13/§15

  # ---- Regime_State.md is RETIRED (2026-06-06, §15). Router/regime state is authoritative in
  # state.current_regime (events.regime_events); prose must never hand-carry a router value or read it. ----
  - id: regime_state_not_hand_carried
    files: [Operating_Protocols.md, Watchlist.md, Claude_Task_Plan.md]
    forbid_regex: '(?:per Regime_State\.md|mirror Regime_State\.md|Regime_State\.md\s+activation|lives independently[^.\n]*Regime_State\.md|edited in place\)[^.\n]*Regime_State\.md)'
    ignorecase: true
    reason: >
      Regime_State.md was RETIRED (§15). Router/regime state is authoritative in state.current_regime
      (events.regime_events, scopes STRATEGY_ACTIVATION + TECHNICAL_SIGNAL) and must be read live, never
      hand-carried in prose or cited as "per Regime_State.md activation rules".
    source_of_truth: state.current_regime / events.regime_events (§15 redirect map)

  # ---- Order confirmations use create_order_instruction's own IBKR notification (2026-07-09 scope
  # narrowing, §1). A [Claude] Confirm order calendar event is the CONTINGENCY for a non-craftable
  # order ONLY — never the default staging step. ----
  - id: no_default_confirm_order_calendar_event
    files: [Operating_Protocols.md, Claude_Task_Plan.md]
    forbid_regex: '(?:into the order-confirmation calendar event|via connector-crafted Confirm-order events|into a [^.\n]{0,20}confirm-order event)'
    ignorecase: true
    reason: >
      The 2026-07-09 calendar-scope narrowing (Operating_Protocols.md §1) made create_order_instruction's
      own IBKR notification the human-facing confirm surface for every CRAFTABLE order. A [Claude] Confirm
      order calendar event is created ONLY for a genuinely non-craftable/manual-entry order. Prose must not
      route the default craftable-order confirmation into a calendar event.
    source_of_truth: Operating_Protocols.md §1 (calendar-scope narrowing) / §11

  # ---- README bigquery apply-range must be COMPUTED (ascending to the highest-numbered file), never a
  # pinned two-endpoint literal that silently goes stale as new bigquery/NN_*.sql files are added. ----
  - id: readme_apply_range_not_pinned
    files: [README.md]
    forbid_regex: 'bigquery/0?1\.\.\d'
    reason: >
      The bigquery apply-range in README.md was pinned ("bigquery/01..11_*.sql") and silently went stale as
      files up to bigquery/NN accumulated. It must be phrased as ascending numeric order to the highest file,
      not a pinned endpoint.
    source_of_truth: bigquery/ (apply in ascending numeric order; see bigquery/README.md)
  - id: readme_apply_range_computed_present
    files: [README.md]
    require_regex: 'ascending numeric order'
    reason: >
      README.md must state the bigquery apply order as "ascending numeric order" (the computed phrasing that
      replaced the pinned "01..11" range) so the instruction can never re-pin a stale endpoint.
    source_of_truth: bigquery/README.md

  # ---- The ROUTINE INVENTORY D2 row must reflect the 2026-07-09 D2/D2a cutover: fills reconciliation,
  # events.trade_fills/daily_marks, and the perf.strategy_daily recompute moved to D2a. ----
  - id: inventory_d2_row_no_retired_writes
    files: [Claude_Task_Plan.md]
    forbid_regex: '^\|\s*\*\*D2\*\*\s*\|[^\n]*(?:trade_fills|recompute\s+.?perf)'
    reason: >
      The ROUTINE INVENTORY D2 row still listed an events.trade_fills WRITE and a "recompute
      perf.strategy_daily" — both moved to D2a in the 2026-07-09 cutover (Claude_Task_Plan.md D2 §"STEP
      0…now run in D2a"; ops/cadence.yaml D2/D2a writes). The D2 row must not claim them. (events.daily_marks
      is fine as a READ in this row's reads column — only the trade_fills/perf-recompute WRITE claims are
      forbidden.)
    source_of_truth: ops/cadence.yaml (D2 / D2a writes) + Claude_Task_Plan.md D2 cutover note

  # ---- "never chase past the documented rest level" is RETIRED (2026-07-20 owner directive — the
  # mechanical never-chase 0.5% equity price-band block was replaced by the AI LIMIT DECISION:
  # RAISE/HOLD/LOWER/ABANDON judgment). That LIMIT DECISION mechanism was ITSELF retired the very
  # next day (2026-07-21 market-only cutover — orders carry no limit price at all, so there is
  # nothing left to raise/hold/lower; see the market_only_orders invariant below). Scoped to
  # Claude_Task_Plan.md only — the routine-executed prose — so historical mentions in RUNBOOK.md /
  # events.decision_log stay untouched. ----
  - id: limit_decision_never_chase_retired
    files: [Claude_Task_Plan.md]
    forbid_regex: 'never chase'
    ignorecase: true
    reason: >
      "Never chase past the documented rest level" was the mechanical never-chase 0.5% equity price-band
      rule, RETIRED 2026-07-20 by owner directive and replaced by the AI LIMIT DECISION (RAISE / HOLD /
      LOWER / ABANDON judgment). That LIMIT DECISION mechanism was ITSELF retired 2026-07-21 by the
      market-only order cutover — orders are MARKET only, so there is no resting limit to raise, hold,
      or lower (see the market_only_orders invariant below). Claude_Task_Plan.md must not re-instruct a
      routine to follow either retired mechanism.
    source_of_truth: bigquery/100_market_only_order_guard.sql (2026-07-21 market-only cutover, current) /
      bigquery/99_ai_limit_decision_order_guard.sql (2026-07-20, now itself superseded)

  # ---- Every IBKR order this system generates is MARKET (2026-07-21 owner directive — the
  # market-only order cutover). No limit orders anywhere: entries, exits, park/sweep, options. The
  # "marketable limit" convention, order_type=LIMIT, and the LIMIT DECISION (RAISE/HOLD/LOWER/
  # ABANDON) judgment framework are all retired. Scoped to the two routine-executed prose files;
  # the exempt_line_regex below skips lines that NAME the retired mechanism to explain its
  # retirement (CHANGELOG entries, the ENTRY/EXIT DECISION block's "supersedes the retired ..."
  # sentence) rather than re-instructing it. ----
  - id: market_only_orders
    files: [Claude_Task_Plan.md, Operating_Protocols.md]
    forbid_regex: '(?:marketable[- ]limit|order_type\s*[=:]\s*.?LIMIT.?|\bLIMIT DECISION\b|RAISE\s*/\s*HOLD\s*/\s*LOWER\s*/\s*ABANDON)'
    ignorecase: true
    exempt_line_regex: '(?:retired|supersede[sd]?|RETIRES)'
    reason: >
      Every IBKR order this system generates is MARKET (owner directive 2026-07-21;
      bigquery/100_market_only_order_guard.sql) — there are no limit orders anywhere (entries,
      exits, park/sweep, options), no "marketable limit" convention, no order_type=LIMIT, and no
      LIMIT DECISION (RAISE/HOLD/LOWER/ABANDON) machinery to run. As of 2026-07-22
      (bigquery/104_strip_pretrade_rails.sql), no liquidity or sizing pre-trade gate remains
      either — the expected-implementation-shortfall gate, its φ·α adaptive budget, the ADV floor
      / 10% participation cap, and the fat-finger sizing caps (1.5x sizing_base, $50 notional,
      park 1.10x-NAV) are all removed. analytics.fn_order_guard now checks only market-only +
      malformed-input (qty/ref-price) sanity; analytics.fn_order_guard_options checks the same
      plus the RETAINED defined-risk (bounded, positive max_loss) rail. Prose in
      Claude_Task_Plan.md / Operating_Protocols.md must not re-instruct a routine to craft a
      limit order, perform the retired LIMIT DECISION judgment, or describe a liquidity/sizing
      pre-trade check that no longer exists.
    source_of_truth: bigquery/100_market_only_order_guard.sql / bigquery/101_market_only_decision_seed.sql
      (2026-07-21 owner directive) / bigquery/104_strip_pretrade_rails.sql (2026-07-22 pre-trade
      rail strip)
